# „Claude fragen“ über GitHub: Claude Code beantwortet eine Frage aus der App
# (Issue „Frage: …“) als Kommentar – im Claude-Abo, ohne Abrechnung je Frage.
# Claude darf hier nur lesen (keine Änderungen, kein Zweig, kein Pull Request).
# Auslösen kann nur der Repository-Inhaber (die App fragt mit dessen Zugang).
name: Claude Fragen

on:
  issues:
    types: [opened]

jobs:
  antworten:
    if: |
      github.event.sender.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'Frage:') &&
      contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 15
            --allowedTools "Read,Glob,Grep"
