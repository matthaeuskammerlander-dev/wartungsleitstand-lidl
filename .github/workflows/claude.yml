# Claude setzt freigegebene Änderungswünsche um.
#
# Ausgelöst wird nur durch Issues/Kommentare mit „@claude“, und nur, wenn sie
# vom Inhaber des Repositorys kommen (die App gibt Wünsche mit dessen Zugang
# weiter). Fremde können so nichts anstoßen. Claude arbeitet auf einem eigenen
# Zweig claude/…; in die echte App kommt nichts ohne Übernahme durch den
# Inhaber (Knopf „Übernehmen“ in der App, nur nach bestandener Prüfung).
#
# Secret: CLAUDE_CODE_OAUTH_TOKEN (aus „claude setup-token“, läuft über das
# Claude-Abo – keine Abrechnung pro Anfrage).
name: Claude Änderungswünsche

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude:
    if: |
      github.event.sender.login == github.repository_owner && (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(node tools/pruefen.mjs),Bash(git diff:*),Bash(git status),Bash(git show:*),Bash(git log:*)"
