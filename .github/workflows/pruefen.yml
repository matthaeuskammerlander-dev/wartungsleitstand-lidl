# Automatische Prüfung jeder vorgeschlagenen Änderung (Änderungswünsche aus
# der App, umgesetzt von Claude) und jedes Stands der echten App.
# Ohne bestandene Prüfung lässt sich ein Wunsch in der App nicht übernehmen.
# Ein Stand von main geht erst nach bestandener Prüfung online (Inhaber 30.10.2026, Job
# „veroeffentlichen“; Repository → Settings → Pages → Source „GitHub Actions“). Fällt die Prüfung
# durch, bleibt der letzte geprüfte Stand online; nach „Re-run“ läuft die Veröffentlichung von selbst.
name: App prüfen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruefen:
    name: App prüfen
    runs-on: ubuntu-latest
    # 25 Minuten: die App-Tests im Browser brauchen inzwischen gut 10 Minuten (04.10.2026)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Claude darf nur die App-Seite (und die Beschreibung) ändern – nie die
      # Prüfung selbst, die Automatik, Datenbank-Regeln oder Funktionen
      - name: Nur erlaubte Dateien geändert
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/')
        run: |
          geaendert=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Geänderte Dateien:"; echo "$geaendert"
          verboten=$(echo "$geaendert" | grep -vE '^(index\.html|README\.md)$' || true)
          if [ -n "$verboten" ]; then
            echo "::error::Geschützte Dateien geändert: $verboten"
            exit 1
          fi

      - name: Syntax und Regeln
        run: node tools/pruefen.mjs

      # Archivskript der Synology (Python, ohne Zusatzpakete): Syntax und ein
      # Durchlauf mit nachgestellter Datenbank in einen Testordner
      - name: Archivskript (Synology)
        run: |
          python3 -m py_compile synology/ukt_archiv.py synology/ukt_posteingang.py synology/ukt_app_holen.py
          python3 tools/archiv_test.py
          python3 tools/posteingang_test.py
          python3 tools/app_holen_test.py

      - name: App im Browser starten (PC und Handy)
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
          node tools/pruefen.mjs --browser

      # Abläufe der App mit erfundenen Daten und nachgebauter Datenbank (tests/): Rollen,
      # Endlosschleifen, Protokoll speichern, Fälligkeit, Kalender, Rechnung, Eingabeprüfung, Spielwiese
      - name: App-Tests (Abläufe)
        run: node tests/app-tests.mjs

  veroeffentlichen:
    name: App veröffentlichen
    needs: pruefen
    # nur echte Stände von main, nie Vorschläge aus einem Änderungswunsch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # immer nur eine Veröffentlichung gleichzeitig
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      STAND_ADRESSE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/stand.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # dauert eine Prüfung länger als die eines neueren Stands: den neueren nie überschreiben
      - name: Nie einen älteren Stand über einen neueren legen
        id: stand
        run: |
          online=$(curl -fsS "$STAND_ADRESSE?t=$(date +%s)" | tr -d '[:space:]' || true)
          echo "Online: ${online:-unbekannt} · geprüft: $(git rev-parse HEAD)"
          if [ -n "$online" ] && git merge-base --is-ancestor HEAD "$online" 2>/dev/null; then
            echo "Online ist schon dieser oder ein neuerer Stand – nichts zu tun."
            echo "weiter=nein" >> "$GITHUB_OUTPUT"
          else
            git rev-parse HEAD > stand.txt
            echo "weiter=ja" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.stand.outputs.weiter == 'ja'
        with:
          path: .

      - uses: actions/deploy-pages@v5
        if: steps.stand.outputs.weiter == 'ja'

      # „erfolgreich“ allein reicht nicht (30.10.2026: gemeldet erfolgreich, online blieb der alte Stand):
      # erst wenn genau dieser Stand wirklich ausgeliefert wird, ist die Veröffentlichung gelungen
      - name: Wirklich online?
        if: steps.stand.outputs.weiter == 'ja'
        run: |
          soll=$(git rev-parse HEAD)
          for i in $(seq 1 36); do
            online=$(curl -fsS "$STAND_ADRESSE?t=$(date +%s)" | tr -d '[:space:]' || true)
            if [ "$online" = "$soll" ]; then echo "Online: $soll"; exit 0; fi
            sleep 10
          done
          echo "::error::Veröffentlicht gemeldet, aber online steht ${online:-nichts} statt $soll"
          exit 1
