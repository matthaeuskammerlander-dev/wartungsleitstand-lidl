          '<strong style="font-size:14px">'+esc(s?stName(s):(o.filialCode||"Markt offen"))+"</strong>")+
          (o.problemtyp?'<br><span style="font-size:13px">'+esc(o.problemtyp)+"</span>":"")+"</div>"+
        '<span class="pill '+alter.klasse+'">'+esc(alter.text)+"</span></div>"+
      (o.termin?'<div style="font-size:13px"><strong>Einsatz geplant:</strong> '+esc(dfmt(o.termin))+
        (o.terminZeit?", "+esc(o.terminZeit)+" Uhr":"")+(o.terminTechniker?" · "+esc(o.terminTechniker):"")+"</div>":"")+
      (o.beschreibung?'<div class="muted" style="font-size:12.5px">'+esc(String(o.beschreibung).slice(0,220))+
        (String(o.beschreibung).length>220?" …":"")+"</div>":"")+
      '<div class="muted mono" style="font-size:12px">'+
        [o.auftragsnummer?"Auftrag "+esc(o.auftragsnummer):"", o.stoerungsnr?"Störung "+esc(o.stoerungsnr):"",
         o.filialCode?esc(o.filialCode):""].filter(Boolean).join(" · ")+"</div>"+
      '<div class="rowflex" style="gap:6px">'+
        '<button class="btn sm" type="button" data-a="proto">Störungsprotokoll erstellen</button>'+
        '<button class="btn ghost sm" type="button" data-a="bearb">Ansehen / ändern</button>'+
        '<button class="btn ghost sm" type="button" data-a="ics">In Handykalender</button>'+
      "</div></div>");
    z.querySelector('[data-a="proto"]').onclick=function(){
      if(!o.standortId){ toast("Der Störung ist noch kein Markt zugewiesen – bitte über „Ansehen / ändern“ nachtragen."); return; }
      S.stoerungAus=o._id; S.protoStandort=o.standortId; S.protoArt="stoerung";
      S.view="protokoll"; formDirty=false; S.bearbeiten=null; render(); window.scrollTo({top:0});
    };
    z.querySelector('[data-a="bearb"]').onclick=function(){ stoerungDialog(o); };
    z.querySelector('[data-a="ics"]').onclick=function(){ stoerungIcs(o); };
    return z;
}

function viewFaellig(){
  var pos=filteredPos();
  var c={ueberfaellig:0,faellig:0,erledigt:0,unbekannt:0};
  pos.forEach(function(p){ c[p.status==="geplant"?"erledigt":p.status]++; });
  var maerkte=filtered();
  var f=document.createDocumentFragment();

  var offen=offeneStoerungen(true);
  f.appendChild(el('<div class="kpis">'+
    (offen.length?'<div class="kpi crit"><div class="n">'+offen.length+'</div><div class="l">offene Störungen</div></div>':"")+
    '<div class="kpi crit"><div class="n">'+c.ueberfaellig+'</div><div class="l">Termine überfällig</div></div>'+
    '<div class="kpi warn"><div class="n">'+c.faellig+'</div><div class="l">fällig in '+VORLAUF_TAGE+' Tagen</div></div>'+
    '<div class="kpi good"><div class="n">'+c.erledigt+'</div><div class="l">im Plan</div></div>'+
    '<div class="kpi"><div class="n">'+maerkte.length+'</div><div class="l">Märkte in der Auswahl</div></div>'+
  '</div>'));

  /* Offene Störungen stehen ganz oben – sie warten, nicht der Kalender. */
  f.appendChild(stoerungsKarte());
  f.appendChild(stoerungsKalender());

  /* Small multiples je Region */
  var bands=REGIONEN.map(function(r){
    return faelligkeitsBand(r, pos.filter(function(p){ return byId[p.standortId].region===r; }));
  });
  var ohne = pos.filter(function(p){ return REGIONEN.indexOf(byId[p.standortId].region)<0; });
  if(ohne.length) bands.push(faelligkeitsBand("ohne Regionszuordnung", ohne));
  var maxV=1; bands.forEach(function(b){ if(b.max>maxV) maxV=b.max; });

  var chart=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Fälligkeiten nach FM-Region</h2>'+
    '<div class="sub">Jede Zeile hat einen festen Jahrestermin: die Jahreswartung am Jahrestag der Inbetriebnahme, '+
      'Halbjahreswartung und -inspektion sechs Monate versetzt. Gleiche Skala in allen Regionen (Maximum '+maxV+').</div></div>'+
    '<div class="legend">'+
      '<span><i style="background:var(--crit)"></i>überfällig</span>'+
      '<span><i style="background:var(--warn)"></i>fällig in '+VORLAUF_TAGE+' Tagen</span>'+
      '<span><i style="background:var(--plan)"></i>später fällig</span>'+
    '</div>'+
    '<div class="smallmult">'+bands.map(function(b){
      var gesamt=b.bald.concat(b.spaeter).reduce(function(a,v){return a+v;},0);
      return '<div><div class="chart-t">'+esc(b.region)+'</div><div class="chart-s">'+b.ueber+' überfällig · '+gesamt+' in 12 Monaten</div>'+bandSVG(b,maxV)+"</div>";
    }).join("")+"</div>"+
  "</div></div>");
  chart.querySelectorAll(".hit").forEach(function(r){
    r.addEventListener("mousemove",function(e){ tipShow(e,r.dataset.tip); });
    r.addEventListener("mouseleave",tipHide);
  });
  f.appendChild(chart);


  /* Positionsliste: nach Fälligkeitsdatum, das dringendste zuerst */
  var list=pos.slice().sort(function(a,b){
    return (a.naechste||"9999").localeCompare(b.naechste||"9999");
  });
  var offen=list.filter(function(p){ return p.status==="ueberfaellig"||p.status==="faellig"; });
  var show=offen.length?offen:list;
  var card=el('<div class="card"><div class="pad"><h2>'+(offen.length?"Anstehende Wartungen":"Alle Positionen")+'</h2>'+
    '<div class="sub">'+show.length+' Positionen, nach Fälligkeitsdatum sortiert. Tippen öffnet das Wartungsprotokoll – '+
    'ein gespeichertes Protokoll schiebt die nächste Fälligkeit sofort weiter.</div></div>'+
    '<div class="rows" id="dulist"></div></div>');
  var rows=card.querySelector("#dulist");
  show.slice(0,120).forEach(function(p){
    var s=byId[p.standortId], w=wannText(p);
    var r=el('<button class="row" type="button">'+
      '<span class="when">'+w.zeile+(w.zusatz?'<br><span style="font-size:10.5px">'+w.zusatz+"</span>":"")+"</span>"+
      '<span class="body"><span class="ttl">'+esc(stName(s))+"</span>"+
        '<span class="meta">'+(stName(s)===s.adresse?"":esc(s.adresse)+(s.region?" · ":""))+esc(s.region||"")+"</span>"+
        '<span class="badges"><span class="tag">'+esc(anlagenName(p))+"</span>"+
          '<span class="tag">'+esc(p.intervall.art)+"</span>"+
          (p.kaeltemittelText?'<span class="tag f30">'+esc(p.kaeltemittelText)+" Kältemittel</span>":"")+
          (p.letzte?'<span class="tag">zuletzt '+dfmt(p.letzte)+(p.letzteAusApp?" (App)":"")+"</span>":'<span class="tag">keine Wartung erfasst</span>')+
        "</span>"+
      "</span>"+
      '<span class="right">'+pill(p.status)+"</span>"+
    "</button>");
    r.onclick=function(){ S.protoStandort=s.id; S.protoPos=p.id; S.protoArt="wartung"; S.view="protokoll"; render(); window.scrollTo({top:0}); };
    rows.appendChild(r);
  });
  if(show.length>120) card.appendChild(el('<div class="pad muted" style="font-size:12.5px">… weitere '+(show.length-120)+" Positionen über Filter eingrenzen.</div>"));
  f.appendChild(card);
  return f;
}

/* ---------- View: Karte ---------- */
/* Kandidaten für die Tour: Standorte, deren Termine zu den gewählten
   Fälligkeiten passen */
function tourKandidaten(){
  var raus=[];
  filtered().forEach(function(s){
    if(!s.lat) return;
    if(S.tour.laender.length && S.tour.laender.indexOf(bundesland(s))<0) return;
    var bis=endeFolgemonat();
    var pos=s.pos.filter(function(p){
      var st = p.status==="geplant" ? "erledigt" : p.status;
      if(S.tour.status.indexOf(st)>=0) return true;
      /* auf Wunsch auch, was erst im nächsten Monat dran ist */
      return S.tour.naechsterMonat && p.naechste && p.naechste<=bis;
    });
    if(pos.length) raus.push({standort:s, positionen:pos});
  });
  return raus;
}
function tourRechnen(){
  var kandidaten=tourKandidaten();
  if(S.tour.manuell){
    var erlaubt={}; S.tour.manuell.forEach(function(id){ erlaubt[id]=1; });
    kandidaten=kandidaten.filter(function(k){ return erlaubt[k.standort.id]; });
  }
  var start=BETRIEB;
  if(S.tour.startId==="__gps"){
    if(S.tour.gps) start={ id:"__gps", name:"Aktueller Standort",
      adresse:"Position des Technikers", lat:S.tour.gps.lat, lon:S.tour.gps.lon };
    /* ohne Positionsfreigabe bleibt der Betrieb als Ausgangspunkt */
  } else if(byId[S.tour.startId] && byId[S.tour.startId].lat){
    start=byId[S.tour.startId];
  }
  S.tour.geometrie=null;
  return planeTour({start:start, stopps:kandidaten, stundenProTag:S.tour.stundenProTag})
    .then(function(erg){
      S.tour.ergebnis=erg;
      if(!erg || !erg.echteStrasse) return null;
      /* die tatsächlich gefahrene Linie für die Karte nachladen */
      return strassenGeometrie([erg.start].concat(erg.reihenfolge).concat([erg.start]))
        .then(function(g){ S.tour.geometrie=g; return g; });
    });
}

function viewKarte(){
  var f=document.createDocumentFragment();
  var list=filtered();
  var withGeo=list.filter(function(s){return s.lat;});
  var noGeo=list.filter(function(s){return !s.lat;});

  if(KARTE_MODUS==="osm" && window.L){
    f.appendChild(karteOsm(withGeo));
    f.appendChild(tourPanel());
    if(noGeo.length) f.appendChild(ohneKarte(noGeo));
    return f;
  }

  var lo=[9.5,17.2], la=[46.35,49.05];
  var k=Math.cos(47.7*Math.PI/180);
  var W=1000, pad=18;
  var uw=(lo[1]-lo[0])*k, uh=la[1]-la[0];
  var sc=(W-2*pad)/uw, H=Math.round(uh*sc+2*pad);
  function X(lon){ return pad+(lon-lo[0])*k*sc; }
  function Y(lat){ return pad+(la[1]-lat)*sc; }

  var path="M"+AT.map(function(p){ return X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1); }).join("L")+"Z";
  var maxPos=1; withGeo.forEach(function(s){ if(s.pos.length>maxPos) maxPos=s.pos.length; });

  var dots=withGeo.slice().sort(function(a,b){ return STATUS_RANK[b.status]-STATUS_RANK[a.status]; }).map(function(s){
    var r=5+3.2*Math.sqrt((s.pos.length-1)/Math.max(1,maxPos-1));
    /* offene Störung: roter Ring um den Punkt */
    return (stoerungVonMarkt(s.id).length?'<circle cx="'+X(s.lon).toFixed(1)+'" cy="'+Y(s.lat).toFixed(1)+'" r="'+(r+4).toFixed(1)+
        '" style="fill:none;stroke:var(--crit);stroke-width:2.5;pointer-events:none"/>':"")+
      '<circle class="dot'+(S.sel===s.id?" sel":"")+'" cx="'+X(s.lon).toFixed(1)+'" cy="'+Y(s.lat).toFixed(1)+'" r="'+r.toFixed(1)+
      '" style="fill:var('+STATUS_VAR[s.status]+')" data-id="'+s.id+'" tabindex="0" role="button" aria-label="'+esc(stName(s)+", "+s.adresse)+'">'+
      "<title>"+esc(stName(s)+" · "+s.adresse+" · "+STATUS_LABEL[s.status])+"</title></circle>";
  }).join("");

  /* Route zeichnen: Linienzug + nummerierte Stopps */
  var routeSvg="";
  var T=S.tour.ergebnis;
  var inTour={};
  if(T){
    var punkte=[T.start].concat(T.reihenfolge).concat([T.start]);
    var d="M"+punkte.map(function(p){ return X(p.lon).toFixed(1)+","+Y(p.lat).toFixed(1); }).join("L");
    routeSvg+='<path d="'+d+'" style="fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;'+
      'stroke-linecap:round;stroke-dasharray:7 5;opacity:.85"/>';
    T.reihenfolge.forEach(function(p,i){ inTour[p.id]=i+1; });
    routeSvg+='<g>'+T.reihenfolge.map(function(p,i){
      return '<circle cx="'+X(p.lon).toFixed(1)+'" cy="'+Y(p.lat).toFixed(1)+'" r="9" style="fill:var(--accent);stroke:var(--surface);stroke-width:1.8"/>'+
        '<text x="'+X(p.lon).toFixed(1)+'" y="'+(Y(p.lat)+3.4).toFixed(1)+'" text-anchor="middle" font-size="10" '+
        'style="fill:#fff;font-weight:600">'+(i+1)+"</text>";
    }).join("")+"</g>";
    routeSvg+='<g><rect x="'+(X(T.start.lon)-7).toFixed(1)+'" y="'+(Y(T.start.lat)-7).toFixed(1)+
      '" width="14" height="14" rx="3" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.8"/>'+
      '<title>'+esc("Start: "+T.start.name)+"</title></g>";
  }

  /* eigene Position, sobald sie bekannt ist */
  if(S.tour.gps){
    var gx=X(S.tour.gps.lon).toFixed(1), gy=Y(S.tour.gps.lat).toFixed(1);
    routeSvg+='<g><circle cx="'+gx+'" cy="'+gy+'" r="11" style="fill:var(--accent);opacity:.22"/>'+
      '<circle cx="'+gx+'" cy="'+gy+'" r="4.5" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/>'+
      "<title>Ihr aktueller Standort</title></g>";
  }

  var cityDots=STAEDTE.map(function(c){
    return '<circle cx="'+X(c[1]).toFixed(1)+'" cy="'+Y(c[2]).toFixed(1)+'" r="2" style="fill:var(--ink-3);opacity:.55"/>';
  }).join("");
  /* Beschriftung nach den Punkten zeichnen, damit sie nicht verdeckt wird */
  var cityLabels=STAEDTE.map(function(c){
    var dx=c[3]==="start"?7:(c[3]==="end"?-7:0);
    return '<text class="cityt" x="'+(X(c[1])+dx).toFixed(1)+'" y="'+(Y(c[2])-8).toFixed(1)+'" text-anchor="'+c[3]+'">'+esc(c[0])+"</text>";
  }).join("");

  var card=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Standortkarte Österreich</h2><div class="sub">'+withGeo.length+' Standorte mit Koordinaten. Punktgröße = Anzahl Wartungspositionen, Farbe = dringlichster Status am Standort. Antippen für Details.</div></div>'+
    '<div class="legend">'+["ueberfaellig","faellig","erledigt"].map(function(k2){
      return '<span><i style="background:var('+STATUS_VAR[k2]+')"></i>'+STATUS_LABEL[k2]+"</span>";
    }).join("")+"</div>"+
    '<div class="mapwrap"><svg class="map" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Karte der Lidl-Standorte in Österreich">'+
      '<path class="outline" d="'+path+'"/>'+cityDots+dots+routeSvg+cityLabels+
    "</svg></div>"+
    '<div id="mapdetail"></div>'+
  "</div></div>");

  var det=card.querySelector("#mapdetail");
  function sel(id){ S.sel=id; det.innerHTML=""; det.appendChild(standortDetail(byId[id]));
    card.querySelectorAll(".dot").forEach(function(d){ d.classList.toggle("sel", d.dataset.id===id); }); }
  card.querySelectorAll(".dot").forEach(function(d){
    d.addEventListener("click",function(){ sel(d.dataset.id); });
    d.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); sel(d.dataset.id); } });
    d.addEventListener("mousemove",function(e){ var s=byId[d.dataset.id];
      tipShow(e,"<b>"+esc(stName(s))+"</b><br>"+esc(s.adresse)+"<br>"+s.pos.length+" Position(en) · "+STATUS_LABEL[s.status]); });
    d.addEventListener("mouseleave",tipHide);
  });
  if(S.sel && byId[S.sel] && byId[S.sel].lat) sel(S.sel);
  f.appendChild(card);
  f.appendChild(tourPanel());

  if(noGeo.length) f.appendChild(ohneKarte(noGeo));
  return f;
}

function ohneKarte(noGeo){
  return el('<div class="card"><div class="pad stack">'+
    '<h2>Ohne Kartenposition</h2>'+
    '<div class="sub">Diese Einträge haben in der Liste keine auswertbare Adresse – meist Sammelzeilen oder Kurznamen.</div>'+
    '<div class="rowflex">'+noGeo.map(function(s){ return '<span class="tag">'+esc(s.name)+" ("+s.pos.length+")</span>"; }).join("")+"</div>"+
  "</div></div>");
}

/* ---------- Karte auf OpenStreetMap (Leaflet) ---------- */
var leafletKarte=null;
function tokenFarbe(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#0E6E85";
}
function karteOsm(withGeo){
  var T=S.tour.ergebnis;
  var card=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Standortkarte</h2><div class="sub">'+withGeo.length+' Standorte auf OpenStreetMap. '+
      'Punktgröße = Anzahl Wartungspositionen, Farbe = dringlichster Status. Antippen öffnet Details und die Navigation.</div></div>'+
    '<div class="legend">'+["ueberfaellig","faellig","erledigt"].map(function(k){
      return '<span><i style="background:var('+STATUS_VAR[k]+')"></i>'+STATUS_LABEL[k]+"</span>";
    }).join("")+'<span><span class="stoerpin klein">!</span>offene Störung</span></div>'+
    '<div id="osmkarte" style="height:min(68vh,560px);width:100%;border-radius:10px;overflow:hidden;'+
      'border:1px solid var(--line);background:var(--surface-2)"></div>'+
    '<div class="rowflex"><button class="btn ghost sm" type="button" id="kartealle">Alle Standorte zeigen</button>'+
      '<span class="muted" style="font-size:12px">Ist Ihr Standort bekannt, öffnet die Karte in Ihrer Umgebung.</span></div>'+
    '<div id="mapdetail"></div>'+
  "</div></div>");

  /* Leaflet braucht den Container im Dokument, deshalb erst danach aufbauen */
  setTimeout(function(){
    var host=document.getElementById("osmkarte");
    if(!host) return;
    if(leafletKarte){ try{ leafletKarte.remove(); }catch(e){} leafletKarte=null; }
    var karte=L.map(host,{scrollWheelZoom:true}).setView([47.6,13.4],7);
    leafletKarte=karte;
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
      maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(karte);

    var maxPos=1; withGeo.forEach(function(s){ if(s.pos.length>maxPos) maxPos=s.pos.length; });
    var bounds=[];
    withGeo.forEach(function(s){
      var r=6+4*Math.sqrt((s.pos.length-1)/Math.max(1,maxPos-1));
      var m=L.circleMarker([s.lat,s.lon],{
        radius:r, color:tokenFarbe("--surface"), weight:1.8, opacity:1,
        fillColor:tokenFarbe(STATUS_VAR[s.status]), fillOpacity:1
      }).addTo(karte);
      bounds.push([s.lat,s.lon]);
      m.bindPopup(function(){ return popupInhalt(s); },{minWidth:230,maxWidth:280});
      m.on("popupopen",function(){ S.sel=s.id; });
    });
    /* Offene Störungen obenauf: ein rotes Warnzeichen am Markt, das auch
       zwischen vielen Punkten auffällt */
    withGeo.forEach(function(s){
      var n=stoerungVonMarkt(s.id).length; if(!n) return;
      var mk=L.marker([s.lat,s.lon],{zIndexOffset:1000, title:"Störung offen: "+stName(s),
        icon:L.divIcon({className:"", iconSize:[26,26], iconAnchor:[13,30],
          html:'<div class="stoerpin"><span>'+(n>1?n:"!")+"</span></div>"})}).addTo(karte);
      mk.bindPopup(function(){ return popupInhalt(s); },{minWidth:230,maxWidth:280});
    });

    if(T){
      var punkte=[T.start].concat(T.reihenfolge).concat([T.start]);
      if(S.tour.geometrie){
        /* tatsächlicher Straßenverlauf vom Routendienst */
        L.polyline(S.tour.geometrie.map(function(c){ return [c[1],c[0]]; }),{
          color:tokenFarbe("--accent"), weight:4, opacity:.8
        }).addTo(karte);
      } else {
        L.polyline(punkte.map(function(p){ return [p.lat,p.lon]; }),{
          color:tokenFarbe("--accent"), weight:3, opacity:.85, dashArray:"8 6"
        }).addTo(karte);
      }
      T.reihenfolge.forEach(function(p,i){
        L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",iconSize:[22,22],iconAnchor:[11,11],
          html:'<div style="width:22px;height:22px;border-radius:50%;background:'+tokenFarbe("--accent")+
            ';color:'+tokenFarbe("--on-accent")+';font:600 11px/22px system-ui,sans-serif;text-align:center;'+
            'border:2px solid '+tokenFarbe("--surface")+'">'+(i+1)+"</div>"})}).addTo(karte);
      });
      L.marker([T.start.lat,T.start.lon],{icon:L.divIcon({className:"",iconSize:[16,16],iconAnchor:[8,8],
        html:'<div style="width:16px;height:16px;border-radius:4px;background:'+tokenFarbe("--ink")+
          ';border:2px solid '+tokenFarbe("--surface")+'"></div>'})})
        .addTo(karte).bindPopup("Start: "+esc(T.start.name||"Startpunkt"));
      bounds=bounds.concat(punkte.map(function(p){ return [p.lat,p.lon]; }));
    }
    if(S.tour.gps){
      L.circle([S.tour.gps.lat,S.tour.gps.lon],{radius:Math.max(60,S.tour.gps.genauigkeit),
        color:tokenFarbe("--accent"),weight:1,fillColor:tokenFarbe("--accent"),fillOpacity:.18}).addTo(karte);
      L.circleMarker([S.tour.gps.lat,S.tour.gps.lon],{radius:6,color:tokenFarbe("--surface"),weight:2,
        fillColor:tokenFarbe("--accent"),fillOpacity:1}).addTo(karte).bindPopup("Ihr aktueller Standort");
      bounds.push([S.tour.gps.lat,S.tour.gps.lon]);
    }
    function alleZeigen(){
      if(bounds.length) karte.fitBounds(bounds,{padding:[24,24]});
    }
    function ausrichten(){
      /* Ganz Österreich passt auf ein schmales Hochformat nur stark
         verkleinert hinein. Ist die Position bekannt, ist die Umgebung
         des Technikers die nützlichere Ansicht. */
      if(S.tour.gps) karte.setView([S.tour.gps.lat, S.tour.gps.lon], 10);
      else alleZeigen();
    }
    ausrichten();
    /* Leaflet misst den Container sofort, die endgültige Höhe steht
       aber erst nach dem Layout fest */
    setTimeout(function(){ if(leafletKarte){ karte.invalidateSize(); ausrichten(); } },200);

    var knopf=document.getElementById("kartealle");
    if(knopf) knopf.onclick=alleZeigen;
  },0);

  return card;
}

function popupInhalt(s){
  var d=document.createElement("div");
  d.innerHTML='<div style="font:600 14px/1.3 system-ui,sans-serif;margin-bottom:2px">'+esc(stName(s))+"</div>"+
    '<div style="font-size:12.5px;color:#555;margin-bottom:6px">'+esc(s.adresse)+"</div>"+
    '<div style="margin-bottom:8px">'+marktPill(s)+' <span class="tag">'+s.pos.length+" Position(en)</span></div>"+
    stoerungVonMarkt(s.id).map(function(o){
      return '<div style="font-size:12.5px;margin-bottom:8px;padding:6px 8px;border-left:3px solid #B3342A;background:#F7E2E0;color:#222;border-radius:4px">'+
        "<strong>Störung offen</strong>"+(o.problemtyp?": "+esc(o.problemtyp):"")+
        '<br><span style="color:#555">'+esc(stoerungAlter(o).text)+(o.termin?" · Einsatz "+esc(dfmt(o.termin)):"")+"</span></div>";
    }).join("")+
    '<div style="display:flex;flex-direction:column;gap:6px">'+
      '<a class="btn sm" style="text-align:center;text-decoration:none" href="'+gmapsZiel(s)+
        '" target="_blank" rel="noopener">Mit Google Maps navigieren</a>'+
      '<button class="btn ghost sm" type="button" data-akt="detail">Anlagen und Historie</button>'+
      '<button class="btn ghost sm" type="button" data-akt="proto">Protokoll ausfüllen</button>'+
    "</div>";
  d.querySelector('[data-akt="detail"]').onclick=function(){
    var host=document.getElementById("mapdetail");
    if(host){ host.innerHTML=""; host.appendChild(standortDetail(s)); host.scrollIntoView({behavior:"smooth",block:"start"}); }
    if(leafletKarte) leafletKarte.closePopup();
  };
  d.querySelector('[data-akt="proto"]').onclick=function(){
    S.protoStandort=s.id; S.protoPos=s.pos.length?s.pos[0].id:""; S.protoArt="wartung"; S.view="protokoll"; render(); window.scrollTo({top:0});
  };
  return d;
}

function tourPanel(){
  var kand=tourKandidaten();
  var T=S.tour.ergebnis;
  var gpsHinweis="";
  if(S.tour.startId==="__gps"){
    if(S.tour.gps) gpsHinweis='<div class="note">Startpunkt ist Ihre aktuelle Position, ermittelt auf rund '+
      Math.round(S.tour.gps.genauigkeit)+' m genau.</div>';

/* Zugang zur Regelung – nur wo es Fernzugriff gibt und etwas eingetragen ist.
   Das Passwort steht verdeckt da; aufdecken und kopieren geht mit einem Tipp. */
function inZwischenablage(text, was){
  var fertig=function(ok){ toast(ok ? was+" kopiert." : "Kopieren hat nicht geklappt – bitte von Hand abtippen."); };
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(text).then(function(){ fertig(true); }, function(){ fertig(false); });
  try{
    var h=document.createElement("textarea");
    h.value=text; h.style.position="fixed"; h.style.opacity="0";
    document.body.appendChild(h); h.select();
    fertig(document.execCommand("copy")); document.body.removeChild(h);
  }catch(e){ fertig(false); }
}

/* Termine einer Anlage für den Dialog: je aktiver Zeile Kürzel und Soll-Monat */
function termineStart(leader){
  return anlageVon(leader).termine.filter(function(t){ return t.aktiv!==false; }).map(function(t){
    return {id:t.id, intervallCode:t.intervallCode||"", monat:+t.monat||0, monatGrund:t.monatGrund||"", naechste:t.naechste||null};
  });
}
/* Was der Dialog an Inbetriebnahme und Terminen geändert hat – je Zeile
   die neuen Werte und die Einträge für den Änderungsverlauf. Die
   Inbetriebnahme gehört der Anlage und geht deshalb auf alle ihre Zeilen. */
function terminAenderungen(start, erg, name){
  var proPos={}, log=[];
  if(!start._termine || !erg._termine) return {proPos:proPos, log:log};
  var ibAlt=start.inbetriebnahme||null, ibNeu=erg.inbetriebnahme||null, ibNeuGesetzt=!gleich(ibAlt, ibNeu);
  if(ibNeuGesetzt) log.push({feld:"inbetriebnahme", name:name+" – Inbetriebnahme", alt:ibAlt?dfmt(ibAlt):"–", neu:ibNeu?dfmt(ibNeu):"–"});
  erg._termine.forEach(function(t,i){
    var alt=start._termine[i]||{}, d={}, code=String(t.intervallCode||"").toUpperCase()||"?";
    if(ibNeuGesetzt) d.inbetriebnahme=ibNeu;
    if(!gleich(alt.intervallCode||"", t.intervallCode||"")){
      d.intervallCode=t.intervallCode;
      log.push({feld:"intervallCode", name:name+" – Kürzel", alt:alt.intervallCode||"–", neu:t.intervallCode||"–"});
    }
    if((+alt.monat||0)!==(+t.monat||0)){
      d.monat=+t.monat||null;
      log.push({feld:"monat", name:name+" – Soll-Monat "+code, alt:+alt.monat?MONATE_L[+alt.monat]:"–", neu:+t.monat?MONATE_L[+t.monat]:"–"});
    }
    if(!gleich(alt.monatGrund||"", t.monatGrund||"")){
      d.monatGrund=t.monatGrund||"";
      log.push({feld:"monatGrund", name:name+" – Grund für den abweichenden Soll-Monat "+code, alt:alt.monatGrund||"–", neu:t.monatGrund||"–"});
    }
    if(Object.keys(d).length) proPos[t.id]=d;
  });
  return {proPos:proPos, log:log};
}
/* Geänderte Felder mehrerer Zeilen wegschreiben – je Zeile ein Eintrag in
   den Stammdaten, gerechnet gegen den Excel-Stand wie überall sonst. */
function positionenSchreiben(proPos, grund){
  var zeit=new Date().toISOString();
  return Promise.all(Object.keys(proPos).map(function(pid){
    var p=ALLE_POS.filter(function(x){ return x.id===pid; })[0];
    if(!p) return null;
    var neuP=Object.assign(auswahl(p, STAMM_FELDER_POS), proPos[pid]);
    var rec={id:"position:"+pid, typ:"position", ziel:pid, felder:objDiff(EXCEL["position:"+pid]||{}, neuP, STAMM_FELDER_POS),
             neu:!!p._neu, geaendert:zeit, von:wer(), grund:grund};
    stammUeber[rec.id]=rec;
    return stammSpeichern(rec);
  })).then(function(wo){
    wendeStammdatenAn();
    return wo.indexOf("geraet")>=0 ? "geraet" : "ablage";
  });
}

/* je Anlage ein Block: Name, Anlagendaten, darunter ihre Termine */
/* Anlagendaten ergänzen, ohne ein Protokoll zu schreiben. Dieselbe geführte
   Erfassung; gespeichert wird direkt in die Anlagendaten, mit Eintrag im
   Änderungsverlauf. Anlagendaten darf jede angemeldete Person ergänzen. */
function anlageDatenErgaenzen(leader){
  if(!Store.benutzer && Store.modus==="anmeldung"){ toast("Dafür bitte zuerst anmelden."); return; }
  var vorher=auswahl(leader, STAMM_FELDER_POS);
  var jetzt=anlageDaten(leader);
  var start={anlagentyp:jetzt.anlagentyp, rueckkuehler:jetzt.rueckkuehler,
             inbetriebnahme:jetzt.inbetriebnahme||null, _termine:termineStart(leader)};
  ANLAGE_FELDER.forEach(function(f){ start[f.k]=(jetzt[f.k]===undefined?null:jetzt[f.k]); });
  /* true: alle Gruppen zeigen. Hier geht es ums Prüfen und Korrigieren,
     nicht nur ums Nachtragen fehlender Angaben. */
  anlageAssistent(start, anlagenName(jetzt), false, true).then(function(erg){
    if(!erg) return;
    var geaendert=[], leaderNeu={};
    ANLAGE_FELDER.concat([{k:"anlagentyp", l:"Bezeichnung der Anlage"}]).forEach(function(f){
      if(erg[f.k]===undefined) return;
      if(gleich(vorher[f.k], erg[f.k])) return;
      leaderNeu[f.k]=erg[f.k];
      geaendert.push({feld:f.k, name:anlagenName(jetzt)+" – "+(f.l||f.k),
        alt:anlageWertText(f, vorher[f.k]), neu:anlageWertText(f, erg[f.k])});
    });
    /* dazu, was sich an Inbetriebnahme und Terminen geändert hat */
    var ta=terminAenderungen(start, erg, anlagenName(jetzt));
    var proPos=ta.proPos;
    if(Object.keys(leaderNeu).length) proPos[leader.id]=Object.assign(proPos[leader.id]||{}, leaderNeu);
    geaendert=geaendert.concat(ta.log);
    if(!geaendert.length){ toast("Nichts geändert."); return; }
    positionenSchreiben(proPos, "Anlagendaten geprüft und ergänzt").then(function(wo){
      wendeStammdatenAn();
      protokolliere({art:"stammdaten", standortId:leader.standortId,
        standortName:stName(byId[leader.standortId]||{}), grund:"Anlagendaten geprüft und ergänzt", felder:geaendert});
      toast(wo==="geraet" ? "Auf dem Gerät gespeichert – wird übertragen, sobald Verbindung besteht."
                          : geaendert.length+" Angabe"+(geaendert.length===1?"":"n")+" gespeichert.");
      render();
    });
  });
}

/* ---------- View: Anlagen ---------- */
function viewAnlagen(){
  var f=document.createDocumentFragment();
  var pos=filteredPos();

  /* Baujahr-Histogramm */
  var years=pos.filter(function(p){return p.baujahr;}).map(function(p){return p.baujahr;});
  var minY=Math.min.apply(null,years.concat([JAHR])), maxY=Math.max.apply(null,years.concat([JAHR]));
  var counts=[]; for(var y=minY;y<=maxY;y++) counts.push({y:y,n:years.filter(function(v){return v===y;}).length});
  var mx=Math.max(1,Math.max.apply(null,counts.map(function(c){return c.n;})));
  var CW=720,CH=190,cpL=30,cpR=8,cpT=14,cpB=28;
  var ciw=CW-cpL-cpR, cih=CH-cpT-cpB, bw=ciw/counts.length;
  var bars=counts.map(function(c,i){
    var h=c.n/mx*cih, x=cpL+i*bw+2.5, w=bw-5, yy=cpT+cih-h;
    return (c.n?'<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" style="fill:var(--accent)"/>':"")+
      '<rect class="hit" x="'+(cpL+i*bw)+'" y="'+cpT+'" width="'+bw+'" height="'+cih+'" style="fill:transparent" data-y="'+c.y+'" data-n="'+c.n+'"/>'+
      (c.n?'<text class="num" x="'+(x+w/2).toFixed(1)+'" y="'+(yy-4).toFixed(1)+'" text-anchor="middle" font-size="10" style="fill:var(--ink-2)">'+c.n+"</text>":"")+
      '<text x="'+(cpL+i*bw+bw/2).toFixed(1)+'" y="'+(cpT+cih+15)+'" text-anchor="middle" font-size="10" style="fill:var(--ink-3)">'+("'"+String(c.y).slice(2))+"</text>";
  }).join("");
  var gy=[0,Math.round(mx/2),mx].filter(function(v,i,a){return a.indexOf(v)===i;});
  var grid=gy.map(function(v){ var yy=cpT+cih-v/mx*cih;
    return '<line x1="'+cpL+'" y1="'+yy.toFixed(1)+'" x2="'+(CW-cpR)+'" y2="'+yy.toFixed(1)+'" style="stroke:var(--line);stroke-width:1"/>'+
      '<text class="num" x="'+(cpL-6)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end" font-size="10" style="fill:var(--ink-3)">'+v+"</text>"; }).join("");

  var hist=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Inbetriebnahme der Anlagen</h2><div class="sub">'+years.length+' von '+pos.length+' Positionen haben ein Datum in der Liste. Ältester Eintrag '+minY+".</div></div>"+
    '<svg class="chart" viewBox="0 0 '+CW+" "+CH+'" role="img" aria-label="Anzahl Anlagen je Inbetriebnahmejahr">'+grid+bars+"</svg>"+
  "</div></div>");
  hist.querySelectorAll(".hit").forEach(function(r){
    r.addEventListener("mousemove",function(e){ tipShow(e,"<b>"+r.dataset.y+"</b><br>"+r.dataset.n+" Anlage(n) in Betrieb genommen"); });
    r.addEventListener("mouseleave",tipHide);
  });
  f.appendChild(hist);

  /* Standortliste */
  var list=filtered().slice().sort(function(a,b){
    var d=STATUS_RANK[a.status]-STATUS_RANK[b.status]; if(d) return d;
    return (a.plz||"zz").localeCompare(b.plz||"zz");
  });
  var card=el('<div class="card"><div class="pad"><h2>Anlagenstamm</h2>'+
    '<div class="sub">'+list.length+" Standorte · "+pos.length+" Wartungspositionen. Aufklappen zeigt Anlagendaten und Wartungshistorie.</div></div><div id=\"stlist\"></div></div>");
  var host=card.querySelector("#stlist");
  list.forEach(function(s){
    var st=stoerungVonMarkt(s.id);
    var d=el('<details class="st"><summary>'+
      "<span><strong>"+esc(stName(s))+'</strong><br><span class="muted" style="font-size:12.5px">'+esc(s.adresse)+(s.region?" · "+esc(s.region):"")+"</span></span>"+
      '<span class="rowflex" style="justify-content:flex-end">'+
        (st.length?'<span class="pill p-ueberfaellig">'+(st.length===1?"Störung offen":st.length+" Störungen offen")+"</span>":"")+
        (s.ueber30kg?'<span class="tag f30">&gt;30 kg</span>':"")+
        '<span class="tag">'+anlagenDesMarkts(s,true).length+" Anl.</span>"+marktPill(s)+"</span>"+
    '</summary><div class="inner"></div></details>');
    var inner=d.querySelector(".inner");
    d.addEventListener("toggle",function(){
      if(d.open && !inner.dataset.done){
        /* Hinfahren und offene Störungen gleich oben, vor den Anlagen */
        var kopf=el('<div class="rowflex" style="gap:8px;margin-bottom:10px">'+
          (s.lat||s.plz?'<a class="btn sm" style="text-decoration:none" href="'+gmapsZiel(s)+'" target="_blank" rel="noopener">Mit Google Maps navigieren</a>':"")+
          "</div>");
        if(kopf.children.length) inner.appendChild(kopf);
        st.forEach(function(o){ var z=stoerungEintrag(o,true); z.style.marginBottom="10px"; inner.appendChild(z); });
        anlagenBloecke(s, inner); inner.dataset.done="1";
      }
    });
    host.appendChild(d);
  });
  f.appendChild(card);
  return f;
}

/* ---------- Protokoll ---------- */
var ANLAGENTYPEN=["Split","Multi-Split","VRV wassergekühlt","VRV luftgekühlt","Rückkühler","Pumpe","sonstige"];
var REGELUNGEN=["Daikin Touch Manager","R&S","Wurm","LichtLoidl"];

/* ---------- Anlagendaten ----------
   Was UKT über jede Anlage wissen muss. Die Excel-Liste ist hier lückenhaft;
   ergänzt wird vor Ort beim Protokoll über einen geführten Dialog, der nur
   fragt, was fehlt. Gruppen = Schritte des Dialogs. */
var BAUARTEN=["Split","Multi-Split","VRV luftgekühlt","VRV wassergekühlt","Kaltwassersatz"];
var KAELTEMITTEL=["R410A","R32","R407C","R134a","R454B","R744"];
var OHNE_REGELUNG="keine eigene Regelung";
/* Wo in der Filiale etwas steht – die Orte, die bei Lidl vorkommen */
var ORTE=["Technikraum hinten, von innen","Technikraum hinten, von außen","Technikraum vorne, von innen",
  "Technikraum vorne, von außen","Dachboden","Dach Filiale","Dach Backshop","Büro","Sozialraum","Pfandraum",
  "Backshop","Lager","IT-Raum"];
function istWassergekuehlt(a){
  var b=String(a.bauart||"").toLowerCase();
  if(b) return b.indexOf("wasser")>=0 || b.indexOf("kaltwasser")>=0;
  return /wasser|rza|rk\b|rückkühl/i.test(String(a.anlagentyp||"")+" "+String(a.rueckkuehler||""));
}
var ANLAGE_GRUPPEN=[
  {titel:"Bauart", frage:"Was für eine Anlage ist das?", felder:[
    {k:"bauart", l:"Bauart", t:"wahl", o:BAUARTEN, frei:true}]},
  {titel:"Kältekreis", frage:"Wie viele Kältekreisläufe hat die Anlage – und gibt es ein Prüfbuch?", felder:[
    {k:"kreislaeufe", l:"Kältekreisläufe", t:"zahl"},
    {k:"pruefbuch", l:"Prüfbuch vorhanden", t:"jn"}]},
  {titel:"Kältemittel und Leistung", frage:"Welches Kältemittel, wie viel – und wie stark ist die Anlage?", felder:[
    {k:"kaeltemittelArt", l:"Kältemittel", t:"wahl", o:KAELTEMITTEL, frei:true},
    {k:"kaeltemittelKg", l:"Füllmenge (kg)", t:"kg"},
    {k:"leistungKw", l:"Kälteleistung (kW)", t:"kw"}]},
  {titel:"Rückkühler und Pumpen", frage:"Wassergekühlt: Gehören Rückkühler und Pumpenstation zu unserem Auftrag?",
    wenn:istWassergekuehlt, felder:[
    {k:"rkUkt", l:"Rückkühler von UKT zu warten", t:"jn"},
    {k:"pumpeUkt", l:"Pumpenstation von UKT zu warten", t:"jn"}]},
  {titel:"Regelung", frage:"Welche Regelung, wer betreut sie, haben wir Fernzugriff?", felder:[
    {k:"regelung", l:"Regelung", t:"wahl", o:REGELUNGEN.concat([OHNE_REGELUNG]), frei:true},
    {k:"regelungFirma", l:"Regelung betreut von", t:"wahl", o:["UKT","andere Firma"],
      wenn:function(a){ return a.regelung!==OHNE_REGELUNG; }},
    {k:"regelungFirmaName", l:"Name der Firma", t:"text",
      wenn:function(a){ return a.regelung!==OHNE_REGELUNG && a.regelungFirma==="andere Firma"; }},
    {k:"fernzugriff", l:"Fernzugriff durch UKT", t:"jn",
      wenn:function(a){ return a.regelung!==OHNE_REGELUNG; }}]},
  /* Zugangsdaten der Regelung. „geheim“ heißt: diese Felder stehen nie im
     Protokoll, nie auf dem Blatt, nie im PDF fürs Archiv und nie mit Wert im
     Änderungsverlauf. Sie gehören zur Anlage, nicht zum Einsatz. */
  {titel:"Zugang zur Regelung", frage:"Wie kommt man auf die Regelung?", geheim:true,
    wenn:function(a){ return a.regelung!==OHNE_REGELUNG && a.fernzugriff==="ja"; }, felder:[
    {k:"zugangLink", l:"Adresse / Link", t:"text"},
    {k:"zugangBenutzer", l:"Benutzername", t:"text"},
    {k:"zugangPasswort", l:"Passwort", t:"geheim"}]},
  {titel:"Wo steht was", frage:"Wo stehen Außengeräte, Absicherung, Regelung und Prüfbuch?", felder:[
    {k:"ortAussen", l:"Außengeräte", t:"wahl", o:ORTE, frei:true},
    {k:"ortStrom", l:"Elektrische Absicherung", t:"wahl", o:ORTE, frei:true},
    {k:"ortRegelung", l:"Regelung", t:"wahl", o:ORTE, frei:true,
      wenn:function(a){ return a.regelung!==OHNE_REGELUNG; }},
    /* Nach dem Prüfbuch wird nur gefragt, wenn es eins gibt. */
    {k:"ortPruefbuch", l:"Prüfbuch", t:"wahl", o:ORTE, frei:true,
      wenn:function(a){ return a.pruefbuch==="ja"; }}]},
  {titel:"Typenschild", frage:"Angaben vom Typenschild (freiwillig)", optional:true, felder:[
    {k:"hersteller", l:"Hersteller", t:"text"},
    {k:"modell", l:"Modell", t:"text"},
    {k:"seriennummer", l:"Seriennummer", t:"text"}]}
];
var ANLAGE_FELDER=[].concat.apply([], ANLAGE_GRUPPEN.map(function(g){
  return g.felder.map(function(f){ return Object.assign({gruppe:g}, f); }); }));
/* Zugangsdaten bleiben bei der Anlage. Sie dürfen weder in den Schnappschuss
   eines Protokolls noch auf das Blatt, das an Lidl geht. */
var GEHEIME_FELDER=ANLAGE_FELDER.filter(function(f){ return f.gruppe.geheim; }).map(function(f){ return f.k; });
function istGeheim(k){ return GEHEIME_FELDER.indexOf(k)>=0; }
function leerWert(w){ return w==null || w==="" || (typeof w==="number" && isNaN(w)); }
/* Die Auswahllisten lernen dazu: was einmal unter „andere …“ eingetippt wurde,
   steht beim nächsten Mal als Knopf da – zuerst das, was am häufigsten
   vorkommt. Gespeichert wird es mit den Anlagendaten, bis dahin auf dem Gerät. */
function gelernteWerte(key){
  var haeufig={};
  ALLE_POS.forEach(function(p){
    var v=p[key];
    if(typeof v==="string" && v.trim()) haeufig[v.trim()]=(haeufig[v.trim()]||0)+1;
  });
  (lsGet("ukt_eigene",{})[key]||[]).forEach(function(v){ if(v) haeufig[v]=haeufig[v]||1; });
  return Object.keys(haeufig).sort(function(a,b){ return haeufig[b]-haeufig[a] || a.localeCompare(b,"de"); });
}
function feldOptionen(f){
  var o=(f.o||[]).slice();
  gelernteWerte(f.k).forEach(function(v){ if(o.indexOf(v)<0) o.push(v); });
  return o;
}
function merkeWert(key, wert){
  wert=String(wert||"").trim();
  if(!wert) return;
  var m=lsGet("ukt_eigene",{}) || {}, liste=m[key]||[];
  if(liste.indexOf(wert)<0){ liste.push(wert); m[key]=liste.slice(-30); lsSet("ukt_eigene",m); }
}
function feldGilt(f, a){ return (!f.gruppe.wenn || f.gruppe.wenn(a)) && (!f.wenn || f.wenn(a)); }
/* was an Pflichtangaben noch fehlt */
function anlageLuecken(a){
  return ANLAGE_FELDER.filter(function(f){ return !f.gruppe.optional && feldGilt(f,a) && leerWert(a[f.k]); });
}
function anlageWertText(f, w){
  if(leerWert(w)) return "–";
  if(f.t==="kg") return String(w).replace(".",",")+" kg";
  if(f.t==="kw") return String(w).replace(".",",")+" kW";
  /* Übersicht und Änderungsverlauf halten fest, DASS ein Passwort gesetzt
     wurde – nicht, wie es lautet. Zum Nachsehen gibt es „ändern“. */
  if(f.t==="geheim") return "••••••••";
  return String(w);
}
/* kurze Zusammenfassung für Karten, Detailansicht und Druck */
function anlageKurz(a){
  var t=[];
  if(a.bauart) t.push(a.bauart);
  if(a.kreislaeufe) t.push(a.kreislaeufe+" Kältekreis"+(+a.kreislaeufe===1?"":"e"));
  if(a.kaeltemittelArt||!leerWert(a.kaeltemittelKg)) t.push([a.kaeltemittelArt, leerWert(a.kaeltemittelKg)?"":String(a.kaeltemittelKg).replace(".",",")+" kg"].filter(Boolean).join(" "));
  if(!leerWert(a.leistungKw)) t.push(String(a.leistungKw).replace(".",",")+" kW");
  if(a.pruefbuch==="ja") t.push("Prüfbuch"+(a.ortPruefbuch?" ("+a.ortPruefbuch+")":""));
  if(istWassergekuehlt(a) && (a.rkUkt||a.pumpeUkt))
    t.push("RK "+(a.rkUkt==="ja"?"UKT":"fremd")+" · Pumpen "+(a.pumpeUkt==="ja"?"UKT":"fremd"));
  if(a.regelung) t.push(a.regelung===OHNE_REGELUNG ? "ohne eigene Regelung"
    : a.regelung+(a.regelungFirma?" ("+(a.regelungFirma==="UKT"?"UKT":(a.regelungFirmaName||"andere Firma"))+")":"")+
      (a.fernzugriff?" · Fernzugriff "+a.fernzugriff:""));
  if(a.ortAussen) t.push("Außengeräte: "+a.ortAussen);
  return t.join(" · ");
}

/* Geführte Erfassung einer Anlage. Fragt nur die Gruppen ab, in denen etwas
   fehlt, und endet mit einer Übersicht, in der sich alles ändern lässt.
   Liefert die vollständigen Werte oder null (abgebrochen). */
function anlageAssistent(start, titel, neu, alles){
  return new Promise(function(fertig){
    var a=Object.assign({}, start);
    /* eigene Kopie der Termine – der Vergleich mit dem Stand vorher braucht das Original */
    if(start._termine) a._termine=start._termine.map(function(t){ return Object.assign({}, t); });
    var ov=el('<div class="assistent" role="dialog" aria-modal="true"><div class="as-karte">'+
      '<div class="as-kopf"><div style="min-width:0"><div class="as-titel"></div><div class="as-schritt"></div></div>'+
        '<button class="btn ghost sm" type="button" data-as="zu">Abbrechen</button></div>'+
      '<div class="as-inhalt"></div><div class="as-fuss"></div></div></div>');
    document.body.appendChild(ov);
    document.body.style.overflow="hidden";
    var inhalt=ov.querySelector(".as-inhalt"), fuss=ov.querySelector(".as-fuss");
    var schliessen=function(wert){ ov.remove(); document.body.style.overflow=""; fertig(wert); };
    ov.querySelector('[data-as="zu"]').onclick=function(){ schliessen(null); };

    /* Schritte: bei einer neuen Anlage zuerst die Bezeichnung, dann jede
       Gruppe, in der eine Pflichtangabe fehlt */

          var zeilen=g.felder.filter(function(f){ return feldGilt(Object.assign({gruppe:g},f),a); }).map(function(f){

/* ----------------------------------------------------------------
   Protokolle auf dem Gerät. IndexedDB statt localStorage: localStorage
   fasst nur rund 5 MB und scheitert dann still – mit Fotos und
   Unterschrift ist das nach wenigen Protokollen voll.
   ---------------------------------------------------------------- */
var IDB=null;
var lokaleProtokolle=[];   // [{id, doc, fotos, erstellt}]

function idbOeffnen(){
  return new Promise(function(ok,nok){
    if(!window.indexedDB){ nok(new Error("Dieser Browser kann keine Daten dauerhaft speichern.")); return; }
    var r;
    try{ r=indexedDB.open("ukt-wartung",4); }catch(e){ nok(e); return; }
    r.onupgradeneeded=function(){
      var db=r.result;
      if(!db.objectStoreNames.contains("protokolle")) db.createObjectStore("protokolle",{keyPath:"id"});
      /* Version 2: Änderungsverlauf */
      if(!db.objectStoreNames.contains("aenderungen")) db.createObjectStore("aenderungen",{keyPath:"id"});
      /* Version 3: Stammdaten-Änderungen aus der Verwaltung */
      if(!db.objectStoreNames.contains("stammdaten")) db.createObjectStore("stammdaten",{keyPath:"id"});
      /* Version 4: angefangene Protokolle, die noch nicht abgeschickt sind */
      if(!db.objectStoreNames.contains("entwurf")) db.createObjectStore("entwurf",{keyPath:"id"});
    };
    r.onsuccess=function(){ IDB=r.result; ok(IDB); };
    r.onerror=function(){ nok(r.error||new Error("Gerätespeicher nicht verfügbar")); };
  });
}
function idbVorgang(modus, arbeit, ablage){
  return new Promise(function(ok,nok){
    if(!IDB){ nok(new Error("Gerätespeicher nicht geöffnet")); return; }
    ablage=ablage||"protokolle";
    var tx=IDB.transaction(ablage,modus), st=tx.objectStore(ablage), erg;
    try{ erg=arbeit(st); }catch(e){ nok(e); return; }
    tx.oncomplete=function(){ ok(erg && "result" in erg ? erg.result : undefined); };
    tx.onerror=function(){ nok(tx.error||new Error("Speichern auf dem Gerät fehlgeschlagen")); };
    tx.onabort=function(){ nok(tx.error||new Error("Gerätespeicher voll")); };
  });
}
function idbAlle(){ return idbVorgang("readonly",function(st){ return st.getAll(); }); }
function idbSchreiben(e){ return idbVorgang("readwrite",function(st){ return st.put(e); }); }
function idbLoeschen(id){ return idbVorgang("readwrite",function(st){ return st.delete(id); }); }

/* ----------------------------------------------------------------
   Angefangene Protokolle. Ein Einsatz dauert, das Handy geht zwischendurch
   aus oder der Browser räumt die Seite weg. Was im Formular steht, liegt
   deshalb laufend auf dem Gerät – bis es abgeschickt oder verworfen wird.
   Fotos und Unterschrift sind dabei, deshalb IndexedDB und nicht
   localStorage: dort wären nach zwei Bildern die 5 MB voll.
   ---------------------------------------------------------------- */
var ENTWURF_ID="aktuell";
var entwurfStand=null;      /* zuletzt gesehener Entwurf, für den Hinweis */
function entwurfSchreiben(d){
  if(!d) return Promise.resolve(false);
  d.id=ENTWURF_ID;
  entwurfStand=d;            /* auch innerhalb der Sitzung: nach einem Tabwechsel
                               soll der Hinweis sofort wieder da sein */
  return idbVorgang("readwrite",function(st){ return st.put(d); },"entwurf")
    .then(function(){ return true; }, function(){ return false; });
}
function entwurfHolen(){
  return idbVorgang("readonly",function(st){ return st.get(ENTWURF_ID); },"entwurf")
    .then(function(d){ entwurfStand=d||null; return entwurfStand; }, function(){ return null; });
}
function entwurfWeg(){
  entwurfStand=null;
  return idbVorgang("readwrite",function(st){ return st.delete(ENTWURF_ID); },"entwurf").catch(function(){});
}

function lokaleNeuLaden(){
  return idbAlle().then(function(liste){
    lokaleProtokolle=(liste||[]).sort(function(a,b){ return (b.erstellt||"").localeCompare(a.erstellt||""); });
    return lokaleProtokolle;
  },function(){ lokaleProtokolle=[]; return []; });
}

/* zentral abgelegte und gerätegespeicherte Protokolle in einer Liste */
function alleProtokolle(mitGeloeschten){
  /* wird schon beim Start für die Fälligkeiten gebraucht, bevor Listen geladen sind */
  var zentral=(protokolle||[]).map(function(p){ return Object.assign({_quelle:"zentral"},p); });
  var lokal=(lokaleProtokolle||[]).map(function(e){
    return Object.assign({_quelle:"geraet", _id:e.id, _fotoDaten:e.fotos||[],
                          _auftragDaten:e.auftrag||null}, e.doc);
  });
  /* Gelöschte zählen nirgends mit – weder in Listen noch als Wartungsnachweis.
     Nur die Verwaltung holt sie zum Wiederherstellen dazu. */
  return lokal.concat(zentral)
    .filter(function(p){ return mitGeloeschten || !p.geloescht; })
    .sort(function(a,b){
      return ((b.datum||"")+(b.erstellt||"")).localeCompare((a.datum||"")+(a.erstellt||""));
    });
}

/* Löschen = als gelöscht markieren. Das Protokoll verschwindet aus allen
   Listen und Berechnungen, bleibt aber mit Grund nachvollziehbar und lässt
   sich wiederherstellen. Nur für Admins. */
function protokollLoeschen(p, grund, wiederher){
  var jetzt=new Date().toISOString(), von=wer(), id=p._id;
  var felder = wiederher
    ? {geloescht:null, geloeschtVon:null, loeschGrund:null}
    : {geloescht:jetzt, geloeschtVon:von, loeschGrund:grund};
  var fertig=function(ok){
    if(!ok) return false;
    protokolliere({art: wiederher?"wiederhergestellt":"geloescht", protokollId:id,
      standortId:p.standortId, standortName:p.standortName, grund:grund,
      felder:[{feld:"datum", name:"Protokoll vom", alt:dfmt(p.datum), neu: wiederher?"wiederhergestellt":"gelöscht"}]});
    return true;
  };
  if(Store.modus==="supabase" && Store.sb){
    var zeile={geloescht:felder.geloescht, geloescht_von:felder.geloeschtVon, loesch_grund:felder.loeschGrund,
      version:(p.version||1)+1, geaendert:jetzt,
      korrektur_grund:(wiederher?"Wiederhergestellt: ":"Gelöscht: ")+grund};
    return Store.sb.from("protokolle").update(zeile).eq("client_id",id).select("client_id").then(function(r){
      if(r.error){
        Store.fehler = /column|geloescht/i.test(r.error.message)
          ? "Die Datenbank kennt das Löschen noch nicht – bitte das Einrichtungsskript in Supabase erneut ausführen."
          : r.error.message;
        return false;
      }
      if(!r.data || !r.data.length){ Store.fehler="Die Datenbank hat das Löschen abgelehnt – nur Admins dürfen löschen."; return false; }
      ladeProtokolle();
      return fertig(true);
    }, function(){ Store.fehler="Keine Verbindung."; return false; });
  }
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).update(Object.assign({version:(p.version||1)+1, geaendert:jetzt}, felder))
      .then(function(){ return fertig(true); }, function(){ Store.fehler="Speichern fehlgeschlagen."; return false; });
  }
  Store.fehler="Keine gemeinsame Ablage verbunden.";
  return Promise.resolve(false);
}

/* ---------------- Änderungsverlauf ----------------
   Jedes Anlegen, Korrigieren und Löschen wird festgehalten: wann, von wem,
   welches Feld von welchem auf welchen Wert, und warum. Einträge werden
   nie geändert oder gelöscht. */
var aenderungen=[];   // neueste zuerst

var FELDNAMEN={ datum:"Datum", uhrzeit:"Uhrzeit", bestellnummer:"Bestellnummer", auftragsnummer:"Lidl-Auftragsnummer",
  region:"FM-Region", standortName:"Standort", adresse:"Adresse", wartungsart:"Wartungsart", firma:"Firma",
  techniker:"Techniker/in", mitarbeiter:"Weitere Techniker/innen", kontakt:"Telefon / E-Mail", subunternehmen:"Subunternehmen",
  zertUnternehmen:"F-Gase-Unternehmenszertifikat", zertPerson:"F-Gase-Personenzertifikat",
  positionIds:"Gewartete Anlagen", anlagen:"Anlagendaten", arbeiten:"Durchgeführte Arbeiten",
  arbeitenSonstiges:"Sonstige Arbeiten", maengel:"Mängel", betriebsbereit:"Betriebsbereit",
  sofortmassnahme:"Sofortmaßnahme", ergebnis:"Ergebnis", bemerkungen:"Bemerkungen",
  nameTechniker:"Name Techniker/in", auftraggebervertreter:"Auftraggebervertreter",
  unterschrift:"Unterschrift", fotos:"Fotos" };

function feldText(feld, wert){
  if(wert==null || wert==="" || (Array.isArray(wert)&&!wert.length)) return "–";
  if(feld==="datum") return dfmt(wert);
  if(feld==="positionIds") return wert.map(function(id){
    var p=null; for(var i=0;i<POS.length;i++){ if(POS[i].id===id){ p=POS[i]; break; } }
    return p?anlagenName(p):id; }).join(", ");
  if(feld==="maengel") return wert.map(function(m){ return m.text+(m.prio?" ("+m.prio+")":""); }).join("; ");
  if(feld==="unterschrift") return "vorhanden";
  if(feld==="fotos") return wert.length+" Foto(s)";
  if(feld==="anlagen") return wert.length+" Anlage(n) erfasst";
  if(Array.isArray(wert)) return wert.join(", ");
  return String(wert);
}
function gleich(a,b){
  var n=function(v){ return (v==null||(Array.isArray(v)&&!v.length))?"":v; };
  return JSON.stringify(n(a))===JSON.stringify(n(b));
}
function vergleiche(alt, neu){
  var felder=[];
  Object.keys(FELDNAMEN).forEach(function(k){
    if(!gleich(alt[k],neu[k])) felder.push({feld:k, name:FELDNAMEN[k], alt:feldText(k,alt[k]), neu:feldText(k,neu[k])});
  });
  /* Angaben zur Störung einzeln, damit der Verlauf zeigt, was genau geändert wurde */
  var sa=alt.stoerung||{}, sn=neu.stoerung||{};
  Object.keys(STOER_NAMEN).forEach(function(k){
    if(gleich(sa[k],sn[k]) || (!sa[k]&&!sn[k])) return;
    var txt=function(w){
      if(k==="material") return (w||[]).map(function(m){ return m.text+(m.menge?" ("+m.menge+")":""); }).join("; ")||"–";
      if(k==="folgeauftrag") return w?"ja":"nein";
      if(/datum|Bis$/.test(k)) return w?dfmt(w):"–";
      return (w==null||w==="")?"–":String(w);
    };
    felder.push({feld:"stoerung."+k, name:STOER_NAMEN[k], alt:txt(sa[k]), neu:txt(sn[k])});
  });
  return felder;
}
function wer(){
  if(Store.modus==="supabase" && Store.benutzer && Store.benutzer.email) return Store.benutzer.email;
  if(Admin && Admin.frei && lsGet("ukt_admin_name","")) return lsGet("ukt_admin_name","");
  return lsGet("ukt_tech","") || "unbekannt";
}
function protokolliere(ev){
  ev.id = ev.id || "e_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  ev.zeit = ev.zeit || new Date().toISOString();
  ev.von = ev.von || wer();
  aenderungen.unshift(ev);
  var lokal=function(){
    return idbVorgang("readwrite",function(st){ return st.put(ev); },"aenderungen").catch(function(){});
  };
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("aenderungen/"+ev.id).set(ev).then(function(){}, lokal);
  }
  if(Store.modus==="supabase" && Store.sb){
    return Store.sb.from("aenderungen").insert({
      client_id:ev.id, zeit:ev.zeit, art:ev.art, protokoll_id:ev.protokollId, standort_id:ev.standortId,
      standort_name:ev.standortName, von:ev.von, grund:ev.grund||null, felder:ev.felder||[]
    }).then(function(r){ if(r.error) return lokal(); }, lokal);
  }
  return lokal();
}
function ladeAenderungen(){
  var lokal=idbVorgang("readonly",function(st){ return st.getAll(); },"aenderungen")
    .then(function(l){ return l||[]; }, function(){ return []; });
  var zentral=Promise.resolve([]);
  if(Store.modus==="supabase" && Store.sb){
    zentral=Store.sb.from("aenderungen").select("*").order("zeit",{ascending:false}).limit(300).then(function(r){
      return (r.data||[]).map(function(x){ return {id:x.client_id||x.id, zeit:x.zeit, art:x.art,
        protokollId:x.protokoll_id, standortId:x.standort_id, standortName:x.standort_name,
        von:x.von, grund:x.grund, felder:x.felder||[]}; });
    }, function(){ return []; });
  } else if(Store.modus==="claude" && Store.claudeDb){
    zentral=Store.claudeDb.collection("aenderungen").orderBy("zeit","desc").limit(300).get().then(function(s){
      return (s.docs||[]).map(function(d){ return d.data(); });
    }, function(){ return []; });
  }
  return Promise.all([lokal,zentral]).then(function(r){
    var alle={};
    r[0].concat(r[1]).forEach(function(e){ if(e&&e.id) alle[e.id]=e; });
    aenderungen=Object.keys(alle).map(function(k){ return alle[k]; })
      .sort(function(a,b){ return (b.zeit||"").localeCompare(a.zeit||""); });
    return aenderungen;
  });
}

/* ----------------------------------------------------------------
   Stammdaten-Änderungen aus der Verwaltung. Sie liegen als eigene Ebene
   über der Excel-Liste: je Markt bzw. Anlage ein Datensatz mit den Feldern,
   die vom Excel-Stand abweichen. Löscht man ihn, gilt wieder Excel.
   ---------------------------------------------------------------- */
var stammUeber = {};   // "standort:S5" | "position:P9" | "stoerung:<id>" -> {id, typ, ziel, felder, neu, geaendert, von, grund}

/* ----------------------------------------------------------------
   Offene Störungen. Lidl schickt einen Auftrag, gearbeitet wird oft erst
   Tage später. Bis dahin steht die Störung hier: sie hängt am Markt,
   erscheint unter „Fällig“ ganz oben und wird mit einem Griff zum
   Störungsprotokoll. Abgelegt werden sie wie Stammdaten-Änderungen, damit
   sie ohne eigene Tabelle auf allen Geräten stehen.
   ---------------------------------------------------------------- */
var OFFENE=[];
function offeneStoerungen(nurOffen){
  return OFFENE.filter(function(o){ return !nurOffen || !o.erledigt; })
    .sort(function(a,b){
      /* was zuerst fällig ist, steht oben; ohne Zieltermin nach hinten */
      var x=a.zieltermin||"9999", y=b.zieltermin||"9999";
      return x.localeCompare(y) || String(b.erfasstAm||"").localeCompare(String(a.erfasstAm||""));
    });
}
function stoerungVonMarkt(sid){ return offeneStoerungen(true).filter(function(o){ return o.standortId===sid; }); }
function stoerungSpeichern(o, grund){
  var rec={id:o._id, typ:"stoerung", ziel:o.standortId||"", neu:false,
    felder:auswahl(o, STOER_OFFEN_FELDER), geaendert:new Date().toISOString(), von:wer(), grund:grund||""};
  stammUeber[rec.id]=rec;
  return stammSpeichern(rec).then(function(wo){ wendeStammdatenAn(); return wo; });
}
var STOER_OFFEN_FELDER=["auftragsnummer","stoerungsnr","filialCode","problemtyp","beschreibung",
  "zieltermin","auftragsdatum","prioritaet","lidlTyp","lidlModell","hersteller","lin","seriennummer",
  "lidlKontakt","lidlTelefon","lidlMail","notiz","seiten","pdfName","pdfDaten","termin","terminZeit","terminTechniker",
  "erledigt","protokollId","quelle"];

function wendeStammdatenAn(){
  /* 1. alles auf den Excel-Stand zurück */
  ALLE_ST = ALLE_ST.filter(function(s){ return !s._neu; });
  ALLE_POS = ALLE_POS.filter(function(p){ return !p._neu; });
  ALLE_ST.forEach(function(s){ Object.assign(s, EXCEL["standort:"+s.id]); s._geaendert=false; });
  ALLE_POS.forEach(function(p){ Object.assign(p, EXCEL["position:"+p.id]); p._geaendert=false; });

  /* 2. Änderungen darüberlegen – Märkte zuerst, damit neue Anlagen ihren Markt finden */
  OFFENE=[];
  var rang=function(k){ return k.indexOf("standort:")===0 ? 0 : 1; };
  var schluessel=Object.keys(stammUeber).sort(function(a,b){ return rang(a)-rang(b); });
  schluessel.forEach(function(k){
    var r=stammUeber[k], ziel=null, i;
    /* Offene Störungen hängen an keinem Datensatz – sie sind eigene Einträge */
    if(r.typ==="stoerung"){
      OFFENE.push(Object.assign({_id:r.id, standortId:r.ziel, erfasstAm:r.geaendert, erfasstVon:r.von}, r.felder));
      return;
    }
    if(r.typ==="standort"){
      for(i=0;i<ALLE_ST.length;i++){ if(ALLE_ST[i].id===r.ziel){ ziel=ALLE_ST[i]; break; } }
      if(!ziel && r.neu){ ziel={id:r.ziel, _neu:true, pos:[], genauigkeit:"manuell", aktiv:true, name:""}; ALLE_ST.push(ziel); }
    } else {
      for(i=0;i<ALLE_POS.length;i++){ if(ALLE_POS[i].id===r.ziel){ ziel=ALLE_POS[i]; break; } }
      if(!ziel && r.neu){ ziel={id:r.ziel, _neu:true, historie:[], techniker:{}, aktiv:true}; ALLE_POS.push(ziel); }
    }
    if(!ziel) return;
    Object.assign(ziel, r.felder);
    ziel._geaendert=true;
  });

  /* 3. abgeleitete Werte nachziehen */
  ALLE_POS.forEach(function(p){
    var ex=EXCEL["position:"+p.id];
    p.monat = p.monat ? +p.monat : 0;
    p.baujahr = p.inbetriebnahme ? +String(p.inbetriebnahme).slice(0,4) : null;
    /* Wartungen laut Prüfbuch: nachgetragene Termine, die in der Excel-Liste
       fehlen. Sie zählen wie ein Eintrag der Liste – für die Fälligkeit und
       in der Historie. Der Excel-Stand bleibt darunter unverändert. */
    if(!p._historieExcel) p._historieExcel=(p.historie||[]).slice();
    var nw=Array.isArray(p.nachweise) ? p.nachweise.filter(function(n){ return n && /^\d{4}-\d\d-\d\d$/.test(n.datum||""); }) : [];
    var tage={}; p._historieExcel.concat(nw.map(function(n){ return n.datum; })).forEach(function(d){ if(d) tage[d]=1; });
    p.historie=Object.keys(tage).sort();
    p.techniker=p.techniker||{};
    nw.forEach(function(n){ var j=n.datum.slice(0,4); if(n.techniker && !p.techniker[j]) p.techniker[j]=n.techniker; });
    var kgGeaendert = !ex || p.kaeltemittelKg!==ex.kaeltemittelKg;
    if(kgGeaendert){
      var kg=(p.kaeltemittelKg===""||p.kaeltemittelKg==null)?null:+p.kaeltemittelKg;
      p.kaeltemittelKg=kg;
      p.kaeltemittelText = kg==null ? "" : kgText(kg);
      p.ueber30kg = kg!=null && kg>=30;
    }
  });
  ALLE_ST.forEach(function(s){
    if(s.lat!=null&&s.lat!=="") s.lat=+s.lat; else s.lat=null;
    if(s.lon!=null&&s.lon!=="") s.lon=+s.lon; else s.lon=null;
    if(s.entfernt) s.aktiv=false;   /* entfernte Zeilen zählen nirgends mehr mit */
    if(s._geaendert && s.lat && EXCEL["standort:"+s.id] && s.lat!==EXCEL["standort:"+s.id].lat) s.genauigkeit="manuell";
    s.unklar=!s.lat;
  });
  indexNeuAufbauen();
  berechneFaelligkeiten();
}

/* Anlagendaten dürfen alle angemeldeten Techniker ergänzen (vor Ort beim
   Protokoll), Märkte nur Admins – so regelt es auch die Datenbank */
function darfStammZentral(rec){
  /* Anlagendaten und offene Störungen darf jede angemeldete Person schreiben,
     Märkte nur Admins – so regelt es auch die Datenbank. */
  return Admin.zentral || (!!Store.benutzer && rec && (rec.typ==="position" || rec.typ==="stoerung"));
}
function stammSpeichern(rec){
  var lokal=function(){
    return idbVorgang("readwrite",function(st){ return st.put(rec); },"stammdaten")
      .then(function(){ return "geraet"; }, function(){ return false; });
  };
  if(Store.modus==="supabase" && Store.sb && darfStammZentral(rec)){
    return Store.sb.from("stammdaten").upsert({id:rec.id, typ:rec.typ, ziel:rec.ziel, felder:rec.felder,
      neu:!!rec.neu, geaendert:rec.geaendert, von:rec.von, grund:rec.grund||null})
      .then(function(r){ return r.error ? lokal() : "gemeinsam"; }, lokal);
  }
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("stammdaten/"+rec.id.replace(":","_")).set(rec)
      .then(function(){ return "gemeinsam"; }, lokal);
  }
  return lokal();
}
function stammLoeschen(id){
  var lokal=idbVorgang("readwrite",function(st){ return st.delete(id); },"stammdaten").catch(function(){});
  if(Store.modus==="supabase" && Store.sb && Admin.zentral){
    return Promise.all([lokal, Store.sb.from("stammdaten").delete().eq("id",id)]);
  }
  if(Store.modus==="claude" && Store.claudeDb){
    return Promise.all([lokal, Store.claudeDb.doc("stammdaten/"+id.replace(":","_")).delete().catch(function(){})]);
  }
  return lokal;
}
function ladeStammdaten(){
  var lokal=idbVorgang("readonly",function(st){ return st.getAll(); },"stammdaten")
    .then(function(l){ return l||[]; }, function(){ return []; });
  var zentral=Promise.resolve([]);
  if(Store.modus==="supabase" && Store.sb){
    zentral=Store.sb.from("stammdaten").select("*").then(function(r){ return r.data||[]; }, function(){ return []; });
  } else if(Store.modus==="claude" && Store.claudeDb){
    zentral=Store.claudeDb.collection("stammdaten").get().then(function(s){
      return (s.docs||[]).map(function(d){ return d.data(); });
    }, function(){ return []; });
  }
  return Promise.all([lokal,zentral]).then(function(r){
    var alle={};
    /* gemeinsame Fassung zuerst, eine neuere vom Gerät gewinnt */
    r[1].concat(r[0]).forEach(function(x){
      if(!x||!x.id) return;
      if(!alle[x.id] || (x.geaendert||"")>(alle[x.id].geaendert||"")) alle[x.id]=x;
    });
    stammUeber=alle;
    wendeStammdatenAn();
    return stammUeber;
  });
}
/* auf dem Gerät gemachte Änderungen nachtragen, sobald man zentral Admin ist */
function stammdatenUebertragen(){
  var darf = (Store.modus==="supabase" && !!Store.benutzer) || Store.modus==="claude";
  if(!darf) return;
  idbVorgang("readonly",function(st){ return st.getAll(); },"stammdaten").then(function(liste){
    (liste||[]).forEach(function(rec){
      if(Store.modus==="supabase" && !darfStammZentral(rec)) return;
      stammSpeichern(rec).then(function(wo){
        if(wo==="gemeinsam") idbVorgang("readwrite",function(st){ return st.delete(rec.id); },"stammdaten");
      });
    });
  },function(){});
}

/* ---------------- Admin-Freigabe ----------------
   Mit gemeinsamer Datenbank entscheidet die Tabelle "admins" in Supabase –
   das setzt die Datenbank selbst durch. Ohne sie gelten Änderungen nur auf
   diesem Gerät; dort schützt eine PIN vor versehentlichen Eingriffen. */
var Admin={frei:false, zentral:false, geprueft:false};
function sha256hex(text){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b),function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
  });
}
function adminPruefen(){
  if(Store.modus==="supabase" && Store.sb && Store.benutzer){
    return Store.sb.from("admins").select("user_id").eq("user_id",Store.benutzer.id).then(function(r){
      Admin.zentral=!!(r.data&&r.data.length); Admin.frei=Admin.zentral; Admin.geprueft=true;
      stammdatenUebertragen();   /* Anlagendaten auch von Technikern */
      return Admin.frei;
    },function(){ Admin.geprueft=true; return false; });
  }
  Admin.geprueft=true;
  try{ Admin.frei = sessionStorage.getItem("ukt_admin_frei")==="1"; }catch(e){}
  return Promise.resolve(Admin.frei);
}

/* Einträge, die auf dem Gerät entstanden sind, in die gemeinsame Ablage
   nachtragen – erst nach bestätigter Übertragung vom Gerät entfernen */
function aenderungenUebertragen(){
  if(Store.modus!=="claude" && Store.modus!=="supabase") return;
  idbVorgang("readonly",function(st){ return st.getAll(); },"aenderungen").then(function(liste){
    (liste||[]).forEach(function(ev){
      var weg=function(){ return idbVorgang("readwrite",function(st){ return st.delete(ev.id); },"aenderungen"); };
      if(Store.modus==="claude"){
        Store.claudeDb.doc("aenderungen/"+ev.id).set(ev).then(weg,function(){});
      } else {
        Store.sb.from("aenderungen").upsert({
          client_id:ev.id, zeit:ev.zeit, art:ev.art, protokoll_id:ev.protokollId, standort_id:ev.standortId,
          standort_name:ev.standortName, von:ev.von, grund:ev.grund||null, felder:ev.felder||[]
        },{onConflict:"client_id", ignoreDuplicates:true}).then(function(r){ if(!r.error) weg(); },function(){});
      }
    });
  },function(){});
}

/* ältere Fassung legte die Warteschlange in localStorage ab – übernehmen */
function altlastUebernehmen(){
  var alt=lsGet("ukt_queue",[]);
  if(!alt.length) return Promise.resolve();
  var kette=Promise.resolve();
  alt.forEach(function(e){
    kette=kette.then(function(){
      return idbSchreiben({id:e.id, doc:e.doc, fotos:e.fotos||[], erstellt:(e.doc&&e.doc.erstellt)||new Date().toISOString()});
    });
  });
  return kette.then(function(){ try{ localStorage.removeItem("ukt_queue"); }catch(x){} });
}

function initStore(versuch){
  versuch=versuch||0;
  var supabaseKonfiguriert = CFG.supabaseUrl && CFG.supabaseAnonKey;
  /* Innerhalb von Claude läuft die Seite in einem Rahmen, und window.claude
     kommt erst nach dem ersten Skriptlauf. Als eigenständige Seite
     (GitHub Pages, eigenes Hosting) gibt es darauf nichts zu warten. */
  var imRahmen=false; try{ imRahmen = window.self!==window.top; }catch(e){ imRahmen=true; }
  if(!window.claude || !window.claude.use){
    if(!supabaseKonfiguriert && imRahmen && versuch<40){ setTimeout(function(){ initStore(versuch+1); },250); return; }
    if(supabaseKonfiguriert) return initSupabase();
    Store.modus="lokal"; storeNachRender(); return;
  }
  window.claude.use("db").then(function(api){
    if(!api){ if(supabaseKonfiguriert) return initSupabase(); Store.modus="lokal"; storeNachRender(); return; }
    Store.claudeDb=api; Store.modus="claude";
    api.collection("protokolle").orderBy("erstellt","desc").limit(1000).onSnapshot(function(snap){
      protokolle=(snap.docs||[]).map(function(d){ return Object.assign({_id:d.id},d.data()||{}); });
      storeNachRender();
    }, function(){ });
    flushQueue();
    ladeStammdaten().then(storeNachRender);
    storeNachRender();
  }, function(){ if(supabaseKonfiguriert) return initSupabase(); Store.modus="lokal"; storeNachRender(); });
}

function initSupabase(){
  if(!window.supabase || !window.supabase.createClient){ Store.modus="lokal"; Store.fehler="Supabase-Bibliothek nicht geladen."; storeNachRender(); return; }
  Store.sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  Store.sb.auth.getSession().then(function(r){
    var sess=r&&r.data?r.data.session:null;
    if(sess){ Store.benutzer=sess.user; Store.modus="supabase"; ladeProtokolle(); flushQueue();
      adminPruefen().then(ladeStammdaten).then(storeNachRender); }
    else { Store.modus="anmeldung"; }
    storeNachRender();
  });
  Store.sb.auth.onAuthStateChange(function(_ev,sess){
    if(sess){ Store.benutzer=sess.user; Store.modus="supabase"; ladeProtokolle(); flushQueue();
      adminPruefen().then(ladeStammdaten).then(storeNachRender); }
    else { Store.benutzer=null; Store.modus="anmeldung"; protokolle=[]; Admin.zentral=false; Admin.frei=false; }
    storeNachRender();
  });
}

/* Spaltennamen der Datenbank sind snake_case, das Formular liefert camelCase */
function zuZeile(doc,uid){
  var zeile={ erstellt:doc.erstellt, erstellt_von:uid,
    standort_id:doc.standortId, position_id:doc.positionId, position_ids:doc.positionIds||[], filiale:doc.filiale,
    standort_name:doc.standortName, adresse:doc.adresse, region:doc.region,
    datum:doc.datum||null, uhrzeit:doc.uhrzeit||null,
    bestellnummer:doc.bestellnummer, auftragsnummer:doc.auftragsnummer, wartungsart:doc.wartungsart,
    firma:doc.firma, techniker:doc.techniker, kontakt:doc.kontakt, subunternehmen:doc.subunternehmen,
    zert_unternehmen:doc.zertUnternehmen, zert_person:doc.zertPerson,
    anlagen:doc.anlagen, arbeiten:doc.arbeiten, arbeiten_sonstiges:doc.arbeitenSonstiges,
    maengel:doc.maengel, betriebsbereit:doc.betriebsbereit, sofortmassnahme:doc.sofortmassnahme,
    ergebnis:doc.ergebnis, bemerkungen:doc.bemerkungen,
    name_techniker:doc.nameTechniker, auftraggebervertreter:doc.auftraggebervertreter,
    fotos:doc.fotos||[] };
  /* Nur mitschicken, wenn sie wirklich vorliegt. Wurde sie nicht nachgeladen,
     bleibt die Spalte unberührt – eine Korrektur darf keine Unterschrift
     löschen, nur weil sie gerade nicht im Speicher war. */
  if(typeof doc.unterschrift==="string") zeile.unterschrift=doc.unterschrift;
  /* nur mitschicken, wenn es eins ist – Wartungen gehen so auch an eine
     Datenbank, in der die Spalte noch fehlt */
  if(doc.stoerung) zeile.stoerung=doc.stoerung;
  if(doc.mitarbeiter && doc.mitarbeiter.length) zeile.mitarbeiter=doc.mitarbeiter;
  return zeile;
}
function ausZeile(r){
