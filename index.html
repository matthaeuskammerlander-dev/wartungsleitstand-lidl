/* Werte aus der KI in die Form der App bringen */
/* Zahl aus Text: „1.975,3“ und „1975,3“ und „1975.3“ – Tausenderpunkte erkannt */
function kiZahl(t){
  var v=String(t||"").replace(/[^\d,.\-]/g,"");
  if(v.indexOf(",")>=0) v=v.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(v)) v=v.replace(/\./g,"");
  return v===""||isNaN(+v) ? null : +v;
}
function kiJn(t){ t=String(t||"").trim().toLowerCase(); return /^(ja|j|yes|x)$/.test(t)?"ja":/^(nein|n|no)$/.test(t)?"nein":null; }
/* Datum aus der KI: nur echte Kalendertage (kein 31.09.) und nicht in der Zukunft */
function kiDatum(t, zukunftOk){ var m=/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{2,4})/.exec(String(t||"")); if(!m) return null;
  var j=m[3].length===2?"20"+m[3]:m[3], iso=j+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
  var d=new Date(iso+"T12:00:00");
  if(isNaN(d) || isoLokal(d)!==iso) return null;
  if(!zukunftOk && iso>isoLokal(new Date())) return null;
  return iso; }
function kiAnlage(k){
  k=k||{}; var r={};
  var setz=function(key,w){ if(w!=null && w!=="") r[key]=w; };
  setz("anlagentyp", String(k.bezeichnung||"").trim());
  ["hersteller","modell","seriennummer","aufsteller"].forEach(function(x){ setz(x, String(k[x]||"").trim()); });
  var ba=String(k.bauart||"").trim(); setz("bauart", BAUARTEN.filter(function(b){ return b.toLowerCase()===ba.toLowerCase(); })[0] || (/split/i.test(ba)?"Split":ba));
  setz("kreislaeufe", kiZahl(k.kreislaeufe)!=null ? Math.round(kiZahl(k.kreislaeufe)) : null);
  var km=String(k.kaeltemittelArt||"").replace(/[\s\-]+/g,"").toUpperCase().replace(/^(R\d+)([A-Z]?)$/,"$1$2");
  setz("kaeltemittelArt", KAELTEMITTEL.filter(function(x){ return x.toUpperCase()===km; })[0] || km);
  ["kaeltemittelKg","gwp","leistungKw","psBar","toC","tkC","psv"].forEach(function(x){ setz(x, kiZahl(k[x])); });
  ["hermetisch","leckageerkennung","astv"].forEach(function(x){ setz(x, kiJn(k[x])); });
  var fg=String(k.fluidgruppe||"").replace(/\D/g,""); if(fg==="1"||fg==="2") setz("fluidgruppe", fg);
  var gp=String(k.gefahr||"").toUpperCase(); setz("gefahr", /HP|HOH/.test(gp)?"HP":/NP|NIED/.test(gp)?"NP":null);
  var ep=String(k.erstePruefung||""); setz("erstePruefung", /kpst|kessel/i.test(ep)?"KPSt":/skp|sachk/i.test(ep)?"skP":null);
  var dm=String(k.dichtheitMonate||""); setz("dichtheitMonate", /nz|nicht/i.test(dm)?"nz":((/(3|6|12|24)/.exec(dm)||[])[1]||null));
  setz("inbetriebnahme", kiDatum(k.inbetriebnahme));
  setz("konformitaet", kiDatum(k.konformitaet));
  return r;
}
/* Prüfungen aus dem Prüfbuch -> Wartungen laut Prüfbuch (nur mit vollem
   Datum; nur Monat/Jahr kommt als Notiz) */
function kiNachweise(liste){
  var voll=[], ohneTag=[];
  (liste||[]).forEach(function(p){
    var d=kiDatum(p.datum);
    /* UKT selbst (Stempel „Umwelt- und Klimatechnik GmbH“) ist kein Name; ein
       Techniker wird auf die bekannte Schreibweise gebracht (Tobias) */
    var ukt=/kammerlander|\bukt\b|umwelt.{0,6}klimatechnik/i.test(p.firma||"");
    var wer=String(p.techniker||"").trim();
    if(wer){ var k=kanonName(wer), kurz=kanonName(wer.split(/\s+/)[0]);
      wer = bekannteNamen().indexOf(k)>=0 ? k : (bekannteNamen().indexOf(kurz)>=0 ? kurz : wer); }
    else if(!ukt) wer=String(p.firma||"").trim();
    if(d) voll.push({datum:d, techniker:wer||undefined});
    else if(/\d{1,2}\.\d{4}/.test(p.datum||"")) ohneTag.push(p.datum+(p.firma?" ("+p.firma+")":""));
  });
  return {voll:voll, ohneTag:ohneTag};
}
/* Kontrollansicht: was die KI gelesen hat, gegen den jetzigen Stand. Je
   Feld ein Haken – vorbelegt, wo bisher nichts steht; unsichere Felder
   sind markiert und nie vorbelegt. Liefert die gewählten Werte. */

    if(hinweis) v.inhalt.appendChild(el('<div class="note">'+esc(hinweis)+"</div>"));

      var z=el('<label class="posbox" style="display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;cursor:pointer'+(uns?";border-color:var(--warn)":"")+'">'+
        '<input type="checkbox" data-k="'+esc(f.k)+'"'+((!gleichWert && leerWert(alt) && !uns)?" checked":"")+(gleichWert?" disabled":"")+">"+
        "<span><strong>"+esc(f.l)+"</strong>"+(uns?' <span class="pill p-faellig">unsicher</span>':"")+
        '<br><span style="font-size:14px">'+esc(f.zeige?f.zeige(neu):String(neu))+"</span>"+
        (leerWert(alt)?"":'<br><span class="muted" style="font-size:12px">bisher: '+esc(f.zeige?f.zeige(alt):String(alt))+(gleichWert?" (gleich)":"")+"</span>")+
        "</span></label>");
      box.appendChild(z);
    });
    v.inhalt.appendChild(box);
    var nimm=el('<button class="btn" type="button">Angehakte übernehmen</button>');
    var zu=el('<button class="btn ghost" type="button">Nichts übernehmen</button>');
    nimm.onclick=function(){
      var r={}; box.querySelectorAll("input:checked").forEach(function(c){ r[c.dataset.k]=gelesen[c.dataset.k]; });
      v.zu(); fertig(r);
    };
    zu.onclick=function(){ v.zu(); fertig(null); };
    v.fuss.appendChild(zu); v.fuss.appendChild(nimm);
  });
}

/* Jeder Link auf eingebettete Daten – Auftragsseiten, Fotos, die noch auf
   dem Gerät liegen – geht in die eigene Ansicht statt ins Leere. */
document.addEventListener("click",function(e){

function leseLidlPdf(datei){
  /* das Original merken – es wird beim Protokoll abgelegt */
  var roh=null;
  return ladePdfJs().then(function(){ return dateiAlsDatenUrl(datei); })
    .then(function(u){ roh=u; return datei.arrayBuffer(); }).then(function(buf){
    return window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  }).then(function(pdf){
    var seiten=[]; for(var i=1;i<=Math.min(pdf.numPages,2);i++) seiten.push(i);
    return Promise.all(seiten.map(function(n){
      return pdf.getPage(n).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
        /* Seite 2 nach unten versetzen, damit sich Zeilen nicht überlagern */
        return tc.items.map(function(it){ return {s:it.str, x:Math.round(it.transform[4]), y:Math.round(it.transform[5])-(n-1)*2000}; });
      });
    })).then(function(listen){
      var teile=[].concat.apply([],listen);
      var lesbar=textIstLesbar(teile);
      return pdfSeitenAlsBild(pdf, 2).then(function(bilder){
        var a = lesbar ? werteLidlAuftrag(teile) : {};
        a._lesbar=lesbar; a._seiten=bilder;
        a._pdfName=datei.name||"auftrag.pdf"; a._pdfDaten=roh;
        return a;
      });
    });
  });
}

/* Kostenstelle AT0234 -> Filiale 234; sonst über die Adresse */
function standortZuAuftrag(a){
  var m=/AT0*(\d+)/i.exec(a.kostenstelle||"");
  if(m){ var tr=ST.filter(function(s){ return String(s.filiale||"").replace(/^0+/,"")===m[1]; }); if(tr.length) return tr[0]; }
  if(a.adresse){
    var norm=function(t){ return String(t||"").toLowerCase().replace(/straße|strasse/g,"str").replace(/[^a-z0-9äöüß]/g,""); };
    var plz=(/\b(\d{4})\b/.exec(a.adresse)||[])[1], strasse=norm(a.adresse.split(",")[0]);
    var tr2=ST.filter(function(s){ return (!plz||s.plz===plz) && strasse && norm(s.adresse).indexOf(strasse)>=0; });
    if(tr2.length===1) return tr2[0];
  }
  return null;
}

/* QR-Code mit der Kamera lesen. Nimmt die eingebaute Erkennung des Browsers,
   wo es sie gibt (Android), sonst eine kleine Bibliothek (iPhone). */
function scanneQr(){
  return new Promise(function(fertig){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast("Dieser Browser erlaubt keinen Kamerazugriff."); fertig(null); return; }
    var ov=el('<div class="qrscan"><div class="qrbox"><video playsinline muted></video><div class="qrrahmen"></div></div>'+
      '<div class="qrtext">QR-Code des Lidl-Auftrags in den Rahmen halten</div>'+
      '<button class="btn" type="button">Abbrechen</button></div>');
    document.body.appendChild(ov);
    var video=ov.querySelector("video"), strom=null, aus=false, cv=document.createElement("canvas");
    var ende=function(wert){
      if(aus) return; aus=true;
      if(strom) strom.getTracks().forEach(function(t){ t.stop(); });
      ov.remove(); fertig(wert);
    };
    ov.querySelector("button").onclick=function(){ ende(null); };
    var erkenner=null;
    var vorbereitet = ("BarcodeDetector" in window)
      ? Promise.resolve().then(function(){ erkenner=new window.BarcodeDetector({formats:["qr_code"]}); })
          .catch(function(){ return window.jsQR?null:ladeSkript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"); })
      : (window.jsQR?Promise.resolve():ladeSkript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"));
    Promise.all([vorbereitet, navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false})])
      .then(function(r){
        strom=r[1]; if(aus){ ende(null); return; }
        video.srcObject=strom; return video.play();
      }).then(function(){
        var runde=function(){
          if(aus) return;
          var w=video.videoWidth, h=video.videoHeight;
          if(!w){ setTimeout(runde,150); return; }
          var weiter=function(wert){ if(wert) ende(wert); else setTimeout(runde,180); };
          if(erkenner){
            erkenner.detect(video).then(function(c){ weiter(c.length?c[0].rawValue:null); }, function(){ weiter(null); });
          } else {
            var sk=Math.min(1, 800/Math.max(w,h)); cv.width=Math.round(w*sk); cv.height=Math.round(h*sk);
            var g=cv.getContext("2d"); g.drawImage(video,0,0,cv.width,cv.height);
            var q=window.jsQR(g.getImageData(0,0,cv.width,cv.height).data, cv.width, cv.height);
            weiter(q?q.data:null);
          }
        };
        runde();
      }).catch(function(e){
        toast(e && e.name==="NotAllowedError" ? "Kamerazugriff wurde nicht erlaubt." : "Kamera nicht verfügbar: "+(e&&e.message||e));
        ende(null);
      });
  });
}

  function pflichtPruefung(){
    /* der Name im Abschluss ist fast immer der Techniker oben – nicht zweimal verlangen */
    var tf=form.querySelector("#f_tech"), nf=form.querySelector("#f_name");
    if(tf && nf && tf.value.trim() && !nf.value.trim()) nf.value=tf.value;
    if(tf && nf && nf.value.trim() && !tf.value.trim()) tf.value=nf.value;
    var fehlend=[];
    form.querySelectorAll("[required]").forEach(function(n){
      var leer = !n.value || !n.value.trim();
      n.style.borderColor = leer ? "var(--crit)" : "";
      if(leer) fehlend.push(n);
    });
    /* beide Namensfelder leer: nur einmal nennen */
    if(fehlend.indexOf(tf)>=0) fehlend=fehlend.filter(function(n){ return n!==nf; });
    var box=form.querySelector("#f_fehlt");
    /* Ohne Anlage kein Protokoll: bei der Wartung, weil sonst kein Termin
       quittiert wird, bei der Störung, weil sonst offen bleibt, woran
       gearbeitet wurde. Die Haken stehen nicht in [required]. */
    var posFeld=form.querySelector('input[name="posw"]');
    /* eine Mängelzeile mit Maßnahme, aber ohne Beschreibung ginge beim Speichern
       still verloren – lieber nachfragen */
    var ohneText=[].filter.call(form.querySelectorAll(".mangelrow"), function(z){
      return !z.querySelector(".m-t").value.trim() && z.querySelector(".m-m").value.trim(); });
    if(!fehlend.length && ohneText.length){
      box.textContent="Bitte den Mangel beschreiben – bei „"+ohneText[0].querySelector(".m-m").value.trim()+"“ fehlt, worum es geht.";
      box.hidden=false; ohneText[0].querySelector(".m-t").style.borderColor="var(--crit)";
      ohneText[0].scrollIntoView({behavior:"smooth", block:"center"});
      return false;
    }
    /* eine vor Ort neu erfasste Anlage zählt auch – sonst müsste man eine
       nicht gewartete anhaken und bekäme einen falschen Wartungsnachweis */
    if(!fehlend.length && posFeld && !form.querySelector('input[name="posw"]:checked') && !neueAnlagen.length){
      box.textContent = stoer ? "Bitte die Anlage wählen, an der die Störung vorliegt."
                              : "Bitte mindestens eine gewartete Anlage wählen.";
      box.hidden=false;
      posFeld.scrollIntoView({behavior:"smooth", block:"center"});
      return false;
    }
    /* Ein Protokoll entsteht nach dem Einsatz. Ein Datum in der Zukunft ist
       immer ein Vertipper – und einer mit Folgen: liegt es im Fenster des
       nächsten Termins, gilt der als erledigt und die Wartung fällt aus. */
    var dfeld=form.querySelector("#f_datum"), heute=isoLokal(new Date());
    if(!fehlend.length && dfeld && dfeld.value && dfeld.value>heute){
      dfeld.style.borderColor="var(--crit)";
      box.textContent="Das Datum liegt in der Zukunft ("+dfmt(dfeld.value)+"). "+
        "Bitte den Tag eintragen, an dem der Einsatz war.";
      box.hidden=false;
      dfeld.scrollIntoView({behavior:"smooth", block:"center"});
      try{ dfeld.focus({preventScroll:true}); }catch(x){ dfeld.focus(); }
      return false;
    }
    /* Weit zurückliegende Nachträge gibt es, aber selten – einmal nachfragen. */
    if(!fehlend.length && dfeld && dfeld.value && dfeld.value < plusMonate(heute,-24) &&
       !window.confirm("Das Datum liegt mehr als zwei Jahre zurück ("+dfmt(dfeld.value)+").\n\nStimmt das?"))
      { dfeld.focus(); return false; }

  function entwurfSammeln(){

    });

      if(n.id) n.checked=!!(d.haken&&d.haken[n.id]);

    mHost.innerHTML="";

      var z=addMangel();

    });

    if(d.anlagenAend){ Object.keys(anlagenAend).forEach(function(k){ delete anlagenAend[k]; });
      Object.keys(d.anlagenAend).forEach(function(k){ anlagenAend[k]=d.anlagenAend[k]; }); }
    if(d.neueAnlagen){ neueAnlagen.length=0; d.neueAnlagen.forEach(function(n){ neueAnlagen.push(n); }); }

    if(d.auftragSeiten && d.auftragSeiten.length) auftragBildZeigen(d.auftragSeiten);

       die offene Störung, aus der er begonnen wurde – oder eben keine. Nichts
       vom gerade geöffneten Formular darf an ihm hängen bleiben, sonst

    auftragPdf=(d.auftragPdf && d.auftragPdf.datenUrl) ? d.auftragPdf : null;

                     felder:[{feld:"positionIds", name:"Gewartete Anlagen", alt:"–", neu:feldText("positionIds",doc.positionIds)}]});

      /* 2. gibt es eine zentrale Ablage, gleich dorthin übertragen */
      if(Store.modus!=="claude" && Store.modus!=="supabase"){
        fertig("Protokoll gespeichert"+(fotos.length?" – mit "+fotos.length+" Foto(s)":"")+".");
        return;
      }
      var wartet=demo() ? "Präsentation: Protokoll angelegt – zur Ansicht, gespeichert wurde nichts."
                        : "Auf dem Gerät gespeichert – wird übertragen, sobald Verbindung besteht.";
      if(fotos.length) btn.textContent="Fotos werden übertragen …";
      /* hängt die Übertragung, gilt es nach 2 Minuten als „auf dem Gerät“ – es liegt ja sicher in der Warteschlange */
      mitFrist(speichereFotos(id,fotos).then(function(fotosOk){
        if(!fotosOk){ fertig(wartet); return; }
        if(eintrag.auftrag) btn.textContent="Auftrag wird übertragen …";
        return speichereAuftragPdf(id, eintrag.auftrag).then(function(pdfOk){
          return pdfOk ? speichereRapportPdf(id, eintrag.rapport) : false;
        }).then(function(pdfOk){
          if(!pdfOk){ fertig(wartet); return; }
          btn.textContent="Übertragen …";
          return speichereProtokoll(id,doc).then(function(ok){
            if(!ok){ fertig(wartet); return; }
            return idbLoeschen(id).then(function(){
              lokaleProtokolle=lokaleProtokolle.filter(function(x){ return x.id!==id; });
              fertig("Protokoll gespeichert und übertragen.");
            },function(){ fertig("Protokoll gespeichert und übertragen."); });
          });
        });
      }), 120000).catch(function(){ fertig(wartet); });
    },function(err){
      fehlschlag("Das Protokoll konnte auf diesem Gerät nicht gespeichert werden: "+
        (err&&err.message?err.message:"unbekannter Fehler")+
        ". Ihre Eingaben sind noch da. Häufigste Ursache: privates Browserfenster oder voller Speicher – "+
        "bitte in einem normalen Fenster öffnen oder Fotos entfernen und erneut speichern.");
    });
  };

  var head = bearb
    ? el('<div class="card" style="border-color:var(--warn)"><div class="pad stack">'+
        '<div><h2>Protokoll korrigieren</h2><div class="sub">Protokoll vom <strong>'+dfmt(bearb.datum)+"</strong>"+
        (protoName(bearb)?" – "+esc(protoName(bearb)):"")+". Ändern Sie, was falsch ist, und geben Sie unten den Grund an. "+
        "Die bisherige Fassung bleibt im Änderungsverlauf nachvollziehbar.</div></div>"+
      "</div></div>")
    : el('<div class="card"><div class="pad stack">'+
        '<div class="modus" role="group" aria-label="Art des Protokolls">'+
          '<button type="button" data-art="wartung" aria-pressed="'+(!stoer)+'">Wartung</button>'+
          '<button type="button" data-art="stoerung" aria-pressed="'+stoer+'">Störung</button></div>'+
        (stoer
          ? '<div><h2>Störungsprotokoll Klimaanlage</h2><div class="sub">Einsatz auf einen Lidl-Störungsauftrag. '+
            "Erscheint in der Anlagenhistorie, verschiebt aber keinen Wartungstermin.</div></div>"
          : '<div><h2>Wartungsprotokoll Klimaanlage</h2><div class="sub">Digitale Fassung des Einseiters. '+
            (s?"Vorbelegt für <strong>"+esc(stName(s))+"</strong>.":"Standort unten auswählen oder aus Liste bzw. Karte heraus öffnen.")+"</div></div>")+
        '<div class="rowflex"><button class="btn" type="button" id="p_gefuehrt">Schritt für Schritt ausfüllen</button>'+
          '<span class="muted" style="font-size:12.5px">ein Thema nach dem anderen – am Handy meist schneller</span></div>'+
      "</div></div>");
  var gefuehrt=head.querySelector("#p_gefuehrt");
  if(gefuehrt) gefuehrt.onclick=function(){ protokollAssistent(form, stoer); };
  head.querySelectorAll("[data-art]").forEach(function(b){
    b.onclick=function(){
      var ziel=b.getAttribute("data-art");
      if((ziel==="stoerung")===stoer) return;
      if(formDirty && !window.confirm("Das Formular enthält Eingaben. Wirklich wechseln? Die Eingaben gehen verloren.")) return;
      formDirty=false; S.protoArt=ziel; S.stoerungAus=null; render(); window.scrollTo({top:0});
    };
  });
  if(Store.modus==="supabase" && Store.sb && !bearb) f.appendChild(kontoKarte());
  f.appendChild(head);
  if(entwurfKasten) f.appendChild(entwurfKasten);
  var body=el('<div class="card"><div class="pad"></div></div>');
  body.querySelector(".pad").appendChild(form);
  f.appendChild(body);

  /* gespeicherte Protokolle: zentral abgelegte und die auf diesem Gerät */
  var alle=alleProtokolle();
  var teile=[];
  if(Store.modus==="claude"||Store.modus==="supabase") teile.push(protokolle.length+" in der gemeinsamen Ablage");
  if(lokaleProtokolle.length) teile.push(lokaleProtokolle.length+" auf diesem Gerät");
  var unterzeile = alle.length
    ? teile.join(" · ")+". Antippen öffnet das Protokoll – dort auch Drucken und PDF."
    : "Noch keine Protokolle erfasst.";
  /* Admins können gelöschte Protokolle einblenden, um sie wiederherzustellen */
  var anzGeloescht=alleProtokolle(true).length-alle.length;
  if(Admin.frei && S.zeigeGeloeschte) alle=alleProtokolle(true);
  var gesp=el('<div class="card"><div class="pad stack">'+
    "<div><h2>Gespeicherte Protokolle</h2>"+
    '<div class="sub">'+unterzeile+"</div></div>"+
    (Admin.frei && anzGeloescht ? '<div class="chips"><button class="chip" type="button" id="p_geloescht" aria-pressed="'+
      (!!S.zeigeGeloeschte)+'">gelöschte anzeigen ('+anzGeloescht+")</button></div>" : "")+
    '<div class="scrollx" id="plist"></div></div></div>');
  var chipG=gesp.querySelector("#p_geloescht");
  if(chipG) chipG.onclick=function(){ S.zeigeGeloeschte=!S.zeigeGeloeschte; render(); };
  var pl=gesp.querySelector("#plist");
  if(alle.length){
    var tbl=el('<table class="dt"><thead><tr><th>Datum</th><th>Standort</th><th>Techniker/in</th>'+
      "<th>Art</th><th>Mängel</th><th>Fotos</th><th>Ablage</th></tr></thead><tbody></tbody></table>");
    var tb=tbl.querySelector("tbody");
    alle.slice(0,60).forEach(function(x){
      var tr=el("<tr style='cursor:pointer"+(x.geloescht?";opacity:.55;text-decoration:line-through":"")+"'><td class='mono'>"+dfmt(x.datum)+"</td><td>"+esc(protoName(x)||"–")+
        "</td><td>"+esc(kanonName(x.nameTechniker||x.techniker)||"–")+"</td><td>"+
        (istStoerung(x)?'<span class="tag st">Störung</span>':esc(x.wartungsart||"–"))+
        "</td><td class='mono'>"+((x.maengel||[]).length||"0")+"</td>"+
        "<td class='mono'>"+((x.fotos||[]).length||"0")+"</td>"+
        "<td>"+(x._quelle==="geraet"?'<span class="tag">Gerät</span>':'<span class="tag f30">gemeinsam</span>')+"</td></tr>");
      tr.onclick=function(){
        var ziel=gesp.querySelector("#pdetail");
        ziel.innerHTML=""; ziel.appendChild(protokollDetail(x));
        ziel.scrollIntoView({behavior:"smooth",block:"start"});
      };
      tb.appendChild(tr);
    });
    pl.appendChild(tbl);
    gesp.querySelector(".stack").appendChild(el('<div id="pdetail"></div>'));
    if(S.letztesProtokoll){
      var neu=alle.filter(function(x){ return x._id===S.letztesProtokoll; })[0];
      S.letztesProtokoll=null;
      if(neu){
        var ziel=gesp.querySelector("#pdetail");
        ziel.appendChild(protokollDetail(neu));
        setTimeout(function(){ ziel.scrollIntoView({behavior:"smooth",block:"start"}); },60);
      }
    }
  } else {
    pl.appendChild(el('<div class="muted" style="font-size:13px">Noch keine Protokolle erfasst.</div>'));
  }
  f.appendChild(gesp);
  return f;
}

/* ---------- Protokoll als Blatt: Drucken oder als PDF sichern ---------- */
function kreuz(an){ return an ? "&#9746;" : "&#9744;"; }

/* Das Blatt – dieselbe Darstellung für Drucken und für das PDF-Archiv */
function blattInhalt(p){
  var gew=function(liste,wert){ return (liste||[]).indexOf(wert)>=0; };
  var zeile=function(k,v){ return "<tr><td class='k'>"+k+"</td><td>"+(v?esc(v):"&nbsp;")+"</td></tr>"; };

  var anlagenHtml=(p.anlagen&&p.anlagen.length?p.anlagen:[{}]).map(function(a,i){
    /* neue Erfassung: je Anlage aus dem Anlagenstamm, mit Kältekreis, Rückkühler, Regelung */
    if(a.positionId){
      var z=function(k,v){ return v?zeile(k,v):""; };
      var jn=function(w){ return w==="ja"?"ja":w==="nein"?"nein":""; };

        "<tr><th colspan='2'>"+esc(a.name||("Anlage "+(i+1)))+(a.neu?" (vor Ort neu erfasst)":"")+"</th></tr>"+
        /* Jede planmäßige Wartung ist zugleich die Überprüfung der Betriebs-
           sicherheit, die § 22 Abs. 1 KAV mindestens jährlich verlangt */
        (zaehltAlsWartung(p) ? z("Gewartet als",a.termin?a.termin+" nach § 22 KAV":"") : istStoerung(p) ? z("Gewartet als",a.termin) : "")+
        z("Bauart",a.bauart)+
        z("Kältekreisläufe / Prüfbuch",[a.kreislaeufe?a.kreislaeufe+" Kältekreis"+(+a.kreislaeufe===1?"":"e"):"",
          a.pruefbuch?"Prüfbuch: "+jn(a.pruefbuch):"", a.ortPruefbuch?"liegt "+a.ortPruefbuch:""].filter(Boolean).join(" · "))+
        z("Kältemittel / Füllmenge",[a.kaeltemittelArt, leerWert(a.kaeltemittelKg)?"":String(a.kaeltemittelKg).replace(".",",")+" kg"].filter(Boolean).join(" · "))+
        (istWassergekuehlt(a)?z("Rückkühler / Pumpenstation von UKT",[a.rkUkt?"Rückkühler: "+jn(a.rkUkt):"", a.pumpeUkt?"Pumpen: "+jn(a.pumpeUkt):""].filter(Boolean).join(" · ")):"")+
        z("Regelung", a.regelung===OHNE_REGELUNG ? "keine eigene Regelung" : [a.regelung,
          a.regelungFirma?"betreut von "+(a.regelungFirma==="UKT"?"UKT":(a.regelungFirmaName||"anderer Firma")):"",
          a.fernzugriff?"Fernzugriff: "+jn(a.fernzugriff):""].filter(Boolean).join(" · "))+
        z("Hersteller / Modell",[a.hersteller,a.modell].filter(Boolean).join(" / "))+
        z("Seriennummer",a.seriennummer)+
        z("Inbetriebnahme",a.inbetriebnahme?dfmt(a.inbetriebnahme):"")+
        /* Angaben aus dem Prüfbuch, soweit bekannt */
        z("Kältemittel / Umwelt",[gwpVon(a)?"GWP "+String(gwpVon(a)).replace(".",","):"", co2Tonnen(a)?String(co2Tonnen(a)).replace(".",",")+" t CO₂-Äquivalent":"",
          a.hermetisch?"hermetisch dicht: "+jn(a.hermetisch):"", a.dichtheitMonate?"Dichtheitskontrolle "+(a.dichtheitMonate==="nz"?"nicht zutreffend":"alle "+a.dichtheitMonate+" Monate"):"",
          a.leckageerkennung?"Leckage-Erkennung: "+jn(a.leckageerkennung):""].filter(Boolean).join(" · "))+
        z("Druck / Einstufung",[leerWert(a.psBar)?"":"PS "+String(a.psBar).replace(".",",")+" bar", leerWert(a.psv)?"":"PS·V "+String(a.psv).replace(".",",")+" bar·l",
          a.fluidgruppe?"Fluidgruppe "+a.fluidgruppe:"", a.gefahr?(a.gefahr==="HP"?"hohes":"niederes")+" Gefahrenpotential":""].filter(Boolean).join(" · "))+
      "</table>";
    }
    return "<table style='margin-bottom:8px'>"+
      "<tr><th colspan='2'>Anlage "+(i+1)+"</th></tr>"+
      "<tr><td class='k'>Anlagentyp</td><td>"+ANLAGENTYPEN.map(function(t){
        return kreuz(gew(a.typ,t))+" "+esc(t); }).join(" &nbsp; ")+"</td></tr>"+
      "<tr><td class='k'>Regelung</td><td>"+REGELUNGEN.map(function(t){
        return kreuz(gew(a.regelung,t))+" "+esc(t); }).join(" &nbsp; ")+
        " &nbsp; Fernzugriff: "+kreuz(a.fernzugriff)+" ja "+kreuz(a.fernzugriff===false)+" nein</td></tr>"+
      zeile("Hersteller / Modell",[a.hersteller,a.modell].filter(Boolean).join(" / "))+

      zeile("Standort Außengerät",a.standortAussen)+

  var maengelHtml=(p.maengel&&p.maengel.length)
    ? "<table><tr><th>Mangel / Feststellung</th><th style='width:14%'>Priorität</th><th>Empfohlene Maßnahme / Frist</th></tr>"+
      p.maengel.map(function(m){ return "<tr><td>"+esc(m.text)+"</td><td>"+esc(m.prio||"")+"</td><td>"+esc(m.massnahme||"")+"</td></tr>"; }).join("")+

  var stoerAuftragHtml = !st ? "" :
    "<h2>Störungsmeldung Lidl</h2><table>"+

      zeile("Auftragsdatum / Ausführen bis",[so.auftragsdatum?dfmt(so.auftragsdatum):"", so.ausfuehrenBis?"bis "+dfmt(so.ausfuehrenBis):""].filter(Boolean).join(" · "))+
      zeile("Kostenstelle",so.kostenstelle)+
      zeile("Problemtyp",so.problemtyp)+

    "</table>";
  var stoerBehebungHtml = !st ? "" :
    "<h2>Störungsbehebung</h2><table>"+
      zeile("Arbeitszeit vor Ort",[so.ankunft,so.ende].filter(Boolean).join(" – ")+(so.ankunft||so.ende?" Uhr":""))+
      absatz("Fehlerbild vor Ort",so.fehlerbild)+
      absatz("Ursache",so.ursache)+
      absatz("Durchgeführte Maßnahmen",so.massnahmen)+
      (so.kmArt||so.kmNach||so.kmEnt ? zeile("Kältemittel",[so.kmArt, so.kmNach?"nachgefüllt "+so.kmNach+" kg":"", so.kmEnt?"zurückgewonnen "+so.kmEnt+" kg":""].filter(Boolean).join(" · ")) : "")+
    "</table>"+
    ((so.material&&so.material.length)
      ? "<table style='margin-top:8px'><tr><th>Material / Ersatzteil</th><th style='width:20%'>Menge</th></tr>"+
        so.material.map(function(m){ return "<tr><td>"+esc(m.text)+"</td><td>"+esc(m.menge||"")+"</td></tr>"; }).join("")+"</table>"
      : "<div style='margin-top:6px'>Kein Material verbaut.</div>")+
    "<table style='margin-top:8px'><tr><td class='k'>Folgeauftrag / Angebot erforderlich</td><td>"+
      kreuz(so.folgeauftrag)+" ja &nbsp; "+kreuz(!so.folgeauftrag)+" nein"+(so.folgeText?" – "+esc(so.folgeText):"")+"</td></tr></table>";

  return (
      '<div class="kopf">'+
        '<div class="firma"><img src="logo.png" alt="Kammerlander Umwelt- und Klimatechnik GmbH"></div>'+
        '<div class="kontakt">Speckbacherstraße 92, A-6380 St. Johann in Tirol<br>'+
          "Telefon 05352 / 61207-0 · office@ukt.at · www.ukt.at</div>"+
      "</div>"+
      "<h1>"+(st?"STÖRUNGSPROTOKOLL":"WARTUNGSPROTOKOLL")+"</h1><div style='color:#444'>Lidl Markt / Lager"+
        (!zaehltAlsWartung(p)?"":" · Wartung und Überprüfung der Betriebssicherheit nach § 22 Kälteanlagenverordnung (KAV)")+"</div>"+

      /* Einsatz und Wartungsunternehmen nebeneinander – spart eine halbe Seite */
      '<div class="zwei"><div>'+
      "<h2>Einsatz</h2><table>"+
        zeile(st?"Datum des Einsatzes":"Datum der Wartung",dfmt(p.datum)+(p.uhrzeit?", "+p.uhrzeit+" Uhr":""))+
        /* Bestellnummer gibt es im Formular nicht mehr – ältere Protokolle zeigen sie weiter */
        (p.bestellnummer?zeile("Bestellnummer",p.bestellnummer):"")+
        /* bei der Störung steht sie unter „Störungsmeldung Lidl“ */
        (st?"":zeile("Lidl-Auftragsnummer / Position",p.auftragsnummer))+
        (rapportVon(p)?zeile("Rapportbericht Lidl",rapportZeile(rapportVon(p))):"")+
        zeile("FM-Region",p.region)+
        zeile("Standort / Filiale / Lager",protoName(p)+(p.filiale&&protoName(p).indexOf(p.filiale)<0?" · Filiale "+p.filiale:""))+
        zeile("Adresse",p.adresse)+
        (st?"":zeile("Wartungsart",p.wartungsart))+
      "</table></div><div>"+

      "<h2>Wartungsunternehmen</h2><table>"+
        zeile("Firma / Vertragspartner",p.firma)+

      (st ? stoerBehebungHtml :
      "<h2>Durchgeführte Wartungsarbeiten</h2>"+
      '<div class="kaestchen">'+ARBEITEN.map(function(a){ return "<div>"+kreuz(gew(p.arbeiten,a))+" "+esc(a)+"</div>"; }).join("")+"</div>"+
      (p.arbeitenSonstiges?"<div style='margin-top:4px'>&#9746; Sonstiges: "+esc(p.arbeitenSonstiges)+"</div>":""))+

        zeile("Sofortmaßnahme",p.sofortmassnahme||"nein")+

      "<h2>Ergebnis und Bemerkungen</h2>"+
      '<div class="kaestchen" style="grid-template-columns:1fr">'+ERGEBNISSE.map(function(a){ return "<div>"+kreuz(gew(p.ergebnis,a))+" "+esc(a)+"</div>"; }).join("")+"</div>")+

          (p.unterschrift?'<img alt="Unterschrift" src="'+bildUrl(p.unterschrift)+'">':"&nbsp;")+"</td></tr>"+
        (p.auftraggebervertreter?zeile("Auftraggebervertreter",p.auftraggebervertreter):"")+
      "</table>"+"</div>"+

      '<div class="fuss">Rechnung an den Vertragspartner in der Bestellanschrift. Bestellnummer im Rechnungskopf angeben. '+
        "Grundsätzlich eine separate Rechnung je Bestellung; bei Sammelbestellungen Lidl-Auftragsnummern exakt je Position ausweisen. "+
        "Kältemittelarbeiten und Dichtheitsprüfungen nur durch befugte bzw. zertifizierte Personen und Unternehmen."+
        /* für das Archiv: welches Protokoll, welche Fassung */
        "<br>Protokoll "+esc(p._id||"")+" · Fassung "+(p.version||1)+
        (p.erstellt?" · erstellt "+tagFmt(p.erstellt):"")+
        ((p.version||1)>1&&p.geaendert?" · zuletzt korrigiert "+tagFmt(p.geaendert)+
          (p.korrekturGrund?" („"+esc(p.korrekturGrund)+"“)":""):"")+"</div>"
  );
}

/* Fotos ins Blatt setzen. Für das PDF als eingebettete Daten, sonst würde
   das Zeichnen an fremden Bildadressen scheitern. */
function fotosEinsetzen(host, p, eingebettet){
  if(!p.fotos || !p.fotos.length){ host.innerHTML=""; return Promise.resolve(); }
  host.innerHTML="<h2>Fotos</h2><div>werden geladen …</div>";
  return ladeFotos(p).then(function(bilder){
    var alsDaten=function(url){
      if(!eingebettet || !url || url.indexOf("data:")===0) return Promise.resolve(url);
      return fetch(url).then(function(r){ return r.blob(); }).then(function(b){
        return new Promise(function(ok){ var fr=new FileReader(); fr.onload=function(){ ok(fr.result); }; fr.onerror=function(){ ok(null); }; fr.readAsDataURL(b); });
      }).catch(function(){ return null; });
    };
    return Promise.all(bilder.map(function(b){ return alsDaten(b.url).then(function(u){ return Object.assign({},b,{url:u}); }); }))
      .then(function(fertig){
        /* fürs PDF (Archiv, Speichern, Drucken): fehlt ein Foto, lieber später
           nochmals als ein unvollständiges PDF, das als aktuell gilt */
        if(eingebettet && (fertig.length<p.fotos.length || fertig.some(function(b){ return !b.url; })))
          throw new Error("Foto(s) gerade nicht abrufbar – das PDF wird später erzeugt. Bitte bei Verbindung nochmals versuchen.");
        host.innerHTML="<h2>Fotos</h2><div class='fotos'>"+fertig.map(function(b){
          return "<figure>"+(b.url?'<img alt="" src="'+bildUrl(b.url)+'">':"<div>Bild nicht abrufbar</div>")+
            "<figcaption>"+esc(b.hinweis||b.name||"")+"</figcaption></figure>";
        }).join("")+"</div>";
      });
  });
}

function druckansichtZeigen(p){
  var alt=document.getElementById("druckansicht"); if(alt) alt.remove();
  var ov=document.createElement("div");
  ov.id="druckansicht";
  ov.innerHTML=
    '<div class="druckleiste">'+
      '<button class="btn" type="button" id="d_pdf">Als PDF speichern</button>'+
      '<button class="btn ghost" type="button" id="d_druck" style="background:#fff">Drucken</button>'+
      '<button class="btn ghost" type="button" id="d_zu" style="background:#fff">Schließen</button>'+
    "</div>"+
    '<div class="blatt">'+blattInhalt(p)+"</div>";
  document.body.appendChild(ov);
  document.body.classList.add("druckmodus");
  var zu=function(){ ov.remove(); document.body.classList.remove("druckmodus"); };
  ov.querySelector("#d_zu").onclick=zu;
  /* Drucken druckt dasselbe PDF, das auch gespeichert und archiviert wird –
     eine Darstellung statt zwei, ohne Kopf- und Fußzeile des Browsers und
     mit dem Rapportbericht dahinter. Nur wenn das PDF nicht entstehen kann
     (etwa ohne Verbindung beim ersten Mal), druckt der Browser das Blatt. */
  var druckKnopf=ov.querySelector("#d_druck");
  druckKnopf.onclick=function(){
    var fenster=window.open("", "_blank");   /* gleich öffnen, sonst blockiert der Browser es */
    druckKnopf.disabled=true; druckKnopf.textContent="PDF wird erstellt …";
    pdfErzeugen(p).then(function(blob){
      druckKnopf.disabled=false; druckKnopf.textContent="Drucken";
      var url=URL.createObjectURL(blob);
      if(fenster && !fenster.closed){ fenster.location.href=url; }
      else pdfAnsicht(url, "Protokoll zum Drucken");
      setTimeout(function(){ URL.revokeObjectURL(url); }, 120000);
    }, function(e){
      druckKnopf.disabled=false; druckKnopf.textContent="Drucken";
      if(fenster && !fenster.closed) fenster.close();
      toast("PDF ließ sich nicht erstellen ("+(e&&e.message||e)+") – es wird das Blatt gedruckt.");
      window.print();
    });
  };
  /* Eigenes PDF statt Druckdialog: ohne Kopf- und Fußzeile des Browsers
     (Adresse der Seite, Datum, Seitenzahlen) und ohne leere Seiten. */
  var pdfKnopf=ov.querySelector("#d_pdf");
  pdfKnopf.onclick=function(){
    pdfKnopf.disabled=true; pdfKnopf.textContent="PDF wird erstellt …";
    pdfErzeugen(p).then(function(blob){
      var name=(istStoerung(p)?"Stoerungsprotokoll_":"Wartungsprotokoll_")+
        String(protoName(p)||"").replace(/[\\/:*?"<>|]/g,"").replace(/\s+/g,"-")+"_"+(p.datum||"")+".pdf";
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download=name; a.rel="noopener";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },4000);
      pdfKnopf.disabled=false; pdfKnopf.textContent="Als PDF speichern";
      toast("PDF erstellt.");
    }, function(e){
      pdfKnopf.disabled=false; pdfKnopf.textContent="Als PDF speichern";
      toast("PDF ließ sich nicht erstellen: "+(e&&e.message||e));
    });
  };
  fotosEinsetzen(ov.querySelector('[data-rolle="fotos"]'), p, false);
  /* Beim Drucken hängt der Rapportbericht hinten dran, jede Seite auf einem
     eigenen Blatt. Er ist die Grundlage der Rechnung. */
  if(rapportVon(p)){
    var rhost=document.createElement("div");
    rhost.innerHTML='<div class="muted rapport-lade" style="font-size:12px;margin-top:10px">Rapportbericht wird geladen …</div>';
    ov.querySelector(".blatt").appendChild(rhost);
    ladeRapportPdf(p).then(function(r){
      if(!r || !r.url) throw new Error("nicht abrufbar");
      return Promise.all([ladePdfJs(), fetch(r.url).then(function(x){ return x.arrayBuffer(); })]);
    }).then(function(x){
      return window.pdfjsLib.getDocument({data:new Uint8Array(x[1])}).promise;
    }).then(function(pdf){ return pdfSeitenAlsBild(pdf, pdf.numPages); })
      .then(function(bilder){
        rhost.innerHTML=bilder.map(function(b,i){
          return '<div class="rapportseite"><img alt="Rapportbericht Seite '+(i+1)+'" src="'+bildUrl(b)+'"></div>'; }).join("");
      }, function(){
        rhost.innerHTML='<div class="note warnbox rapportseite-fehlt">Der Rapportbericht ließ sich gerade nicht laden – '+
          "bitte mit Verbindung erneut öffnen, bevor gedruckt wird.</div>";
      });
  }
}

/* ---------------- PDF für das Archiv ----------------
   Das Blatt wird unsichtbar aufgebaut, als Bild gezeichnet und auf
   A4-Seiten verteilt – Seitenumbrüche nur zwischen Zeilen und Abschnitten. */
var PDF_BIBLIOTHEKEN=[
  "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
];
var pdfBereit=null, pdfInArbeit={};
function ladePdfBibliotheken(){
  if(pdfBereit) return pdfBereit;
  pdfBereit=PDF_BIBLIOTHEKEN.reduce(function(kette,src){
    return kette.then(function(){ return new Promise(function(ok,nok){
      var s=document.createElement("script"); s.src=src; s.onload=ok;
      s.onerror=function(){ pdfBereit=null; nok(new Error("PDF-Werkzeug nicht ladbar")); };
      document.head.appendChild(s);
    }); });
  }, Promise.resolve());
  return pdfBereit;
}
function bilderGeladen(host){
  var imgs=Array.prototype.slice.call(host.querySelectorAll("img"));
  return Promise.all(imgs.map(function(i){
    if(i.complete && i.naturalWidth) return Promise.resolve();
    return new Promise(function(ok){ i.onload=ok; i.onerror=ok; setTimeout(ok,8000); });
  }));
}
/* Das fertige Protokoll-PDF, mit dem Rapportbericht von Lidl dahinter.
   Der Rapport wird dafür nicht abgezeichnet, sondern mit seinen Original-
   seiten angehängt: er ist die Grundlage der Rechnung und bleibt so
   gestochen scharf und durchsuchbar. Fehlt er, obwohl er dazugehört, ist
   das ein Fehler – ein Archiv-PDF ohne Rapport wäre unvollständig. */
function pdfErzeugen(p){
  return protokollPdfErzeugen(p).then(function(blob){ return rapportAnhaengen(p, blob); });
}
var PDF_LIB="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
function rapportAnhaengen(p, blob){
  if(!rapportVon(p)) return Promise.resolve(blob);
  return Promise.all([window.PDFLib ? null : ladeSkript(PDF_LIB), ladeRapportPdf(p)]).then(function(x){
    var r=x[1];
    if(!r || !r.url) throw new Error("Rapportbericht gerade nicht abrufbar");
    return Promise.all([blob.arrayBuffer(), fetch(r.url).then(function(res){
      if(!res.ok) throw new Error("Rapportbericht nicht ladbar (HTTP "+res.status+")");
      return res.arrayBuffer();
    })]);
  }).then(function(b){
    var L=window.PDFLib;
    return Promise.all([L.PDFDocument.load(b[0]), L.PDFDocument.load(b[1],{ignoreEncryption:true})]).then(function(d){
      return d[0].copyPages(d[1], d[1].getPageIndices()).then(function(seiten){
        seiten.forEach(function(s){ d[0].addPage(s); });
        return d[0].save();
      });
    });
  }).then(function(bytes){ return new Blob([bytes],{type:"application/pdf"}); });
}
/* Firmenlogo fürs Wasserzeichen – einmal geladen; fehlt es, gibt es eben keins */
var WASSERZEICHEN=null;
function ladeWasserzeichen(){
  if(WASSERZEICHEN) return Promise.resolve(WASSERZEICHEN);
  return new Promise(function(ok){
    var b=new Image();
    b.onload=function(){ WASSERZEICHEN=b; ok(b); };
    b.onerror=function(){ ok(null); };
    b.src="logo.png";
  });
}
function protokollPdfErzeugen(p){
  return ladeUnterschrift(p).then(ladePdfBibliotheken).then(ladeWasserzeichen).then(function(){
    var BREITE=794;                                  /* A4 bei 96 dpi */
    var huelle=document.createElement("div");
    huelle.style.cssText="position:fixed;left:-12000px;top:0;width:"+BREITE+"px;background:#fff;z-index:-1";
    huelle.innerHTML='<div class="blatt" style="background:#fff;color:#111;font:12.5px/1.45 \'IBM Plex Sans\',\'Segoe UI\',Arial,sans-serif;padding:4px 6px;box-sizing:border-box;width:'+BREITE+'px">'+
      blattInhalt(p)+"</div>";
    document.body.appendChild(huelle);
    var blatt=huelle.querySelector(".blatt");
    return fotosEinsetzen(blatt.querySelector('[data-rolle="fotos"]'), p, true)
      .then(function(){ return bilderGeladen(blatt); })
      .then(function(){
        /* mögliche Umbruchstellen: Unterkanten von Zeilen, Überschriften, Fotos */
        var oben=blatt.getBoundingClientRect().top, stellen=[];
        blatt.querySelectorAll("tr, h1, .kopf, .kaestchen > div, figure, .fuss, table, .zusammen").forEach(function(e){
          /* in einem Block, der beisammen bleiben soll, nur dessen Ende */
          var z=e.closest(".zusammen");
          if(z && z!==e) return;
          stellen.push(Math.round(e.getBoundingClientRect().bottom-oben));
        });
        /* vor einer Überschrift umbrechen, nie danach – sonst steht sie allein
           am Seitenende und ihr Abschnitt auf der nächsten Seite */
        blatt.querySelectorAll("h2").forEach(function(e){
          var z=e.closest(".zusammen");
          if(z && z.firstElementChild!==e) return;
          stellen.push(Math.round((z||e).getBoundingClientRect().top-oben)-2);
        });
        stellen.sort(function(a,b){ return a-b; });
        var hoehe=blatt.scrollHeight;
        /* Obergrenze für die Zeichenfläche – Safari am iPhone verweigert mehr als ~16 Mio. Pixel */
        var skala=Math.min(2, Math.sqrt(14e6/(BREITE*hoehe)));
        return window.html2canvas(blatt,{scale:skala, backgroundColor:"#ffffff", useCORS:true, logging:false})
          .then(function(bild){ return {bild:bild, stellen:stellen, hoehe:hoehe, skala:skala}; });
      })
      .then(function(r){
        document.body.removeChild(huelle);
        var jsPDF=window.jspdf.jsPDF;
        var doc=new jsPDF({unit:"mm", format:"a4", compress:true});
        var RAND=10, nutzB=210-2*RAND, nutzH=297-2*RAND-6;          /* 6 mm für die Seitenzahl */
        var pxProMm=BREITE/nutzB, seitePx=Math.floor(nutzH*pxProMm);
        var seiten=[], start=0;
        while(start < r.hoehe-2){
          var grenze=start+seitePx, ende=grenze;
          if(grenze < r.hoehe){
            var passend=r.stellen.filter(function(y){ return y>start+seitePx*0.5 && y<=grenze; });
            if(passend.length) ende=passend[passend.length-1];
          } else ende=r.hoehe;
          seiten.push([start,ende]); start=ende;
        }
        seiten.forEach(function(s,i){
          if(i) doc.addPage();
          var hPx=s[1]-s[0];
          var teil=document.createElement("canvas");
          teil.width=r.bild.width; teil.height=Math.max(1,Math.round(hPx*r.skala));
          var g=teil.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,teil.width,teil.height);
          g.drawImage(r.bild, 0, Math.round(s[0]*r.skala), r.bild.width, teil.height, 0, 0, teil.width, teil.height);
          /* Wasserzeichen: Firmenlogo blass und schräg in der Seitenmitte.
             „multiply“ legt es wie Farbe aufs Papier – Schrift bleibt schwarz
             und lesbar, nur das Weiß bekommt den Hauch Logo. */
          if(WASSERZEICHEN){
            var wb=teil.width*0.62, wh=wb*WASSERZEICHEN.naturalHeight/WASSERZEICHEN.naturalWidth;
            var mitteY=Math.min(teil.height, Math.round(nutzH*pxProMm*r.skala))/2;
            g.save(); g.globalAlpha=0.07; g.globalCompositeOperation="multiply";
            g.translate(teil.width/2, mitteY); g.rotate(-Math.PI/9);
            g.drawImage(WASSERZEICHEN, -wb/2, -wh/2, wb, wh);
            g.restore();
          }
          doc.addImage(teil.toDataURL("image/jpeg",0.86),"JPEG",RAND,RAND,nutzB,hPx/pxProMm);
          doc.setFontSize(8); doc.setTextColor(120);
          doc.text((istStoerung(p)?"Störungsprotokoll ":"Wartungsprotokoll ")+protoName(p)+" vom "+dfmt(p.datum)+"  -  Seite "+(i+1)+" von "+seiten.length,
                   105, 297-RAND+1, {align:"center"});
        });
        doc.setProperties({title:(istStoerung(p)?"Störungsprotokoll ":"Wartungsprotokoll ")+protoName(p)+" "+dfmt(p.datum),
          subject:"Lidl Klimaanlagen - Protokoll "+(p._id||""), author:"Kammerlander Umwelt- und Klimatechnik GmbH",
          creator:"Wartungsleitstand"});
        return doc.output("blob");
      }, function(e){ if(huelle.parentNode) document.body.removeChild(huelle); throw e; });
  });
}

/* PDF in Supabase ablegen, von dort holt es die Synology ab.
   Der Pfad hängt nur an der Kennung – den lesbaren Dateinamen vergibt die Synology. */
function berichtAblegen(p){
  if(demo()) return Promise.resolve(false);
  if(Store.modus!=="supabase" || !Store.sb || !p || !p._id) return Promise.resolve(false);
  /* läuft schon einer: bei derselben Fassung genügt der; ist inzwischen
     korrigiert worden, danach die neue Fassung ablegen – sonst bliebe im
     Archiv die alte */
  var laeuft=pdfInArbeit[p._id];
  if(laeuft) return laeuft.version===(p.version||1) ? laeuft : laeuft.then(function(){ return berichtAblegen(p); });
  /* Archiv noch nicht eingerichtet (SQL-Abschnitt fehlt): gar nicht erst ein PDF bauen */
  return archivEingerichtet().then(function(an){ return an ? berichtErzeugenUndAblegen(p) : false; });
}
var archivStatus=null;
function archivEingerichtet(){
  if(!archivStatus) archivStatus=Store.sb.from("berichte").select("client_id").limit(1)
    .then(function(r){ return !r.error; }, function(){ archivStatus=null; return false; });
  return archivStatus;
}
function berichtErzeugenUndAblegen(p){
  var jahr=String(p.datum||"").slice(0,4)||"ohne-datum", pfad=jahr+"/"+p._id+".pdf";
  var offen=lsGet("ukt_pdf_offen",[]);
  var merken=function(){ if(offen.indexOf(p._id)<0){ offen.push(p._id); lsSet("ukt_pdf_offen",offen); } return false; };
  var lauf=pdfErzeugen(p).then(function(blob){
    return Store.sb.storage.from("berichte").upload(pfad, blob, {contentType:"application/pdf", upsert:true})
      .then(function(r){
        if(r.error){ Store.fehler=r.error.message; return merken(); }
        return Store.sb.from("berichte").upsert({client_id:p._id, version:p.version||1, pfad:pfad,
          erstellt:new Date().toISOString()},{onConflict:"client_id"}).then(function(r2){
            if(r2.error){ Store.fehler=r2.error.message; return merken(); }
            lsSet("ukt_pdf_offen", lsGet("ukt_pdf_offen",[]).filter(function(x){ return x!==p._id; }));
            return true;
          });
      });
  }).catch(function(e){ Store.fehler=e&&e.message; return merken(); })
    .then(function(x){ if(pdfInArbeit[p._id]===lauf) delete pdfInArbeit[p._id]; return x; });
  lauf.version=p.version||1;
  pdfInArbeit[p._id]=lauf;
  return lauf;
}
/* was beim letzten Mal nicht klappte (Funkloch), erneut versuchen */
function offeneBerichteNachholen(){
  if(Store.modus!=="supabase") return;
  var offen=lsGet("ukt_pdf_offen",[]);
  if(!offen.length) return;
  var i=0;
  var weiter=function(){
    if(i>=offen.length) return;
    var id=offen[i++];
    var p=(protokolle||[]).filter(function(x){ return x._id===id && !x.geloescht; })[0];
    if(!p){ lsSet("ukt_pdf_offen", lsGet("ukt_pdf_offen",[]).filter(function(x){ return x!==id; })); return weiter(); }
    berichtAblegen(p).then(weiter);
  };
  weiter();
}

  /* Löschen und Wiederherstellen – nur Admins, immer mit Grund */

    panel.querySelector('[data-rolle="loeschtext"]').textContent = wiederher

             "</strong> gehört zu diesem Protokoll, ließ sich aber gerade nicht abrufen.</div>"));

  /* Rapportbericht von Lidl: öffnen, oder – solange keiner dabei ist –
     nachreichen. Nachreichen ist eine Korrektur mit vorbelegtem Grund, damit

    var rk=el('<button class="btn ghost sm" type="button">'+esc(rref.name||"rapport.pdf")+rkb+" öffnen</button>");

      if(pdfZuGross(datei)) return;
      dateiAlsDatenUrl(datei).then(function(u){

      }, function(e){ toast(e&&e.unlesbar ? e.message : "Die Datei ließ sich nicht lesen."); });

  var fh=d.querySelector("#pfotos");

/* ---------- Wartungshistorie einer Filiale ----------
   Führt die Einträge aus der Excel-Liste und die Protokolle der App
   zusammen: wer hat wann welche Anlage gewartet. */
function gleicherBesuch(a,b){
  if(!a || !b) return false;
  return Math.abs(new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))<=BESUCH_TAGE*86400000;
}
function historieEintraege(s){
  var zeilen=[];
  s.pos.forEach(function(p){
    (p.historie||[]).forEach(function(d){
      /* gibt es dazu ein Protokoll aus der App, steht nur das */
      var ausApp=alleProtokolle().some(function(pr){
        var ids=(pr.positionIds&&pr.positionIds.length)?pr.positionIds:(pr.positionId?[pr.positionId]:[]);
        return !istStoerung(pr) && ids.indexOf(p.id)>=0 && gleicherBesuch(pr.datum,d);
      });
      if(ausApp) return;
      zeilen.push({datum:d, anlage:anlagenName(p), art:p.intervall.art,
        techniker:kanonName((p.techniker&&p.techniker[d.slice(0,4)])||""), quelle:"Liste"});
    });
  });
  alleProtokolle().forEach(function(pr){
    if(pr.standortId!==s.id || !pr.datum) return;
    var ids=(pr.positionIds&&pr.positionIds.length)?pr.positionIds:(pr.positionId?[pr.positionId]:[]);
    var stoe=istStoerung(pr);
    zeilen.push({datum:pr.datum, anlage:ids.length?feldText("positionIds",ids):"(Markt allgemein)",
      art:stoe ? ("Störung"+(pr.stoerung&&pr.stoerung.problemtyp?": "+pr.stoerung.problemtyp:"")) : (pr.wartungsart||""),
      stoerung:stoe, techniker:kanonName(pr.nameTechniker||pr.techniker||""), quelle:"App", protokoll:pr});
  });
  return zeilen.sort(function(a,b){ return b.datum.localeCompare(a.datum); });
}
function historieAnsicht(s){
  var box=document.createElement("div");
  box.className="stack";
  var z=historieEintraege(s);
  if(!z.length){ box.appendChild(el('<div class="muted">Für diesen Standort ist keine Wartung erfasst.</div>')); return box; }
  var anzStoer=z.filter(function(e){ return e.stoerung; }).length, anzWart=z.length-anzStoer;

  /* wer war in den letzten Jahren hier – auf einen Blick */
  var wer={}; z.forEach(function(e){ if(e.techniker) wer[e.techniker]=(wer[e.techniker]||0)+1; });
  var namen=Object.keys(wer).sort(function(a,b){ return wer[b]-wer[a]; });
  var ohneName=z.filter(function(e){ return !e.techniker; }).length;
  box.appendChild(el('<dl class="dl">'+
    "<dt>Letzter Besuch</dt><dd class='mono'>"+(s.letzterBesuch?dfmt(s.letzterBesuch):"—")+"</dd>"+
    "<dt>Wartungen erfasst</dt><dd>"+anzWart+" seit "+z[z.length-1].datum.slice(0,4)+"</dd>"+
    (anzStoer?"<dt>Störungseinsätze</dt><dd>"+anzStoer+"</dd>":"")+
    "<dt>Techniker</dt><dd>"+(namen.length?namen.map(function(n){ return esc(n)+" ("+wer[n]+"×)"; }).join(", "):"in der Liste nicht eingetragen")+
      (ohneName&&namen.length?' <span class="muted">· '+ohneName+" ohne Namen</span>":"")+"</dd>"+
  "</dl>"));

  var jahre={}; z.forEach(function(e){ var j=e.datum.slice(0,4); (jahre[j]=jahre[j]||[]).push(e); });
  Object.keys(jahre).sort().reverse().forEach(function(j){
    var nS=jahre[j].filter(function(e){ return e.stoerung; }).length, nW=jahre[j].length-nS;
    var t=el('<div><div class="chart-t" style="margin-bottom:4px">'+j+' <span class="muted mono" style="font-size:12px;font-weight:400">· '+
      [nW?nW+" Wartung"+(nW===1?"":"en"):"", nS?nS+" Störung"+(nS===1?"":"en"):""].filter(Boolean).join(" · ")+'</span></div>'+
      '<div class="scrollx"><table class="dt"><thead><tr><th>Datum</th><th>Anlage</th><th>Art</th><th>Techniker/in</th><th>Quelle</th></tr></thead>'+
      "<tbody></tbody></table></div></div>");
    var tb=t.querySelector("tbody");
    jahre[j].forEach(function(e){
      var tr=el("<tr><td class='mono'>"+dfmt(e.datum)+"</td><td>"+esc(e.anlage)+"</td><td>"+
        (e.stoerung?'<span class="tag st">Störung</span> '+esc(e.art.replace(/^Störung:?\s*/,"")):esc(e.art))+
        "</td><td>"+(e.techniker?esc(e.techniker):'<span class="muted">–</span>')+"</td><td>"+
        (e.quelle==="App"?'<span class="tag f30">Protokoll</span>':'<span class="tag">Liste</span>')+"</td></tr>");
      if(e.protokoll){
        tr.style.cursor="pointer";
        tr.title="Protokoll öffnen";
        tr.onclick=function(){ S.letztesProtokoll=e.protokoll._id; S.view="protokoll"; render(); };
      }
      tb.appendChild(tr);
    });
    box.appendChild(t);
  });
  return box;
}

var ART_TEXT={angelegt:"Protokoll angelegt", korrigiert:"Protokoll korrigiert", geloescht:"Protokoll gelöscht",
              wiederhergestellt:"Protokoll wiederhergestellt", stammdaten:"Stammdaten geändert"};
var ART_KLASSE={angelegt:"p-erledigt", korrigiert:"p-faellig", geloescht:"p-ueberfaellig",
                wiederhergestellt:"p-erledigt", stammdaten:"p-geplant"};
function zeitFmt(iso){
  if(!iso) return "–";
  var d=new Date(iso);
  return dfmt(isoLokal(d))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

/* ---------- Übersicht zum Mitnehmen ----------
   Was zuletzt gemacht wurde und was als Nächstes ansteht – als CSV für
   Excel oder als Ausdruck bzw. PDF. */
function berichtDaten(tageZurueck, tageVoraus, region){
  var heute=isoLokal(new Date());
  var von=isoLokal(new Date(Date.now()-tageZurueck*86400000));
  var bis=isoLokal(new Date(Date.now()+tageVoraus*86400000));
  var passt=function(s){ return !region || s.region===region; };
  var rueck=[];
  alleProtokolle().forEach(function(p){
    if(!p.datum || p.datum<von || p.datum>heute) return;
    var s=byId[p.standortId];
    if(s && !passt(s)) return;
    if(!s && region) return;
    var ids=(p.positionIds&&p.positionIds.length)?p.positionIds:(p.positionId?[p.positionId]:[]);
    rueck.push({datum:p.datum, markt:protoName(p), filiale:s?s.filiale:p.filiale, region:p.region||(s?s.region:""),
      anlage:ids.length?feldText("positionIds",ids):"(Markt allgemein)",
      art:istStoerung(p)?("Störung"+(p.stoerung&&p.stoerung.problemtyp?": "+p.stoerung.problemtyp:"")):(p.wartungsart||"Wartung"),
      techniker:kanonName(p.nameTechniker||p.techniker||""), maengel:(p.maengel||[]).length, quelle:"Protokoll"});
  });
  /* Termine aus der Excel-Liste, zu denen es kein App-Protokoll gibt */
  POS.forEach(function(p){
    var s=byId[p.standortId]; if(!s || !passt(s)) return;
    (p.historie||[]).forEach(function(d){
      if(d<von || d>heute) return;
      if(rueck.some(function(r){ return r.datum===d && r.markt===stName(s); })) return;
      rueck.push({datum:d, markt:stName(s), filiale:s.filiale, region:s.region, anlage:anlagenName(p),
        art:p.intervall.art, techniker:kanonName((p.techniker&&p.techniker[d.slice(0,4)])||""), maengel:"", quelle:"Liste"});
    });
  });
  rueck.sort(function(a,b){ return b.datum.localeCompare(a.datum); });

  var vor=[];
  POS.forEach(function(p){
    var s=byId[p.standortId]; if(!s || !passt(s) || !p.naechste || p.naechste>bis) return;
    vor.push({datum:p.naechste, status:STATUS_LABEL[p.status]||"", markt:stName(s), filiale:s.filiale, region:s.region,
      anlage:anlagenName(p), termin:p.intervall.art, letzte:p.letzte?dfmt(p.letzte):"—", adresse:s.adresse});
  });
  vor.sort(function(a,b){ return a.datum.localeCompare(b.datum); });
  return {von:von, bis:bis, heute:heute, region:region, rueck:rueck, vor:vor};
}

        }

        render(); window.scrollTo({top:0});
      };
      /* Rückgängig: Stammdaten auf den Stand davor, eine Korrektur auf die
         Fassung davor. Nur für die Verwaltung, immer mit Grund, und selbst
         wieder ein Eintrag im Verlauf – der sich ebenso zurücknehmen lässt. */
      if(istInhaber()){
        var zurueck=null;
        if(e.art==="stammdaten" && e.rueck && Object.keys(e.rueck).length) zurueck=function(){ stammRueckgaengig(e); };

function stammRueckgaengig(e){
  var ids=Object.keys(e.rueck);
  /* wurde seither nochmals geändert, geht auch das verloren – sagen */
  /* seither geändert: am Datensatz ODER laut Verlauf (auch wenn er inzwischen
     gelöscht bzw. auf den Listenstand zurückgesetzt ist) */
  var spaeter=ids.filter(function(id){
    var j=stammStand[id];
    return (j && (j.geaendert||"")>(e.zeit||"")) ||
      aenderungen.some(function(x){ return x!==e && x.rueck && (id in x.rueck) && (x.zeit||"")>(e.zeit||""); });
  });
  /* Störungen: der Status (erledigt, gelöscht) gehört zu seiner eigenen
     Änderung. Nimmt man etwas anderes zurück, bleibt er, wie er jetzt ist –
     sonst ginge eine erledigte Störung wieder auf oder eine gelöschte käme zurück. */
  var statusAenderung=(e.felder||[]).some(function(x){ return x.feld==="stoerung" && /^(offen|erledigt|gelöscht)$/.test(String(x.neu)); });
  var weg=ids.filter(function(id){ var v=e.rueck[id]; return v && v.typ==="stoerung" && !stammStand[id] && !statusAenderung; });
  var frage="Diese Änderung vom "+zeitFmt(e.zeit)+" zurücknehmen?"+
    (spaeter.length?"\n\nAchtung: "+spaeter.length+" der betroffenen Einträge wurde seither nochmals geändert (oder schon zurückgenommen) – "+
      "auch das wird damit zurückgesetzt. Neuere Änderungen besser zuerst zurücknehmen.":"")+
    (weg.length?"\n\n"+weg.length+" betroffene Störung(en) wurde(n) inzwischen gelöscht und bleiben gelöscht.":"");
  if(!window.confirm(frage)) return;
  var grund=window.prompt("Warum wird die Änderung zurückgenommen?","");
  if(grund===null) return;
  if(!grund.trim()){ toast("Ohne Grund wird nichts zurückgenommen."); return; }
  var zeit=new Date().toISOString();
  Promise.all(ids.map(function(id){
    var vorher=e.rueck[id];
    if(weg.indexOf(id)>=0) return null;    /* inzwischen gelöschte Störung nicht still zurückholen */
    if(vorher){
      var rec=Object.assign({}, vorher, {geaendert:zeit, von:wer(), grund:"Rückgängig: "+grund.trim()});
      /* Zugangsdaten und eingebettete PDFs stehen nicht im Verlauf – die aktuellen bleiben */
      var jetztRec=stammStand[id];
      if(jetztRec && jetztRec.felder){ rec.felder=Object.assign({}, rec.felder);
        NICHT_IM_VERLAUF().forEach(function(k){ if(k in jetztRec.felder) rec.felder[k]=jetztRec.felder[k]; });
        if(rec.typ==="stoerung" && !statusAenderung){
          rec.felder.erledigt=jetztRec.felder.erledigt||null; rec.felder.protokollId=jetztRec.felder.protokollId||null;
        }
      } else if(rec.typ==="stoerung" && rec.felder && rec.felder.pdfName && !rec.felder.pdfDaten){
        /* zurückgeholte Störung: das Auftrags-PDF stand nicht im Verlauf */
        rec.felder=Object.assign({}, rec.felder); delete rec.felder.pdfName;
        rec.felder.notiz=((rec.felder.notiz||"")+" (Auftrags-PDF nach dem Zurückholen bitte neu anhängen)").trim();
      }
      stammUeber[id]=rec;
      return stammSpeichern(rec);
    }
    delete stammUeber[id];                 /* gab es vorher nicht */
    return stammLoeschen(id);
  })).then(function(){
    wendeStammdatenAn();
    protokolliere({art:"stammdaten", standortId:e.standortId, standortName:e.standortName,
      grund:"Rückgängig (Änderung vom "+zeitFmt(e.zeit)+"): "+grund.trim(),
      felder:(e.felder||[]).map(function(x){ return {feld:x.feld, name:x.name, alt:x.neu, neu:x.alt}; })});
    berechneFaelligkeiten(); render();
    toast("Änderung zurückgenommen.");
  });
}
/* Eine Korrektur zurücknehmen: die Datenbank hat vor jeder Korrektur die
   ganze Fassung gesichert (protokoll_fassungen). Die wird als neue Fassung
   wieder eingesetzt – nichts wird überschrieben oder gelöscht. */
function korrekturRueckgaengig(e, p){
  /* nur die jüngste Änderung dieses Protokolls – danach gelöscht, wiederhergestellt
     oder nochmals korrigiert, träfe es sonst die falsche Fassung */
  var juengste=aenderungen.filter(function(x){ return x.protokollId===e.protokollId; })
    .sort(function(a,b){ return String(b.zeit||"").localeCompare(String(a.zeit||"")); })[0];
  if(juengste && juengste!==e){ toast("Nach dieser Korrektur wurde das Protokoll nochmals geändert – bitte zuerst die neueste Änderung zurücknehmen."); return; }
  if(!window.confirm("Die Korrektur vom "+zeitFmt(e.zeit)+" zurücknehmen? Das Protokoll bekommt wieder den Stand davor, als neue Fassung.")) return;
  var grund=window.prompt("Warum wird die Korrektur zurückgenommen?","");
  if(grund===null) return;
  if(!grund.trim()){ toast("Ohne Grund wird nichts zurückgenommen."); return; }
  Store.sb.from("protokoll_fassungen").select("daten,version").eq("client_id",p._id).order("gesichert",{ascending:false}).limit(1)
    .then(function(r){
      var f=r.data && r.data[0];
      if(r.error || !f){ toast("Die vorherige Fassung ließ sich nicht laden"+(r.error?" ("+r.error.message+")":"")+"."); return; }
      return ladeUnterschrift(p).then(function(){
        var alt=ausZeile(f.daten);
        var doc=Object.assign({}, alt, {version:(p.version||1)+1, geaendert:new Date().toISOString(),
          korrekturGrund:"Rückgängig: "+grund.trim()});
        if(typeof doc.unterschrift!=="string") doc.unterschrift=p.unterschrift||"";
        var felder=vergleiche(p, doc);
        if(!felder.length){ toast("Die vorherige Fassung entspricht dem jetzigen Stand – nichts zurückgenommen."); return; }
        return aktualisiereProtokoll(p._id, doc, "zentral").then(function(ok){
          if(!ok){ toast("Zurücknehmen fehlgeschlagen"+(Store.fehler?" ("+Store.fehler+")":"")+"."); return; }
          protokolliere({art:"korrigiert", protokollId:p._id, standortId:doc.standortId, standortName:doc.standortName,
            grund:"Rückgängig (Korrektur vom "+zeitFmt(e.zeit)+"): "+grund.trim(), felder:felder});
          berechneFaelligkeiten(); render();
          toast("Korrektur zurückgenommen – "+felder.length+" Feld"+(felder.length===1?"":"er")+" wieder wie vorher.");
        });
      });
    });
}

function stammWert(feld, w){
  if(w===null||w===undefined||w==="") return "–";
  /* Der Änderungsverlauf hält fest, DASS jemand ein Passwort geändert hat –
     nicht, wie es lautet. Sonst stünde jedes alte Passwort dauerhaft lesbar
     in einer Liste, die sich absichtlich nicht mehr ändern lässt. */
  if(feld==="zugangPasswort" || istGeheim(feld)) return "••••••••";
  if(feld==="innengeraete") return innenText(w);
  if(feld==="nachweise") return Array.isArray(w)&&w.length ? w.map(function(n){ return dfmt(n.datum)+(n.techniker?" ("+n.techniker+")":""); }).join(", ") : "–";
  if(feld==="aktiv"||feld==="pausiert"||feld==="vorOrtNeu") return w?"ja":"nein";
  if(feld==="monat") return MONATE_L[+w]||"–";
  if(feld==="inbetriebnahme") return dfmt(w);
  return String(w);
}

/* Was an einem Markt nicht stimmt – getrennt nach Fehlern und fehlenden Angaben */
function auffaelligkeiten(s){
  var f=[], l=[];
  if(!s.lat) f.push("keine Kartenposition");
  if(!s.region) f.push("keine FM-Region");
  if(s.filiale){
    var doppelt=ALLE_ST.filter(function(o){ return o!==s && o.aktiv && String(o.filiale)===String(s.filiale); });
    if(doppelt.length) f.push("Filialnummer "+s.filiale+" ist mehrfach vergeben");
  }
  if(!s.pos.length) f.push("keine Anlage in Betrieb");
  /* zwei Zeilen mit demselben Termin: in der alten Liste meist die Halbjahreswartung mit falschem Kürzel */
  s.pos.forEach(function(p,i){
    s.pos.slice(i+1).forEach(function(q){
      if(anlageLeader(p)!==p || anlageLeader(q)!==q) return;
      /* ausdrücklich als eigene Anlage geführt: dann sind es wirklich zwei
         Anlagen, die im selben Monat drankommen – kein vergessenes Paar */
      if(p.anlageZu===p.id || q.anlageZu===q.id) return;
      /* verschieden benannt = zwei Anlagen, die im selben Monat drankommen – normal */
      var nameN=function(x){ return String(anlagenName(x)||"").toLowerCase().replace(/[^a-z0-9äöüß]/g,""); };
      if(nameN(p) && nameN(q) && nameN(p)!==nameN(q)) return;
      if(slotMonat(p) && slotMonat(p)===slotMonat(q) && intervallArt(p.intervallCode).kurz===intervallArt(q.intervallCode).kurz)
        f.push(anlagenName(p)+": zweimal "+intervallArt(p.intervallCode).kurz+" im "+MONATE_L[slotMonat(p)]+
          " – ist eine Zeile eigentlich die Halbjahreswartung? Dann dort Kürzel HJW/HJI setzen, sonst über „Gehört zu Anlage“ zusammenführen.");
    });
  });
  /* innerhalb EINER Anlage zwei Termine mit demselben Kürzel (zweimal JW) */
  anlagenDesMarkts(s,false).forEach(function(a){
    var k={};
    a.termine.forEach(function(t){ var ia=intervallArt(t.intervallCode), kz=ia.kurz; if(!kz || ia.unklar || kz==="?") return; k[kz]=(k[kz]||0)+1; });
    Object.keys(k).forEach(function(kz){ if(k[kz]>1)
      f.push(anlagenName(a.leader)+": "+k[kz]+" Termine mit demselben Kürzel "+kz+" – einer davon doppelt oder mit falschem Kürzel?"); });
  });
  if(s.pos.some(function(p){ return p.ueber30kg; }) && !s.pos.some(function(p){ return p.intervall&&p.intervall.kurz==="HJW"; }))
    f.push("über 30 kg Kältemittel, aber keine Halbjahreswartung (HJW)");
  /* Zwei Termine auf demselben Tag: dann streiten sie sich um dieselben
     Wartungen, und einer steht am Ende zu Unrecht als überfällig da. */
  var gesehen={};
  s.pos.forEach(function(p){
    if(!p.anker) return;
    var k=p.anker.monat+"-"+p.anker.tag, vor=gesehen[k];
    if(vor){
      var wo="Zwei Termine am selben Tag ("+String(p.anker.tag).padStart(2,"0")+"."+
        String(p.anker.monat).padStart(2,"0")+".): "+anlagenName(vor)+" "+(vor.intervall?vor.intervall.kurz:"")+
        " und "+anlagenName(p)+" "+(p.intervall?p.intervall.kurz:"");
      if(vor.anlageId===p.anlageId)
        f.push(wo+" – beide gehören zur selben Anlage. Ein Termin ist zu viel oder hat das falsche Kürzel.");
      else
        l.push(wo+" – zwei Anlagen, die am selben Tag drankommen. Beim Protokoll darauf achten, für welche es zählt.");
    }
    else gesehen[k]=p;
  });
  /* Eine Anlage, ein Inbetriebnahmedatum. Gehen die Zeilen auseinander,
     stammt das meist aus der Excel-Liste. */
  anlagenDesMarkts(s,true).forEach(function(a){
    var w={};
    a.termine.forEach(function(p){ if(p.inbetriebnahme) w[p.inbetriebnahme]=1; });
    var k=Object.keys(w);
    if(k.length>1) f.push(anlagenName(a.leader)+": die Termine haben verschiedene Inbetriebnahmedaten ("+
      k.map(function(x){ return dfmt(x); }).join(", ")+") – es gilt "+dfmt(inbetriebnahmeVon(a.leader))+
      ". In der Verwaltung einmal richtigstellen.");
  });
  s.pos.forEach(function(p){
    var n=anlagenName(p);
    if(p.intervall && p.intervall.unklar) f.push(n+": Kürzel „"+(p.intervallCode||"leer")+"“ unklar");
    /* Der eingetragene Soll-Monat gilt, auch wenn er von der Regel abweicht.
       Ohne Begründung bleibt aber offen, ob das Absicht war. */
    if(p.anker && p.anker.regel && p.monat && +p.monat!==p.anker.regel){
      if(String(p.monatGrund||"").trim())
        l.push(n+": Soll-Monat "+MONATE_L[p.monat]+" statt "+MONATE_L[p.anker.regel]+
               " – bewusst so: "+String(p.monatGrund).trim());
      else
        f.push(n+": Soll-Monat "+MONATE_L[p.monat]+" weicht von der Regel ab (aus der Inbetriebnahme käme "+
               MONATE_L[p.anker.regel]+"). Gilt trotzdem – bitte in der Verwaltung begründen oder angleichen.");
    }
    if(p.inbetriebnahme && p.inbetriebnahme>isoLokal(new Date()))
      f.push(n+": Inbetriebnahme "+dfmt(p.inbetriebnahme)+" liegt in der Zukunft – die Anlage fällt so aus der Planung");
    if(p.vorOrtNeu) f.push(n+": vor Ort neu erfasst – Kürzel und Termin festlegen");
    if(!inbetriebnahmeVon(p)) l.push(n+": Inbetriebnahme fehlt");
    if(!p.kaeltemittelText) l.push(n+": Kältemittelmenge fehlt");
    var al=anlageLeader(p)===p ? anlageLuecken(anlageDaten(p)).filter(function(f2){ return f2.k!=="kaeltemittelKg"; }) : [];
    if(al.length) l.push(n+": "+al.length+" Anlagendaten offen ("+al.map(function(f2){ return f2.l; }).join(", ")+")");
  });
  s.pausiertePos.forEach(function(p){ if(anlageLeader(p)===p) l.push(anlagenName(p)+": zur Zeit nicht gewartet"+(p.pausiertGrund?" – "+p.pausiertGrund:"")); });
  if(!s.filiale) l.push("keine Filialnummer");
  if(!s.plz) l.push("keine PLZ in der Adresse");
  if(s.pos.length===1) l.push("nur ein Termin im Jahr eingetragen – fehlt der zweite Termin in der Liste?");
  /* Bei mehreren gleichartigen Anlagen entsteht derselbe Hinweis mehrfach –
     einmal genügt. */
  var einmal=function(liste){ return liste.filter(function(x,i){ return liste.indexOf(x)===i; }); };
  return {fehler:einmal(f), luecken:einmal(l)};
}
function naechsterTerminMarkt(s){
  var t=s.pos.map(function(p){ return p.naechste; }).filter(Boolean);
  t.sort(); return t[0]||null;
}

/* Archiv auf der Synology: zeigt, welche Protokolle noch kein aktuelles PDF
   haben, und erzeugt diese auf Knopfdruck (z. B. alle Protokolle von vor
   dieser Funktion oder solche, deren PDF im Funkloch hängen blieb). */
function archivKarte(){
  var c=el('<div class="card"><div class="pad stack">'+
    '<div class="rowflex" style="justify-content:space-between"><div><h2>Archiv (Synology)</h2>'+
      '<div class="sub" id="ar_stand">Jedes Protokoll wird als PDF abgelegt und von der Synology abgeholt.</div></div>'+
      '<div class="rowflex"><button class="btn ghost sm" type="button" id="ar_pruef">Prüfen</button>'+
      '<button class="btn sm" type="button" id="ar_los" hidden>Fehlende PDFs erzeugen</button></div></div>'+
  "</div></div>");
  var stand=c.querySelector("#ar_stand"), los=c.querySelector("#ar_los"), fehlend=[];
  c.querySelector("#ar_pruef").onclick=function(){
    stand.textContent="wird geprüft …";
    Promise.all([
      Store.sb.from("protokolle").select("*").is("geloescht",null).order("erstellt",{ascending:false}).limit(1000),
      Store.sb.from("berichte").select("client_id,version").limit(5000)
    ]).then(function(r){
      if(r[0].error||r[1].error){ stand.textContent="Prüfen fehlgeschlagen: "+((r[0].error||r[1].error).message)+
        " – ist das SQL-Skript mit dem Abschnitt „Archiv“ ausgeführt?"; return; }
      var da={}; (r[1].data||[]).forEach(function(b){ da[b.client_id]=b.version||1; });
      var alle=(r[0].data||[]).map(ausZeile);
      fehlend=alle.filter(function(p){ return !da[p._id] || da[p._id]<(p.version||1); });
      stand.textContent=(alle.length-fehlend.length)+" von "+alle.length+" Protokollen haben ein aktuelles PDF."+
        (fehlend.length?" "+fehlend.length+(fehlend.length===1?" fehlt.":" fehlen."):"");
      los.hidden=!fehlend.length;
    });
  };
  los.onclick=function(){
    los.disabled=true;
    var i=0, ok=0;
    var weiter=function(){
      if(i>=fehlend.length){
        stand.textContent=ok+" von "+fehlend.length+" PDFs erzeugt."+(ok<fehlend.length?" Fehler: "+(Store.fehler||"unbekannt"):"");
        los.disabled=false; los.hidden=ok===fehlend.length; return;
      }
      var p=fehlend[i++];
      stand.textContent="PDF "+i+" von "+fehlend.length+" – "+protoName(p)+" vom "+dfmt(p.datum)+" …";
      berichtAblegen(p).then(function(x){ if(x) ok++; weiter(); });
    };
    weiter();
  };
  return c;
}
