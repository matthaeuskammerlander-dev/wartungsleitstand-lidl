/* ---------- View: Anlagen ---------- */
function viewAnlagen(){
  var f=document.createDocumentFragment();
  var pos=filteredPos();

  /* Baujahr-Histogramm */
  var years=pos.filter(function(p){return p.baujahr;}).map(function(p){return p.baujahr;});
  var minY=Math.min.apply(null,years.concat([JAHR])), maxY=Math.max.apply(null,years.concat([JAHR]));
  var counts=[]; for(var y=minY;y<=maxY;y++) counts.push({y:y,n:years.filter(function(v){return v===y;}).length});
  var mx=Math.max(1,Math.max.apply(null,counts.map(function(c){return c.n;})));
  var CW=720,CH=190,cpL=30,cpR=8,cpT=14,cpB=28;
  var ciw=CW-cpL-cpR, cih=CH-cpT-cpB, bw=ciw/counts.length;
  var bars=counts.map(function(c,i){
    var h=c.n/mx*cih, x=cpL+i*bw+2.5, w=bw-5, yy=cpT+cih-h;
    return (c.n?'<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" style="fill:var(--accent)"/>':"")+
      '<rect class="hit" x="'+(cpL+i*bw)+'" y="'+cpT+'" width="'+bw+'" height="'+cih+'" style="fill:transparent" data-y="'+c.y+'" data-n="'+c.n+'"/>'+
      (c.n?'<text class="num" x="'+(x+w/2).toFixed(1)+'" y="'+(yy-4).toFixed(1)+'" text-anchor="middle" font-size="10" style="fill:var(--ink-2)">'+c.n+"</text>":"")+
      '<text x="'+(cpL+i*bw+bw/2).toFixed(1)+'" y="'+(cpT+cih+15)+'" text-anchor="middle" font-size="10" style="fill:var(--ink-3)">'+("'"+String(c.y).slice(2))+"</text>";
  }).join("");
  var gy=[0,Math.round(mx/2),mx].filter(function(v,i,a){return a.indexOf(v)===i;});
  var grid=gy.map(function(v){ var yy=cpT+cih-v/mx*cih;
    return '<line x1="'+cpL+'" y1="'+yy.toFixed(1)+'" x2="'+(CW-cpR)+'" y2="'+yy.toFixed(1)+'" style="stroke:var(--line);stroke-width:1"/>'+
      '<text class="num" x="'+(cpL-6)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end" font-size="10" style="fill:var(--ink-3)">'+v+"</text>"; }).join("");

  var hist=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Inbetriebnahme der Anlagen</h2><div class="sub">'+years.length+' von '+pos.length+' Positionen haben ein Datum in der Liste. Ältester Eintrag '+minY+".</div></div>"+
    '<svg class="chart" viewBox="0 0 '+CW+" "+CH+'" role="img" aria-label="Anzahl Anlagen je Inbetriebnahmejahr">'+grid+bars+"</svg>"+
  "</div></div>");
  hist.querySelectorAll(".hit").forEach(function(r){
    r.addEventListener("mousemove",function(e){ tipShow(e,"<b>"+r.dataset.y+"</b><br>"+r.dataset.n+" Anlage(n) in Betrieb genommen"); });
    r.addEventListener("mouseleave",tipHide);
  });
  f.appendChild(hist);

  /* Standortliste */
  var list=filtered().slice().sort(function(a,b){
    var d=STATUS_RANK[a.status]-STATUS_RANK[b.status]; if(d) return d;
    return (a.plz||"zz").localeCompare(b.plz||"zz");
  });
  var card=el('<div class="card"><div class="pad"><h2>Anlagenstamm</h2>'+
    '<div class="sub">'+list.length+" Standorte · "+pos.length+" Wartungspositionen. Aufklappen zeigt Anlagendaten und Wartungshistorie.</div></div><div id=\"stlist\"></div></div>");
  var host=card.querySelector("#stlist");
  list.forEach(function(s){
    var d=el('<details class="st"><summary>'+
      "<span><strong>"+esc(stName(s))+'</strong><br><span class="muted" style="font-size:12.5px">'+esc(s.adresse)+(s.region?" · "+esc(s.region):"")+"</span></span>"+
      '<span class="rowflex" style="justify-content:flex-end">'+
        (s.ueber30kg?'<span class="tag f30">&gt;30 kg</span>':"")+
        '<span class="tag">'+anlagenDesMarkts(s,true).length+" Anl.</span>"+pill(s.status)+"</span>"+
    '</summary><div class="inner"></div></details>');
    var inner=d.querySelector(".inner");
    d.addEventListener("toggle",function(){
      if(d.open && !inner.dataset.done){ anlagenBloecke(s, inner); inner.dataset.done="1"; }
    });
    host.appendChild(d);
  });
  f.appendChild(card);
  return f;
}

/* ---------- Protokoll ---------- */
var ANLAGENTYPEN=["Split","Multi-Split","VRV wassergekühlt","VRV luftgekühlt","Rückkühler","Pumpe","sonstige"];
var REGELUNGEN=["Daikin Touch Manager","R&S","Wurm","LichtLoidl"];

/* ---------- Anlagendaten ----------
   Was UKT über jede Anlage wissen muss. Die Excel-Liste ist hier lückenhaft;
   ergänzt wird vor Ort beim Protokoll über einen geführten Dialog, der nur
   fragt, was fehlt. Gruppen = Schritte des Dialogs. */
var BAUARTEN=["Split","Multi-Split","VRV luftgekühlt","VRV wassergekühlt","Kaltwassersatz"];
var KAELTEMITTEL=["R410A","R32","R407C","R134a","R454B","R744"];
var OHNE_REGELUNG="keine eigene Regelung";
function istWassergekuehlt(a){
  var b=String(a.bauart||"").toLowerCase();
  if(b) return b.indexOf("wasser")>=0 || b.indexOf("kaltwasser")>=0;
  return /wasser|rza|rk\b|rückkühl/i.test(String(a.anlagentyp||"")+" "+String(a.rueckkuehler||""));
}
var ANLAGE_GRUPPEN=[
  {titel:"Bauart", frage:"Was für eine Anlage ist das?", felder:[
    {k:"bauart", l:"Bauart", t:"wahl", o:BAUARTEN, frei:true}]},
  {titel:"Kältekreis", frage:"Wie viele Kältekreisläufe hat die Anlage – und gibt es ein Prüfbuch?", felder:[
    {k:"kreislaeufe", l:"Kältekreisläufe", t:"zahl"},
    {k:"pruefbuch", l:"Prüfbuch vorhanden", t:"jn"}]},
  {titel:"Kältemittel", frage:"Welches Kältemittel, wie viel?", felder:[
    {k:"kaeltemittelArt", l:"Kältemittel", t:"wahl", o:KAELTEMITTEL, frei:true},
    {k:"kaeltemittelKg", l:"Füllmenge (kg)", t:"kg"}]},
  {titel:"Rückkühler und Pumpen", frage:"Wassergekühlt: Gehören Rückkühler und Pumpenstation zu unserem Auftrag?",
    wenn:istWassergekuehlt, felder:[
    {k:"rkUkt", l:"Rückkühler von UKT zu warten", t:"jn"},
    {k:"pumpeUkt", l:"Pumpenstation von UKT zu warten", t:"jn"}]},
  {titel:"Regelung", frage:"Welche Regelung, wer betreut sie, haben wir Fernzugriff?", felder:[
    {k:"regelung", l:"Regelung", t:"wahl", o:REGELUNGEN.concat([OHNE_REGELUNG]), frei:true},
    {k:"regelungFirma", l:"Regelung betreut von", t:"wahl", o:["UKT","andere Firma"],
      wenn:function(a){ return a.regelung!==OHNE_REGELUNG; }},
    {k:"regelungFirmaName", l:"Name der Firma", t:"text",
      wenn:function(a){ return a.regelung!==OHNE_REGELUNG && a.regelungFirma==="andere Firma"; }},
    {k:"fernzugriff", l:"Fernzugriff durch UKT", t:"jn",
      wenn:function(a){ return a.regelung!==OHNE_REGELUNG; }}]},
  {titel:"Typenschild", frage:"Angaben vom Typenschild (freiwillig)", optional:true, felder:[
    {k:"hersteller", l:"Hersteller", t:"text"},
    {k:"modell", l:"Modell", t:"text"},
    {k:"seriennummer", l:"Seriennummer", t:"text"}]}
];
var ANLAGE_FELDER=[].concat.apply([], ANLAGE_GRUPPEN.map(function(g){
  return g.felder.map(function(f){ return Object.assign({gruppe:g}, f); }); }));
function leerWert(w){ return w==null || w==="" || (typeof w==="number" && isNaN(w)); }
function feldGilt(f, a){ return (!f.gruppe.wenn || f.gruppe.wenn(a)) && (!f.wenn || f.wenn(a)); }
/* was an Pflichtangaben noch fehlt */
function anlageLuecken(a){
  return ANLAGE_FELDER.filter(function(f){ return !f.gruppe.optional && feldGilt(f,a) && leerWert(a[f.k]); });
}
function anlageWertText(f, w){
  if(leerWert(w)) return "–";
  if(f.t==="kg") return String(w).replace(".",",")+" kg";
  return String(w);
}
/* kurze Zusammenfassung für Karten, Detailansicht und Druck */
function anlageKurz(a){
  var t=[];
  if(a.bauart) t.push(a.bauart);
  if(a.kreislaeufe) t.push(a.kreislaeufe+" Kältekreis"+(+a.kreislaeufe===1?"":"e"));
  if(a.kaeltemittelArt||!leerWert(a.kaeltemittelKg)) t.push([a.kaeltemittelArt, leerWert(a.kaeltemittelKg)?"":String(a.kaeltemittelKg).replace(".",",")+" kg"].filter(Boolean).join(" "));
  if(a.pruefbuch==="ja") t.push("Prüfbuch");
  if(istWassergekuehlt(a) && (a.rkUkt||a.pumpeUkt))
    t.push("RK "+(a.rkUkt==="ja"?"UKT":"fremd")+" · Pumpen "+(a.pumpeUkt==="ja"?"UKT":"fremd"));
  if(a.regelung) t.push(a.regelung===OHNE_REGELUNG ? "ohne eigene Regelung"
    : a.regelung+(a.regelungFirma?" ("+(a.regelungFirma==="UKT"?"UKT":(a.regelungFirmaName||"andere Firma"))+")":"")+
      (a.fernzugriff?" · Fernzugriff "+a.fernzugriff:""));
  return t.join(" · ");
}

/* Geführte Erfassung einer Anlage. Fragt nur die Gruppen ab, in denen etwas
   fehlt, und endet mit einer Übersicht, in der sich alles ändern lässt.
   Liefert die vollständigen Werte oder null (abgebrochen). */
function anlageAssistent(start, titel, neu){
  return new Promise(function(fertig){
    var a=Object.assign({}, start);
    var ov=el('<div class="assistent" role="dialog" aria-modal="true"><div class="as-karte">'+
      '<div class="as-kopf"><div style="min-width:0"><div class="as-titel"></div><div class="as-schritt"></div></div>'+
        '<button class="btn ghost sm" type="button" data-as="zu">Abbrechen</button></div>'+
      '<div class="as-inhalt"></div><div class="as-fuss"></div></div></div>');
    document.body.appendChild(ov);
    document.body.style.overflow="hidden";
    var inhalt=ov.querySelector(".as-inhalt"), fuss=ov.querySelector(".as-fuss");
    var schliessen=function(wert){ ov.remove(); document.body.style.overflow=""; fertig(wert); };
    ov.querySelector('[data-as="zu"]').onclick=function(){ schliessen(null); };

    /* Schritte: bei einer neuen Anlage zuerst die Bezeichnung, dann jede
       Gruppe, in der eine Pflichtangabe fehlt */
    var gruppenMitLuecke=function(){
      var fehl=anlageLuecken(a);
      return ANLAGE_GRUPPEN.filter(function(g){ return fehl.some(function(f){ return f.gruppe===g; }); });
    };
    var schritte=(neu?["name"]:[]).concat(gruppenMitLuecke());
    var pos=0, zurUebersicht=false;

    var kopf=function(text, schritt){
      ov.querySelector(".as-titel").textContent=titel||"Anlage";
      ov.querySelector(".as-schritt").textContent=text+(schritt?" · "+schritt:"");
    };
    var knopf=function(text, art, fn){
      var b=el('<button class="btn'+(art?" "+art:"")+'" type="button">'+esc(text)+"</button>"); b.onclick=fn; fuss.appendChild(b); return b;
    };

    function feldHtml(f){
      var w=a[f.k], h='<div class="as-feld"><div class="as-label">'+esc(f.l)+"</div>";
      var chip=function(wert, text, an){
        return '<button class="chip" type="button" data-f="'+f.k+'" data-w="'+esc(wert)+'" aria-pressed="'+(!!an)+'">'+esc(text)+"</button>"; };
      if(f.t==="wahl"){
        var eigen=!leerWert(w) && f.o.indexOf(w)<0;
        h+='<div class="chips">'+f.o.map(function(o){ return chip(o,o,w===o); }).join("")+
          (f.frei?chip("__frei","andere …",eigen):"")+"</div>"+
          (f.frei?'<input type="text" class="as-frei" data-frei="'+f.k+'" placeholder="Bezeichnung eingeben" value="'+esc(eigen?w:"")+'"'+(eigen?"":" hidden")+">":"");
      } else if(f.t==="jn"){
        h+='<div class="chips">'+chip("ja","ja",w==="ja")+chip("nein","nein",w==="nein")+chip("","weiß nicht",leerWert(w))+"</div>";
      } else if(f.t==="zahl"){
        h+='<div class="chips">'+[1,2,3,4].map(function(n){ return chip(n,String(n),+w===n); }).join("")+"</div>"+
          '<input type="number" min="1" max="99" inputmode="numeric" data-in="'+f.k+'" placeholder="andere Anzahl" value="'+esc(+w>4?w:"")+'">';
      } else if(f.t==="kg"){
        h+='<input type="text" inputmode="decimal" data-in="'+f.k+'" placeholder="z. B. 12,5" value="'+esc(leerWert(w)?"":String(w).replace(".",","))+'">'+
          '<div class="as-hinweis" data-hinweis="'+f.k+'"></div>';
      } else {
        h+='<input type="text" data-in="'+f.k+'" value="'+esc(leerWert(w)?"":w)+'">';
      }
      return h+"</div>";
    }
    function kgHinweis(){
      var n=inhalt.querySelector('[data-hinweis="kaeltemittelKg"]'); if(!n) return;
      n.textContent = +a.kaeltemittelKg>=30 ? "Ab 30 kg ist eine Halbjahreswartung (HJW) vorgeschrieben." : "";
    }
    function gruppeZeigen(g){
      inhalt.innerHTML='<div class="as-frage">'+esc(g.frage)+"</div>"+
        g.felder.filter(function(f){ return feldGilt(Object.assign({gruppe:g},f),a); }).map(feldHtml).join("");
      inhalt.querySelectorAll(".chip[data-f]").forEach(function(c){
        c.onclick=function(){
          var k=c.dataset.f, w=c.dataset.w, frei=inhalt.querySelector('[data-frei="'+k+'"]');
          if(w==="__frei"){
            /* Eingabefeld aufklappen – ohne Neuaufbau, sonst verschwände es gleich wieder */
            if(frei){ frei.hidden=false; frei.focus(); a[k]=frei.value.trim(); }
            inhalt.querySelectorAll('.chip[data-f="'+k+'"]').forEach(function(x){ x.setAttribute("aria-pressed", String(x===c)); });
            return;
          }
          a[k]= (k==="kreislaeufe") ? +w : w;
          if(frei){ frei.hidden=true; frei.value=""; }
          var zahlIn=inhalt.querySelector('[data-in="'+k+'"]'); if(zahlIn) zahlIn.value="";
          /* abhängige Fragen (z. B. Firmenname) sofort ein- oder ausblenden */
          gruppeZeigen(g);
        };
      });
      inhalt.querySelectorAll("[data-frei]").forEach(function(i){ i.oninput=function(){ a[i.dataset.frei]=i.value.trim(); }; });
      inhalt.querySelectorAll("[data-in]").forEach(function(i){
        i.oninput=function(){
          var k=i.dataset.in, v=i.value.trim();
          if(k==="kaeltemittelKg"){ v=v.replace(",","."); a[k]= v===""?null:(isNaN(+v)?a[k]:+v); kgHinweis(); }
          else if(k==="kreislaeufe"){ a[k]= v===""?a[k]:+v; inhalt.querySelectorAll('.chip[data-f="kreislaeufe"]').forEach(function(c){ c.setAttribute("aria-pressed","false"); }); }
          else a[k]=v;
        };
      });
      kgHinweis();
    }
    function nameZeigen(){
      inhalt.innerHTML='<div class="as-frage">Wie heißt die Anlage, damit sie jeder wiederfindet?</div>'+
        '<div class="as-feld"><div class="as-label">Bezeichnung</div><input type="text" data-in="anlagentyp" '+
        'placeholder="z. B. VRV Verkaufsraum, Split Serverraum" value="'+esc(a.anlagentyp||"")+'"></div>';
      var i=inhalt.querySelector("input"); i.oninput=function(){ a.anlagentyp=i.value.trim(); }; setTimeout(function(){ i.focus(); },50);
    }
    function schrittZeigen(){
      fuss.innerHTML="";
      var s=schritte[pos];
      kopf("Schritt "+(pos+1)+" von "+schritte.length, s==="name"?"Bezeichnung":s.titel);
      if(s==="name") nameZeigen(); else gruppeZeigen(s);
      if(pos>0 && !zurUebersicht) knopf("Zurück","ghost",function(){ pos--; schrittZeigen(); });
      if(s!=="name" && !zurUebersicht) knopf("Überspringen","ghost",function(){ weiter(); });
      knopf(zurUebersicht?"Fertig":"Weiter","",function(){
        if(s==="name" && !a.anlagentyp){ toast("Bitte eine Bezeichnung eingeben."); return; }
        weiter();
      });
      inhalt.scrollTop=0;
    }
    function weiter(){
      if(zurUebersicht){ uebersicht(); return; }
      /* die restlichen Schritte neu bestimmen – eine Antwort kann Fragen
         hinzufügen (wassergekühlt -> Rückkühler) oder überflüssig machen */
      var akt=schritte[pos], ab=akt==="name"?-1:ANLAGE_GRUPPEN.indexOf(akt);
      var rest=gruppenMitLuecke().filter(function(g){ return ANLAGE_GRUPPEN.indexOf(g)>ab; });
      schritte=schritte.slice(0,pos+1).concat(rest);
      if(pos>=schritte.length-1){ uebersicht(); return; }
      pos++; schrittZeigen();
    }
    function uebersicht(){
      zurUebersicht=true; fuss.innerHTML="";
      var fehl=anlageLuecken(a);
      kopf(fehl.length ? fehl.length+" Angabe"+(fehl.length===1?"":"n")+" noch offen" : "Alle Angaben vorhanden", "Übersicht");
      inhalt.innerHTML='<div class="as-frage">'+(fehl.length?"Offenes kann auch später ergänzt werden.":"Stimmt noch alles?")+"</div>"+
        ANLAGE_GRUPPEN.filter(function(g){ return !g.wenn || g.wenn(a); }).map(function(g,i){
          var zeilen=g.felder.filter(function(f){ return feldGilt(Object.assign({gruppe:g},f),a); }).map(function(f){
            var w=a[f.k];
            return '<div class="as-zeile"><span>'+esc(f.l)+"</span><strong"+(leerWert(w)&&!g.optional?' class="as-offen"':"")+">"+
              esc(leerWert(w)?(g.optional?"–":"offen"):anlageWertText(f,w))+"</strong></div>";
          }).join("");
          return '<div class="as-gruppe"><div class="as-gkopf"><span>'+esc(g.titel)+"</span>"+
            '<button class="btn ghost sm" type="button" data-g="'+ANLAGE_GRUPPEN.indexOf(g)+'">ändern</button></div>'+zeilen+"</div>";
        }).join("");
      inhalt.querySelectorAll("[data-g]").forEach(function(b){

/* ----------------------------------------------------------------
   Protokolle auf dem Gerät. IndexedDB statt localStorage: localStorage
   fasst nur rund 5 MB und scheitert dann still – mit Fotos und
   Unterschrift ist das nach wenigen Protokollen voll.
   ---------------------------------------------------------------- */
var IDB=null;
var lokaleProtokolle=[];   // [{id, doc, fotos, erstellt}]

function idbOeffnen(){
  return new Promise(function(ok,nok){
    if(!window.indexedDB){ nok(new Error("Dieser Browser kann keine Daten dauerhaft speichern.")); return; }
    var r;
    try{ r=indexedDB.open("ukt-wartung",3); }catch(e){ nok(e); return; }
    r.onupgradeneeded=function(){
      var db=r.result;
      if(!db.objectStoreNames.contains("protokolle")) db.createObjectStore("protokolle",{keyPath:"id"});
      /* Version 2: Änderungsverlauf */
      if(!db.objectStoreNames.contains("aenderungen")) db.createObjectStore("aenderungen",{keyPath:"id"});
      /* Version 3: Stammdaten-Änderungen aus der Verwaltung */
      if(!db.objectStoreNames.contains("stammdaten")) db.createObjectStore("stammdaten",{keyPath:"id"});
    };
    r.onsuccess=function(){ IDB=r.result; ok(IDB); };
    r.onerror=function(){ nok(r.error||new Error("Gerätespeicher nicht verfügbar")); };
  });
}
function idbVorgang(modus, arbeit, ablage){
  return new Promise(function(ok,nok){
    if(!IDB){ nok(new Error("Gerätespeicher nicht geöffnet")); return; }
    ablage=ablage||"protokolle";
    var tx=IDB.transaction(ablage,modus), st=tx.objectStore(ablage), erg;
    try{ erg=arbeit(st); }catch(e){ nok(e); return; }
    tx.oncomplete=function(){ ok(erg && "result" in erg ? erg.result : undefined); };
    tx.onerror=function(){ nok(tx.error||new Error("Speichern auf dem Gerät fehlgeschlagen")); };
    tx.onabort=function(){ nok(tx.error||new Error("Gerätespeicher voll")); };
  });
}
function idbAlle(){ return idbVorgang("readonly",function(st){ return st.getAll(); }); }
function idbSchreiben(e){ return idbVorgang("readwrite",function(st){ return st.put(e); }); }
function idbLoeschen(id){ return idbVorgang("readwrite",function(st){ return st.delete(id); }); }

function lokaleNeuLaden(){
  return idbAlle().then(function(liste){
    lokaleProtokolle=(liste||[]).sort(function(a,b){ return (b.erstellt||"").localeCompare(a.erstellt||""); });
    return lokaleProtokolle;
  },function(){ lokaleProtokolle=[]; return []; });
}

/* zentral abgelegte und gerätegespeicherte Protokolle in einer Liste */
function alleProtokolle(mitGeloeschten){
  /* wird schon beim Start für die Fälligkeiten gebraucht, bevor Listen geladen sind */
  var zentral=(protokolle||[]).map(function(p){ return Object.assign({_quelle:"zentral"},p); });
  var lokal=(lokaleProtokolle||[]).map(function(e){
    return Object.assign({_quelle:"geraet", _id:e.id, _fotoDaten:e.fotos||[]}, e.doc);
  });
  /* Gelöschte zählen nirgends mit – weder in Listen noch als Wartungsnachweis.
     Nur die Verwaltung holt sie zum Wiederherstellen dazu. */
  return lokal.concat(zentral)
    .filter(function(p){ return mitGeloeschten || !p.geloescht; })
    .sort(function(a,b){
      return ((b.datum||"")+(b.erstellt||"")).localeCompare((a.datum||"")+(a.erstellt||""));
    });
}

/* Löschen = als gelöscht markieren. Das Protokoll verschwindet aus allen
   Listen und Berechnungen, bleibt aber mit Grund nachvollziehbar und lässt
   sich wiederherstellen. Nur für Admins. */
function protokollLoeschen(p, grund, wiederher){
  var jetzt=new Date().toISOString(), von=wer(), id=p._id;
  var felder = wiederher
    ? {geloescht:null, geloeschtVon:null, loeschGrund:null}
    : {geloescht:jetzt, geloeschtVon:von, loeschGrund:grund};
  var fertig=function(ok){
    if(!ok) return false;
    protokolliere({art: wiederher?"wiederhergestellt":"geloescht", protokollId:id,
      standortId:p.standortId, standortName:p.standortName, grund:grund,
      felder:[{feld:"datum", name:"Protokoll vom", alt:dfmt(p.datum), neu: wiederher?"wiederhergestellt":"gelöscht"}]});
    return true;
  };
  if(Store.modus==="supabase" && Store.sb){
    var zeile={geloescht:felder.geloescht, geloescht_von:felder.geloeschtVon, loesch_grund:felder.loeschGrund,
      version:(p.version||1)+1, geaendert:jetzt,
      korrektur_grund:(wiederher?"Wiederhergestellt: ":"Gelöscht: ")+grund};
    return Store.sb.from("protokolle").update(zeile).eq("client_id",id).select("client_id").then(function(r){
      if(r.error){
        Store.fehler = /column|geloescht/i.test(r.error.message)
          ? "Die Datenbank kennt das Löschen noch nicht – bitte das Einrichtungsskript in Supabase erneut ausführen."
          : r.error.message;
        return false;
      }
      if(!r.data || !r.data.length){ Store.fehler="Die Datenbank hat das Löschen abgelehnt – nur Admins dürfen löschen."; return false; }
      ladeProtokolle();
      return fertig(true);
    }, function(){ Store.fehler="Keine Verbindung."; return false; });
  }
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).update(Object.assign({version:(p.version||1)+1, geaendert:jetzt}, felder))
      .then(function(){ return fertig(true); }, function(){ Store.fehler="Speichern fehlgeschlagen."; return false; });
  }
  Store.fehler="Keine gemeinsame Ablage verbunden.";
  return Promise.resolve(false);
}

/* ---------------- Änderungsverlauf ----------------
   Jedes Anlegen, Korrigieren und Löschen wird festgehalten: wann, von wem,
   welches Feld von welchem auf welchen Wert, und warum. Einträge werden
   nie geändert oder gelöscht. */
var aenderungen=[];   // neueste zuerst

var FELDNAMEN={ datum:"Datum", uhrzeit:"Uhrzeit", bestellnummer:"Bestellnummer", auftragsnummer:"Lidl-Auftragsnummer",
  region:"FM-Region", standortName:"Standort", adresse:"Adresse", wartungsart:"Wartungsart", firma:"Firma",
  techniker:"Techniker/in", kontakt:"Telefon / E-Mail", subunternehmen:"Subunternehmen",
  zertUnternehmen:"F-Gase-Unternehmenszertifikat", zertPerson:"F-Gase-Personenzertifikat",
  positionIds:"Gewartete Anlagen", anlagen:"Anlagendaten", arbeiten:"Durchgeführte Arbeiten",
  arbeitenSonstiges:"Sonstige Arbeiten", maengel:"Mängel", betriebsbereit:"Betriebsbereit",
  sofortmassnahme:"Sofortmaßnahme", ergebnis:"Ergebnis", bemerkungen:"Bemerkungen",
  nameTechniker:"Name Techniker/in", auftraggebervertreter:"Auftraggebervertreter",
  unterschrift:"Unterschrift", fotos:"Fotos" };

function feldText(feld, wert){
  if(wert==null || wert==="" || (Array.isArray(wert)&&!wert.length)) return "–";
  if(feld==="datum") return dfmt(wert);
  if(feld==="positionIds") return wert.map(function(id){
    var p=null; for(var i=0;i<POS.length;i++){ if(POS[i].id===id){ p=POS[i]; break; } }
    return p?anlagenName(p):id; }).join(", ");
  if(feld==="maengel") return wert.map(function(m){ return m.text+(m.prio?" ("+m.prio+")":""); }).join("; ");
  if(feld==="unterschrift") return "vorhanden";
  if(feld==="fotos") return wert.length+" Foto(s)";
  if(feld==="anlagen") return wert.length+" Anlage(n) erfasst";
  if(Array.isArray(wert)) return wert.join(", ");
  return String(wert);
}
function gleich(a,b){
  var n=function(v){ return (v==null||(Array.isArray(v)&&!v.length))?"":v; };
  return JSON.stringify(n(a))===JSON.stringify(n(b));
}
function vergleiche(alt, neu){
  var felder=[];
  Object.keys(FELDNAMEN).forEach(function(k){
    if(!gleich(alt[k],neu[k])) felder.push({feld:k, name:FELDNAMEN[k], alt:feldText(k,alt[k]), neu:feldText(k,neu[k])});
  });
  /* Angaben zur Störung einzeln, damit der Verlauf zeigt, was genau geändert wurde */
  var sa=alt.stoerung||{}, sn=neu.stoerung||{};
  Object.keys(STOER_NAMEN).forEach(function(k){
    if(gleich(sa[k],sn[k]) || (!sa[k]&&!sn[k])) return;
    var txt=function(w){
      if(k==="material") return (w||[]).map(function(m){ return m.text+(m.menge?" ("+m.menge+")":""); }).join("; ")||"–";
      if(k==="folgeauftrag") return w?"ja":"nein";
      if(/datum|Bis$/.test(k)) return w?dfmt(w):"–";
      return (w==null||w==="")?"–":String(w);
    };
    felder.push({feld:"stoerung."+k, name:STOER_NAMEN[k], alt:txt(sa[k]), neu:txt(sn[k])});
  });
  return felder;
}

/* ----------------------------------------------------------------
   Stammdaten-Änderungen aus der Verwaltung. Sie liegen als eigene Ebene
   über der Excel-Liste: je Markt bzw. Anlage ein Datensatz mit den Feldern,
   die vom Excel-Stand abweichen. Löscht man ihn, gilt wieder Excel.
   ---------------------------------------------------------------- */
var stammUeber = {};   // "standort:S5" | "position:P9" -> {id, typ, ziel, felder, neu, geaendert, von, grund}

function wendeStammdatenAn(){
  /* 1. alles auf den Excel-Stand zurück */
  ALLE_ST = ALLE_ST.filter(function(s){ return !s._neu; });
  ALLE_POS = ALLE_POS.filter(function(p){ return !p._neu; });
  ALLE_ST.forEach(function(s){ Object.assign(s, EXCEL["standort:"+s.id]); s._geaendert=false; });
  ALLE_POS.forEach(function(p){ Object.assign(p, EXCEL["position:"+p.id]); p._geaendert=false; });

  /* 2. Änderungen darüberlegen – Märkte zuerst, damit neue Anlagen ihren Markt finden */
  var rang=function(k){ return k.indexOf("standort:")===0 ? 0 : 1; };
  var schluessel=Object.keys(stammUeber).sort(function(a,b){ return rang(a)-rang(b); });
  schluessel.forEach(function(k){
    var r=stammUeber[k], ziel=null, i;
    if(r.typ==="standort"){
      for(i=0;i<ALLE_ST.length;i++){ if(ALLE_ST[i].id===r.ziel){ ziel=ALLE_ST[i]; break; } }
      if(!ziel && r.neu){ ziel={id:r.ziel, _neu:true, pos:[], genauigkeit:"manuell", aktiv:true, name:""}; ALLE_ST.push(ziel); }
    } else {
      for(i=0;i<ALLE_POS.length;i++){ if(ALLE_POS[i].id===r.ziel){ ziel=ALLE_POS[i]; break; } }
      if(!ziel && r.neu){ ziel={id:r.ziel, _neu:true, historie:[], techniker:{}, aktiv:true}; ALLE_POS.push(ziel); }
    }
    if(!ziel) return;
    Object.assign(ziel, r.felder);
    ziel._geaendert=true;
  });

  /* 3. abgeleitete Werte nachziehen */
  ALLE_POS.forEach(function(p){
    var ex=EXCEL["position:"+p.id];
    p.monat = p.monat ? +p.monat : 0;
    p.baujahr = p.inbetriebnahme ? +String(p.inbetriebnahme).slice(0,4) : null;
    var kgGeaendert = !ex || p.kaeltemittelKg!==ex.kaeltemittelKg;
    if(kgGeaendert){
      var kg=(p.kaeltemittelKg===""||p.kaeltemittelKg==null)?null:+p.kaeltemittelKg;
      p.kaeltemittelKg=kg;
      p.kaeltemittelText = kg==null ? "" : String(kg).replace(".",",")+" kg";
      p.ueber30kg = kg!=null && kg>=30;
    }
  });
  ALLE_ST.forEach(function(s){
    if(s.lat!=null&&s.lat!=="") s.lat=+s.lat; else s.lat=null;
    if(s.lon!=null&&s.lon!=="") s.lon=+s.lon; else s.lon=null;
    if(s._geaendert && s.lat && EXCEL["standort:"+s.id] && s.lat!==EXCEL["standort:"+s.id].lat) s.genauigkeit="manuell";
    s.unklar=!s.lat;
  });
  indexNeuAufbauen();
  berechneFaelligkeiten();
}

/* ---------------- Admin-Freigabe ----------------
   Mit gemeinsamer Datenbank entscheidet die Tabelle "admins" in Supabase –
   das setzt die Datenbank selbst durch. Ohne sie gelten Änderungen nur auf
   diesem Gerät; dort schützt eine PIN vor versehentlichen Eingriffen. */
var Admin={frei:false, zentral:false, geprueft:false};
function sha256hex(text){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b),function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
  });
}
function adminPruefen(){

      stammdatenUebertragen();   /* Anlagendaten auch von Technikern */
      return Admin.frei;

  }
  Admin.geprueft=true;
  try{ Admin.frei = sessionStorage.getItem("ukt_admin_frei")==="1"; }catch(e){}
  return Promise.resolve(Admin.frei);
}

/* ältere Fassung legte die Warteschlange in localStorage ab – übernehmen */
function altlastUebernehmen(){
  var alt=lsGet("ukt_queue",[]);
  if(!alt.length) return Promise.resolve();
  var kette=Promise.resolve();
  alt.forEach(function(e){
    kette=kette.then(function(){
      return idbSchreiben({id:e.id, doc:e.doc, fotos:e.fotos||[], erstellt:(e.doc&&e.doc.erstellt)||new Date().toISOString()});
    });
  });
  return kette.then(function(){ try{ localStorage.removeItem("ukt_queue"); }catch(x){} });
}

/* ----------------------------------------------------------------
   Speicher: im Artifact die Claude-Datenbank, auf GitHub Pages
   Supabase, und wenn beides fehlt nur lokal am Gerät.
   ---------------------------------------------------------------- */
var CFG=window.UKT_CONFIG||{};
var Store={
  modus:"lade",        // lade | claude | supabase | anmeldung | lokal
  claudeDb:null,
  sb:null,
  benutzer:null,
  fehler:""
};
function storeNachRender(){
  /* neue oder geladene Protokolle verschieben Fälligkeiten */
  berechneFaelligkeiten();
  /* die Karte nicht unter der Hand neu aufbauen – Zoom und Ausschnitt gingen verloren */
  if(darfRendern() && S.view!=="karte") render();
}

function initStore(versuch){
  versuch=versuch||0;
  var supabaseKonfiguriert = CFG.supabaseUrl && CFG.supabaseAnonKey;
  /* Innerhalb von Claude läuft die Seite in einem Rahmen, und window.claude
     kommt erst nach dem ersten Skriptlauf. Als eigenständige Seite
     (GitHub Pages, eigenes Hosting) gibt es darauf nichts zu warten. */
  var imRahmen=false; try{ imRahmen = window.self!==window.top; }catch(e){ imRahmen=true; }
  if(!window.claude || !window.claude.use){
    if(!supabaseKonfiguriert && imRahmen && versuch<40){ setTimeout(function(){ initStore(versuch+1); },250); return; }
    if(supabaseKonfiguriert) return initSupabase();
    Store.modus="lokal"; storeNachRender(); return;
  }
  window.claude.use("db").then(function(api){
    if(!api){ if(supabaseKonfiguriert) return initSupabase(); Store.modus="lokal"; storeNachRender(); return; }
    Store.claudeDb=api; Store.modus="claude";
    api.collection("protokolle").orderBy("erstellt","desc").limit(200).onSnapshot(function(snap){
      protokolle=(snap.docs||[]).map(function(d){ return Object.assign({_id:d.id},d.data()||{}); });
      storeNachRender();
    }, function(){ });
    flushQueue();
    ladeStammdaten().then(storeNachRender);
    storeNachRender();
  }, function(){ if(supabaseKonfiguriert) return initSupabase(); Store.modus="lokal"; storeNachRender(); });
}

function initSupabase(){
  if(!window.supabase || !window.supabase.createClient){ Store.modus="lokal"; Store.fehler="Supabase-Bibliothek nicht geladen."; storeNachRender(); return; }
  Store.sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  Store.sb.auth.getSession().then(function(r){
    var sess=r&&r.data?r.data.session:null;
    if(sess){ Store.benutzer=sess.user; Store.modus="supabase"; ladeProtokolle(); flushQueue();
      adminPruefen().then(ladeStammdaten).then(storeNachRender); }
    else { Store.modus="anmeldung"; }
    storeNachRender();
  });
  Store.sb.auth.onAuthStateChange(function(_ev,sess){
    if(sess){ Store.benutzer=sess.user; Store.modus="supabase"; ladeProtokolle(); flushQueue();
      adminPruefen().then(ladeStammdaten).then(storeNachRender); }
    else { Store.benutzer=null; Store.modus="anmeldung"; protokolle=[]; Admin.zentral=false; Admin.frei=false; }
    storeNachRender();
  });
}

/* ---------------- Fotos ----------------
   Handykameras liefern 3–8 MB je Bild. Das wird vor dem Hochladen auf
   eine brauchbare Dokumentationsgröße gebracht – sonst dauert es im
   Funkloch ewig und sprengt jede Speichergrenze. */
var FOTO_KANTE = 1600;        // längste Kante in Pixel
var FOTO_BUDGET = 160000;     // Zielgröße je Bild in Byte
var FOTO_MAX = 8;             // Bilder je Protokoll

function verkleinere(datei){
  return new Promise(function(fertig, schiefgegangen){
    var quelle = window.createImageBitmap
      ? createImageBitmap(datei,{imageOrientation:"from-image"})
      : new Promise(function(ok,nok){
          var img=new Image(), url=URL.createObjectURL(datei);
          img.onload=function(){ URL.revokeObjectURL(url); ok(img); };
          img.onerror=function(){ URL.revokeObjectURL(url); nok(new Error("Bild nicht lesbar")); };
          img.src=url;
        });
    quelle.then(function(bild){
      var b=bild.width, h=bild.height;
      var f=Math.min(1, FOTO_KANTE/Math.max(b,h));
      var cv=document.createElement("canvas");
      cv.width=Math.round(b*f); cv.height=Math.round(h*f);
      cv.getContext("2d").drawImage(bild,0,0,cv.width,cv.height);
      if(bild.close) bild.close();
      /* Qualität so weit senken, bis das Budget passt */
      var q=0.78, url=cv.toDataURL("image/jpeg",q);
      while(url.length*0.75 > FOTO_BUDGET && q > 0.36){
        q-=0.08; url=cv.toDataURL("image/jpeg",q);
      }
      fertig({datenUrl:url, breite:cv.width, hoehe:cv.height,
              bytes:Math.round(url.length*0.75), qualitaet:Math.round(q*100)});
    }, schiefgegangen);
  });
}
function datenUrlZuBlob(url){
  var teile=url.split(","), roh=atob(teile[1]);
  var a=new Uint8Array(roh.length);
  for(var i=0;i<roh.length;i++) a[i]=roh.charCodeAt(i);
  return new Blob([a],{type:"image/jpeg"});
}

/* speichert alle Fotos eines Protokolls; liefert false, wenn etwas scheitert */
function speichereFotos(protokollId, fotos){
  if(!fotos || !fotos.length) return Promise.resolve(true);

  if(Store.modus==="claude" && Store.claudeDb){
    /* ein Dokument je Foto – die Grenze liegt bei 256 KiB je Dokument */
    var i=0;
    var naechstes=function(){
      if(i>=fotos.length) return Promise.resolve(true);
      var f=fotos[i++];
      return Store.claudeDb.doc("protokollfotos/"+f.id).set({
        protokollId:protokollId, name:f.name, hinweis:f.hinweis,
        datenUrl:f.datenUrl, erstellt:new Date().toISOString()
      }).then(naechstes, function(){ return false; });
    };
    return naechstes();
  }

  if(Store.modus==="supabase" && Store.sb){
    var j=0;
    var weiter=function(){
      if(j>=fotos.length) return Promise.resolve(true);
      var f=fotos[j++];
      var pfad=protokollId+"/"+f.id+".jpg";
      return Store.sb.storage.from("protokollfotos")
        .upload(pfad, datenUrlZuBlob(f.datenUrl), {contentType:"image/jpeg", upsert:false})
        .then(function(r){ if(r.error){ Store.fehler=r.error.message; return false; } return weiter(); },
              function(){ return false; });
    };
    return weiter();
  }
  return Promise.resolve(false);
}

/* holt die Bilder eines Protokolls zur Anzeige */
function ladeFotos(p){
  /* noch nicht übertragen: die Bilder liegen direkt im Gerätespeicher */
  if(p._fotoDaten && p._fotoDaten.length){
    return Promise.resolve(p._fotoDaten.map(function(f){ return {name:f.name, hinweis:f.hinweis, url:f.datenUrl}; }));
  }
  if(!p.fotos || !p.fotos.length) return Promise.resolve([]);
  if(Store.modus==="claude" && Store.claudeDb){
    return Promise.all(p.fotos.map(function(f){
      return Store.claudeDb.doc("protokollfotos/"+f.id).get().then(function(snap){
        var d=snap.exists?snap.data():null;
        return {name:f.name, hinweis:f.hinweis, url:d?d.datenUrl:null};
      },function(){ return {name:f.name, hinweis:f.hinweis, url:null}; });
    }));
  }
  if(Store.modus==="supabase" && Store.sb){
    return Promise.all(p.fotos.map(function(f){
      return Store.sb.storage.from("protokollfotos")
        .createSignedUrl((p._id||p.id)+"/"+f.id+".jpg", 3600)
        .then(function(r){ return {name:f.name, hinweis:f.hinweis, url:r.data?r.data.signedUrl:null}; },
              function(){ return {name:f.name, hinweis:f.hinweis, url:null}; });
    }));
  }
  return Promise.resolve([]);
}

/* ein Protokoll wegschreiben – liefert ein Promise, das nie ablehnt */
function speichereProtokoll(id,doc){
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).set(doc).then(function(){ return true; },function(){ return false; });
  }
  if(Store.modus==="supabase" && Store.sb){
    var zeile=zuZeile(doc,Store.benutzer?Store.benutzer.id:null);
    /* Die Kennung aus der App mitgeben: unter ihr liegen die Fotos, und ein
       zweiter Übertragungsversuch legt so kein doppeltes Protokoll an. */
    zeile.client_id=id;
    return Store.sb.from("protokolle").upsert(zeile,{onConflict:"client_id", ignoreDuplicates:true}).then(function(r){
      if(r.error){
        Store.fehler=/stoerung/.test(r.error.message||"")
          ? "In der Datenbank fehlt die Spalte für Störungen – bitte supabase-setup.sql im Supabase SQL Editor erneut ausführen"
          : r.error.message;
        return false;
      }
      ladeProtokolle();
      /* Archiv-PDF im Hintergrund – das Speichern wartet nicht darauf */
      berichtAblegen(Object.assign({}, doc, {_id:id, version:doc.version||1}));
      return true;
    },function(){ return false; });
  }
  return Promise.resolve(false);
}

/* eine Korrektur wegschreiben – gleiche Kennung, neue Fassung */
function aktualisiereProtokoll(id, doc, quelle, geraetFotos){
  if(quelle==="geraet"){
    return idbSchreiben({id:id, doc:doc, fotos:geraetFotos||[], erstellt:doc.erstellt})
      .then(function(){ return true; }, function(){ return false; });
  }
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).set(doc).then(function(){ return true; }, function(){ return false; });
  }
  if(Store.modus==="supabase" && Store.sb){
    var zeile=zuZeile(doc,null);
    delete zeile.erstellt_von;   /* der ursprüngliche Verfasser bleibt eingetragen */
    delete zeile.erstellt;
    zeile.version=doc.version; zeile.geaendert=doc.geaendert; zeile.korrektur_grund=doc.korrekturGrund||null;
    return Store.sb.from("protokolle").update(zeile).eq("client_id",id).then(function(r){
      if(r.error){ Store.fehler=r.error.message; return false; }
      ladeProtokolle();
      berichtAblegen(Object.assign({}, doc, {_id:id}));   /* neue Fassung ersetzt das PDF */
      return true;
    },function(){ return false; });
  }
  return Promise.resolve(false);
}
/* überträgt Protokolle vom Gerät, sobald eine zentrale Ablage da ist */
var uebertragungLaeuft=false;
function flushQueue(){
  if(uebertragungLaeuft) return;
  if(Store.modus!=="claude" && Store.modus!=="supabase") return;
  if(!lokaleProtokolle.length){ aenderungenUebertragen(); return; }
  uebertragungLaeuft=true;
  var liste=lokaleProtokolle.slice(), done=0, i=0;
  var next=function(){
    if(i>=liste.length){
      uebertragungLaeuft=false;
      aenderungenUebertragen();
      lokaleNeuLaden().then(function(){
        if(done) toast(done+" Protokoll(e) vom Gerät in die zentrale Ablage übertragen.");
        storeNachRender();
      });
      return;
    }
    var e=liste[i++];
    speichereFotos(e.id, e.fotos||[]).then(function(fotosOk){
      if(!fotosOk){ next(); return; }
      speichereProtokoll(e.id,e.doc).then(function(ok){
        if(!ok){ next(); return; }
        done++;
        /* erst nach bestätigter Übertragung vom Gerät entfernen */
        idbLoeschen(e.id).then(next,next);
      });
    });
  };
  next();
}
window.addEventListener("online",function(){ flushQueue(); });

/* ================= Störungseinsätze =================
   Lidl schickt je Störung einen Auftrag als PDF. Der QR-Code darauf enthält
   nur die Auftragsnummer – alles andere steht als Text in der PDF und wird
   von dort übernommen. Ein Störungsprotokoll hat die Wartungsart „Störung“
   und verschiebt deshalb keine Fälligkeit (siehe ZAEHLT_ALS_WARTUNG). */
var STOER_AUFTRAG=[
  ["auftragsdatum","Auftragsdatum","date"], ["stoerungsnr","Störungsnummer (Lidl)","text"],
  ["ausfuehrenBis","Ausführen bis","date"], ["kostenstelle","Kostenstelle","text"],
  ["problemtyp","Problemtyp","text"], ["lidlTyp","Typ (Lidl)","text"], ["lidlModell","Modell (Lidl)","text"],
  ["lin","LIN","text"], ["iaNummer","IA-Nummer","text"],
  ["lidlKontakt","Kontakt bei Lidl","text"], ["lidlTelefon","Telefon Lidl","text"], ["lidlMail","E-Mail Lidl","text"]
];
var STOER_BEHEBUNG=[
  ["ankunft","Ankunft","time"], ["ende","Fertig","time"],
  ["kmArt","Kältemittel","text"], ["kmNach","Kältemittel nachgefüllt (kg)","text"], ["kmEnt","Kältemittel zurückgewonnen (kg)","text"]
];
var STOER_TEXTE=[["beschreibung","Beschreibung laut Auftrag"],["fehlerbild","Fehlerbild vor Ort"],
  ["ursache","Ursache"],["massnahmen","Durchgeführte Maßnahmen"]];
/* für Änderungsverlauf und Anzeige: alle Felder mit Namen */
var STOER_NAMEN=(function(){ var n={}; STOER_AUFTRAG.concat(STOER_BEHEBUNG,STOER_TEXTE).forEach(function(f){ n[f[0]]=f[1]; });
  n.material="Material / Ersatzteile"; n.folgeauftrag="Folgeauftrag / Angebot"; n.folgeText="Folgeauftrag – was"; return n; })();

function istStoerung(p){ return !!p && (p.wartungsart==="Störung" || !!p.stoerung); }
function datumIso(t){ var m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(t||"").trim());
  return m ? m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2) : ""; }

function ladeSkript(src){
  return new Promise(function(ok,nok){
    var s=document.createElement("script"); s.src=src; s.onload=ok;
    s.onerror=function(){ nok(new Error("Werkzeug nicht ladbar – keine Internetverbindung?")); };
    document.head.appendChild(s);
  });
}
var pdfJsBereit=null;
function ladePdfJs(){
  if(pdfJsBereit) return pdfJsBereit;
  var basis="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  pdfJsBereit=ladeSkript(basis+"pdf.min.js").then(function(){
    /* Hilfsprozess als eigene Datei vom selben Ursprung, sonst blockt der Browser */
    return fetch(basis+"pdf.worker.min.js").then(function(r){ return r.text(); }).then(function(t){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:"text/javascript"}));
    }, function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=basis+"pdf.worker.min.js"; });
  });
  pdfJsBereit.catch(function(){ pdfJsBereit=null; });
  return pdfJsBereit;
}

/* Textbausteine der Lidl-PDF mit Position -> Felder.
   Der Auftrag ist ein Formular: links die Bezeichnung, rechts daneben der Wert;
   lange Werte laufen in der nächsten Zeile an derselben Einrückung weiter. */
function werteLidlAuftrag(teile){
  var z=teile.filter(function(t){ return t.s && t.s.trim(); }).map(function(t){ return {s:t.s.trim(), x:t.x, y:t.y}; });
  var alles=z.map(function(t){ return t.s; }).join("\n");
  var LABELS={"Datum:":"auftragsdatum","Kontakt:":"lidlKontakt","Telefon:":"lidlTelefon","Mail-Adresse:":"lidlMail",
    "Ausführen bis":"ausfuehrenBis","Leistungsort":"leistungsort","Kostenstelle":"kostenstelle","Störung":"stoerungsnr",
    "Typ":"lidlTyp","Modell":"lidlModell","Hersteller":"hersteller","Seriennummer":"seriennummer","LIN":"lin",
    "Inventarstandort":"inventarstandort","Problemtyp":"problemtyp","Beschreibung":"beschreibung"};
  var istLabel=function(t){ return LABELS.hasOwnProperty(t.s) || t.s==="Leistungsempfänger" || t.s==="Rechnungsanschrift"; };
  var r={};
  z.forEach(function(l){
    if(!LABELS.hasOwnProperty(l.s)) return;
    var zeile=z.filter(function(t){ return Math.abs(t.y-l.y)<3 && t.x>l.x+5; }).sort(function(a,b){ return a.x-b.x; });
    var grenze=Infinity;
    zeile.forEach(function(t){ if(istLabel(t) && t.x<grenze) grenze=t.x; });
    var werte=zeile.filter(function(t){ return t.x<grenze && !istLabel(t); });
    if(!werte.length) return;
    var xv=werte[0].x, text=[werte.map(function(t){ return t.s; }).join(" ")], y=l.y;
    /* Fortsetzungszeilen */
    for(var i=0;i<4;i++){
      var weiter=z.filter(function(t){ return t.y<y-3 && t.y>y-15 && Math.abs(t.x-xv)<4; });
      if(!weiter.length) break;
      var yy=weiter[0].y;
      if(z.some(function(t){ return Math.abs(t.y-yy)<3 && istLabel(t) && t.x<xv; })) break;
      text.push(weiter.map(function(t){ return t.s; }).join(" ")); y=yy;
    }
    r[LABELS[l.s]]=text.join(l.s==="Beschreibung"?" ":"\n");
  });
  var m=/Auftrag-Nr\.:\s*(\d{5,})/.exec(alles) || /Auftrag-Nr\.:\s*\n\s*(\d{5,})/.exec(alles);
  if(m) r.auftragsnummer=m[1];
  m=/IA-Nummer:\s*(\d+)/.exec(alles); if(m) r.iaNummer=m[1];
  r.auftragsdatum=datumIso(r.auftragsdatum); r.ausfuehrenBis=datumIso(r.ausfuehrenBis);
  /* „Lidl Filiale\nValiergasse 2, 6020 Innsbruck“ -> Adresse ist die letzte Zeile */
  if(r.leistungsort){ var zl=r.leistungsort.split("\n"); r.adresse=zl[zl.length-1]; }
  return r;
}
function leseLidlPdf(datei){
  return ladePdfJs().then(function(){ return datei.arrayBuffer(); }).then(function(buf){
    return window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  }).then(function(pdf){
    var seiten=[]; for(var i=1;i<=Math.min(pdf.numPages,2);i++) seiten.push(i);
    return Promise.all(seiten.map(function(n){
      return pdf.getPage(n).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
        /* Seite 2 nach unten versetzen, damit sich Zeilen nicht überlagern */
        return tc.items.map(function(it){ return {s:it.str, x:Math.round(it.transform[4]), y:Math.round(it.transform[5])-(n-1)*2000}; });
      });
    }));
  }).then(function(listen){ return werteLidlAuftrag([].concat.apply([],listen)); });
}

/* Kostenstelle AT0234 -> Filiale 234; sonst über die Adresse */
function standortZuAuftrag(a){
  var m=/AT0*(\d+)/i.exec(a.kostenstelle||"");
  if(m){ var tr=ST.filter(function(s){ return String(s.filiale||"").replace(/^0+/,"")===m[1]; }); if(tr.length) return tr[0]; }
  if(a.adresse){
    var norm=function(t){ return String(t||"").toLowerCase().replace(/straße|strasse/g,"str").replace(/[^a-z0-9äöüß]/g,""); };
    var plz=(/\b(\d{4})\b/.exec(a.adresse)||[])[1], strasse=norm(a.adresse.split(",")[0]);
    var tr2=ST.filter(function(s){ return (!plz||s.plz===plz) && strasse && norm(s.adresse).indexOf(strasse)>=0; });
    if(tr2.length===1) return tr2[0];
  }
  return null;
}

/* QR-Code mit der Kamera lesen. Nimmt die eingebaute Erkennung des Browsers,
   wo es sie gibt (Android), sonst eine kleine Bibliothek (iPhone). */
function scanneQr(){
  return new Promise(function(fertig){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast("Dieser Browser erlaubt keinen Kamerazugriff."); fertig(null); return; }
    var ov=el('<div class="qrscan"><div class="qrbox"><video playsinline muted></video><div class="qrrahmen"></div></div>'+
      '<div class="qrtext">QR-Code des Lidl-Auftrags in den Rahmen halten</div>'+
      '<button class="btn" type="button">Abbrechen</button></div>');
    document.body.appendChild(ov);
    var video=ov.querySelector("video"), strom=null, aus=false, cv=document.createElement("canvas");
    var ende=function(wert){
      if(aus) return; aus=true;
      if(strom) strom.getTracks().forEach(function(t){ t.stop(); });
      ov.remove(); fertig(wert);
    };
    ov.querySelector("button").onclick=function(){ ende(null); };
    var erkenner=null;
    var vorbereitet = ("BarcodeDetector" in window)
      ? Promise.resolve().then(function(){ erkenner=new window.BarcodeDetector({formats:["qr_code"]}); })
          .catch(function(){ return window.jsQR?null:ladeSkript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"); })
      : (window.jsQR?Promise.resolve():ladeSkript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"));
    Promise.all([vorbereitet, navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false})])
      .then(function(r){
        strom=r[1]; if(aus){ ende(null); return; }
        video.srcObject=strom; return video.play();
      }).then(function(){
        var runde=function(){
          if(aus) return;
          var w=video.videoWidth, h=video.videoHeight;
          if(!w){ setTimeout(runde,150); return; }
          var weiter=function(wert){ if(wert) ende(wert); else setTimeout(runde,180); };
          if(erkenner){
            erkenner.detect(video).then(function(c){ weiter(c.length?c[0].rawValue:null); }, function(){ weiter(null); });
          } else {
            var sk=Math.min(1, 800/Math.max(w,h)); cv.width=Math.round(w*sk); cv.height=Math.round(h*sk);
            var g=cv.getContext("2d"); g.drawImage(video,0,0,cv.width,cv.height);
            var q=window.jsQR(g.getImageData(0,0,cv.width,cv.height).data, cv.width, cv.height);
            weiter(q?q.data:null);
          }
        };
        runde();
      }).catch(function(e){
        toast(e && e.name==="NotAllowedError" ? "Kamerazugriff wurde nicht erlaubt." : "Kamera nicht verfügbar: "+(e&&e.message||e));
        ende(null);
      });
  });
}

    };
    if(stoer){
      var so2={};
      STOER_AUFTRAG.concat(STOER_BEHEBUNG,STOER_TEXTE).forEach(function(f2){ so2[f2[0]]=v("s_"+f2[0]); });
      so2.material=[];
      Array.prototype.forEach.call(matHost.children,function(b){

      so2.folgeauftrag=form.querySelector("#s_folgeauftrag").checked;

      /* woher die Auftragsdaten stammen – hilft beim Nachvollziehen */
      so2.quelle = geladenerAuftrag ? "pdf" : qrGescannt ? "qr" : (bearb&&bearb.stoerung&&bearb.stoerung.quelle) || "hand";
      doc.stoerung=so2;
      doc.wartungsart="Störung";
    }
    lsSet("ukt_tech",doc.nameTechniker||doc.techniker);
    /* für die nächste Wartung merken */
    (function(){

      lsSet("ukt_techdaten",m);

    })();
    var id="p_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
    var btn=form.querySelector("#save"); btn.disabled=true; btn.textContent="Speichern …";

      btn.disabled=false; btn.textContent="Protokoll speichern"; formDirty=false; toast(msg);
      S.protoStandort=""; S.protoPos="";
      S.letztesProtokoll=id;     /* nach dem Neuzeichnen direkt aufklappen */
      berechneFaelligkeiten();   /* die gewarteten Positionen rücken sofort weiter */
      render();
    };
    var fehlschlag=function(text){
      /* Formular bleibt stehen – nichts von dem Eingegebenen geht verloren */
      btn.disabled=false; btn.textContent="Protokoll speichern";
      var box=form.querySelector("#f_fehlt");
      box.textContent=text; box.hidden=false;
      box.scrollIntoView({behavior:"smooth",block:"center"});
    };

    /* ---- Korrektur eines gespeicherten Protokolls ---- */
    if(bearb){
      var grund=v("f_grund");
      doc.erstellt=bearb.erstellt||doc.erstellt;
      doc.version=(bearb.version||1)+1;
      doc.geaendert=new Date().toISOString();
      doc.korrekturGrund=grund;
      if(!hasSig) doc.unterschrift=bearb.unterschrift||"";
      doc.fotos=(bearb.fotos||[]).concat(doc.fotos);   /* Fotos kommen nur dazu, keines verschwindet */
      var felder=vergleiche(bearb, doc);
      if(!felder.length){ fehlschlag("Es wurde nichts geändert – die Korrektur wird nicht gespeichert."); return; }

      var kid=bearb._id, aufGeraet=bearb._quelle==="geraet";
      btn.disabled=true; btn.textContent="Korrektur wird gespeichert …";
      var geraetFotos=aufGeraet ? (bearb._fotoDaten||[]).concat(fotos) : null;
      (aufGeraet ? Promise.resolve(true) : speichereFotos(kid, fotos)).then(function(fotosOk){
        if(!fotosOk){ fehlschlag("Die neuen Fotos ließen sich nicht übertragen – die Korrektur ist noch nicht gespeichert. Bitte bei Verbindung erneut versuchen."); return; }
        aktualisiereProtokoll(kid, doc, bearb._quelle, geraetFotos).then(function(ok){
          if(!ok){ fehlschlag("Die Korrektur konnte nicht gespeichert werden"+(Store.fehler?" ("+Store.fehler+")":"")+". Ihre Eingaben sind noch da."); return; }

          protokolliere({art:"korrigiert", protokollId:kid, standortId:doc.standortId,
                         standortName:doc.standortName, grund:grund, felder:felder});
          (aufGeraet ? lokaleNeuLaden() : Promise.resolve()).then(function(){
            formDirty=false; S.bearbeiten=null; S.letztesProtokoll=kid;
            toast("Korrektur gespeichert – "+felder.length+" Feld"+(felder.length===1?"":"er")+" geändert.");
            berechneFaelligkeiten(); render();
          });
        });
      });
      return;
    }

    /* 1. immer zuerst sicher aufs Gerät – das klappt auch im Funkloch */
    var eintrag={id:id, doc:doc, fotos:fotos, erstellt:doc.erstellt};
    idbSchreiben(eintrag).then(function(){
      anlagenUebernehmen(doc);   /* vor Ort ergänzte Anlagendaten */
      lokaleProtokolle.unshift(eintrag);
      protokolliere({art:"angelegt", protokollId:id, standortId:doc.standortId, standortName:doc.standortName,
                     felder:[{feld:"positionIds", name:"Gewartete Anlagen", alt:"–", neu:feldText("positionIds",doc.positionIds)}]});

      /* 2. gibt es eine zentrale Ablage, gleich dorthin übertragen */
      if(Store.modus!=="claude" && Store.modus!=="supabase"){
        fertig("Protokoll gespeichert"+(fotos.length?" – mit "+fotos.length+" Foto(s)":"")+".");
        return;
      }
      if(fotos.length) btn.textContent="Fotos werden übertragen …";
      speichereFotos(id,fotos).then(function(fotosOk){
        if(!fotosOk){ fertig("Auf dem Gerät gespeichert – wird übertragen, sobald Verbindung besteht."); return; }
        btn.textContent="Übertragen …";
        speichereProtokoll(id,doc).then(function(ok){
          if(!ok){ fertig("Auf dem Gerät gespeichert – wird übertragen, sobald Verbindung besteht."); return; }
          idbLoeschen(id).then(function(){
            lokaleProtokolle=lokaleProtokolle.filter(function(x){ return x.id!==id; });

          },function(){ fertig("Protokoll gespeichert und übertragen."); });
        });

      fehlschlag("Das Protokoll konnte auf diesem Gerät nicht gespeichert werden: "+
        (err&&err.message?err.message:"unbekannter Fehler")+
        ". Ihre Eingaben sind noch da. Häufigste Ursache: privates Browserfenster oder voller Speicher – "+

  var head = bearb

        '<div><h2>Protokoll korrigieren</h2><div class="sub">Protokoll vom <strong>'+dfmt(bearb.datum)+"</strong>"+
        (protoName(bearb)?" – "+esc(protoName(bearb)):"")+". Ändern Sie, was falsch ist, und geben Sie unten den Grund an. "+

    : el('<div class="card"><div class="pad stack">'+

          '<button type="button" data-art="stoerung" aria-pressed="'+stoer+'">Störung</button></div>'+
        (stoer
          ? '<div><h2>Störungsprotokoll Klimaanlage</h2><div class="sub">Einsatz auf einen Lidl-Störungsauftrag. '+
            "Erscheint in der Anlagenhistorie, verschiebt aber keinen Wartungstermin.</div></div>"
          : '<div><h2>Wartungsprotokoll Klimaanlage</h2><div class="sub">Digitale Fassung des Einseiters. '+
            (s?"Vorbelegt für <strong>"+esc(stName(s))+"</strong>.":"Standort unten auswählen oder aus Liste bzw. Karte heraus öffnen.")+"</div></div>")+

  head.querySelectorAll("[data-art]").forEach(function(b){

  var alle=alleProtokolle();

  if(lokaleProtokolle.length) teile.push(lokaleProtokolle.length+" auf diesem Gerät");

    ? teile.join(" · ")+". Antippen öffnet das Protokoll – dort auch Drucken und PDF."

  var anzGeloescht=alleProtokolle(true).length-alle.length;

  var pl=gesp.querySelector("#plist");
  if(alle.length){
    var tbl=el('<table class="dt"><thead><tr><th>Datum</th><th>Standort</th><th>Techniker/in</th>'+
      "<th>Art</th><th>Mängel</th><th>Fotos</th><th>Ablage</th></tr></thead><tbody></tbody></table>");

      var tr=el("<tr style='cursor:pointer"+(x.geloescht?";opacity:.55;text-decoration:line-through":"")+"'><td class='mono'>"+dfmt(x.datum)+"</td><td>"+esc(protoName(x)||"–")+
        "</td><td>"+esc(kanonName(x.nameTechniker||x.techniker)||"–")+"</td><td>"+

        "<td class='mono'>"+((x.fotos||[]).length||"0")+"</td>"+
        "<td>"+(x._quelle==="geraet"?'<span class="tag">Gerät</span>':'<span class="tag f30">gemeinsam</span>')+"</td></tr>");
      tr.onclick=function(){

        ziel.innerHTML=""; ziel.appendChild(protokollDetail(x));
        ziel.scrollIntoView({behavior:"smooth",block:"start"});
      };
      tb.appendChild(tr);
    });
    pl.appendChild(tbl);
    gesp.querySelector(".stack").appendChild(el('<div id="pdetail"></div>'));
    if(S.letztesProtokoll){
      var neu=alle.filter(function(x){ return x._id===S.letztesProtokoll; })[0];
      S.letztesProtokoll=null;
      if(neu){
        var ziel=gesp.querySelector("#pdetail");
        ziel.appendChild(protokollDetail(neu));
        setTimeout(function(){ ziel.scrollIntoView({behavior:"smooth",block:"start"}); },60);
      }
    }
  } else {
    pl.appendChild(el('<div class="muted" style="font-size:13px">Noch keine Protokolle erfasst.</div>'));
  }
  f.appendChild(gesp);
  return f;
}

/* ---------- Protokoll als Blatt: Drucken oder als PDF sichern ---------- */
function kreuz(an){ return an ? "&#9746;" : "&#9744;"; }

/* Das Blatt – dieselbe Darstellung für Drucken und für das PDF-Archiv */
function blattInhalt(p){
  var gew=function(liste,wert){ return (liste||[]).indexOf(wert)>=0; };
  var zeile=function(k,v){ return "<tr><td class='k'>"+k+"</td><td>"+(v?esc(v):"&nbsp;")+"</td></tr>"; };

  var anlagenHtml=(p.anlagen&&p.anlagen.length?p.anlagen:[{}]).map(function(a,i){
    /* neue Erfassung: je Anlage aus dem Anlagenstamm, mit Kältekreis, Rückkühler, Regelung */
    if(a.positionId){
      var z=function(k,v){ return v?zeile(k,v):""; };
      var jn=function(w){ return w==="ja"?"ja":w==="nein"?"nein":""; };
      return "<table style='margin-bottom:8px'>"+
        "<tr><th colspan='2'>"+esc(a.name||("Anlage "+(i+1)))+(a.neu?" (vor Ort neu erfasst)":"")+"</th></tr>"+
        z("Gewartet als",a.termin)+
        z("Bauart",a.bauart)+

/* Fotos ins Blatt setzen. Für das PDF als eingebettete Daten, sonst würde
   das Zeichnen an fremden Bildadressen scheitern. */
function fotosEinsetzen(host, p, eingebettet){
  if(!p.fotos || !p.fotos.length){ host.innerHTML=""; return Promise.resolve(); }
  host.innerHTML="<h2>Fotos</h2><div>werden geladen …</div>";
  return ladeFotos(p).then(function(bilder){
    var alsDaten=function(url){
      if(!eingebettet || !url || url.indexOf("data:")===0) return Promise.resolve(url);
      return fetch(url).then(function(r){ return r.blob(); }).then(function(b){
        return new Promise(function(ok){ var fr=new FileReader(); fr.onload=function(){ ok(fr.result); }; fr.onerror=function(){ ok(null); }; fr.readAsDataURL(b); });
      }).catch(function(){ return null; });
    };
    return Promise.all(bilder.map(function(b){ return alsDaten(b.url).then(function(u){ return Object.assign({},b,{url:u}); }); }))
      .then(function(fertig){
        host.innerHTML="<h2>Fotos</h2><div class='fotos'>"+fertig.map(function(b){
          return "<figure>"+(b.url?'<img alt="" src="'+b.url+'">':"<div>Bild nicht abrufbar</div>")+
            "<figcaption>"+esc(b.hinweis||b.name||"")+"</figcaption></figure>";
        }).join("")+"</div>";
      });
  });
}

/* ---------------- PDF für das Archiv ----------------
   Das Blatt wird unsichtbar aufgebaut, als Bild gezeichnet und auf
   A4-Seiten verteilt – Seitenumbrüche nur zwischen Zeilen und Abschnitten. */
var PDF_BIBLIOTHEKEN=[
  "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
];
var pdfBereit=null, pdfInArbeit={};
function ladePdfBibliotheken(){
  if(pdfBereit) return pdfBereit;
  pdfBereit=PDF_BIBLIOTHEKEN.reduce(function(kette,src){
    return kette.then(function(){ return new Promise(function(ok,nok){
      var s=document.createElement("script"); s.src=src; s.onload=ok;
      s.onerror=function(){ pdfBereit=null; nok(new Error("PDF-Werkzeug nicht ladbar")); };
      document.head.appendChild(s);
    }); });
  }, Promise.resolve());
  return pdfBereit;
}
function bilderGeladen(host){
  var imgs=Array.prototype.slice.call(host.querySelectorAll("img"));
  return Promise.all(imgs.map(function(i){
    if(i.complete && i.naturalWidth) return Promise.resolve();
    return new Promise(function(ok){ i.onload=ok; i.onerror=ok; setTimeout(ok,8000); });
  }));
}
function pdfErzeugen(p){
  return ladePdfBibliotheken().then(function(){
    var BREITE=794;                                  /* A4 bei 96 dpi */
    var huelle=document.createElement("div");
    huelle.style.cssText="position:fixed;left:-12000px;top:0;width:"+BREITE+"px;background:#fff;z-index:-1";
    huelle.innerHTML='<div class="blatt" style="background:#fff;color:#111;font:12.5px/1.45 \'IBM Plex Sans\',\'Segoe UI\',Arial,sans-serif;padding:4px 6px;box-sizing:border-box;width:'+BREITE+'px">'+
      blattInhalt(p)+"</div>";
    document.body.appendChild(huelle);
    var blatt=huelle.querySelector(".blatt");
    return fotosEinsetzen(blatt.querySelector('[data-rolle="fotos"]'), p, true)
      .then(function(){ return bilderGeladen(blatt); })
      .then(function(){
        /* mögliche Umbruchstellen: Unterkanten von Zeilen, Überschriften, Fotos */
        var oben=blatt.getBoundingClientRect().top, stellen=[];
        blatt.querySelectorAll("tr, h2, h1, .kopf, .kaestchen > div, figure, .fuss, table").forEach(function(e){
          stellen.push(Math.round(e.getBoundingClientRect().bottom-oben));
        });
        stellen.sort(function(a,b){ return a-b; });
        var hoehe=blatt.scrollHeight;
        /* Obergrenze für die Zeichenfläche – Safari am iPhone verweigert mehr als ~16 Mio. Pixel */
        var skala=Math.min(2, Math.sqrt(14e6/(BREITE*hoehe)));
        return window.html2canvas(blatt,{scale:skala, backgroundColor:"#ffffff", useCORS:true, logging:false})
          .then(function(bild){ return {bild:bild, stellen:stellen, hoehe:hoehe, skala:skala}; });
      })
      .then(function(r){
        document.body.removeChild(huelle);
        var jsPDF=window.jspdf.jsPDF;
        var doc=new jsPDF({unit:"mm", format:"a4", compress:true});
        var RAND=10, nutzB=210-2*RAND, nutzH=297-2*RAND-6;          /* 6 mm für die Seitenzahl */
        var pxProMm=BREITE/nutzB, seitePx=Math.floor(nutzH*pxProMm);
        var seiten=[], start=0;
        while(start < r.hoehe-2){
          var grenze=start+seitePx, ende=grenze;
          if(grenze < r.hoehe){
            var passend=r.stellen.filter(function(y){ return y>start+seitePx*0.5 && y<=grenze; });
            if(passend.length) ende=passend[passend.length-1];
          } else ende=r.hoehe;
          seiten.push([start,ende]); start=ende;
        }
        seiten.forEach(function(s,i){
          if(i) doc.addPage();
          var hPx=s[1]-s[0];
          var teil=document.createElement("canvas");
          teil.width=r.bild.width; teil.height=Math.max(1,Math.round(hPx*r.skala));
          var g=teil.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,teil.width,teil.height);
          g.drawImage(r.bild, 0, Math.round(s[0]*r.skala), r.bild.width, teil.height, 0, 0, teil.width, teil.height);
          doc.addImage(teil.toDataURL("image/jpeg",0.86),"JPEG",RAND,RAND,nutzB,hPx/pxProMm);
          doc.setFontSize(8); doc.setTextColor(120);
          doc.text((istStoerung(p)?"Störungsprotokoll ":"Wartungsprotokoll ")+protoName(p)+" vom "+dfmt(p.datum)+"  -  Seite "+(i+1)+" von "+seiten.length,
                   105, 297-RAND+1, {align:"center"});
        });
        doc.setProperties({title:(istStoerung(p)?"Störungsprotokoll ":"Wartungsprotokoll ")+protoName(p)+" "+dfmt(p.datum),
          subject:"Lidl Klimaanlagen - Protokoll "+(p._id||""), author:"Kammerlander Umwelt- und Klimatechnik GmbH",
          creator:"Wartungsleitstand"});
        return doc.output("blob");
      }, function(e){ if(huelle.parentNode) document.body.removeChild(huelle); throw e; });
  });
}

/* PDF in Supabase ablegen, von dort holt es die Synology ab.
   Der Pfad hängt nur an der Kennung – den lesbaren Dateinamen vergibt die Synology. */
function berichtAblegen(p){
  if(Store.modus!=="supabase" || !Store.sb || !p || !p._id) return Promise.resolve(false);
  if(pdfInArbeit[p._id]) return pdfInArbeit[p._id];
  /* Archiv noch nicht eingerichtet (SQL-Abschnitt fehlt): gar nicht erst ein PDF bauen */
  return archivEingerichtet().then(function(an){ return an ? berichtErzeugenUndAblegen(p) : false; });
}
var archivStatus=null;
function archivEingerichtet(){
  if(!archivStatus) archivStatus=Store.sb.from("berichte").select("client_id").limit(1)
    .then(function(r){ return !r.error; }, function(){ archivStatus=null; return false; });
  return archivStatus;
}
function berichtErzeugenUndAblegen(p){
  var jahr=String(p.datum||"").slice(0,4)||"ohne-datum", pfad=jahr+"/"+p._id+".pdf";
  var offen=lsGet("ukt_pdf_offen",[]);
  var merken=function(){ if(offen.indexOf(p._id)<0){ offen.push(p._id); lsSet("ukt_pdf_offen",offen); } return false; };
  var lauf=pdfErzeugen(p).then(function(blob){
    return Store.sb.storage.from("berichte").upload(pfad, blob, {contentType:"application/pdf", upsert:true})
      .then(function(r){
        if(r.error){ Store.fehler=r.error.message; return merken(); }
        return Store.sb.from("berichte").upsert({client_id:p._id, version:p.version||1, pfad:pfad,
          erstellt:new Date().toISOString()},{onConflict:"client_id"}).then(function(r2){
            if(r2.error){ Store.fehler=r2.error.message; return merken(); }
            lsSet("ukt_pdf_offen", lsGet("ukt_pdf_offen",[]).filter(function(x){ return x!==p._id; }));
            return true;
          });
      });
  }).catch(function(e){ Store.fehler=e&&e.message; return merken(); })
    .then(function(x){ delete pdfInArbeit[p._id]; return x; });
  pdfInArbeit[p._id]=lauf;
  return lauf;
}
/* was beim letzten Mal nicht klappte (Funkloch), erneut versuchen */
function offeneBerichteNachholen(){
  if(Store.modus!=="supabase") return;
  var offen=lsGet("ukt_pdf_offen",[]);
  if(!offen.length) return;
  var i=0;
  var weiter=function(){
    if(i>=offen.length) return;
    var id=offen[i++];
    var p=(protokolle||[]).filter(function(x){ return x._id===id && !x.geloescht; })[0];
    if(!p){ lsSet("ukt_pdf_offen", lsGet("ukt_pdf_offen",[]).filter(function(x){ return x!==id; })); return weiter(); }
    berichtAblegen(p).then(weiter);
  };
  weiter();
}

      ja.disabled=true; ja.textContent= wiederher?"Wird wiederhergestellt …":"Wird gelöscht …";

      toast("Protokoll vom Gerät gelöscht."); berechneFaelligkeiten(); render();

  var fh=d.querySelector("#pfotos");

/* ---------- Wartungshistorie einer Filiale ----------
   Führt die Einträge aus der Excel-Liste und die Protokolle der App
   zusammen: wer hat wann welche Anlage gewartet. */
function historieEintraege(s){
  var zeilen=[];
  s.pos.forEach(function(p){
    (p.historie||[]).forEach(function(d){
      zeilen.push({datum:d, anlage:anlagenName(p), art:p.intervall.art,
        techniker:kanonName((p.techniker&&p.techniker[d.slice(0,4)])||""), quelle:"Liste"});
    });
  });
  alleProtokolle().forEach(function(pr){
    if(pr.standortId!==s.id || !pr.datum) return;
    var ids=(pr.positionIds&&pr.positionIds.length)?pr.positionIds:(pr.positionId?[pr.positionId]:[]);
    var stoe=istStoerung(pr);
    zeilen.push({datum:pr.datum, anlage:ids.length?feldText("positionIds",ids):"(Markt allgemein)",
      art:stoe ? ("Störung"+(pr.stoerung&&pr.stoerung.problemtyp?": "+pr.stoerung.problemtyp:"")) : (pr.wartungsart||""),
      stoerung:stoe, techniker:kanonName(pr.nameTechniker||pr.techniker||""), quelle:"App", protokoll:pr});
  });
  return zeilen.sort(function(a,b){ return b.datum.localeCompare(a.datum); });
}
function historieAnsicht(s){
  var box=document.createElement("div");
  box.className="stack";
  var z=historieEintraege(s);
  if(!z.length){ box.appendChild(el('<div class="muted">Für diesen Standort ist keine Wartung erfasst.</div>')); return box; }
  var anzStoer=z.filter(function(e){ return e.stoerung; }).length, anzWart=z.length-anzStoer;

  /* wer war in den letzten Jahren hier – auf einen Blick */
  var wer={}; z.forEach(function(e){ if(e.techniker) wer[e.techniker]=(wer[e.techniker]||0)+1; });
  var namen=Object.keys(wer).sort(function(a,b){ return wer[b]-wer[a]; });
  var ohneName=z.filter(function(e){ return !e.techniker; }).length;
  box.appendChild(el('<dl class="dl">'+
    "<dt>Letzter Besuch</dt><dd class='mono'>"+(s.letzterBesuch?dfmt(s.letzterBesuch):"—")+"</dd>"+
    "<dt>Wartungen erfasst</dt><dd>"+anzWart+" seit "+z[z.length-1].datum.slice(0,4)+"</dd>"+
    (anzStoer?"<dt>Störungseinsätze</dt><dd>"+anzStoer+"</dd>":"")+
    "<dt>Techniker</dt><dd>"+(namen.length?namen.map(function(n){ return esc(n)+" ("+wer[n]+"×)"; }).join(", "):"in der Liste nicht eingetragen")+
      (ohneName&&namen.length?' <span class="muted">· '+ohneName+" ohne Namen</span>":"")+"</dd>"+
  "</dl>"));

  var jahre={}; z.forEach(function(e){ var j=e.datum.slice(0,4); (jahre[j]=jahre[j]||[]).push(e); });
  Object.keys(jahre).sort().reverse().forEach(function(j){
    var nS=jahre[j].filter(function(e){ return e.stoerung; }).length, nW=jahre[j].length-nS;
    var t=el('<div><div class="chart-t" style="margin-bottom:4px">'+j+' <span class="muted mono" style="font-size:12px;font-weight:400">· '+
      [nW?nW+" Wartung"+(nW===1?"":"en"):"", nS?nS+" Störung"+(nS===1?"":"en"):""].filter(Boolean).join(" · ")+'</span></div>'+
      '<div class="scrollx"><table class="dt"><thead><tr><th>Datum</th><th>Anlage</th><th>Art</th><th>Techniker/in</th><th>Quelle</th></tr></thead>'+
      "<tbody></tbody></table></div></div>");
    var tb=t.querySelector("tbody");
    jahre[j].forEach(function(e){
      var tr=el("<tr><td class='mono'>"+dfmt(e.datum)+"</td><td>"+esc(e.anlage)+"</td><td>"+
        (e.stoerung?'<span class="tag st">Störung</span> '+esc(e.art.replace(/^Störung:?\s*/,"")):esc(e.art))+
        "</td><td>"+(e.techniker?esc(e.techniker):'<span class="muted">–</span>')+"</td><td>"+
        (e.quelle==="App"?'<span class="tag f30">Protokoll</span>':'<span class="tag">Liste</span>')+"</td></tr>");
      if(e.protokoll){
        tr.style.cursor="pointer";
        tr.title="Protokoll öffnen";
        tr.onclick=function(){ S.letztesProtokoll=e.protokoll._id; S.view="protokoll"; render(); };
      }
      tb.appendChild(tr);
    });
    box.appendChild(t);
  });
  return box;
}

var ART_TEXT={angelegt:"Protokoll angelegt", korrigiert:"Protokoll korrigiert", geloescht:"Protokoll gelöscht",
              wiederhergestellt:"Protokoll wiederhergestellt", stammdaten:"Stammdaten geändert"};

                wiederhergestellt:"p-erledigt", stammdaten:"p-geplant"};
function zeitFmt(iso){
  if(!iso) return "–";
  var d=new Date(iso);
  return dfmt(isoLokal(d))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

/* ---------- Übersicht zum Mitnehmen ----------
   Was zuletzt gemacht wurde und was als Nächstes ansteht – als CSV für
   Excel oder als Ausdruck bzw. PDF. */
function berichtDaten(tageZurueck, tageVoraus, region){
  var heute=isoLokal(new Date());
  var von=isoLokal(new Date(Date.now()-tageZurueck*86400000));
  var bis=isoLokal(new Date(Date.now()+tageVoraus*86400000));
  var passt=function(s){ return !region || s.region===region; };
  var rueck=[];
  alleProtokolle().forEach(function(p){
    if(!p.datum || p.datum<von || p.datum>heute) return;
    var s=byId[p.standortId];
    if(s && !passt(s)) return;
    if(!s && region) return;
    var ids=(p.positionIds&&p.positionIds.length)?p.positionIds:(p.positionId?[p.positionId]:[]);
    rueck.push({datum:p.datum, markt:protoName(p), filiale:s?s.filiale:p.filiale, region:p.region||(s?s.region:""),
      anlage:ids.length?feldText("positionIds",ids):"(Markt allgemein)",
      art:istStoerung(p)?("Störung"+(p.stoerung&&p.stoerung.problemtyp?": "+p.stoerung.problemtyp:"")):(p.wartungsart||"Wartung"),
      techniker:kanonName(p.nameTechniker||p.techniker||""), maengel:(p.maengel||[]).length, quelle:"Protokoll"});
  });
  /* Termine aus der Excel-Liste, zu denen es kein App-Protokoll gibt */
  POS.forEach(function(p){
    var s=byId[p.standortId]; if(!s || !passt(s)) return;
    (p.historie||[]).forEach(function(d){
      if(d<von || d>heute) return;
      if(rueck.some(function(r){ return r.datum===d && r.markt===stName(s); })) return;
      rueck.push({datum:d, markt:stName(s), filiale:s.filiale, region:s.region, anlage:anlagenName(p),
        art:p.intervall.art, techniker:kanonName((p.techniker&&p.techniker[d.slice(0,4)])||""), maengel:"", quelle:"Liste"});
    });
  });
  rueck.sort(function(a,b){ return b.datum.localeCompare(a.datum); });

  var vor=[];
  POS.forEach(function(p){
    var s=byId[p.standortId]; if(!s || !passt(s) || !p.naechste || p.naechste>bis) return;
    vor.push({datum:p.naechste, status:STATUS_LABEL[p.status]||"", markt:stName(s), filiale:s.filiale, region:s.region,
      anlage:anlagenName(p), termin:p.intervall.art, letzte:p.letzte?dfmt(p.letzte):"—", adresse:s.adresse});
  });
  ST.forEach(function(s){
    if(!passt(s) || !s.naechsterBesuch || s.naechsterBesuch>bis) return;
    if(s.pos.some(function(p){ return p.naechste && p.naechste<=s.naechsterBesuch; })) return;
    vor.push({datum:s.naechsterBesuch, status:STATUS_LABEL[s.marktStatus]||"", markt:stName(s), filiale:s.filiale,
      region:s.region, anlage:"(ganzer Markt)", termin:"Halbjahresbesuch", letzte:s.letzterBesuch?dfmt(s.letzterBesuch):"—", adresse:s.adresse});
  });
  vor.sort(function(a,b){ return a.datum.localeCompare(b.datum); });
  return {von:von, bis:bis, heute:heute, region:region, rueck:rueck, vor:vor};
}

  region:"FM-Region", lat:"Breitengrad", lon:"Längengrad", aktiv:"betreut", notiz:"Notiz"};
var LABEL_POS={anlagentyp:"Anlagentyp", intervallCode:"Kürzel", inbetriebnahme:"Inbetriebnahme",
  monat:"Soll-Monat", kaeltemittelKg:"Kältemittel (kg)", kaeltemittelArt:"Kältemittelart",
  rueckkuehler:"Rückkühler", aktiv:"in Betrieb", notiz:"Notiz",
  pausiert:"zur Zeit nicht gewartet", pausiertGrund:"Grund (nicht gewartet)", vorOrtNeu:"vor Ort neu erfasst", anlageZu:"gehört zu Anlage"};
ANLAGE_FELDER.forEach(function(f){ if(!LABEL_POS[f.k]) LABEL_POS[f.k]=f.l; });
function stammWert(feld, w){
  if(w===null||w===undefined||w==="") return "–";
  if(feld==="aktiv"||feld==="pausiert"||feld==="vorOrtNeu") return w?"ja":"nein";
  if(feld==="monat") return MONATE_L[+w]||"–";
  if(feld==="inbetriebnahme") return dfmt(w);
  return String(w);
}
function objDiff(vorher, nachher, felder){
  var d={}; felder.forEach(function(k){ if(!gleich(vorher[k],nachher[k])) d[k]=nachher[k]; }); return d;
}

/* Was an einem Markt nicht stimmt – getrennt nach Fehlern und fehlenden Angaben */
function auffaelligkeiten(s){
  var f=[], l=[];
  if(!s.lat) f.push("keine Kartenposition");
  if(!s.region) f.push("keine FM-Region");
  if(s.filiale){
    var doppelt=ALLE_ST.filter(function(o){ return o!==s && o.aktiv && String(o.filiale)===String(s.filiale); });
    if(doppelt.length) f.push("Filialnummer "+s.filiale+" ist mehrfach vergeben");
  }
  if(!s.pos.length) f.push("keine Anlage in Betrieb");
  /* zwei Zeilen mit demselben Termin: in der alten Liste meist die Halbjahreswartung mit falschem Kürzel */
  s.pos.forEach(function(p,i){
    s.pos.slice(i+1).forEach(function(q){
      if(anlageLeader(p)!==p || anlageLeader(q)!==q) return;
      if(slotMonat(p) && slotMonat(p)===slotMonat(q) && intervallArt(p.intervallCode).kurz===intervallArt(q.intervallCode).kurz)
        f.push(anlagenName(p)+": zweimal "+intervallArt(p.intervallCode).kurz+" im "+MONATE_L[slotMonat(p)]+
          " – ist eine Zeile eigentlich die Halbjahreswartung? Dann dort Kürzel HJW/HJI setzen, sonst über „Gehört zu Anlage“ zusammenführen.");
    });
  });
  if(s.pos.some(function(p){ return p.ueber30kg; }) && !s.pos.some(function(p){ return p.intervall&&p.intervall.kurz==="HJW"; }))
    f.push("über 30 kg Kältemittel, aber keine Halbjahreswartung (HJW)");
  s.pos.forEach(function(p){
    var n=anlagenName(p);
    if(p.intervall && p.intervall.unklar) f.push(n+": Kürzel „"+(p.intervallCode||"leer")+"“ unklar");
    if(p.anker && p.anker.quelle==="Inbetriebnahme" && p.monat){
      var d=Math.abs(p.anker.monat-p.monat); d=Math.min(d,12-d);
      if(d>1) f.push(n+": Soll-Monat "+MONATE_L[p.monat]+" passt nicht zur Inbetriebnahme (ergibt "+MONATE_L[p.anker.monat]+")");
    }
    if(p.vorOrtNeu) f.push(n+": vor Ort neu erfasst – Kürzel und Termin festlegen");
    if(!p.inbetriebnahme) l.push(n+": Inbetriebnahme fehlt");
    if(!p.kaeltemittelText) l.push(n+": Kältemittelmenge fehlt");
    var al=anlageLeader(p)===p ? anlageLuecken(anlageDaten(p)).filter(function(f2){ return f2.k!=="kaeltemittelKg"; }) : [];
    if(al.length) l.push(n+": "+al.length+" Anlagendaten offen ("+al.map(function(f2){ return f2.l; }).join(", ")+")");
  });
  s.pausiertePos.forEach(function(p){ if(anlageLeader(p)===p) l.push(anlagenName(p)+": zur Zeit nicht gewartet"+(p.pausiertGrund?" – "+p.pausiertGrund:"")); });
  if(!s.filiale) l.push("keine Filialnummer");
  if(!s.plz) l.push("keine PLZ in der Adresse");
  if(s.pos.length===1) l.push("nur ein Termin im Jahr eingetragen – der Halbjahresbesuch fehlt in der Liste");
  return {fehler:f, luecken:l};
}
function naechsterTerminMarkt(s){
  var t=s.pos.map(function(p){ return p.naechste; }).filter(Boolean);
  if(s.naechsterBesuch) t.push(s.naechsterBesuch);
  t.sort(); return t[0]||null;
}

/* Archiv auf der Synology: zeigt, welche Protokolle noch kein aktuelles PDF
   haben, und erzeugt diese auf Knopfdruck (z. B. alle Protokolle von vor
   dieser Funktion oder solche, deren PDF im Funkloch hängen blieb). */
function archivKarte(){
  var c=el('<div class="card"><div class="pad stack">'+
    '<div class="rowflex" style="justify-content:space-between"><div><h2>Archiv (Synology)</h2>'+
      '<div class="sub" id="ar_stand">Jedes Protokoll wird als PDF abgelegt und von der Synology abgeholt.</div></div>'+
      '<div class="rowflex"><button class="btn ghost sm" type="button" id="ar_pruef">Prüfen</button>'+
      '<button class="btn sm" type="button" id="ar_los" hidden>Fehlende PDFs erzeugen</button></div></div>'+
  "</div></div>");
  var stand=c.querySelector("#ar_stand"), los=c.querySelector("#ar_los"), fehlend=[];
  c.querySelector("#ar_pruef").onclick=function(){
    stand.textContent="wird geprüft …";
    Promise.all([
      Store.sb.from("protokolle").select("*").is("geloescht",null).order("erstellt",{ascending:false}).limit(1000),
      Store.sb.from("berichte").select("client_id,version").limit(5000)
    ]).then(function(r){
      if(r[0].error||r[1].error){ stand.textContent="Prüfen fehlgeschlagen: "+((r[0].error||r[1].error).message)+
        " – ist das SQL-Skript mit dem Abschnitt „Archiv“ ausgeführt?"; return; }
      var da={}; (r[1].data||[]).forEach(function(b){ da[b.client_id]=b.version||1; });
      var alle=(r[0].data||[]).map(ausZeile);
      fehlend=alle.filter(function(p){ return !da[p._id] || da[p._id]<(p.version||1); });
      stand.textContent=(alle.length-fehlend.length)+" von "+alle.length+" Protokollen haben ein aktuelles PDF."+
        (fehlend.length?" "+fehlend.length+(fehlend.length===1?" fehlt.":" fehlen."):"");
      los.hidden=!fehlend.length;
    });
  };
  los.onclick=function(){
    los.disabled=true;
    var i=0, ok=0;
    var weiter=function(){
      if(i>=fehlend.length){
        stand.textContent=ok+" von "+fehlend.length+" PDFs erzeugt."+(ok<fehlend.length?" Fehler: "+(Store.fehler||"unbekannt"):"");
        los.disabled=false; los.hidden=ok===fehlend.length; return;
      }
      var p=fehlend[i++];
      stand.textContent="PDF "+i+" von "+fehlend.length+" – "+protoName(p)+" vom "+dfmt(p.datum)+" …";
      berichtAblegen(p).then(function(x){ if(x) ok++; weiter(); });
    };
    weiter();
  };
  return c;
}

  c.querySelector("#a_speichern").onclick=function(){

      var betrieb=lese("betrieb");

                pausiert:betrieb==="pausiert", pausiertGrund:betrieb==="pausiert"?lese("pausiertGrund"):""};
      var p0=posById[pid];

      });
      if(neuP.pausiertGrund===undefined) neuP.pausiertGrund=p0?p0.pausiertGrund:"";
      /* Zuordnung zu einer Anlage: nur speichern, wenn sie sich ändert */

      if(p0 && !neuP.pausiert && !p0.pausiert) neuP.pausiert=p0.pausiert;

      if(istNeu){

        if(!neuP.intervallCode){ fehlt=true; return; }
        neuP.standortId=s.id;
