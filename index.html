function verwaltungEditor(s){
  var A=S.adm;
  var ausgewaehlt=ALLE_POS.filter(function(p){ return p.standortId===s.id; });
  /* nach Anlagen geordnet: erste Zeile einer Anlage, dann ihre weiteren Termine */
  var urReihe=ausgewaehlt.slice();
  var rangA=function(p){ var l=anlageLeader(p); var i=urReihe.indexOf(l); if(i<0) i=urReihe.indexOf(p); return i*10+(l===p?0:1)+urReihe.indexOf(p)/1000; };
  ausgewaehlt.sort(function(x,y){ return rangA(x)-rangA(y); });
  var au=s._entwurf?{fehler:[],luecken:[]}:auffaelligkeiten(s);
  var exS=EXCEL["standort:"+s.id]||{};
  var hinweisExcel=function(feld, aktuell){
    if(s._neu || !(feld in exS) || gleich(exS[feld],aktuell)) return "";
    return '<span class="muted" style="font-size:11px;text-transform:none;letter-spacing:0"> · Excel: '+esc(stammWert(feld,exS[feld]))+"</span>";
  };
  var feld=function(id,label,wert,typ,extra){
    return '<label class="fl"><span>'+label+(extra||"")+'</span><input type="'+(typ||"text")+'" id="'+id+'" value="'+esc(wert==null?"":wert)+'"></label>';
  };
  var regionen=REGIONEN.map(function(r){ return '<option'+(s.region===r?" selected":"")+">"+r+"</option>"; }).join("");

  var c=el('<div class="card" id="adm_editor" style="border-color:var(--accent)"><div class="pad stack">'+
    '<div class="rowflex" style="justify-content:space-between">'+
      '<h2 style="text-transform:none;font-size:17px;color:var(--ink)">'+(s._entwurf?"Neuer Markt":esc(stName(s))+" bearbeiten")+"</h2>"+
      '<button class="btn ghost sm" type="button" id="adm_schliessen">Schließen</button></div>'+
    ((au.fehler.length||au.luecken.length)?'<div class="stack">'+
      (au.fehler.length?'<div class="note warnbox"><strong>Fehler</strong><br>'+au.fehler.map(esc).join("<br>")+"</div>":"")+
      (au.luecken.length?'<div class="note"><strong>Fehlende Angaben</strong><br>'+au.luecken.map(esc).join("<br>")+"</div>":"")+
    "</div>":"")+

    '<fieldset><legend>Markt</legend><div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">'+
      feld("a_filiale","Filialnummer",s.filiale,"text",hinweisExcel("filiale",s.filiale))+
      /* leer lassen = automatischer Name (Ort bzw. Ort + Straße) */
      '<label class="fl"><span>Bezeichnung</span><input type="text" id="a_name" value="'+esc(eigenerName(s))+
        '" placeholder="'+esc(s.autoName||"z. B. Seekirchen")+'"><span class="muted" style="font-size:11.5px">'+
        "Leer lassen für den automatischen Namen"+(s.autoName?" („"+esc(s.autoName)+"“)":"")+"</span></label>"+
      '<label class="fl"><span>FM-Region'+hinweisExcel("region",s.region)+'</span><select id="a_region"><option value="">– keine –</option>'+regionen+"</select></label>"+
    "</div>"+
    '<div class="adr-zeile">'+
      feld("a_adresse","Adresse",s.adresse,"text",hinweisExcel("adresse",s.adresse))+
      feld("a_plz","PLZ",s.plz,"text",hinweisExcel("plz",s.plz))+
      feld("a_ort","Ort",s.ort,"text",hinweisExcel("ort",s.ort))+
    "</div>"+
    '<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px">'+
      feld("a_lat","Breitengrad",s.lat,"number")+feld("a_lon","Längengrad",s.lon,"number")+
      '<div class="fl" style="justify-content:end"><span>&nbsp;</span><div class="rowflex">'+
        '<button class="btn ghost sm" type="button" id="a_geo">Aus Adresse ermitteln</button>'+
        (s.lat?'<a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+s.lat+"&mlon="+s.lon+"#map=17/"+s.lat+"/"+s.lon+'">Auf Karte prüfen</a>':"")+
      "</div></div>"+
    "</div>"+
    '<label class="chk" style="margin-top:10px"><input type="checkbox" id="a_aktiv"'+(s.aktiv!==false?" checked":"")+'><span>Markt wird betreut '+
      '<span class="muted">– abwählen legt ihn still: er verschwindet aus Plan, Karte und Touren, seine Historie bleibt.</span></span></label>'+
    '<label class="fl" style="margin-top:8px"><span>Notiz</span><textarea id="a_notiz" rows="2">'+esc(s.notiz||"")+"</textarea></label>"+
    "</fieldset>"+

    '<fieldset><legend>Anlagen dieses Markts</legend><div id="a_anlagen" class="stack"></div>'+
      '<div style="margin-top:10px"><button class="btn ghost sm" type="button" id="a_plus">+ weitere Anlage</button></div>'+
      '<div class="muted" style="font-size:12px;margin-top:8px">Ein Markt hat eine oder mehrere <strong>Anlagen</strong>. Jede Anlage hat ihre '+
        '<strong>Termine</strong>: die Jahreswartung am Jahrestag der Inbetriebnahme, dazu sechs Monate versetzt HJW (ab 30 kg Kältemittel) '+
        'oder HJI. Steht ein Termin in der falschen Anlage, schiebt ihn die Auswahl rechts neben dem Termin hinüber.</div>'+
    "</fieldset>"+

    '<label class="fl"><span class="req">Grund der Änderung</span><input type="text" id="a_grund" placeholder="z. B. Adresse laut Lidl-Auftrag korrigiert"></label>'+
    '<div class="note warnbox" id="a_err" hidden></div>'+
    '<div class="rowflex" style="justify-content:flex-end;gap:10px">'+
      ((!s._neu && (s._geaendert||ausgewaehlt.some(function(p){ return p._geaendert; })))?'<button class="btn ghost" type="button" id="a_reset">Auf Excel-Stand zurücksetzen</button>':"")+
      /* Sammelzeilen der Excel-Liste, die gar keine Märkte sind, ganz aus der Liste nehmen */
      (s._entwurf?"":(s.entfernt
        ? '<button class="btn ghost" type="button" id="a_zurueck">Wieder aufnehmen</button>'
        : '<button class="btn ghost" type="button" id="a_weg" style="color:var(--crit);border-color:var(--crit)">Aus der Liste entfernen</button>'))+
      '<button class="btn" type="button" id="a_speichern">'+(s._entwurf?"Markt anlegen":"Änderungen speichern")+"</button>"+
    "</div>"+
  "</div></div>");

  /* ---- Anlagen als Karten, Termine darin ----------------------------------
     Der Markt hat Anlagen, jede Anlage hat einen oder zwei Termine im Jahr.
     Genau so sieht der Editor aus: eine Karte je Anlage, darin ihre Termine.
     Ein Termin lässt sich per Auswahl in eine andere Anlage schieben. */
  var host=c.querySelector("#a_anlagen");
  var kartenNr=0;
  var KUERZEL=[["","– fehlt –"],["JW","JW · Jahreswartung"],["HJW","HJW · Halbjahreswartung"],["HJI","HJI · Halbjahresinspektion"]];
  var normCode=function(k){ k=String(k||"").trim().toUpperCase(); return k==="HW"?"HJW":(k.indexOf("HI")===0?"HJI":k); };

  /* Soll-Monat gegen die Regel halten: Jahreswartung im Monat der
     Inbetriebnahme, Halbjahrestermine sechs Monate versetzt. Weicht der
     eingetragene Monat ab, gilt er trotzdem – aber er will begründet sein. */
  function sollHinweisNeu(k){
    var ibFeld=k.querySelector('[data-a="inbetriebnahme"]');
    var ib=ibFeld?ibFeld.value:"";
    k.querySelectorAll(".terminzeile").forEach(function(z){
      var box=z.querySelector(".sollhinweis"); if(!box) return;
      var code=normCode(z.querySelector('[data-t="intervallCode"]').value);
      var halb=(code==="HJW"||code==="HJI");
      var monat=+z.querySelector('[data-t="monat"]').value||0;
      var regel=ib?sollMonatVorschlag(ib,halb):0;
      var p0=posById[z.dataset.pid];
      var grund=(box.querySelector('[data-t="monatGrund"]')||{}).value;
      if(grund===undefined) grund=(p0&&p0.monatGrund)||"";
      if(!regel){ box.hidden=true; box.innerHTML=""; return; }
      if(!monat){
        box.hidden=false;
        box.innerHTML='<div class="note" style="font-size:12.5px">Vorschlag aus der Inbetriebnahme: <strong>'+
          MONATE_L[regel]+"</strong> "+(halb?"(sechs Monate versetzt)":"(Monat der Inbetriebnahme)")+
          ' <button class="btn ghost sm" type="button" data-t="sollnehmen" style="margin-left:6px">übernehmen</button></div>';
        box.querySelector('[data-t="sollnehmen"]').onclick=function(){
          z.querySelector('[data-t="monat"]').value=String(regel); sollHinweisNeu(k);
        };
        return;
      }
      if(monat===regel){ box.hidden=true; box.innerHTML=""; return; }
      box.hidden=false;
      box.innerHTML='<div class="note warnbox" style="font-size:12.5px">'+
        "Weicht von der Regel ab: aus der Inbetriebnahme käme <strong>"+MONATE_L[regel]+"</strong>, "+
        "eingetragen ist <strong>"+MONATE_L[monat]+"</strong>. Der eingetragene Monat gilt."+
        ' <button class="btn ghost sm" type="button" data-t="sollnehmen">Regel übernehmen</button>'+
        '<label class="fl" style="margin-top:6px"><span>Warum abweichend?</span>'+
        '<input type="text" data-t="monatGrund" placeholder="z. B. Markt wird an einem Tag komplett gewartet" value="'+
          esc(grund||"")+'"></label></div>';
      box.querySelector('[data-t="sollnehmen"]').onclick=function(){
        z.querySelector('[data-t="monat"]').value=String(regel); sollHinweisNeu(k);
      };
    });
  }
  function terminZeile(p, neu){
    var ex=EXCEL["position:"+p.id]||{};
    var hin=function(k){
      if(neu || p._neu || !(k in ex) || gleich(ex[k],p[k])) return "";
      return '<span class="muted" style="font-size:11px;text-transform:none;letter-spacing:0"> · Excel: '+esc(stammWert(k,ex[k]))+"</span>";
    };
    var z=el('<div class="terminzeile" data-pid="'+esc(p.id)+'" data-neu="'+(neu?"1":"")+'">'+
      '<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px">'+
        '<label class="fl"><span>Kürzel'+hin("intervallCode")+'</span><select data-t="intervallCode">'+
          KUERZEL.map(function(o){ return '<option value="'+o[0]+'"'+(normCode(p.intervallCode)===o[0]?" selected":"")+">"+o[1]+"</option>"; }).join("")+
        "</select></label>"+
        '<label class="fl"><span>Soll-Monat'+hin("monat")+'</span><select data-t="monat"><option value="0">–</option>'+
          MONATE_L.slice(1).map(function(m,i){ return '<option value="'+(i+1)+'"'+(+p.monat===i+1?" selected":"")+">"+m+"</option>"; }).join("")+
        "</select></label>"+
      "</div>"+
      /* Der Soll-Monat darf bewusst von der Regel abweichen – dann soll aber
         dastehen, warum. Der Hinweis erscheint nur bei einer Abweichung. */
      '<div class="sollhinweis" hidden style="margin-top:6px"></div>'+
      '<div class="rowflex" style="justify-content:space-between;gap:8px;margin-top:6px">'+
        '<span class="muted" style="font-size:12px">'+
          (neu ? "neuer Termin"
               : (p.naechste ? "nächster Termin "+dfmt(p.naechste)+(p.letzte?" · zuletzt "+dfmt(p.letzte):"")
                             : "Termin ergibt sich aus Kürzel und Inbetriebnahme"))+"</span>"+
        '<span class="rowflex" style="gap:8px">'+
          '<label class="chk" style="font-size:12.5px;align-items:center"><input type="checkbox" data-t="entfaellt"'+
            (p.aktiv===false?" checked":"")+"><span>Termin entfällt</span></label>"+
          '<select class="verschieben" style="font-size:12.5px;max-width:200px"></select>'+
          (neu?'<button class="btn ghost sm" type="button" data-t="weg">entfernen</button>':"")+
        "</span>"+
      "</div>"+
    "</div>");
    /* Kürzel und Soll-Monat entscheiden über den Hinweis zur Regel */
    ["intervallCode","monat"].forEach(function(key){
      var f=z.querySelector('[data-t="'+key+'"]');
      if(f) f.onchange=function(){ var k=z.closest(".anlagekarte"); if(k) sollHinweisNeu(k); };
    });
    var weg=z.querySelector('[data-t="weg"]');
    if(weg) weg.onclick=function(){ z.remove(); leereKartenWeg(); optionenNeu(); };
    z.querySelector(".verschieben").onchange=function(e2){
      var ziel=e2.target.value;
      if(!ziel) return;
      var karte;
      if(ziel==="__neu"){
        /* neue Anlage mit den Angaben dieses Termins vorbelegen, sonst wären sie weg */
        var p0=posById[z.dataset.pid];
        karte=anlageKarte(p0?{leader:p0, termine:[]}:null);
      } else karte=host.querySelector('.anlagekarte[data-k="'+ziel+'"]');
      var vorher=z.closest(".anlagekarte");
      if(karte) karte.querySelector(".termine").appendChild(z);
      leereKartenWeg(); optionenNeu();
      if(vorher && vorher.isConnected) sollHinweisNeu(vorher);
      if(karte) sollHinweisNeu(karte);
    };
    return z;
  }

  /* Anlagendaten in denselben Gruppen wie der Dialog vor Ort. Fragen, die
     nicht zur Anlage passen (Rückkühler bei luftgekühlt, Firma ohne eigene
     Regelung), stehen gar nicht erst da. */
  function anlagenWerte(k){
    var w={};
    k.querySelectorAll("[data-a]").forEach(function(x){
      var key=x.dataset.a, v=x.type==="checkbox"?x.checked:x.value.trim();
      w[key]= (key==="kreislaeufe"||key==="kaeltemittelKg"||key==="leistungKw") ? (v===""?null:+v) : v;
    });
    return w;
  }
  function datenFeld(f, w){
    var v=(w[f.k]==null?"":w[f.k]);
    /* Innengeräte sind eine Liste – hier nur anzeigen (bearbeitet wird im
       Anlagendialog); ohne data-a bleibt der gespeicherte Wert beim Speichern */
    if(f.t==="innen") return '<div class="fl"><span>'+esc(f.l)+'</span><div class="muted" style="font-size:13px">'+
      esc(innenText(w[f.k]))+" · bearbeiten über „Anlagendaten prüfen/ergänzen“</div></div>";
    /* Dezimalzahlen mit Komma, Datum als Datum – sonst würden Text und
       Schein-Änderungen gespeichert und das CO₂e verschwände */
    if(f.t==="dez") return '<label class="fl"><span>'+esc(f.l)+(f.e?" ("+esc(f.e)+")":"")+'</span><input type="text" inputmode="decimal" data-a="'+f.k+'" value="'+
      esc(leerWert(w[f.k])?"":String(w[f.k]).replace(".",","))+'"></label>';
    if(f.t==="datum") return '<label class="fl"><span>'+esc(f.l)+'</span><input type="date" data-a="'+f.k+'" value="'+esc(v)+'"></label>';
    if(f.t==="jn") return '<label class="fl"><span>'+esc(f.l)+'</span><select data-a="'+f.k+'">'+
      [["","–"],["ja","ja"],["nein","nein"]].map(function(o){ return '<option value="'+o[0]+'"'+(v===o[0]?" selected":"")+">"+o[1]+"</option>"; }).join("")+"</select></label>";
    if(f.t==="zahl") return '<label class="fl"><span>'+esc(f.l)+'</span><input type="number" min="1" data-a="'+f.k+'" value="'+esc(v)+'"></label>';
    if(f.t==="kg"||f.t==="kw") return '<label class="fl"><span>'+esc(f.l)+'</span><input type="number" step="0.1" min="0" data-a="'+f.k+'" value="'+esc(v)+'"></label>';
    if(f.t==="geheim") return '<label class="fl"><span>'+esc(f.l)+'</span>'+
      '<span class="rowflex" style="gap:6px"><input type="password" data-a="'+f.k+'" autocomplete="off" '+
        'spellcheck="false" style="flex:1;min-width:0" value="'+esc(v)+'">'+
      '<button class="btn ghost sm" type="button" data-zeigen="1">anzeigen</button></span></label>';
    var dl=f.o?' list="dl_'+f.k+'"':"";
    var listeO=f.o?feldOptionen(f):[];
    return '<label class="fl"><span>'+esc(f.l)+'</span><input type="text" data-a="'+f.k+'"'+dl+' placeholder="'+esc(f.o?f.o[0]:"")+'" value="'+esc(v)+'">'+
      (f.o?'<datalist id="dl_'+f.k+'">'+listeO.map(function(o){ return '<option value="'+esc(o)+'">'; }).join("")+"</datalist>":"")+"</label>";
  }
  function datenBlockHtml(w){
    return ANLAGE_GRUPPEN.filter(function(g){ return !g.wenn || g.wenn(w); }).map(function(g){
      var felder=g.felder.filter(function(f){ return feldGilt(Object.assign({gruppe:g},f), w); });
      if(!felder.length) return "";
      return '<div class="datengruppe"><div class="l muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:8px 0 4px">'+
        esc(g.titel)+(g.optional?" (freiwillig)":"")+"</div>"+
        '<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">'+
        felder.map(function(f){ return datenFeld(f, w); }).join("")+"</div></div>";
    }).join("");
  }
  function datenBlockSetzen(k, w){
    var box=k.querySelector(".anlagendaten");
    box.innerHTML=datenBlockHtml(w);
    /* Bauart, Regelung und Fernzugriff entscheiden, welche Fragen folgen */
    box.querySelectorAll('[data-a="bauart"],[data-a="regelung"],[data-a="fernzugriff"]').forEach(function(x){
      x.onchange=function(){ datenBlockSetzen(k, anlagenWerte(k)); };
    });
    box.querySelectorAll("[data-zeigen]").forEach(function(b){
      b.onclick=function(){
        var i=b.previousElementSibling, zu=i.type==="password";
        i.type=zu?"text":"password"; b.textContent=zu?"verbergen":"anzeigen";
      };
    });
    var zus=k.querySelector(".datenkurz");
    if(zus) zus.textContent=anlageKurz(w)||"noch leer";
  }

  function anlageKarte(anl){
    kartenNr++;
    var d = anl ? anlageDaten(anl.leader) : {};
    var akt = anl ? (anl.leader.aktiv===false?"still":(anl.leader.pausiert?"pausiert":"aktiv")) : "aktiv";
    var k=el('<div class="akarte anlagekarte" data-k="k'+kartenNr+'" style="background:var(--surface)">'+
      '<div class="rowflex" style="justify-content:space-between;gap:8px">'+
        '<strong style="font-size:15px">'+(anl?"Anlage":"Neue Anlage")+"</strong>"+
        '<button class="btn ghost sm" type="button" data-a2="plus">+ Termin</button></div>'+
      '<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">'+
        '<label class="fl"><span>Bezeichnung der Anlage</span><input type="text" data-a="anlagentyp" placeholder="z. B. VRV Verkaufsraum" value="'+esc(d.anlagentyp||"")+'"></label>'+
        /* Eine Anlage, ein Inbetriebnahmedatum – die Termine darunter teilen
           es sich. Früher stand es je Termin, dadurch liefen die Anker
           auseinander. */
        '<label class="fl"><span>Inbetriebnahme der Anlage</span><input type="date" data-a="inbetriebnahme" value="'+esc(d.inbetriebnahme||"")+'"></label>'+
        '<label class="fl"><span>Status</span><select data-a="betrieb">'+
          [["aktiv","in Betrieb – wird gewartet"],["pausiert","zur Zeit nicht gewartet"],["still","stillgelegt / abgebaut"]].map(function(o){
            return '<option value="'+o[0]+'"'+(akt===o[0]?" selected":"")+">"+o[1]+"</option>"; }).join("")+"</select></label>"+
        '<label class="fl"><span>Grund, falls nicht gewartet</span><input type="text" data-a="pausiertGrund" placeholder="z. B. von Lidl ausgesetzt" value="'+esc(d.pausiertGrund||"")+'"></label>'+
      "</div>"+
      ((anl&&anl.leader.vorOrtNeu)?'<div class="note warnbox" style="font-size:12.5px">Vor Ort neu erfasst – bitte Kürzel, Soll-Monat und Inbetriebnahme ergänzen.</div>':"")+
      (d.rueckkuehler?'<div class="muted" style="font-size:12px">Eintrag der Excel-Liste zum Rückkühler: „'+esc(d.rueckkuehler)+"“</div>":"")+
      '<details'+((anl && !anlageLuecken(d).length)?"":" open")+'><summary style="cursor:pointer;font-weight:600;font-size:13px">Anlagendaten'+
        ' <span class="muted datenkurz" style="font-weight:400"></span></summary>'+
        '<div class="anlagendaten"></div></details>'+
      '<div class="fl" style="margin-top:4px"><span>Termine dieser Anlage</span></div>'+
      '<div class="termine stack"></div>'+
      '<label class="fl"><span>Notiz</span><input type="text" data-a="notiz" value="'+esc((anl?anl.leader.notiz:"")||"")+'"></label>'+
    "</div>");
    k.querySelector('[data-a2="plus"]').onclick=function(){
      k.querySelector(".termine").appendChild(terminZeile({id:"NP"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), aktiv:true}, true));
      optionenNeu(); sollHinweisNeu(k);
    };
    k.querySelector('[data-a="anlagentyp"]').oninput=optionenNeu;
    k.querySelector('[data-a="inbetriebnahme"]').onchange=function(){ sollHinweisNeu(k); };
    host.appendChild(k);
    datenBlockSetzen(k, d);
    if(anl) anl.termine.forEach(function(p){ k.querySelector(".termine").appendChild(terminZeile(p,false)); });
    sollHinweisNeu(k);
    return k;
  }
  function leereKartenWeg(){
    host.querySelectorAll(".anlagekarte").forEach(function(k){ if(!k.querySelector(".terminzeile")) k.remove(); });
  }
  function optionenNeu(){
    var karten=[].slice.call(host.querySelectorAll(".anlagekarte"));
    host.querySelectorAll(".terminzeile").forEach(function(z){
      var sel=z.querySelector(".verschieben"); if(!sel) return;
      var meine=z.parentElement.parentElement;
      var mehrere=meine && meine.querySelectorAll(".terminzeile").length>1;
      sel.innerHTML='<option value="">gehört zu dieser Anlage</option>'+
        karten.filter(function(x){ return x!==meine; }).map(function(x){
          var nm=x.querySelector('[data-a="anlagentyp"]').value.trim();
          return '<option value="'+x.dataset.k+'">→ verschieben zu: '+esc(nm||("Anlage "+(karten.indexOf(x)+1)))+"</option>";
        }).join("")+
        (mehrere?'<option value="__neu">→ eigene Anlage daraus machen</option>':"");
    });
  }

  /* bestehende Anlagen des Markts, auch stillgelegte und pausierte */
  (function(){
    var gruppen={}, reihe=[];
    ausgewaehlt.forEach(function(p){
      var id=anlageLeader(p).id;
      if(!gruppen[id]){ gruppen[id]={leader:anlageLeader(p), termine:[]}; reihe.push(gruppen[id]); }
      gruppen[id].termine.push(p);
    });
    reihe.forEach(function(g){ anlageKarte(g); });
  })();
  if(s._entwurf) anlageKarte(null).querySelector('[data-a2="plus"]').click();
  optionenNeu();
  c.querySelector("#a_plus").onclick=function(){
    anlageKarte(null).querySelector('[data-a2="plus"]').click();
    optionenNeu();
  };

  c.querySelector("#adm_schliessen").onclick=function(){ A.sel=null; A.entwurf=null; render(); };

  c.querySelector("#a_geo").onclick=function(){
    var adr=c.querySelector("#a_adresse").value.trim();
    if(!adr){ toast("Zuerst eine Adresse eintragen."); return; }
    toast("Adresse wird verortet …");
    fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=at&q="+encodeURIComponent(adr))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j||!j[0]){ toast("Adresse nicht gefunden – bitte genauer angeben oder Koordinaten von Hand eintragen."); return; }
        c.querySelector("#a_lat").value=(+j[0].lat).toFixed(5);
        c.querySelector("#a_lon").value=(+j[0].lon).toFixed(5);
        toast("Gefunden: "+j[0].display_name.split(",").slice(0,3).join(","));
      }, function(){ toast("Verortung hier nicht möglich – bitte Koordinaten von Hand eintragen."); });
  };

  var fehler=function(t){ var e=c.querySelector("#a_err"); e.textContent=t; e.hidden=false; e.scrollIntoView({behavior:"smooth",block:"center"}); };
  var grundHolen=function(){
    var g=c.querySelector("#a_grund").value.trim();
    if(!g){ fehler("Bitte einen Grund angeben – er wird mit der Änderung im Verlauf festgehalten."); c.querySelector("#a_grund").focus(); }
    return g;
  };

  /* Entfernen und Wiederaufnehmen – mit Grund, jederzeit umkehrbar */
  var entfernenSetzen=function(weg){
    var grund=grundHolen(); if(!grund) return;
    if(weg && !window.confirm("„"+stName(s)+"“ aus der Liste nehmen?\n\nDer Eintrag verschwindet aus Plan, Karte, Touren und dieser Übersicht. "+
        "Unter „entfernt“ ist er weiter zu finden und lässt sich wieder aufnehmen.")) return;
    var vorher=auswahl(s,STAMM_FELDER_ST);
    var neu=Object.assign({}, vorher, {entfernt:weg, entferntGrund:weg?grund:"", aktiv:weg?false:true});
    var gegenExcel=objDiff(EXCEL["standort:"+s.id]||{}, neu, STAMM_FELDER_ST);
    var rec={id:"standort:"+s.id, typ:"standort", ziel:s.id, felder:s._neu?neu:gegenExcel, neu:!!s._neu,
             geaendert:new Date().toISOString(), von:wer(), grund:grund};
    stammUeber[rec.id]=rec;
    stammSpeichern(rec).then(function(wo){
      wendeStammdatenAn();
      protokolliere({art:"stammdaten", standortId:s.id, standortName:stName(s), grund:grund,
        felder:[{feld:"entfernt", name:"Markt", alt:weg?"in der Liste":"entfernt", neu:weg?"aus der Liste entfernt":"wieder aufgenommen"}]});
      A.sel=weg?null:s.id; A.entwurf=null;
      toast(weg?"Aus der Liste entfernt.":"Wieder aufgenommen."+(wo==="geraet"?" (vorerst nur auf diesem Gerät)":""));
      render();
    });
  };
  var wegKnopf=c.querySelector("#a_weg");
  if(wegKnopf) wegKnopf.onclick=function(){ entfernenSetzen(true); };
  var zurueckKnopf=c.querySelector("#a_zurueck");
  if(zurueckKnopf) zurueckKnopf.onclick=function(){ entfernenSetzen(false); };

  var resetKnopf=c.querySelector("#a_reset");
  if(resetKnopf) resetKnopf.onclick=function(){
    var grund=grundHolen(); if(!grund) return;
    if(!window.confirm("Alle Änderungen an diesem Markt und seinen Anlagen verwerfen und wieder die Werte der Excel-Liste verwenden?")) return;
    var schl=["standort:"+s.id].concat(ausgewaehlt.filter(function(p){ return !p._neu; }).map(function(p){ return "position:"+p.id; }));
    var felder=[];
    schl.forEach(function(k){ if(stammUeber[k]){ Object.keys(stammUeber[k].felder||{}).forEach(function(f2){
      felder.push({feld:f2, name:(k.indexOf("standort")===0?"":"Anlage – ")+(LABEL_ST[f2]||LABEL_POS[f2]||f2),
                   alt:stammWert(f2,stammUeber[k].felder[f2]), neu:"Excel-Wert"}); }); } });
    Promise.all(schl.filter(function(k){ return stammUeber[k]; }).map(function(k){ delete stammUeber[k]; return stammLoeschen(k); }))
      .then(function(){
        wendeStammdatenAn();
        protokolliere({art:"stammdaten", standortId:s.id, standortName:stName(s), grund:grund, felder:felder});
        toast("Auf Excel-Stand zurückgesetzt."); render();
      });
  };

  c.querySelector("#a_speichern").onclick=function(){
    var grund=grundHolen(); if(!grund) return;
    var num=function(v){ v=String(v).trim().replace(",","."); return v===""?null:+v; };
    var neuSt={
      /* leer = automatischer Name: dann den Wert aus der Liste behalten, sonst entstünde eine Scheinänderung */
      filiale:c.querySelector("#a_filiale").value.trim(), name:c.querySelector("#a_name").value.trim()||(exS.name||""),
      adresse:c.querySelector("#a_adresse").value.trim(), plz:c.querySelector("#a_plz").value.trim(),
      ort:c.querySelector("#a_ort").value.trim(), region:c.querySelector("#a_region").value,
      lat:num(c.querySelector("#a_lat").value), lon:num(c.querySelector("#a_lon").value),
      aktiv:c.querySelector("#a_aktiv").checked, notiz:c.querySelector("#a_notiz").value.trim()
    };
    if(!neuSt.filiale && !neuSt.name && !neuSt.adresse){ fehler("Ein Markt braucht mindestens Filialnummer, Bezeichnung oder Adresse."); return; }
    if(neuSt.lat!=null && (isNaN(neuSt.lat)||neuSt.lat<46||neuSt.lat>49.5)){ fehler("Der Breitengrad liegt nicht in Österreich (etwa 46,3 bis 49,1)."); return; }
    if(neuSt.lon!=null && (isNaN(neuSt.lon)||neuSt.lon<9||neuSt.lon>17.5)){ fehler("Der Längengrad liegt nicht in Österreich (etwa 9,5 bis 17,2)."); return; }

    var recs=[], protokoll=[];
    var jetzt=new Date().toISOString(), von=wer();

    /* Markt */
    var vorherSt=auswahl(s,STAMM_FELDER_ST);
    var deltaSt=objDiff(vorherSt,neuSt,STAMM_FELDER_ST);
    Object.keys(deltaSt).forEach(function(k){ protokoll.push({feld:k, name:LABEL_ST[k], alt:stammWert(k,vorherSt[k]), neu:stammWert(k,neuSt[k])}); });
    if(s._neu){
      if(Object.keys(deltaSt).length || s._entwurf) recs.push({id:"standort:"+s.id, felder:neuSt, neu:true});
    } else if(Object.keys(deltaSt).length){
      var gegenExcel=objDiff(EXCEL["standort:"+s.id],neuSt,STAMM_FELDER_ST);
      recs.push({id:"standort:"+s.id, felder:gegenExcel, neu:false, leer:!Object.keys(gegenExcel).length});
    }

    /* Anlagen und ihre Termine: was in einer Karte steht, gehört zusammen */
    var fehlend=[], doppelt=[], kuenftig=[];
    host.querySelectorAll(".anlagekarte").forEach(function(k){
      var zeilen=[].slice.call(k.querySelectorAll(".terminzeile"));
      if(!zeilen.length) return;
      var la=function(key){ var x=k.querySelector('[data-a="'+key+'"]'); if(!x) return undefined;
        return x.type==="checkbox"?x.checked:x.value.trim(); };
      var betrieb=la("betrieb"), ankerPid=zeilen[0].dataset.pid;
      var kartenName=la("anlagentyp");
      var monate={};
      zeilen.forEach(function(z, idx){
        var pid=z.dataset.pid, istNeu=z.dataset.neu==="1", p0=posById[pid], istAnker=(idx===0);
        var lt=function(key){ var x=z.querySelector('[data-t="'+key+'"]'); if(!x) return undefined;
          return x.type==="checkbox"?x.checked:x.value.trim(); };
        var neuP=Object.assign({}, p0?auswahl(p0,STAMM_FELDER_POS):{});
        neuP.intervallCode=lt("intervallCode");
        /* Die Inbetriebnahme steht einmal an der Anlage und gilt für jeden
           ihrer Termine – so können die Anker nicht mehr auseinanderlaufen. */
        neuP.inbetriebnahme=la("inbetriebnahme")||null;
        neuP.monat=+lt("monat")||0;
        var vGrund=lt("monatGrund");
        neuP.monatGrund = (vGrund===undefined) ? ((p0&&p0.monatGrund)||"") : vGrund;
        neuP.aktiv = betrieb!=="still" && !lt("entfaellt");
        /* Status und Anlagendaten hängen an der ersten Zeile der Anlage */
        neuP.pausiert = istAnker ? (betrieb==="pausiert") : (p0?p0.pausiert:false);
        neuP.pausiertGrund = istAnker ? (betrieb==="pausiert"?la("pausiertGrund"):"") : (p0?p0.pausiertGrund:"");
        if(istAnker){
          neuP.anlagentyp=kartenName;
          neuP.notiz=la("notiz");
          ANLAGE_FELDER.forEach(function(f){
            /* nicht gezeigte Felder (z. B. Rückkühler bei luftgekühlt) unverändert lassen */
            var v=la(f.k); if(v===undefined) return;
            if(f.o && v && f.o.indexOf(v)<0) merkeWert(f.k, v);   /* eigener Wert kommt in die Liste */
            if(f.t==="dez"){ var dz=String(v).replace(/\s/g,"").replace(",","."); neuP[f.k]= dz===""?null:(isNaN(+dz)?(p0?p0[f.k]:null):+dz); }
            else neuP[f.k]= (f.t==="zahl"||f.t==="kg"||f.t==="kw") ? (v===""?null:+v) : (f.t==="datum" ? (v||null) : v);
            /* stand nur da, weil eine andere Zeile der Anlage ihn hat – keine Änderung */
            if(p0 && leerWert(p0[f.k]) && gleich(neuP[f.k], anlageDaten(p0)[f.k])) neuP[f.k]=p0[f.k];
          });
        }
        /* Zuordnung: erste Zeile ist die Anlage, die anderen hängen an ihr */
        var will = istAnker ? pid : ankerPid;
        neuP.anlageZu = (p0 && p0.anlageId===will) ? (p0.anlageZu||null) : will;
        if(p0) STAMM_FELDER_POS.forEach(function(kk){
          if(leerWert(neuP[kk]) && leerWert(p0[kk]) && neuP[kk]!==false) neuP[kk]=p0[kk];
        });
        if(p0 && !neuP.pausiert && !p0.pausiert) neuP.pausiert=p0.pausiert;
        if(p0) neuP.vorOrtNeu = (p0.vorOrtNeu && !neuP.intervallCode) ? p0.vorOrtNeu : (p0.vorOrtNeu?false:p0.vorOrtNeu);

        var name=(kartenName||(p0?anlagenName(p0):"Anlage"));
        if(neuP.aktiv && !neuP.intervallCode) fehlend.push(name);
        /* Eine Inbetriebnahme in der Zukunft schiebt den Jahrestermin mit –
           die Anlage verschwindet still aus der Planung. Das ist immer ein
           Vertipper und wird hier abgefangen. */
        if(neuP.inbetriebnahme && neuP.inbetriebnahme>isoLokal(new Date())) kuenftig.push(name+" ("+dfmt(neuP.inbetriebnahme)+")");
        if(neuP.aktiv && neuP.monat){ if(monate[neuP.monat]) doppelt.push(name+" (zweimal "+MONATE_L[neuP.monat]+")"); monate[neuP.monat]=1; }

        if(istNeu){
          if(!neuP.intervallCode && !neuP.inbetriebnahme && !kartenName) return;  /* leer geblieben */
          neuP.standortId=s.id;
          recs.push({id:"position:"+pid, felder:neuP, neu:true});
          protokoll.push({feld:"anlage", name:"Neuer Termin", alt:"–",
            neu:(kartenName||"Anlage")+" · "+(neuP.intervallCode||"ohne Kürzel")+(neuP.inbetriebnahme?" · IB "+dfmt(neuP.inbetriebnahme):"")});
          return;
        }
        if(!p0) return;
        var vorherP=auswahl(p0,STAMM_FELDER_POS);
        var norm=function(x){ x=String(x||"").trim().toUpperCase(); return x==="HW"?"HJW":(x.indexOf("HI")===0?"HJI":x); };
        if(norm(vorherP.intervallCode)===norm(neuP.intervallCode)) neuP.intervallCode=vorherP.intervallCode;
        var deltaP=objDiff(vorherP,neuP,STAMM_FELDER_POS);
        if(!Object.keys(deltaP).length) return;
        Object.keys(deltaP).forEach(function(kk){
          protokoll.push({feld:kk, name:name+" – "+(LABEL_POS[kk]||kk), alt:stammWert(kk,vorherP[kk]), neu:stammWert(kk,neuP[kk])});
        });
        if(p0._neu){ neuP.standortId=s.id; recs.push({id:"position:"+pid, felder:neuP, neu:true}); }
        else {
          var gE=objDiff(EXCEL["position:"+pid],neuP,STAMM_FELDER_POS);
          recs.push({id:"position:"+pid, felder:gE, neu:false, leer:!Object.keys(gE).length});
        }
      });
    });
    if(kuenftig.length){
      fehler("Die Inbetriebnahme liegt in der Zukunft: "+kuenftig.join(", ")+
             ". Der Jahrestermin haengt daran – so faellt die Anlage aus der Planung. Bitte das Datum pruefen.");
      return;
    }
    if(fehlend.length){
      fehler("Ohne Kürzel gibt es keinen Termin. Bitte bei „"+fehlend[0]+"“ JW, HJW oder HJI wählen"+
             (fehlend.length>1?" (und bei "+(fehlend.length-1)+" weiteren)":"")+".");
      return;
    }
    if(doppelt.length && !window.confirm("Zwei Termine im selben Monat: "+doppelt.join(", ")+
        ".\n\nGewollt? Sonst abbrechen und einen der Termine auf den Halbjahresmonat setzen.")) return;
    if(!recs.length){ fehler("Es wurde nichts geändert."); return; }

    var knopf=c.querySelector("#a_speichern"); knopf.disabled=true; knopf.textContent="Wird gespeichert …";
    Promise.all(recs.map(function(r){
      if(r.leer){ delete stammUeber[r.id]; return stammLoeschen(r.id).then(function(){ return "zurueck"; }); }
      var rec={id:r.id, typ:r.id.split(":")[0], ziel:r.id.split(":")[1], felder:r.felder, neu:!!r.neu,
               geaendert:jetzt, von:von, grund:grund};
      stammUeber[r.id]=rec;
      return stammSpeichern(rec);
    })).then(function(erg){
      if(erg.indexOf(false)>=0){
        knopf.disabled=false; knopf.textContent="Änderungen speichern";
        fehler("Ein Teil der Änderungen ließ sich nicht speichern. Bitte erneut versuchen.");
        return;
      }
      wendeStammdatenAn();
      protokolliere({art:"stammdaten", standortId:s.id, standortName:stName(byId[s.id]||s), grund:grund, felder:protokoll});
      A.entwurf=null; A.sel=s.id;
      toast((s._entwurf?"Markt angelegt":"Gespeichert – "+protokoll.length+" Änderung"+(protokoll.length===1?"":"en"))+
            (erg.indexOf("geraet")>=0?" (vorerst nur auf diesem Gerät)":"")+".");
      render();
    });
  };
  return c;
}

/* ================= Prüfen: Checkliste fürs Büro =================
   Termine und Daten kommen inzwischen aus vielen Quellen: Excel-Liste,
   Verwaltung, Anlagendaten vor Ort, Prüfbuch, Protokolle, offene Störungen,
   Rapporte. Hier steht alles, was sich widerspricht oder doppelt ist – mit
   dem Markt zum Antippen. Nichts wird automatisch geändert. */
function pruefListe(){
  var L=[], dazu=function(schwere, thema, text, s, extra){
    L.push(Object.assign({schwere:schwere, thema:thema, text:text, standortId:s?s.id:null}, extra||{}));
  };
  var protos=alleProtokolle();
  var pids=function(pr){ return (pr.positionIds&&pr.positionIds.length)?pr.positionIds:(pr.positionId?[pr.positionId]:[]); };
  var heute=isoLokal(new Date());

  /* 1. was die Verwaltung je Markt findet */
  ST.forEach(function(s){
    var a=auffaelligkeiten(s);
    a.fehler.forEach(function(t){ dazu("Fehler", /Termin|Soll-Monat|Kürzel|JW|HJ|Inbetriebnahme/.test(t)?"Termine":"Stammdaten", t, s); });
    a.luecken.forEach(function(t){
      if(/Zwei Termine am selben Tag/.test(t)) return;          /* zwei Anlagen am selben Tag ist normal */
      if(/bewusst so/.test(t)) return;                           /* begründet – nur eine Notiz */
      dazu("Lücke", /Termin|Inbetriebnahme/.test(t)?"Termine":"Anlagendaten", t, s);
    });
  });

  /* 2. Termine, um die sich jemand kümmern sollte */
  POS.forEach(function(p){
    var s=byId[p.standortId]; if(!s) return;
    if(p.ausgelassen) dazu("Hinweis","Termine", anlagenName(p)+": Termin "+dfmt(p.ausgelassen)+" wurde ausgelassen (nicht gewartet).", s);
    if(p.doppeltImFenster) dazu("Hinweis","Doppelt", anlagenName(p)+" ("+p.intervall.kurz+"): zwei Wartungen für denselben Termin ("+
      p.doppeltImFenster.map(dfmt).join(" und ")+") – doppelt erfasst oder einem falschen Termin zugeordnet?", s);
    if(!p.letzte && p.status==="ueberfaellig") dazu("Hinweis","Termine", anlagenName(p)+": nie gewartet erfasst und überfällig – fehlt ein Nachweis (Liste, Prüfbuch, Protokoll)?", s);
  });

  /* 3. Doppelte Anlagen */
  var nachSn={};
  ALLE_POS.forEach(function(p){
    if(anlageLeader(p)!==p || p.aktiv===false) return;
    var d=anlageDaten(p), sn=String(d.seriennummer||"").replace(/\s+/g,"").toUpperCase();
    if(sn.length>=4) (nachSn[sn]=nachSn[sn]||[]).push(p);
  });
  Object.keys(nachSn).forEach(function(sn){
    var l=nachSn[sn]; if(l.length<2) return;
    dazu("Fehler","Doppelt", "Seriennummer "+sn+" steht bei "+l.length+" Anlagen: "+
      l.map(function(p){ return anlagenName(p)+" ("+stName(byId[p.standortId]||{})+")"; }).join(", ")+" – eine davon ist doppelt erfasst.",
      byId[l[0].standortId]);
  });
  ST.forEach(function(s){
    var an=anlagenDesMarkts(s,false).map(function(a){ return {p:a.leader, d:anlageDaten(a.leader)}; });
    an.forEach(function(x,i){
      an.slice(i+1).forEach(function(y){
        var gleichesModell=x.d.modell && y.d.modell && x.d.modell.replace(/\s+/g,"").toUpperCase()===y.d.modell.replace(/\s+/g,"").toUpperCase();
        var snX=String(x.d.seriennummer||""), snY=String(y.d.seriennummer||"");
        if(!gleichesModell || (snX && snY && snX!==snY)) return;
        if(!gleich(x.d.kaeltemittelKg, y.d.kaeltemittelKg)) return;
        var neu=x.p.vorOrtNeu||y.p.vorOrtNeu||x.p._neu||y.p._neu;
        dazu(neu?"Fehler":"Hinweis","Doppelt", anlagenName(x.p)+" und "+anlagenName(y.p)+": gleiches Modell "+x.d.modell+
          (x.d.kaeltemittelKg?" und gleiche Füllmenge":"")+(snX||snY?"":", keine Seriennummer")+
          " – dieselbe Anlage zweimal"+(neu?" (eine davon neu angelegt)":"")+"? Sonst Seriennummer eintragen.", s);
      });
    });
  });

  /* 3b. Derselbe Markt doppelt: gleiche Adresse oder gleiche Kartenposition */
  var nachAdr={};
  ST.forEach(function(s){
    var adr=String(s.adresse||"").toLowerCase().replace(/straße/g,"str").replace(/strasse/g,"str").replace(/[^a-z0-9äöü]/g,"");
    if(adr.length>=6) (nachAdr["a:"+adr]=nachAdr["a:"+adr]||[]).push(s);
    /* gleiche Kartenposition nur bei adressgenauer Lage – ortsgenau liegen viele Märkte auf einem Punkt */
    if(s.lat && s.lon && (s.genauigkeit==="adresse"||s.genauigkeit==="manuell"))
      (nachAdr["k:"+(+s.lat).toFixed(4)+","+(+s.lon).toFixed(4)]=nachAdr["k:"+(+s.lat).toFixed(4)+","+(+s.lon).toFixed(4)]||[]).push(s);
  });
  var schonGemeldet={};
  Object.keys(nachAdr).forEach(function(k){
    var l=nachAdr[k]; if(l.length<2) return;
    var ids=l.map(function(s){ return s.id; }).sort().join("|"); if(schonGemeldet[ids]) return; schonGemeldet[ids]=1;
    /* zwei Märkte mit verschiedener Filialnummer an einer Adresse gibt es (z. B. Filiale und Lager) – nur Hinweis */
    var filialen=l.map(function(s){ return String(s.filiale||"").replace(/^0+/,""); });
    var verschieden=filialen.every(Boolean) && filialen.filter(function(f,i){ return filialen.indexOf(f)===i; }).length===filialen.length;
    dazu(verschieden?"Hinweis":"Fehler","Doppelt", "Märkte "+l.map(function(s){ return "„"+stName(s)+"“"; }).join(" und ")+
      (k.charAt(0)==="a"?" haben dieselbe Adresse":" liegen an derselben Stelle")+" – derselbe Markt doppelt angelegt?", l[1]);
  });

  /* 4. Doppelte Protokolle: dieselbe Anlage, derselbe Besuch – verglichen über
     die Anlage, nicht über den Termin (sonst fiele JW + HJW am selben Tag durch) */
  var anl=function(pr){ return pids(pr).map(function(id){ var pp=posById[id]; return pp ? anlageVon(pp).id : id; }); };
  var wart=protos.filter(function(pr){ return zaehltAlsWartung(pr) && pr.datum; });
  wart.forEach(function(pr,i){
    wart.slice(i+1).forEach(function(q){
      if(pr.standortId!==q.standortId || !gleicherBesuch(pr.datum,q.datum)) return;
      var aq=anl(q), gemeinsamA=anl(pr).filter(function(id){ return aq.indexOf(id)>=0; });
      if(!gemeinsamA.length) return;
      var gemeinsam=pids(pr).filter(function(id){ var pp=posById[id]; return gemeinsamA.indexOf(pp?anlageVon(pp).id:id)>=0; });
      dazu("Fehler","Doppelt", "Zwei Wartungsprotokolle für "+feldText("positionIds",gemeinsam)+" ("+dfmt(pr.datum)+" und "+dfmt(q.datum)+
        ") – ein Besuch zweimal erfasst? Eines davon löschen (Admin).", byId[pr.standortId]);
    });
  });

  /* 5. Offene Störungen */
  var offen=offeneStoerungen(true);
  var nachNr={};
  offen.forEach(function(o){ if(o.auftragsnummer) (nachNr[o.auftragsnummer]=nachNr[o.auftragsnummer]||[]).push(o); });
  Object.keys(nachNr).forEach(function(nr){
    if(nachNr[nr].length>1) dazu("Fehler","Störungen", "Auftrag "+nr+" ist "+nachNr[nr].length+"× als offene Störung erfasst.", byId[nachNr[nr][0].standortId]);
  });
  offen.forEach(function(o){
    var s=byId[o.standortId];
    if(!o.standortId) dazu("Fehler","Störungen", "Offene Störung "+(o.auftragsnummer||o.problemtyp||"")+" hat keinen Markt.", null);
    var pr=o.auftragsnummer ? protos.filter(function(x){ return istStoerung(x) && x.auftragsnummer===o.auftragsnummer; })[0] : null;
    if(pr) dazu("Fehler","Störungen", "Auftrag "+o.auftragsnummer+" ist noch offen, obwohl es schon ein Störungsprotokoll vom "+dfmt(pr.datum)+" gibt – abhaken?", s);
  });
  var stNr={};
  protos.filter(istStoerung).forEach(function(pr){ if(pr.auftragsnummer) (stNr[pr.auftragsnummer]=stNr[pr.auftragsnummer]||[]).push(pr); });
  Object.keys(stNr).forEach(function(nr){
    var l=stNr[nr]; if(l.length<2) return;
    dazu("Hinweis","Störungen", "Auftrag "+nr+" hat "+l.length+" Störungsprotokolle ("+l.map(function(p){ return dfmt(p.datum); }).join(", ")+
      ") – bei mehreren Einsätzen richtig, sonst doppelt.", byId[l[0].standortId]);
  });

  /* 6. Rapporte */
  var rapNr={};
  protos.forEach(function(pr){
    var r=rapportVon(pr); if(!r) return;
    var d=r.daten;
    if(d && d.nummer) (rapNr[d.nummer]=rapNr[d.nummer]||[]).push(pr);
    var s=byId[pr.standortId];
    var abw=rapportAbweichung(d, s&&s.filiale, pr.datum, (istStoerung(pr) || /^\d{6,}$/.test(String(pr.auftragsnummer||"").trim())) ? pr.auftragsnummer : "");
    if(abw) dazu("Fehler","Rapporte", "Protokoll vom "+dfmt(pr.datum)+": "+abw, s);
  });
  Object.keys(rapNr).forEach(function(nr){
    var l=rapNr[nr]; if(l.length<2) return;
    dazu("Fehler","Rapporte", "Rapport "+nr+" hängt an "+l.length+" Protokollen ("+l.map(function(p){ return dfmt(p.datum); }).join(", ")+
      ") – er gehört nur zu einem.", byId[l[0].standortId]);
  });
  protos.forEach(function(pr){
    if(pr.datum && pr.datum>heute) dazu("Fehler","Protokolle", "Protokoll mit Datum in der Zukunft ("+dfmt(pr.datum)+").", byId[pr.standortId]);
  });

  var rang={Fehler:0, Hinweis:1, "Lücke":2};
  return L.sort(function(a,b){ return rang[a.schwere]-rang[b.schwere] || a.thema.localeCompare(b.thema) ||
    stName(byId[a.standortId]||{}).localeCompare(stName(byId[b.standortId]||{}),"de"); });
}
/* ---------- Nachbessern: die Arbeitsliste fürs Büro ----------
   Unter Verwaltung → Nachbessern. Je Markt, was sich widerspricht, doppelt
   ist oder fehlt – sortiert nach Chaosfaktor: Termin-Fehler wiegen am
   schwersten, fehlende Anlagendaten am wenigsten, und ein Markt, der
   überfällig oder bald fällig ist, rückt nach oben. Von jedem Markt geht es
   mit einem Tipp in den Editor (Markt, Anlagen, Termine) oder in die
   Anlagendaten. */
var GEWICHT={
  "Fehler":{Termine:30, Doppelt:28, "Störungen":22, Rapporte:18, Protokolle:18, Stammdaten:10, _:10},
  "Hinweis":{Termine:12, Doppelt:9, "Störungen":6, _:4},
  "Lücke":{Termine:5, Anlagendaten:1, _:2}
};
function befundGewicht(x){ var g=GEWICHT[x.schwere]||{}; return g[x.thema]!=null ? g[x.thema] : (g._||1); }
function marktDrang(s){
  if(!s) return 1;
  if(s.status==="ueberfaellig") return 2;
  if(s.status==="faellig") return 1.6;
  var n=naechsterTerminMarkt(s);
  return n && tageBis(n)<=90 ? 1.2 : 1;
}
function nachbessernAnsicht(liste){
  var f=document.createDocumentFragment();
  var A=S.adm;
  A.nbThema=A.nbThema||"alle";
  var themen=["alle"].concat(liste.map(function(x){ return x.thema; }).filter(function(t,i,a){ return a.indexOf(t)===i; }).sort());
  var sicht=liste.filter(function(x){ return A.nbThema==="alle" || x.thema===A.nbThema; });
  /* je Markt bündeln */
  var gruppen={}, ohne=[];
  sicht.forEach(function(x){
    if(!x.standortId || !byId[x.standortId]){ ohne.push(x); return; }
    (gruppen[x.standortId]=gruppen[x.standortId]||[]).push(x);
  });
  var maerkte=Object.keys(gruppen).map(function(id){
    var l=gruppen[id].sort(function(a,b){ return befundGewicht(b)-befundGewicht(a); });
    var summe=l.reduce(function(n,x){ return n+befundGewicht(x); },0);
    return {s:byId[id], l:l, punkte:Math.round(summe*marktDrang(byId[id]))};
  }).sort(function(a,b){ return b.punkte-a.punkte || stName(a.s).localeCompare(stName(b.s),"de"); });
  var zahl=function(sw){ return liste.filter(function(x){ return x.schwere===sw; }).length; };

  var kopf=el('<div class="card"><div class="pad stack">'+

    '<div class="kpis">'+
      '<div class="kpi crit"><div class="n">'+zahl("Fehler")+'</div><div class="l">Fehler</div></div>'+
      '<div class="kpi warn"><div class="n">'+zahl("Hinweis")+'</div><div class="l">Hinweise</div></div>'+
      '<div class="kpi"><div class="n">'+zahl("Lücke")+'</div><div class="l">Lücken</div></div>'+

    "</div>"+
    '<div class="chips">'+themen.map(function(w){
      return '<button class="chip" type="button" data-w="'+esc(w)+'" aria-pressed="'+(A.nbThema===w)+'">'+esc(w==="alle"?"alles":w)+"</button>"; }).join("")+"</div>"+

  kopf.querySelectorAll(".chip").forEach(function(b){ b.onclick=function(){ A.nbThema=b.dataset.w; render(); }; });
  kopf.querySelector('[data-a="csv"]').onclick=function(){
    var zeilen=[];

    ohne.forEach(function(x){ zeilen.push(["", x.schwere, x.thema, "", "", x.text]); });
    csv("nachbessern_lidl.csv", ["Chaos-Punkte","Schwere","Thema","Filiale","Markt","Befund"], zeilen);

  ohne.forEach(function(x){

  zeige.forEach(function(m){
    var s=m.s, stufe=m.punkte>=60?"hoch":m.punkte>=25?"mittel":"gering";
    var c=el('<div class="card"><div class="pad stack">'+
      '<div class="rowflex" style="justify-content:space-between;gap:8px;align-items:flex-start">'+
        "<div><strong style=\"font-size:15px\">"+marktLink(s)+"</strong>"+(s.filiale?' <span class="muted mono">'+esc(s.filiale)+"</span>":"")+
          '<br><span class="muted" style="font-size:12.5px">'+esc(s.adresse||"")+"</span></div>"+
        '<span class="rowflex" style="gap:4px">'+marktPill(s)+'<span class="pill '+
          (stufe==="hoch"?"p-ueberfaellig":stufe==="mittel"?"p-faellig":"p-unbekannt")+'">Chaos '+stufe+" · "+m.punkte+"</span></span></div>"+
      '<div class="stack" data-befunde></div>'+

      "</div></div></div>");
    var bh=c.querySelector("[data-befunde]");
    m.l.forEach(function(x){
      bh.appendChild(el('<div style="font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start">'+
        '<span class="pill '+(x.schwere==="Fehler"?"p-ueberfaellig":x.schwere==="Hinweis"?"p-faellig":"p-unbekannt")+'">'+esc(x.thema)+"</span>"+
        "<span>"+esc(x.text)+"</span></div>"));

    c.querySelector('[data-a="edit"]').onclick=function(){

    };
    /* Anlagen mit offenen Anlagendaten: gleich hier ergänzen */
    var kh=c.querySelector("[data-knoepfe]");

      x.betriebsbereit,x.bemerkungen]; });
    csv("protokolle_lidl.csv",head,rows);
  };

  return f;

function csv(name,head,rows){
  var q=function(v){ v=String(v==null?"":v); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  var text="﻿"+[head.map(q).join(";")].concat(rows.map(function(r){return r.map(q).join(";");})).join("\r\n");
  if(window.claude&&window.claude.use){
    /* im Artifact sind eigene Downloads gesperrt, der Host übernimmt das */
    window.claude.use("downloads").then(function(d){
      if(!d){ toast("Download in dieser Ansicht nicht möglich."); return; }
      d.save({filename:name,data:text}).then(function(){ toast("Datei bereitgestellt."); },function(){ toast("Download abgebrochen."); });
    },function(){ toast("Download in dieser Ansicht nicht möglich."); });
    return;
  }
  try{
    var blob=new Blob([text],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    toast("CSV heruntergeladen.");
  }catch(e){ toast("Download nicht möglich: "+e.message); }
}

/* ---------- Render ---------- */
function render(){
  /* Kopfzeile nachziehen – Märkte können angelegt oder stillgelegt worden sein */
  var standEl=document.getElementById("stand");
  if(standEl) standEl.textContent="Stand "+dfmt(isoLokal(new Date()))+" · "+ST.length+" Standorte · "+anzahlAnlagen()+" Anlagen · "+POS.length+" Termine";
  /* Kunde und Präsentation: nur die Reiter zum Ansehen */
  var NUR_LESEN_REITER=["faellig","karte","anlagen","verlauf"];
  /* Büro-Reiter nur für Admins: ein Techniker kann dort nichts tun, und
     jemand Neues soll sich nicht in Verwaltungstexte verirren */
  var BUERO_REITER=["verwaltung","daten"];
  var versteckt=function(v){
    if(nurLesen()) return NUR_LESEN_REITER.indexOf(v)<0;
    return (Store.modus==="supabase"||Store.modus==="anmeldung") && !Admin.frei && BUERO_REITER.indexOf(v)>=0;
  };
  if(versteckt(S.view)) S.view="faellig";
  Array.prototype.forEach.call(tabsEl.children,function(b){ b.hidden = versteckt(b.dataset.v); });
  Array.prototype.forEach.call(tabsEl.children,function(b){ b.setAttribute("aria-selected", b.dataset.v===S.view?"true":"false"); });
  var host=document.getElementById("app");
  host.innerHTML="";
  if(S.view==="pruefen"){ S.view="verwaltung"; S.adm=S.adm||{suche:"", filter:"alle", sort:"filiale", auf:true}; S.adm.tab="nachbessern"; }
  var sec=document.createElement("section"); sec.className="view";
  /* Abgemeldet zeigt die App nur die Excel-Liste. Ohne diesen Hinweis sähe
     „keine offene Störung“ und ein falsch überfälliger Termin echt aus. */
  if(!angemeldetOderLokal() && S.view!=="protokoll"){
    var ab=el('<div class="note warnbox" style="margin-bottom:12px"><strong>Nicht angemeldet.</strong> '+
      "Zu sehen ist nur die Wartungsliste. Offene Störungen, Protokolle aus der App und ergänzte Anlagendaten "+
      "fehlen – Fälligkeiten können deshalb falsch sein. "+
      '<button class="btn sm" type="button" style="margin-left:6px">Jetzt anmelden</button></div>');
    ab.querySelector("button").onclick=function(){ S.view="protokoll"; render(); window.scrollTo({top:0}); };
    host.appendChild(ab);
  }
  if(["protokoll","daten","verlauf","verwaltung","pruefen"].indexOf(S.view)<0) host.appendChild(filterBar());
  if(S.view==="faellig") sec.appendChild(viewFaellig());
  else if(S.view==="karte") sec.appendChild(viewKarte());
  else if(S.view==="anlagen") sec.appendChild(viewAnlagen());
  else if(S.view==="protokoll") sec.appendChild(viewProtokoll());
  else if(S.view==="verlauf") sec.appendChild(viewVerlauf());
  else if(S.view==="verwaltung") sec.appendChild(viewVerwaltung());
  else sec.appendChild(viewDaten());
  host.appendChild(sec);
  tipHide();
}

  var alt=document.getElementById("qrOverlay"); if(alt) alt.remove();
  var url=appAdresse();
  var ov=el('<div class="overlay" id="qrOverlay" role="dialog" aria-modal="true" aria-label="QR-Code zur App">'+
    '<div class="sheet">'+
      '<div class="rowflex" style="justify-content:space-between"><h2>Am Handy öffnen</h2>'+
        '<button class="btn ghost sm" type="button" id="qrclose">Schließen</button></div>'+
      '<div class="qrframe"><canvas id="qrcanvas" width="280" height="280"></canvas></div>'+
      '<div class="qrurl" id="qrtext"></div>'+
      '<label class="fl"><span>Adresse für den Code</span>'+
        '<input type="url" id="qrinput" inputmode="url" placeholder="https://…"></label>'+
      '<div class="muted" style="font-size:12.5px">Mit der Handykamera scannen. Die Adresse lässt sich hier ändern, '+
        'etwa um den Code schon auf das spätere eigene Hosting zeigen zu lassen — die Änderung bleibt auf diesem Gerät gespeichert.</div>'+
    "</div></div>");
  document.body.appendChild(ov);
  var canvas=ov.querySelector("#qrcanvas"), txt=ov.querySelector("#qrtext"), input=ov.querySelector("#qrinput");
  var rahmen=ov.querySelector(".qrframe");

  function zeichne(u){
    txt.textContent=u||"Noch keine Adresse hinterlegt.";
    if(!u){ rahmen.hidden=true; return; }
    rahmen.hidden=false;
    if(!window.QRious){
      rahmen.innerHTML='<div style="color:#0F1A20;font-size:12.5px;padding:8px;text-align:center">'+
        "QR-Bibliothek nicht erreichbar. Adresse bitte von Hand eintippen.</div>";
      return;
    }
    try{
      new window.QRious({element:canvas,value:u,size:560,level:"M",padding:0,background:"#ffffff",foreground:"#0F1A20"});
    }catch(e){
      rahmen.innerHTML='<div style="color:#0F1A20;font-size:12.5px;padding:8px;text-align:center">QR-Code nicht erzeugbar: '+esc(e.message)+"</div>";
    }
  }
  input.value=url; zeichne(url);
  input.oninput=function(){
    var v=input.value.trim();
    zeichne(v);
    try{ if(v) lsSet("ukt_appurl",v); else localStorage.removeItem("ukt_appurl"); }catch(e){}
  };

  function zu(){ document.removeEventListener("keydown",esc2); ov.remove(); }
  function esc2(e){ if(e.key==="Escape") zu(); }
  ov.querySelector("#qrclose").onclick=zu;
  ov.addEventListener("click",function(e){ if(e.target===ov) zu(); });
  document.addEventListener("keydown",esc2);
  ov.querySelector("#qrclose").focus();
}

/* ----------------------------------------------------------------
   Zugangsschutz. Der Anlagenstamm wird verschlüsselt ausgeliefert
   (AES-256-CBC, Schlüssel aus PBKDF2-SHA256), das Passwort
   entschlüsselt ihn erst im Browser. Ohne Passwort steht in
   daten.enc.js nichts Lesbares.
   ---------------------------------------------------------------- */
(function(){
  "use strict";
  var tabs=document.getElementById("tabs");
  var qrbtn=document.getElementById("qrbtn");
  var stand=document.getElementById("stand");
  var app=document.getElementById("app");

  function b64(s){ var bin=atob(s), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }

  function entschluessle(pw){
    var e=window.LIDL_ENC;
    var mat=new TextEncoder().encode(pw);
    return crypto.subtle.importKey("raw",mat,{name:"PBKDF2"},false,["deriveKey"])
      .then(function(k){
        return crypto.subtle.deriveKey(
          {name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},
          k,{name:"AES-CBC",length:256},false,["decrypt"]);
      })
      .then(function(key){ return crypto.subtle.decrypt({name:"AES-CBC",iv:b64(e.iv)},key,b64(e.data)); })
      .then(function(buf){
        var txt=new TextDecoder().decode(buf);
        if(txt.charAt(0)!=="{") throw new Error("falsch");
        return JSON.parse(txt);
      });
  }

  function start(daten){
    window.LIDL_DB=daten;
    if(tabs) tabs.hidden=false;
    if(qrbtn) qrbtn.hidden=false;
    if(stand) stand.hidden=false;
    starteWartungsleitstand();
  }

  function schirm(){
    if(tabs) tabs.hidden=true;
    if(qrbtn) qrbtn.hidden=true;
    if(stand) stand.hidden=true;
    app.innerHTML="";
    var card=document.createElement("div");
    card.className="card";
    card.style.maxWidth="440px";
    card.style.marginTop="28px";
    card.innerHTML='<div class="pad stack">'+
      '<div><h2>Zugang</h2><div class="sub">Die Anlagen- und Standortdaten sind verschlüsselt hinterlegt. '+
      'Mit dem Passwort aus dem Büro werden sie hier im Browser entschlüsselt.</div></div>'+
      '<form class="stack" id="gateform">'+
        '<label class="fl"><span>Passwort</span>'+
          '<input type="password" id="g_pw" autocomplete="current-password" autofocus required></label>'+
        '<div class="note warnbox" id="g_err" hidden></div>'+
        '<div><button class="btn" type="submit" id="g_btn">Daten anzeigen</button></div>'+
      '</form>'+
      '<div class="muted" style="font-size:12.5px">Das Entschlüsseln dauert einen Moment – '+
      'die Schlüsselableitung ist absichtlich rechenintensiv, damit Passwörter nicht durchprobiert werden können.</div>'+
    '</div>';
    app.appendChild(card);

    var form=card.querySelector("#gateform"),
        pw=card.querySelector("#g_pw"),
        err=card.querySelector("#g_err"),
        btn=card.querySelector("#g_btn");

    form.onsubmit=function(ev){
      ev.preventDefault();
      err.hidden=true; btn.disabled=true; btn.textContent="Entschlüsseln …";
      entschluessle(pw.value).then(function(daten){
        try{ sessionStorage.setItem("ukt_pw",pw.value); }catch(e){}
        start(daten);
      },function(){
        btn.disabled=false; btn.textContent="Daten anzeigen";
        err.textContent="Das Passwort passt nicht.";
        err.hidden=false; pw.select();
      });
    };
  }

  if(window.LIDL_DB){ start(window.LIDL_DB); return; }           // unverschlüsselt ausgeliefert
  if(!window.LIDL_ENC){ start({standorte:[],positionen:[],meta:{}}); return; }
  if(!window.crypto || !window.crypto.subtle){
    app.innerHTML='<div class="card"><div class="pad"><h2>Nicht entschlüsselbar</h2>'+
      '<div class="sub">Dieser Browser stellt keine Verschlüsselungsfunktionen bereit. '+
      'Das passiert, wenn die Seite ohne HTTPS aufgerufen wird.</div></div></div>';
    if(tabs) tabs.hidden=true; if(qrbtn) qrbtn.hidden=true; if(stand) stand.hidden=true;
    return;
  }

  /* innerhalb derselben Browser-Sitzung nicht erneut fragen */
  var gemerkt=null;
  try{ gemerkt=sessionStorage.getItem("ukt_pw"); }catch(e){}
  if(gemerkt){
    schirm();
    entschluessle(gemerkt).then(start,function(){ try{ sessionStorage.removeItem("ukt_pw"); }catch(e){} });
  } else {
    schirm();
  }
})();
</script>
