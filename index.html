/* GWP üblicher Kältemittel (AR4, wie in den Prüfbüchern) – für das
   CO2-Äquivalent, wenn im Prüfbuch keines eingetragen ist */
var GWP_STANDARD={R410A:2087.5, R32:675, R407C:1774, R134a:1430, R454B:466, R744:1, R404A:3922, R407F:1825, R22:1810};
function gwpVon(a){
  if(!leerWert(a.gwp)) return +a.gwp;
  var art=String(a.kaeltemittelArt||"").replace(/[\s\-]+/g,"").toUpperCase();   /* „R-410A“ = R410A */
  var k=Object.keys(GWP_STANDARD).filter(function(x){ return x.toUpperCase()===art; })[0];
  return k ? GWP_STANDARD[k] : null;
}
function co2Tonnen(a){
  var kg=+a.kaeltemittelKg, gwp=gwpVon(a);
  if(!kg || !gwp) return null;
  return Math.round(kg*gwp/10)/100;   /* Tonnen, zwei Stellen */
}
var ANLAGE_FELDER=[].concat.apply([], ANLAGE_GRUPPEN.map(function(g){
  return g.felder.map(function(f){ return Object.assign({gruppe:g}, f); }); }));
/* Zugangsdaten bleiben bei der Anlage. Sie dürfen weder in den Schnappschuss
   eines Protokolls noch auf das Blatt, das an Lidl geht. */
var GEHEIME_FELDER=ANLAGE_FELDER.filter(function(f){ return f.gruppe.geheim; }).map(function(f){ return f.k; });
function istGeheim(k){ return GEHEIME_FELDER.indexOf(k)>=0; }
function leerWert(w){ return w==null || w==="" || (typeof w==="number" && isNaN(w)); }
/* Die Auswahllisten lernen dazu: was einmal unter „andere …“ eingetippt wurde,
   steht beim nächsten Mal als Knopf da – zuerst das, was am häufigsten
   vorkommt. Gespeichert wird es mit den Anlagendaten, bis dahin auf dem Gerät. */
function gelernteWerte(key){
  var haeufig={};
  ALLE_POS.forEach(function(p){
    var v=p[key];
    if(typeof v==="string" && v.trim()) haeufig[v.trim()]=(haeufig[v.trim()]||0)+1;
  });
  (lsGet("ukt_eigene",{})[key]||[]).forEach(function(v){ if(v) haeufig[v]=haeufig[v]||1; });
  return Object.keys(haeufig).sort(function(a,b){ return haeufig[b]-haeufig[a] || a.localeCompare(b,"de"); });
}
function feldOptionen(f){
  var o=(f.o||[]).slice();
  gelernteWerte(f.k).forEach(function(v){ if(o.indexOf(v)<0) o.push(v); });
  return o;
}
function merkeWert(key, wert){
  if(demo()) return;   /* die Präsentation hinterlässt nichts auf dem Gerät */
  wert=String(wert||"").trim();
  if(!wert) return;
  var m=lsGet("ukt_eigene",{}) || {}, liste=m[key]||[];
  if(liste.indexOf(wert)<0){ liste.push(wert); m[key]=liste.slice(-30); lsSet("ukt_eigene",m); }
}
function feldGilt(f, a){ return (!f.gruppe.wenn || f.gruppe.wenn(a)) && (!f.wenn || f.wenn(a)); }
/* was an Pflichtangaben noch fehlt */
function anlageLuecken(a){
  return ANLAGE_FELDER.filter(function(f){ return !f.gruppe.optional && feldGilt(f,a) && leerWert(a[f.k]); });
}
var INNEN_FELDER=[["raum","Raum / Bezeichnung","z. B. Verkaufsraum 1"],["hersteller","Hersteller",""],
  ["modell","Modell",""],["seriennummer","Seriennummer",""],["leistungKw","Leistung (kW)","z. B. 5,6"]];
function innenText(liste){
  liste=(Array.isArray(liste)?liste:[]).filter(innenBelegt);
  if(!liste.length) return "–";
  return liste.map(function(g,i){
    var d=[g.hersteller, g.modell, g.seriennummer?"SN "+g.seriennummer:"",
      leerWert(g.leistungKw)?"":String(g.leistungKw).replace(".",",")+" kW"].filter(Boolean).join(" ");
    return (g.raum||"Innengerät "+(i+1))+(d?": "+d:"");
  }).join("; ");
}
function innenBelegt(g){ return g && INNEN_FELDER.some(function(f){ return !leerWert(g[f[0]]); }); }
/* Für den Änderungsverlauf: Zugangsdaten der Regelung (Adresse, Benutzer,
   Passwort) nie mit Wert – der Verlauf ist für alle Angemeldeten lesbar und
   lässt sich nicht löschen. Festgehalten wird nur, DASS sie geändert wurden. */
function verlaufWert(f, w){
  if(istGeheim(f.k)) return leerWert(w) ? "–" : "•••••••• (vertraulich)";
  return anlageWertText(f, w);
}
function anlageWertText(f, w){
  if(f.t==="innen") return innenText(w);
  if(leerWert(w)) return "–";
  if(f.t==="kg") return String(w).replace(".",",")+" kg";
  if(f.t==="kw") return String(w).replace(".",",")+" kW";
  if(f.t==="dez") return String(w).replace(".",",")+(f.e?" "+f.e:"");
  if(f.t==="datum") return dfmt(w);
  if(f.k==="dichtheitMonate") return w==="nz" ? "nicht zutreffend" : w+" Monate";
  /* Übersicht und Änderungsverlauf halten fest, DASS ein Passwort gesetzt
     wurde – nicht, wie es lautet. Zum Nachsehen gibt es „ändern“. */
  if(f.t==="geheim") return "••••••••";
  return String(w);
}
/* kurze Zusammenfassung für Karten, Detailansicht und Druck */
function anlageKurz(a){
  var t=[];
  if(a.bauart) t.push(a.bauart);
  if(a.kreislaeufe) t.push(a.kreislaeufe+" Kältekreis"+(+a.kreislaeufe===1?"":"e"));
  if(a.kaeltemittelArt||!leerWert(a.kaeltemittelKg)) t.push([a.kaeltemittelArt, leerWert(a.kaeltemittelKg)?"":String(a.kaeltemittelKg).replace(".",",")+" kg"].filter(Boolean).join(" "));
  if(!leerWert(a.leistungKw)) t.push(String(a.leistungKw).replace(".",",")+" kW");
  var co2=co2Tonnen(a); if(co2) t.push(String(co2).replace(".",",")+" t CO₂e");
  if(a.pruefbuch==="ja") t.push("Prüfbuch"+(a.ortPruefbuch?" ("+a.ortPruefbuch+")":""));
  if(istWassergekuehlt(a) && (a.rkUkt||a.pumpeUkt))
    t.push("RK "+(a.rkUkt==="ja"?"UKT":"fremd")+" · Pumpen "+(a.pumpeUkt==="ja"?"UKT":"fremd"));
  if(a.regelung) t.push(a.regelung===OHNE_REGELUNG ? "ohne eigene Regelung"
    : a.regelung+(a.regelungFirma?" ("+(a.regelungFirma==="UKT"?"UKT":(a.regelungFirmaName||"andere Firma"))+")":"")+
      (a.fernzugriff?" · Fernzugriff "+a.fernzugriff:""));
  if(a.ortAussen) t.push("Außengeräte: "+a.ortAussen);
  return t.join(" · ");
}

/* Geführte Erfassung einer Anlage. Fragt nur die Gruppen ab, in denen etwas
   fehlt, und endet mit einer Übersicht, in der sich alles ändern lässt.
   Liefert die vollständigen Werte oder null (abgebrochen). */
function anlageAssistent(start, titel, neu, alles){
  return new Promise(function(fertig){
    var a=Object.assign({}, start);
    /* eigene Kopie der Termine – der Vergleich mit dem Stand vorher braucht das Original */
    if(start._termine) a._termine=start._termine.map(function(t){ return Object.assign({}, t); });
    var ov=el('<div class="assistent" role="dialog" aria-modal="true"><div class="as-karte">'+
      '<div class="as-kopf"><div style="min-width:0"><div class="as-titel"></div><div class="as-schritt"></div></div>'+
        '<button class="btn ghost sm" type="button" data-as="zu">Abbrechen</button></div>'+
      '<div class="as-inhalt"></div><div class="as-fuss"></div></div></div>');
    document.body.appendChild(ov);
    document.body.style.overflow="hidden";
    var inhalt=ov.querySelector(".as-inhalt"), fuss=ov.querySelector(".as-fuss");
    var schliessen=function(wert){ ov.remove(); document.body.style.overflow=""; fertig(wert); };
    var anfangA=JSON.stringify(a);
    ov.querySelector('[data-as="zu"]').onclick=function(){
      /* Eingetragenes (auch von der KI Übernommenes) nicht still wegwerfen */
      if(JSON.stringify(a)!==anfangA && !window.confirm("Die eingetragenen Anlagendaten verwerfen?")) return;
      schliessen(null);
    };

    /* Schritte: bei einer neuen Anlage zuerst die Bezeichnung, dann jede
       Gruppe, in der eine Pflichtangabe fehlt */
    var gruppenMitLuecke=function(){
      var fehl=anlageLuecken(a);
      var pflicht=ANLAGE_GRUPPEN.filter(function(g){ return fehl.some(function(f){ return f.gruppe===g; }); });
      /* Freiwilliges zum Schluss: wer gerade vor dem Typenschild steht, soll
         es eintragen können, ohne dafür in die Verwaltung zu wechseln.
         Überspringen geht in jedem Schritt. */
      var frei=ANLAGE_GRUPPEN.filter(function(g){
        return g.optional && (!g.wenn || g.wenn(a)) && g.felder.some(function(f){
          return feldGilt(Object.assign({gruppe:g}, f), a) && leerWert(a[f.k]); });
      });
      return pflicht.concat(frei);
    };
    /* „alles“: der Aufruf kommt nicht aus einem Protokoll, sondern vom Knopf an
       der Anlage. Dann geht es ums Prüfen und Korrigieren, nicht nur ums
       Nachtragen – also jede Gruppe zeigen, die zur Anlage passt. */
    var alleGruppen=function(){
      return ANLAGE_GRUPPEN.filter(function(g){ return !g.wenn || g.wenn(a); });
    };
    /* Termine als eigener Schritt: beim Prüfen immer, beim Ergänzen nur, wenn
       dort etwas fehlt – sonst stehen sie in der Übersicht */
    var termineZeigenNoetig=function(){ return !!a._termine && (alles || !a.inbetriebnahme || a._termine.some(function(t){ return !t.intervallCode || !+t.monat; })); };
    var schritte=(neu?["name"]:[]).concat(alles?alleGruppen():gruppenMitLuecke()).concat(termineZeigenNoetig()?["termine"]:[]);
    var pos=0, zurUebersicht=false;

    /* Prüfbuch oder Typenschild fotografieren und lesen lassen. Was die KI
       findet, wird angezeigt und nur übernommen, was angehakt bleibt; die
       Übernahme landet im Dialog, gespeichert wird wie sonst auch erst mit
       „Übernehmen“. Prüfungen aus dem Prüfbuch werden zu Wartungen laut
       Prüfbuch. */
    /* der Markt der Anlage – für die Einordnung durch die KI */
    function kiMarkt(){
      var lp=a._leaderId ? ALLE_POS.filter(function(x){ return x.id===a._leaderId; })[0] : null;
      return byId[a.standortId] || (lp && byId[lp.standortId]) || null;
    }
    function kiEinlesen(){
      var w=ansichtOeffnen("Aus Fotos lesen");
      w.schritt.textContent="Was ist auf den Fotos?";
      var reihe=el('<div class="stack"><button class="btn" type="button" data-kiart="pruefbuch">Prüfbuch – eine oder mehrere Seiten</button>'+
        '<button class="btn" type="button" data-kiart="typenschild" data-geraet="aussen">Typenschild Außengerät</button>'+
        '<button class="btn ghost" type="button" data-kiart="typenschild" data-geraet="innen">Typenschilder Innengeräte – eins oder mehrere</button>'+
        '<div class="muted" style="font-size:12.5px">Prüfbuch-Seiten dürfen in einem Rutsch fotografiert werden (bis 12 Bilder). '+
        "Die Füllmenge der Anlage kommt aus dem Prüfbuch – auf dem Typenschild steht nur die Werksfüllung.</div></div>");
      reihe.querySelectorAll("[data-kiart]").forEach(function(b){ b.onclick=function(){ w.zu(); kiArt(b.dataset.kiart, b.dataset.geraet); }; });
      w.inhalt.appendChild(reihe);
    }
    function kiArt(art, geraet){
      /* Ohne eigenen KI-Zugang: über die Claude-App kopieren – gleiche Prüfansicht */
      if(!kiAn()){
        kiKopierweg(art, kiKontext(kiMarkt(), a)).then(function(d){ if(d) verarbeiten({daten:d}); });
        return;
      }
      kiFotosWaehlen().then(function(dateien){
        if(!dateien.length) return;
        if(dateien.length>12){ toast("Höchstens 12 Bilder auf einmal."); return; }
        kopf("KI liest "+dateien.length+" Bild"+(dateien.length===1?"":"er")+" …", "bitte warten");
        return kiLesen(art, dateien, kiKontext(kiMarkt(), a)).then(verarbeiten, function(e){ toast(e.message); uebersicht(); });
      });
      function verarbeiten(erg){
          var d=erg.daten||{};
          if(art==="typenschild" && geraet==="innen") return kiInnen(d);
          /* Außengerät: das Schild, das die KI als außen erkennt, sonst das erste */
          if(art==="typenschild"){
            var gl=Array.isArray(d.geraete)?d.geraete:[];
            var ag=gl.filter(function(x){ return x.art==="aussen"; })[0] || gl.filter(function(x){ return x.art!=="innen"; })[0] || null;
            /* nur Innengeräte auf den Fotos: nicht als Außengerät übernehmen */
            if(!ag){ toast(gl.length ? "Auf den Fotos ist nur ein Innengerät-Typenschild – bitte „Typenschilder Innengeräte“ wählen." : "Kein Typenschild erkannt."); uebersicht(); return; }
            /* unsicher „geraet N: feld“ gilt nur, wenn N das Außengerät ist */
            var agNr=gl.indexOf(ag)+1;
            var unsA=(d.unsicher||[]).map(function(u){ var m=/geraet\s*(\d+)\s*:\s*(\w+)/i.exec(u); return m ? (+m[1]===agNr ? m[2] : null) : u; }).filter(Boolean);
            /* Werksfüllung ist nicht die Füllmenge der Anlage – die bleibt dem Prüfbuch */
            d={anlage:{hersteller:ag.hersteller, modell:ag.modell, seriennummer:ag.seriennummer, kaeltemittelArt:ag.kaeltemittelArt,
               leistungKw:ag.leistungKw, psBar:ag.psBar}, unsicher:unsA,
               hinweise:[d.hinweise, gl.length>1?"Auf den Fotos sind "+gl.length+" Typenschilder – übernommen wird das Außengerät; Innengeräte über „Typenschilder Innengeräte“.":"",
                 ag.werksfuellungKg?"Werksfüllung laut Schild: "+ag.werksfuellungKg+" kg (nicht die Füllmenge der Anlage).":""].filter(Boolean).join(" ")};
          }
          var gelesen=kiAnlage(d.anlage);
          var felder=ANLAGE_FELDER.filter(function(f){ return !f.gruppe.geheim; }).map(function(f){
            return {k:f.k, l:f.l, zeige:function(w){ return anlageWertText(f,w); }}; });
          felder.unshift({k:"anlagentyp", l:"Bezeichnung"});
          if(a._termine) felder.push({k:"inbetriebnahme", l:"Inbetriebnahme", zeige:dfmt});
          var nw=kiNachweise(d.pruefungen);
          /* nur anbieten, was die Anlage noch nicht hat (derselbe Besuch zählt einmal) */
          var lp=a._leaderId ? ALLE_POS.filter(function(x){ return x.id===a._leaderId; })[0] : null;
          if(lp){
            var schon=besucheDerAnlage(lp);
            /* auch innerhalb der Antwort denselben Besuch nur einmal anbieten */
            nw.voll=nw.voll.filter(function(n){
              if(schon.some(function(dd){ return gleicherBesuch(dd,n.datum); })) return false;
              schon.push(n.datum); return true; });
          }
          if(nw.voll.length){
            gelesen._nachweise=nw.voll;
            felder.push({k:"_nachweise", l:"Wartungen laut Prüfbuch", q:"pruefungen", zeige:function(l){
              return (l||[]).map(function(n){ return dfmt(n.datum)+(n.techniker?" ("+n.techniker+")":""); }).join(", "); }});
          }
          /* Wartungsintervall laut Prüfbuch gegen die Termine: 12 Monate = eine
             Jahreswartung. Nur das Kürzel wird angeboten – der Soll-Monat bleibt,
             Termine dazunehmen oder streichen geht in der Verwaltung. */
          var intervallHinweis="";
          var mon=kiZahl(d.anlage && d.anlage.wartungsintervallMonate);
          if(art==="pruefbuch" && mon && a._termine){
            var tl=a._termine;
            if(mon===12 && tl.length===1 && tl[0].intervallCode!=="JW"){
              gelesen._intervall="JW";
              felder.push({k:"_intervall", l:"Termin laut Prüfbuch", q:"wartungsintervallMonate",
                zeige:function(){ return "Jahreswartung (JW) – im Prüfbuch alle 12 Monate; der Soll-Monat bleibt"; }});
            } else if(mon===12 && tl.length>1){
              intervallHinweis="Laut Prüfbuch jährlich (12 Monate), eingetragen sind aber "+tl.length+" Termine – bitte in der Verwaltung prüfen.";
            } else if(mon===6 && tl.length<2){
              intervallHinweis="Laut Prüfbuch halbjährlich (6 Monate), eingetragen ist nur ein Termin – den zweiten bitte in der Verwaltung anlegen.";
            }
          }
          var hinweis=[d.hinweise, intervallHinweis, nw.ohneTag.length?"Ohne Tag, kommt als Notiz: "+nw.ohneTag.join(", "):""].filter(Boolean).join(" ");
          return kiPruefen(art==="pruefbuch"?"Prüfbuch":"Typenschild Außengerät", gelesen, a, felder, d.unsicher, hinweis).then(function(wahl){
            if(!wahl){ uebersicht(); return; }
            Object.keys(wahl).forEach(function(k){
              if(k==="_nachweise") a._nachweiseNeu=(a._nachweiseNeu||[]).concat(wahl[k]);
              else if(k==="_intervall") a._termine.forEach(function(t){ t.intervallCode=wahl[k]; });
              else a[k]=wahl[k];
            });
            if(nw.ohneTag.length && wahl._nachweise) a._notizDazu="Laut Prüfbuch außerdem (ohne Tag): "+nw.ohneTag.join(", ")+".";
            toast(Object.keys(wahl).length+" Angabe"+(Object.keys(wahl).length===1?"":"n")+" übernommen – bitte prüfen und dann „Übernehmen“.");
            uebersicht();
          });
      }
    }
    /* Innengeräte vom Typenschild: je Gerät ein Haken. Schon erfasste
       Seriennummern werden nicht doppelt angeboten; übernommen wird ans Ende
       der Liste, den Raum trägt man danach ein. */
    function kiInnen(d){
      /* Nummern wie in der Antwort der KI („geraet 3“), auch wenn Außengeräte wegfallen */
      var gl=(Array.isArray(d.geraete)?d.geraete:[]).map(function(x){ return x.art==="aussen" ? null : x; });
      var da=(Array.isArray(a.innengeraete)?a.innengeraete:[]).map(function(g){ return String(g.seriennummer||"").trim().toUpperCase(); }).filter(Boolean);
      var gelesen={}, felder=[], doppelt=0;
      gl.forEach(function(x, i){
        if(!x) return;
        var sn=String(x.seriennummer||"").trim();
        if(sn && da.indexOf(sn.toUpperCase())>=0){ doppelt++; return; }
        if(sn) da.push(sn.toUpperCase());   /* dasselbe Schild zweimal in der Antwort: einmal */
        var g={hersteller:String(x.hersteller||"").trim(), modell:String(x.modell||"").trim(), seriennummer:sn,
               leistungKw:kiZahl(x.leistungKw)};
        if(!innenBelegt(g)) return;
        gelesen["_innen"+i]=g;
        felder.push({k:"_innen"+i, l:"Innengerät "+(felder.length+1), q:"geraet "+(i+1),
          zeige:function(w){ return innenText([w]).replace(/^Innengerät 1: /,""); }});
      });
      var hinweis=[d.hinweise, doppelt?doppelt+" Gerät"+(doppelt===1?" ist":"e sind")+" schon erfasst (gleiche Seriennummer).":""].filter(Boolean).join(" ");
      /* unsichere Angaben je Gerät („geraet 2: seriennummer“) markieren das ganze Gerät */
      var alleNr=gl.map(function(x,i){ return x ? "geraet "+(i+1) : null; }).filter(Boolean);
      var uns=[];
      (d.unsicher||[]).forEach(function(u){
        var m=/geraet\s*(\d+)/i.exec(u);
        /* ohne Gerätenummer: bei einem Gerät dieses, sonst sicherheitshalber alle */
        if(m) uns.push("geraet "+m[1]); else uns=uns.concat(alleNr);
      });
      return kiPruefen("Typenschilder Innengeräte", gelesen, {}, felder, uns, hinweis).then(function(wahl){
        if(wahl && Object.keys(wahl).length){
          a.innengeraete=(Array.isArray(a.innengeraete)?a.innengeraete:[]).map(function(g){ return Object.assign({},g); })
            .concat(Object.keys(wahl).sort(function(x,y){ return +x.slice(6)-+y.slice(6); }).map(function(k){ return wahl[k]; }));
          toast(Object.keys(wahl).length+" Innengerät"+(Object.keys(wahl).length===1?"":"e")+" übernommen – Raum bitte ergänzen, dann „Übernehmen“.");
        }
        uebersicht();
      });
    }
    /* Termine prüfen: Inbetriebnahme der Anlage, je Termin Kürzel und
       Soll-Monat. Dieselbe Regel wie in der Verwaltung – weicht der
       Soll-Monat von der Inbetriebnahme ab, gilt er trotzdem, will aber
       begründet sein. */
    var normCode=function(k){ k=String(k||"").trim().toUpperCase(); return k==="HW"?"HJW":(k.indexOf("HI")===0?"HJI":k); };
    var KURZ_TEXT={JW:"Jahreswartung", HJW:"Halbjahreswartung", HJI:"Halbjahresinspektion"};
    function terminRegel(t){ var c=normCode(t.intervallCode); return a.inbetriebnahme ? sollMonatVorschlag(a.inbetriebnahme, c==="HJW"||c==="HJI") : 0; }
    function termineZeigen(){
      var h='<div class="as-frage">Stimmen Inbetriebnahme und Termine?</div>'+

      a._termine.forEach(function(t,i){

        h+='<div class="as-feld" data-ti="'+i+'"><div class="as-label">Termin '+(a._termine.length>1?(i+1):"")+
            (t.naechste?' <span style="font-weight:400;text-transform:none;letter-spacing:0"> · nächster '+esc(dfmt(t.naechste))+"</span>":"")+"</div>"+
          '<div class="chips">'+["JW","HJW","HJI"].map(function(k){
            return '<button class="chip" type="button" data-code="'+k+'" aria-pressed="'+(c===k)+'">'+k+" · "+KURZ_TEXT[k]+"</button>"; }).join("")+"</div>"+
          '<select data-monat style="margin-top:8px;width:100%"><option value="0">Soll-Monat – fehlt</option>'+
            MONATE_L.slice(1).map(function(m,j){ return '<option value="'+(j+1)+'"'+(+t.monat===j+1?" selected":"")+">Soll-Monat "+m+"</option>"; }).join("")+
          "</select>"+
          '<div class="as-hinweis" data-regel></div>'+
          '<input type="text" data-grund placeholder="Warum abweichend? z. B. passt besser in die Tour" value="'+esc(t.monatGrund||"")+'" hidden style="margin-top:6px">'+
        "</div>";
      });
      h+='<div class="muted" style="font-size:12.5px">Einen Termin dazunehmen oder streichen geht in der Verwaltung.</div>';
      inhalt.innerHTML=h;
      var hinweise=function(){
        inhalt.querySelectorAll("[data-ti]").forEach(function(box){
          var t=a._termine[+box.dataset.ti], regel=terminRegel(t), m=+t.monat||0;

          } else if(m!==regel){

          if(n) n.onclick=function(){ t.monat=regel; box.querySelector("[data-monat]").value=String(regel); hinweise(); };
        });

      inhalt.querySelector("[data-ib]").onchange=function(){
        var v=this.value;
        if(v && v>isoLokal(new Date())){ toast("Die Inbetriebnahme kann nicht in der Zukunft liegen."); this.value=a.inbetriebnahme||""; return; }
        a.inbetriebnahme=v||null; hinweise();
      };
      inhalt.querySelectorAll("[data-ti]").forEach(function(box){
        var t=a._termine[+box.dataset.ti];
        box.querySelectorAll("[data-code]").forEach(function(c){
          c.onclick=function(){
            t.intervallCode=c.dataset.code;
            box.querySelectorAll("[data-code]").forEach(function(x){ x.setAttribute("aria-pressed", String(x===c)); });
            hinweise();

        box.querySelector("[data-grund]").oninput=function(){ t.monatGrund=this.value.trim(); };
      });

/* ----------------------------------------------------------------
   Protokolle auf dem Gerät. IndexedDB statt localStorage: localStorage
   fasst nur rund 5 MB und scheitert dann still – mit Fotos und
   Unterschrift ist das nach wenigen Protokollen voll.
   ---------------------------------------------------------------- */
var IDB=null;
var lokaleProtokolle=[];   // [{id, doc, fotos, erstellt}]

function idbOeffnen(){
  return new Promise(function(ok,nok){
    if(!window.indexedDB){ nok(new Error("Dieser Browser kann keine Daten dauerhaft speichern.")); return; }
    var r;
    try{ r=indexedDB.open("ukt-wartung",4); }catch(e){ nok(e); return; }
    r.onupgradeneeded=function(){
      var db=r.result;
      if(!db.objectStoreNames.contains("protokolle")) db.createObjectStore("protokolle",{keyPath:"id"});
      /* Version 2: Änderungsverlauf */
      if(!db.objectStoreNames.contains("aenderungen")) db.createObjectStore("aenderungen",{keyPath:"id"});
      /* Version 3: Stammdaten-Änderungen aus der Verwaltung */
      if(!db.objectStoreNames.contains("stammdaten")) db.createObjectStore("stammdaten",{keyPath:"id"});
      /* Version 4: angefangene Protokolle, die noch nicht abgeschickt sind */
      if(!db.objectStoreNames.contains("entwurf")) db.createObjectStore("entwurf",{keyPath:"id"});
    };
    r.onsuccess=function(){ IDB=r.result; ok(IDB); };
    r.onerror=function(){ nok(r.error||new Error("Gerätespeicher nicht verfügbar")); };
  });
}
function idbVorgang(modus, arbeit, ablage){
  if(typeof demo==="function" && demo() && modus==="readwrite") return Promise.resolve(undefined);
  return new Promise(function(ok,nok){
    if(!IDB){ nok(new Error("Gerätespeicher nicht geöffnet")); return; }
    ablage=ablage||"protokolle";
    var tx=IDB.transaction(ablage,modus), st=tx.objectStore(ablage), erg;
    try{ erg=arbeit(st); }catch(e){ nok(e); return; }
    tx.oncomplete=function(){ ok(erg && "result" in erg ? erg.result : undefined); };
    tx.onerror=function(){ nok(tx.error||new Error("Speichern auf dem Gerät fehlgeschlagen")); };
    tx.onabort=function(){ nok(tx.error||new Error("Gerätespeicher voll")); };
  });
}

/* zentral abgelegte und gerätegespeicherte Protokolle in einer Liste */
function alleProtokolle(mitGeloeschten){
  /* wird schon beim Start für die Fälligkeiten gebraucht, bevor Listen geladen sind */
  var zentral=(protokolle||[]).map(function(p){ return Object.assign({_quelle:"zentral"},p); });
  var lokal=(lokaleProtokolle||[]).map(function(e){
    return Object.assign({_quelle:"geraet", _id:e.id, _fotoDaten:e.fotos||[],
                          _auftragDaten:e.auftrag||null, _rapportDaten:e.rapport||null}, e.doc);
  });
  /* Gelöschte zählen nirgends mit – weder in Listen noch als Wartungsnachweis.
     Nur die Verwaltung holt sie zum Wiederherstellen dazu. */
  return lokal.concat(zentral)
    .filter(function(p){ return mitGeloeschten || !p.geloescht; })
    .sort(function(a,b){
      return ((b.datum||"")+(b.erstellt||"")).localeCompare((a.datum||"")+(a.erstellt||""));
    });
}

/* Löschen = als gelöscht markieren. Das Protokoll verschwindet aus allen
   Listen und Berechnungen, bleibt aber mit Grund nachvollziehbar und lässt
   sich wiederherstellen. Nur für Admins. */
function protokollLoeschen(p, grund, wiederher){
  var jetzt=new Date().toISOString(), von=wer(), id=p._id;
  var felder = wiederher
    ? {geloescht:null, geloeschtVon:null, loeschGrund:null}
    : {geloescht:jetzt, geloeschtVon:von, loeschGrund:grund};
  var fertig=function(ok){
    if(!ok) return false;
    protokolliere({art: wiederher?"wiederhergestellt":"geloescht", protokollId:id,
      standortId:p.standortId, standortName:p.standortName, grund:grund,
      felder:[{feld:"datum", name:"Protokoll vom", alt:dfmt(p.datum), neu: wiederher?"wiederhergestellt":"gelöscht"}]});
    /* Die Störung, die dieses Protokoll erledigt hatte, ist ohne das Protokoll
       wieder offen – sonst wäre sie still verschwunden. Beim Wiederherstellen
       ist sie wieder erledigt. Die Verknüpfung (protokollId) bleibt dafür stehen. */
    OFFENE.filter(function(x){ return x.protokollId===id && (wiederher ? !x.erledigt : !!x.erledigt); }).forEach(function(x){
      var z=Object.assign({}, x, {erledigt: wiederher ? jetzt : null});
      stoerungSpeichern(z, wiederher ? "Störungsprotokoll wiederhergestellt – wieder erledigt" : "Störungsprotokoll gelöscht – Störung wieder offen")
        .then(function(wo){
          if(wo===false) return;
          stoerungVerlauf(z, wiederher ? "Störungsprotokoll wiederhergestellt" : "Störungsprotokoll gelöscht – Störung wieder offen",
            wiederher ? "offen" : "erledigt", wiederher ? "erledigt" : "offen");
          berechneFaelligkeiten(); render();
        });
    });
    return true;
  };
  if(demo()){
    protokolle=protokolle.map(function(x){ return x._id===id ? Object.assign({}, x, felder, {version:(p.version||1)+1}) : x; });
    return Promise.resolve(fertig(true));
  }
  if(Store.modus==="supabase" && Store.sb){
    var zeile={geloescht:felder.geloescht, geloescht_von:felder.geloeschtVon, loesch_grund:felder.loeschGrund,
      version:(p.version||1)+1, geaendert:jetzt,
      korrektur_grund:(wiederher?"Wiederhergestellt: ":"Gelöscht: ")+grund};
    return Store.sb.from("protokolle").update(zeile).eq("client_id",id).select("client_id").then(function(r){
      if(r.error){
        Store.fehler = /column|geloescht/i.test(r.error.message)
          ? "Die Datenbank kennt das Löschen noch nicht – bitte das Einrichtungsskript in Supabase erneut ausführen."
          : r.error.message;
        return false;
      }
      if(!r.data || !r.data.length){ Store.fehler="Die Datenbank hat das Löschen abgelehnt – nur Admins dürfen löschen."; return false; }
      ladeProtokolle();
      return fertig(true);
    }, function(){ Store.fehler="Keine Verbindung."; return false; });
  }
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).update(Object.assign({version:(p.version||1)+1, geaendert:jetzt}, felder))
      .then(function(){ return fertig(true); }, function(){ Store.fehler="Speichern fehlgeschlagen."; return false; });
  }
  Store.fehler="Keine gemeinsame Ablage verbunden.";
  return Promise.resolve(false);
}

function feldText(feld, wert){

  if(feld==="datum") return dfmt(wert);
  if(feld==="rapport") return wert.name||"rapport.pdf";
  if(feld==="positionIds") return wert.map(function(id){
    var p=null; for(var i=0;i<POS.length;i++){ if(POS[i].id===id){ p=POS[i]; break; } }
    return p?anlagenName(p):id; }).join(", ");
  if(feld==="maengel") return wert.map(function(m){ return m.text+(m.prio?" ("+m.prio+")":""); }).join("; ");
  if(feld==="unterschrift") return "vorhanden";
  if(feld==="fotos") return wert.length+" Foto(s)";
  if(feld==="anlagen") return wert.length+" Anlage(n) erfasst";

function gleich(a,b){

function vergleiche(alt, neu){
  var felder=[];
  Object.keys(FELDNAMEN).forEach(function(k){
    if(!gleich(alt[k],neu[k])) felder.push({feld:k, name:FELDNAMEN[k], alt:feldText(k,alt[k]), neu:feldText(k,neu[k])});
  });
  /* Angaben zur Störung einzeln, damit der Verlauf zeigt, was genau geändert wurde */
  var sa=alt.stoerung||{}, sn=neu.stoerung||{};
  Object.keys(STOER_NAMEN).forEach(function(k){
    if(gleich(sa[k],sn[k]) || (!sa[k]&&!sn[k])) return;
    var txt=function(w){
      if(k==="material") return (w||[]).map(function(m){ return m.text+(m.menge?" ("+m.menge+")":""); }).join("; ")||"–";
      if(k==="folgeauftrag") return w?"ja":"nein";

function protokolliere(ev){
  if(demo()){ ev.id=ev.id||"e_"+Date.now().toString(36); ev.zeit=ev.zeit||new Date().toISOString(); ev.von=ev.von||wer(); aenderungen.unshift(ev); rueckPuffer={}; return Promise.resolve(); }
  ev.id = ev.id || "e_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  /* Stammdaten-Änderung: den Stand davor mitgeben, damit sie sich zurücknehmen lässt */
  if(ev.art==="stammdaten" && !ev.rueck && Object.keys(rueckPuffer).length){ ev.rueck=rueckPuffer; rueckPuffer={}; }
  ev.zeit = ev.zeit || new Date().toISOString();
  ev.von = ev.von || wer();
  aenderungen.unshift(ev);
  var lokal=function(){
    return idbVorgang("readwrite",function(st){ return st.put(ev); },"aenderungen").catch(function(){});
  };
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("aenderungen/"+ev.id).set(ev).then(function(){}, lokal);
  }
  if(Store.modus==="supabase" && Store.sb){
    var senden=function(){ return Store.sb.from("aenderungen").insert(aenderungZeile(ev)); };
    return senden().then(function(r){
      /* Spalte rueck fehlt noch (SQL nicht gelaufen): ohne sie senden */
      if(r.error && rueckSpalte && /rueck/.test(r.error.message||"")){ rueckSpalte=false; return senden(); }
      return r;

  if(Store.modus==="supabase" && Store.sb){
    zentral=Store.sb.from("aenderungen").select("*").order("zeit",{ascending:false}).limit(300).then(function(r){
      return (r.data||[]).map(function(x){ return {id:x.client_id||x.id, zeit:x.zeit, art:x.art,
        protokollId:x.protokoll_id, standortId:x.standort_id, standortName:x.standort_name, rueck:x.rueck||null,
        von:x.von, grund:x.grund, felder:x.felder||[]}; });
    }, function(){ return []; });
  } else if(Store.modus==="claude" && Store.claudeDb){
    zentral=Store.claudeDb.collection("aenderungen").orderBy("zeit","desc").limit(300).get().then(function(s){
      return (s.docs||[]).map(function(d){ return d.data(); });
    }, function(){ return []; });
  }
  return Promise.all([lokal,zentral]).then(function(r){
    var alle={};
    r[0].concat(r[1]).forEach(function(e){ if(e&&e.id) alle[e.id]=e; });
    /* Präsentation: was in dieser Sitzung ausprobiert wurde, steht nur im Speicher */
    if(demo()) aenderungen.forEach(function(e){ if(e&&e.id) alle[e.id]=e; });
    aenderungen=Object.keys(alle).map(function(k){ return alle[k]; })
      .sort(function(a,b){ return (b.zeit||"").localeCompare(a.zeit||""); });
    return aenderungen;
  });
}

/* ----------------------------------------------------------------
   Stammdaten-Änderungen aus der Verwaltung. Sie liegen als eigene Ebene
   über der Excel-Liste: je Markt bzw. Anlage ein Datensatz mit den Feldern,
   die vom Excel-Stand abweichen. Löscht man ihn, gilt wieder Excel.
   ---------------------------------------------------------------- */
var stammUeber = {};   // "standort:S5" | "position:P9" | "stoerung:<id>" -> {id, typ, ziel, felder, neu, geaendert, von, grund}

/* ----------------------------------------------------------------
   Offene Störungen. Lidl schickt einen Auftrag, gearbeitet wird oft erst
   Tage später. Bis dahin steht die Störung hier: sie hängt am Markt,
   erscheint unter „Fällig“ ganz oben und wird mit einem Griff zum
   Störungsprotokoll. Abgelegt werden sie wie Stammdaten-Änderungen, damit
   sie ohne eigene Tabelle auf allen Geräten stehen.
   ---------------------------------------------------------------- */
var OFFENE=[];
function offeneStoerungen(nurOffen){
  return OFFENE.filter(function(o){ return !nurOffen || !o.erledigt; })
    .sort(function(a,b){
      /* was zuerst fällig ist, steht oben; ohne Zieltermin nach hinten */
      var x=a.zieltermin||"9999", y=b.zieltermin||"9999";
      return x.localeCompare(y) || String(b.erfasstAm||"").localeCompare(String(a.erfasstAm||""));
    });
}
function stoerungVonMarkt(sid){ return offeneStoerungen(true).filter(function(o){ return o.standortId===sid; }); }
function stoerungSpeichern(o, grund){
  var rec={id:o._id, typ:"stoerung", ziel:o.standortId||"", neu:false,
    felder:auswahl(o, STOER_OFFEN_FELDER), geaendert:new Date().toISOString(), von:wer(), grund:grund||""};
  /* schlägt das Speichern fehl, gilt wieder der alte Stand – die Anzeige soll
     nicht zeigen, was nirgends gespeichert ist */
  var altU=stammUeber[rec.id], altS=stammStand[rec.id];
  stammUeber[rec.id]=rec;
  return stammSpeichern(rec).then(function(wo){
    if(wo===false){
      if(altU) stammUeber[rec.id]=altU; else delete stammUeber[rec.id];
      if(altS) stammStand[rec.id]=altS; else delete stammStand[rec.id];
    }
    wendeStammdatenAn(); return wo;
  });
}
/* Jede Statusänderung einer Störung (abgehakt, gelöscht, per Protokoll
   erledigt) bekommt ihren eigenen Eintrag im Änderungsverlauf. So nimmt
   „Rückgängig“ genau diese Änderung zurück – und keine andere Änderung
   trägt den Stand davor stillschweigend mit. */
function stoerungVerlauf(o, grund, alt, neu){
  return protokolliere({art:"stammdaten", standortId:o.standortId, standortName:stName(byId[o.standortId]||{}),
    grund:grund+(o.auftragsnummer?" – Auftrag "+o.auftragsnummer:""),
    felder:[{feld:"stoerung", name:"Offene Störung", alt:alt, neu:neu}]});
}
var STOER_OFFEN_FELDER=["auftragsnummer","stoerungsnr","filialCode","problemtyp","beschreibung",
  "zieltermin","auftragsdatum","prioritaet","lidlTyp","lidlModell","hersteller","lin","seriennummer",
  "lidlKontakt","lidlTelefon","lidlMail","notiz","seiten","pdfName","pdfDaten","termin","terminZeit","terminTechniker","ohneAuftrag","positionId","qrInhalt",
  "erledigt","protokollId","quelle"];

function wendeStammdatenAn(){
  /* 1. alles auf den Excel-Stand zurück */
  ALLE_ST = ALLE_ST.filter(function(s){ return !s._neu; });
  ALLE_POS = ALLE_POS.filter(function(p){ return !p._neu; });
  ALLE_ST.forEach(function(s){ Object.assign(s, EXCEL["standort:"+s.id]); s._geaendert=false; });
  ALLE_POS.forEach(function(p){ Object.assign(p, EXCEL["position:"+p.id]); p._geaendert=false; });

  /* 2. Änderungen darüberlegen – Märkte zuerst, damit neue Anlagen ihren Markt finden */
  OFFENE=[];
  var rang=function(k){ return k.indexOf("standort:")===0 ? 0 : 1; };
  var schluessel=Object.keys(stammUeber).sort(function(a,b){ return rang(a)-rang(b); });
  schluessel.forEach(function(k){
    var r=stammUeber[k], ziel=null, i;
    /* Offene Störungen hängen an keinem Datensatz – sie sind eigene Einträge */
    if(r.typ==="stoerung"){
      OFFENE.push(Object.assign({_id:r.id, standortId:r.ziel, erfasstAm:r.geaendert, erfasstVon:r.von}, r.felder));
      return;
    }
    if(r.typ==="standort"){
      for(i=0;i<ALLE_ST.length;i++){ if(ALLE_ST[i].id===r.ziel){ ziel=ALLE_ST[i]; break; } }
      if(!ziel && r.neu){ ziel={id:r.ziel, _neu:true, pos:[], genauigkeit:"manuell", aktiv:true, name:""}; ALLE_ST.push(ziel); }
    } else {
      for(i=0;i<ALLE_POS.length;i++){ if(ALLE_POS[i].id===r.ziel){ ziel=ALLE_POS[i]; break; } }
      if(!ziel && r.neu){ ziel={id:r.ziel, _neu:true, historie:[], techniker:{}, aktiv:true}; ALLE_POS.push(ziel); }
    }
    if(!ziel) return;
    Object.assign(ziel, r.felder);
    ziel._geaendert=true;
  });

  /* 3. abgeleitete Werte nachziehen */
  ALLE_POS.forEach(function(p){
    var ex=EXCEL["position:"+p.id];
    p.monat = p.monat ? +p.monat : 0;
    p.baujahr = p.inbetriebnahme ? +String(p.inbetriebnahme).slice(0,4) : null;
    /* Wartungen laut Prüfbuch: nachgetragene Termine, die in der Excel-Liste
       fehlen. Sie zählen wie ein Eintrag der Liste – für die Fälligkeit und
       in der Historie. Der Excel-Stand bleibt darunter unverändert. */
    if(!p._historieExcel) p._historieExcel=(p.historie||[]).slice();
    var nw=Array.isArray(p.nachweise) ? p.nachweise.filter(function(n){ return n && /^\d{4}-\d\d-\d\d$/.test(n.datum||""); }) : [];
    /* derselbe Besuch nicht doppelt: liegt ein Listeneintrag höchstens
       BESUCH_TAGE neben einem Prüfbuch-Eintrag, gilt das Prüfbuch */
    var nwTage=nw.map(function(n){ return n.datum; });
    var tage={}; p._historieExcel.filter(function(d){ return !nwTage.some(function(n){ return gleicherBesuch(d,n); }); })
      .concat(nwTage).forEach(function(d){ if(d) tage[d]=1; });
    p.historie=Object.keys(tage).sort();
    p.techniker=p.techniker||{};
    nw.forEach(function(n){ var j=n.datum.slice(0,4); if(n.techniker && !p.techniker[j]) p.techniker[j]=n.techniker; });
    var kgGeaendert = !ex || p.kaeltemittelKg!==ex.kaeltemittelKg;
    if(kgGeaendert){
      var kg=(p.kaeltemittelKg===""||p.kaeltemittelKg==null)?null:+p.kaeltemittelKg;
      p.kaeltemittelKg=kg;
      p.kaeltemittelText = kg==null ? "" : kgText(kg);
      p.ueber30kg = kg!=null && kg>=30;
    }
  });
  ALLE_ST.forEach(function(s){
    if(s.lat!=null&&s.lat!=="") s.lat=+s.lat; else s.lat=null;
    if(s.lon!=null&&s.lon!=="") s.lon=+s.lon; else s.lon=null;
    if(s.entfernt) s.aktiv=false;   /* entfernte Zeilen zählen nirgends mehr mit */
    if(s._geaendert && s.lat && EXCEL["standort:"+s.id] && s.lat!==EXCEL["standort:"+s.id].lat) s.genauigkeit="manuell";
    s.unklar=!s.lat;
  });
  indexNeuAufbauen();
  berechneFaelligkeiten();
}

/* Anlagendaten dürfen alle angemeldeten Techniker ergänzen (vor Ort beim
   Protokoll), Märkte nur Admins – so regelt es auch die Datenbank */
function darfStammZentral(rec){
  /* Anlagendaten und offene Störungen darf jede angemeldete Person schreiben,
     Märkte nur Admins – so regelt es auch die Datenbank. */
  return Admin.zentral || (!!Store.benutzer && rec && (rec.typ==="position" || rec.typ==="stoerung"));
}
/* Für „Rückgängig“: der zuletzt gespeicherte Stand jedes Eintrags. Wer
   speichert, hinterlässt den Stand davor im Puffer; der nächste Eintrag im
   Änderungsverlauf nimmt ihn mit. So lässt sich jede Stammdaten-Änderung
   exakt zurücknehmen, ohne dass jede speichernde Stelle das selbst tut. */
var stammStand={}, rueckPuffer={};
/* nicht in den Verlauf: Zugangsdaten (vertraulich) und eingebettete
   Auftrags-PDFs und Seitenbilder offener Störungen (mehrere MB) */
function NICHT_IM_VERLAUF(){ return GEHEIME_FELDER.concat(["pdfDaten","seiten"]); }
function stammVorherMerken(id){
  if(id in rueckPuffer) return;
  var v=stammStand[id] ? JSON.parse(JSON.stringify(stammStand[id])) : null;
  /* Zugangsdaten der Regelung gehören nie in den Verlauf – der ist für alle
     Angemeldeten lesbar und lässt sich nicht löschen */
  if(v && v.felder) NICHT_IM_VERLAUF().forEach(function(k){ delete v.felder[k]; });
  rueckPuffer[id]=v;
}
function stammSpeichern(rec, nachtragen){
  if(demo()){ stammStand[rec.id]=JSON.parse(JSON.stringify(rec)); rueckPuffer={}; return Promise.resolve("demo"); }
  /* ein nachgetragener Gerätestand ist keine neue Änderung – nichts für „Rückgängig“ */
  if(!nachtragen) stammVorherMerken(rec.id);
  stammStand[rec.id]=JSON.parse(JSON.stringify(rec));
  var lokal=function(){
    return idbVorgang("readwrite",function(st){ return st.put(rec); },"stammdaten")
      .then(function(){ return "geraet"; }, function(){ return false; });
  };
  if(Store.modus==="supabase" && Store.sb && darfStammZentral(rec)){
    return mitFrist(Store.sb.from("stammdaten").upsert({id:rec.id, typ:rec.typ, ziel:rec.ziel, felder:rec.felder,
      neu:!!rec.neu, geaendert:rec.geaendert, von:rec.von, grund:rec.grund||null}))
      .then(function(r){ return r.error ? lokal() : "gemeinsam"; }, lokal);
  }
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("stammdaten/"+rec.id.replace(":","_")).set(rec)
      .then(function(){ return "gemeinsam"; }, lokal);
  }
  return lokal();
}
function stammLoeschen(id){
  if(demo()){ delete stammStand[id]; return Promise.resolve(); }
  stammVorherMerken(id);
  delete stammStand[id];
  var lokal=idbVorgang("readwrite",function(st){ return st.delete(id); },"stammdaten").catch(function(){});
  if(Store.modus==="supabase" && Store.sb && Admin.zentral){
    return Promise.all([lokal, Store.sb.from("stammdaten").delete().eq("id",id)]);
  }
  if(Store.modus==="claude" && Store.claudeDb){
    return Promise.all([lokal, Store.claudeDb.doc("stammdaten/"+id.replace(":","_")).delete().catch(function(){})]);
  }
  return lokal;
}
function ladeStammdaten(){
  var lokal=idbVorgang("readonly",function(st){ return st.getAll(); },"stammdaten")
    .then(function(l){ return l||[]; }, function(){ return []; });
  var zentral=Promise.resolve([]);
  if(Store.modus==="supabase" && Store.sb){
    /* seitenweise: Supabase liefert höchstens 1000 Zeilen je Abfrage – darüber
       fehlten sonst zufällig Anlagendaten und offene Störungen */
    var tab=nurLesen()||demo()?"stammdaten_lesen":"stammdaten", SEITE=1000;
    var seite=function(ab, bisher){
      return Store.sb.from(tab).select("*").order("id").range(ab, ab+SEITE-1).then(function(r){
        var l=bisher.concat(r.data||[]);
        return (!r.error && r.data && r.data.length===SEITE) ? seite(ab+SEITE, l) : l;
      }, function(){ return bisher; });
    };
    zentral=seite(0, []);
  } else if(Store.modus==="claude" && Store.claudeDb){
    zentral=Store.claudeDb.collection("stammdaten").get().then(function(s){
      return (s.docs||[]).map(function(d){ return d.data(); });
    }, function(){ return []; });
  }
  return Promise.all([lokal,zentral]).then(function(r){
    var alle={};
    /* Kunde, Präsentation und Abgemeldete sehen keine Zugangsdaten – auch
       nicht die, die noch auf dem Gerät auf die Übertragung warten */
    if(nurLesen()||demo()||!angemeldetOderLokal()) r[0]=r[0].map(function(x){
      if(!x || !x.felder) return x;
      var y=Object.assign({}, x, {felder:Object.assign({}, x.felder)});
      GEHEIME_FELDER.forEach(function(k){ delete y.felder[k]; });
      return y;
    });
    /* gemeinsame Fassung zuerst, eine neuere vom Gerät gewinnt */
    r[1].concat(r[0]).forEach(function(x){
      if(!x||!x.id) return;
      if(!alle[x.id] || (x.geaendert||"")>(alle[x.id].geaendert||"")) alle[x.id]=x;
    });
    stammUeber=alle;
    stammStand=JSON.parse(JSON.stringify(alle));
    wendeStammdatenAn();
    return stammUeber;
  });
}
/* auf dem Gerät gemachte Änderungen nachtragen, sobald man zentral Admin ist */
function stammdatenUebertragen(){
  var darf = (Store.modus==="supabase" && !!Store.benutzer) || Store.modus==="claude";
  if(!darf) return;
  idbVorgang("readonly",function(st){ return st.getAll(); },"stammdaten").then(function(liste){
    (liste||[]).forEach(function(rec){
      if(Store.modus==="supabase" && !darfStammZentral(rec)) return;
      stammSpeichern(rec, true).then(function(wo){
        if(wo==="gemeinsam") idbVorgang("readwrite",function(st){ return st.delete(rec.id); },"stammdaten");
      });
    });
  },function(){});
}

/* ---------------- Admin-Freigabe ----------------
   Mit gemeinsamer Datenbank entscheidet die Tabelle "admins" in Supabase –
   das setzt die Datenbank selbst durch. Ohne sie gelten Änderungen nur auf
   diesem Gerät; dort schützt eine PIN vor versehentlichen Eingriffen. */
var Admin={frei:false, zentral:false, geprueft:false};
/* Rollen. Inhaber (Manfred, Matthäus) haben zusätzlich Rückgängig, KI-Kosten
   und die Kontenübersicht; Kunde und Präsentation lesen nur – die Datenbank
   sperrt das Schreiben selbst (tools/rollen.sql). */
var Rolle={name:"techniker", da:false};
function nurLesen(){ return Rolle.name==="kunde"; }
/* Mit gemeinsamer Datenbank, aber abgemeldet, fehlt alles, was nur Angemeldete
   lesen: offene Störungen, App-Protokolle, ergänzte Anlagendaten. */
function angemeldetOderLokal(){ return Store.modus!=="anmeldung"; }
/* Präsentation: eine Spielwiese. Alles lässt sich bedienen wie als Admin,
   aber nichts verlässt dieses Browserfenster – keine Datenbank, kein
   Gerätespeicher, keine KI. Nach dem Neuladen ist alles wieder wie vorher.
   Die Datenbank sperrt das Schreiben für diese Rolle zusätzlich. */
function demo(){ return Rolle.name==="praesentation"; }
/* solange die Rollen-Tabelle fehlt, haben Admins die Inhaber-Rechte */
function istInhaber(){ return Rolle.name==="inhaber" || (!Rolle.da && Admin.frei); }
function sha256hex(text){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b),function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
  });
}
function adminPruefen(){
  if(Store.modus==="supabase" && Store.sb && Store.benutzer){
    return Promise.all([
      Store.sb.from("admins").select("user_id").eq("user_id",Store.benutzer.id),
      /* Rolle: Inhaber, Admin, Techniker, Kunde, Präsentation (tools/rollen.sql).
         Fehlt die Tabelle noch, gilt das bisherige: Admin oder Techniker. */
      Store.sb.from("rollen").select("rolle,name").eq("user_id",Store.benutzer.id)
    ]).then(function(r){
      Admin.zentral=!!(r[0].data&&r[0].data.length); Admin.frei=Admin.zentral; Admin.geprueft=true;
      Rolle.da=!r[1].error;
      Rolle.name=(r[1].data&&r[1].data[0]&&r[1].data[0].rolle) || (Admin.zentral?"admin":"techniker");
      Rolle.anzeige=(r[1].data&&r[1].data[0]&&r[1].data[0].name) || "";
      /* Präsentation darf alles bedienen wie ein Admin – gespeichert wird nichts */
      if(demo()) Admin.frei=true;
      document.body.classList.toggle("nurlesen", nurLesen());
      document.body.classList.toggle("demo", demo());
      demoBanner();
      if(!nurLesen() && !demo()) stammdatenUebertragen();   /* Anlagendaten auch von Technikern */
      return Admin.frei;
    },function(){ Admin.geprueft=true; return false; });
  }
  Admin.geprueft=true;
  try{ Admin.frei = sessionStorage.getItem("ukt_admin_frei")==="1"; }catch(e){}
  return Promise.resolve(Admin.frei);
}

/* Einträge, die auf dem Gerät entstanden sind, in die gemeinsame Ablage

/* ----------------------------------------------------------------
   Speicher: im Artifact die Claude-Datenbank, auf GitHub Pages
   Supabase, und wenn beides fehlt nur lokal am Gerät.
   ---------------------------------------------------------------- */
var CFG=window.UKT_CONFIG||{};
var Store={
  modus:"lade",        // lade | claude | supabase | anmeldung | lokal
  claudeDb:null,
  sb:null,
  benutzer:null,
  fehler:""
};
function storeNachRender(){
  /* neue oder geladene Protokolle verschieben Fälligkeiten */
  berechneFaelligkeiten();
  /* die Karte nicht unter der Hand neu aufbauen – Zoom und Ausschnitt gingen verloren */
  if(darfRendern() && S.view!=="karte") render();
}

function initStore(versuch){
  versuch=versuch||0;
  var supabaseKonfiguriert = CFG.supabaseUrl && CFG.supabaseAnonKey;
  /* Innerhalb von Claude läuft die Seite in einem Rahmen, und window.claude
     kommt erst nach dem ersten Skriptlauf. Als eigenständige Seite
     (GitHub Pages, eigenes Hosting) gibt es darauf nichts zu warten. */
  var imRahmen=false; try{ imRahmen = window.self!==window.top; }catch(e){ imRahmen=true; }
  if(!window.claude || !window.claude.use){
    if(!supabaseKonfiguriert && imRahmen && versuch<40){ setTimeout(function(){ initStore(versuch+1); },250); return; }
    if(supabaseKonfiguriert) return initSupabase();
    Store.modus="lokal"; storeNachRender(); return;
  }
  window.claude.use("db").then(function(api){
    if(!api){ if(supabaseKonfiguriert) return initSupabase(); Store.modus="lokal"; storeNachRender(); return; }
    Store.claudeDb=api; Store.modus="claude";
    api.collection("protokolle").orderBy("erstellt","desc").limit(1000).onSnapshot(function(snap){
      protokolle=(snap.docs||[]).map(function(d){ return Object.assign({_id:d.id},d.data()||{}); });
      storeNachRender();
    }, function(){ });
    flushQueue();
    ladeStammdaten().then(storeNachRender);
    storeNachRender();
  }, function(){ if(supabaseKonfiguriert) return initSupabase(); Store.modus="lokal"; storeNachRender(); });
}

function initSupabase(){
  if(!window.supabase || !window.supabase.createClient){ Store.modus="lokal"; Store.fehler="Supabase-Bibliothek nicht geladen."; storeNachRender(); return; }
  Store.sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  Store.sb.auth.getSession().then(function(r){
    var sess=r&&r.data?r.data.session:null;
    if(sess){ Store.benutzer=sess.user; Store.modus="supabase"; ladeProtokolle(); flushQueue();
      adminPruefen().then(ladeStammdaten).then(storeNachRender); }
    else { Store.modus="anmeldung"; }
    storeNachRender();
  });
  Store.sb.auth.onAuthStateChange(function(_ev,sess){
    /* anderes Konto oder abgemeldet: was die Präsentation nur im Speicher
       angelegt hat, fliegt raus – sonst überträgt es die nächste echte
       Sitzung in die Datenbank */
    if(!sess || !Store.benutzer || sess.user.id!==Store.benutzer.id){
      lokaleProtokolle=lokaleProtokolle.map(function(x){ return x._original || x; }).filter(function(x){ return !x._demo; });

}

    firma:doc.firma, techniker:doc.techniker, kontakt:doc.kontakt, subunternehmen:doc.subunternehmen,
    zert_unternehmen:doc.zertUnternehmen, zert_person:doc.zertPerson,

var PROTOKOLL_SPALTEN=["id","client_id","erstellt","erstellt_von","standort_id","position_id","position_ids",

/* Holt die Unterschrift eines Protokolls nach. Schon vorhandene bleibt.
   Liefert immer, auch wenn es keine gibt oder die Leitung weg ist. */
function ladeUnterschrift(p){
  if(!p) return Promise.resolve("");
  if(typeof p.unterschrift==="string") return Promise.resolve(p.unterschrift);
  if(!Store.sb || !p._id){ p.unterschrift=""; return Promise.resolve(""); }
  return Store.sb.from("protokolle").select("unterschrift").eq("client_id",p._id).limit(1).then(function(r){
    var w=(r && r.data && r.data[0] && r.data[0].unterschrift) || "";
    p.unterschrift=w;
    /* Die Listen liefern Kopien; damit nicht bei jedem Öffnen neu geladen
       wird, auch am gemerkten Datensatz hinterlegen. */
    (protokolle||[]).forEach(function(x){ if(x._id===p._id) x.unterschrift=w; });
    return w;
  }, function(){ return ""; });
}

function ladeProtokolle(){
  if(!Store.sb) return;
  /* Die Grenze muss über den gesamten Bestand reichen: aus den Protokollen
     kommt der Wartungsnachweis. Fällt ein altes Protokoll heraus, gilt seine
     Wartung als nicht geschehen und der Termin springt auf überfällig. */
  Store.sb.from("protokolle").select(PROTOKOLL_SPALTEN+(rapportSpalte?",rapport":"")).order("erstellt",{ascending:false}).limit(1000).then(function(r){
    if(r.error && rapportSpalte && /rapport/.test(r.error.message||"")){ rapportSpalte=false; ladeProtokolle(); return; }
    if(r.error){ Store.fehler=r.error.message; return; }
    protokolle=(r.data||[]).map(ausZeile);
    storeNachRender();
    offeneBerichteNachholen();
  });
}

/* ---------------- Fotos ----------------
   Handykameras liefern 3–8 MB je Bild. Das wird vor dem Hochladen auf
   eine brauchbare Dokumentationsgröße gebracht – sonst dauert es im
   Funkloch ewig und sprengt jede Speichergrenze. */
var FOTO_KANTE = 1600;        // längste Kante in Pixel
var FOTO_BUDGET = 160000;     // Zielgröße je Bild in Byte
var FOTO_MAX = 8;             // Bilder je Protokoll

function verkleinere(datei){
  return new Promise(function(fertig, schiefgegangen){
    var quelle = window.createImageBitmap
      ? createImageBitmap(datei,{imageOrientation:"from-image"})
      : new Promise(function(ok,nok){
          var img=new Image(), url=URL.createObjectURL(datei);
          img.onload=function(){ URL.revokeObjectURL(url); ok(img); };
          img.onerror=function(){ URL.revokeObjectURL(url); nok(new Error("Bild nicht lesbar")); };
          img.src=url;
        });
    quelle.then(function(bild){
      var b=bild.width, h=bild.height;
      var f=Math.min(1, FOTO_KANTE/Math.max(b,h));
      var cv=document.createElement("canvas");
      cv.width=Math.round(b*f); cv.height=Math.round(h*f);
      cv.getContext("2d").drawImage(bild,0,0,cv.width,cv.height);
      if(bild.close) bild.close();
      /* Qualität so weit senken, bis das Budget passt */
      var q=0.78, url=cv.toDataURL("image/jpeg",q);
      while(url.length*0.75 > FOTO_BUDGET && q > 0.36){
        q-=0.08; url=cv.toDataURL("image/jpeg",q);
      }
      fertig({datenUrl:url, breite:cv.width, hoehe:cv.height,
              bytes:Math.round(url.length*0.75), qualitaet:Math.round(q*100)});
    }, schiefgegangen);
  });
}
function datenUrlZuBlob(url, typ){
  var teile=url.split(","), roh=atob(teile[1]);
  var a=new Uint8Array(roh.length);
  for(var i=0;i<roh.length;i++) a[i]=roh.charCodeAt(i);
  return new Blob([a],{type:typ||"image/jpeg"});
}
/* eine Datei so einlesen, wie sie ist – fuer das Auftrags-PDF, das im
   Original erhalten bleiben soll und nicht als Bild */
function dateiAlsDatenUrl(datei){
  return new Promise(function(ok, nein){
    var r=new FileReader();
    r.onload=function(){ ok(r.result); };
    r.onerror=function(){ nein(r.error||new Error("Datei nicht lesbar")); };
    r.readAsDataURL(datei);
  });
}
/* Groesse der Originaldatei aus der Data-URL, ohne sie zu dekodieren */
function datenUrlBytes(url){
  var b64=String(url||"").split(",")[1]||"";
  var fuell=(b64.slice(-2).match(/=/g)||[]).length;
  return Math.max(0, Math.floor(b64.length*3/4)-fuell);
}

/* speichert alle Fotos eines Protokolls; liefert false, wenn etwas scheitert */

  if(demo()) return Promise.resolve(false);   /* bleibt im Speicher, wie ein Geräteprotokoll */

    /* ein Dokument je Foto – die Grenze liegt bei 256 KiB je Dokument */
    var i=0;

  if(Store.modus==="supabase" && Store.sb){
    var j=0;
    var weiter=function(){
      if(j>=fotos.length) return Promise.resolve(true);
      var f=fotos[j++];
      var pfad=protokollId+"/"+f.id+".jpg";
      return Store.sb.storage.from("protokollfotos")
        .upload(pfad, datenUrlZuBlob(f.datenUrl), {contentType:"image/jpeg", upsert:false})
        .then(function(r){
          /* schon da (ein früherer Versuch kam bis hierher): gilt als hochgeladen –
             sonst bliebe das Protokoll für immer auf dem Gerät hängen */
          if(r.error && !/exist|duplicate|409/i.test((r.error.message||"")+" "+(r.error.statusCode||""))){ Store.fehler=r.error.message; return false; }
          return weiter(); },
              function(){ return false; });
    };

  }
  return Promise.resolve(false);
}

/* --------------------------------------------------------------------
   Das Auftrags-PDF von Lidl. Es gehoert zum Einsatz und wird deshalb beim
   Protokoll abgelegt – im Original, nicht als Bild. Die Bilder der ersten
   zwei Seiten bleiben daneben bestehen, sie sind fuer die Anzeige da.
   Ablage wie bei den Fotos: ein Pfad unter der Protokollkennung.
   -------------------------------------------------------------------- */
function auftragPfad(protokollId){ return protokollId+"/auftrag.pdf"; }

/* Zweites PDF daneben: der Rapportbericht, den Lidl nach Abschluss des
   Auftrags erzeugt. Gleiche Ablage, gleiche Regeln – kein Überschreiben. */
var ANHANG={
  auftrag:{pfad:auftragPfad, claude:"auftragspdf/", feld:"auftragDatei", daten:"_auftragDaten", datei:"auftrag.pdf"},
  /* ein vom Admin ersetzter Rapport liegt unter eigenem Pfad (steht im Verweis) */
  rapport:{pfad:function(id, ref){ return (ref&&ref.pfad) || id+"/rapport.pdf"; }, claude:"rapportpdf/", feld:"rapportDatei", daten:"_rapportDaten", datei:"rapport.pdf"}
};
function speichereAnhangPdf(art, protokollId, pdf){
  if(demo()) return Promise.resolve(false);

    return Store.claudeDb.doc(a.claude+protokollId).set({
      protokollId:protokollId, name:pdf.name||a.datei,

      .upload(a.pfad(protokollId, pdf), datenUrlZuBlob(pdf.datenUrl,"application/pdf"),
              {contentType:"application/pdf", upsert:false})
      .then(function(r){ 
        /* liegt schon da (etwa nach Zurücknehmen und erneutem Anhängen): gut so */
        if(r.error && /exist|duplicate/i.test(r.error.message||"")) return true;
        if(r.error){ Store.fehler=r.error.message; return false; } return true; },
            function(){ return false; });
  }
  return Promise.resolve(false);
}
/* Was im Rapportzettel steht. Die PDF aus der Lidl-Mail enthält echten Text
   (erzeugt, nicht gescannt): Rapportnummer, Auftrags-Nr., Filiale und je
   Einsatztag Datum, Firma, Arbeitskräfte, Anfang, Ende, Pause, verrechenbare
   Stunden und die ausgeführten Arbeiten. Ein eingescannter Zettel liefert
   nichts – dann bleibt es beim Original. Der Dateiname aus der Mail
   (619415854_AT0249_28658685_rapport.pdf) hilft, wo der Text schweigt. */
function werteRapport(text, dateiname){
  var t=" | "+text+" | ", d={zeilen:[]};
  var m;
  if((m=/Rapportzettel (\S+)/.exec(t))) d.art=m[1];
  else if(/Rapport ohne IMS-Auftrag/.test(t)) d.art="ohne IMS-Auftrag";
  if((m=/\((\d{6,})\)/.exec(t))) d.nummer=m[1];
  if((m=/\| (\d{6,}) \| Auftrag-Nr\./.exec(t)) || (m=/Auftrag-Nr\. \| (\d{6,}) \|/.exec(t))) d.auftrag=m[1];
  if((m=/Filiale: \| AT0*(\d+)/.exec(t))) d.filiale=m[1];
  var zeile=/\| (\d\d\.\d\d\.\d{4}) \| (.+?) \| (\d{1,2}) \| (\d{1,2}:\d\d) \| (\d{1,2}:\d\d) \| (\d{1,2}:\d\d) \| (\d{1,3}:\d\d) \| (.+?)(?= \| \d\d\.\d\d\.\d{4} \| .+? \| \d{1,2} \| \d{1,2}:\d\d| \| Wir bestätigen)/g;
  while((m=zeile.exec(t))){
    d.zeilen.push({datum:datumIso(m[1]), firma:m[2].replace(/ \| /g," "), personen:+m[3], von:m[4], bis:m[5], pause:m[6],
      stunden:m[7], arbeiten:m[8].replace(/ \| /g," ").replace(/\s+/g," ").trim()});
  }
  var n=/^(?:(\d{6,})_)?AT0*(\d+)_(\d{6,})_rapport/i.exec(dateiname||"");
  if(n){ if(!d.auftrag && n[1]) d.auftrag=n[1]; if(!d.filiale) d.filiale=n[2]; if(!d.nummer) d.nummer=n[3]; }
  var min=d.zeilen.reduce(function(s,z){ var h=z.stunden.split(":"); return s+(+h[0])*60+(+h[1]); },0);
  if(d.zeilen.length) d.stunden=Math.floor(min/60)+":"+String(min%60).padStart(2,"0");
  d.lesbar=d.zeilen.length>0;
  return (d.nummer||d.filiale||d.lesbar) ? d : null;
}
/* Die Ablage nimmt höchstens 5 MB je PDF – größer bliebe es für immer auf
   dem Gerät hängen. Lidl-Rapporte und -Aufträge sind weit darunter. */
var PDF_MAX=5*1024*1024;
function pdfZuGross(datei){
  if(datei && datei.size>PDF_MAX){ toast("Die PDF ist zu groß ("+Math.round(datei.size/1048576*10)/10+" MB, höchstens 5 MB). Bitte die Original-PDF aus der Mail von Lidl nehmen."); return true; }
  return false;
}
function leseRapport(datenUrl, dateiname){
  return ladePdfJs().then(function(){
    var roh=atob(datenUrl.split(",")[1]||""), b=new Uint8Array(roh.length);
    for(var i=0;i<roh.length;i++) b[i]=roh.charCodeAt(i);
    return window.pdfjsLib.getDocument({data:b}).promise;
  }).then(function(pdf){
    var seiten=[]; for(var i=1;i<=pdf.numPages;i++) seiten.push(i);
    return Promise.all(seiten.map(function(n){
      return pdf.getPage(n).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
        return tc.items.map(function(x){ return x.str; }).filter(function(s){ return s.trim(); }).join(" | ");
      });
    }));
  }).then(function(texte){ return werteRapport(texte.join(" | "), dateiname); },
         function(e){
           /* pdf.js fehlt (keine Verbindung): ungelesen annehmen, das Original zählt */
           if(!window.pdfjsLib) return werteRapport("", dateiname);
           /* die Datei selbst ist kaputt – nicht annehmen, sonst ist das Protokoll
              danach weder druck- noch archivierbar */
           var f=new Error("Diese PDF lässt sich nicht öffnen – bitte den Rapport aus der Mail von Lidl erneut speichern und nochmals wählen.");
           f.unlesbar=true; throw f;
         });
}
/* „Nr. 28658685 · 30.07.2025 · 2 Pers. 11:00–12:00 · 2:00 h“ */
function rapportZeile(r){
  var d=r && r.daten;
  if(!d) return "liegt bei ("+((r&&r.name)||"rapport.pdf")+")";
  return ["liegt bei", d.nummer?"Nr. "+d.nummer:"", d.auftrag?"Auftrag "+d.auftrag:"",
    (d.zeilen||[]).map(function(z){ return dfmt(z.datum)+" · "+z.personen+" Pers. "+z.von+"–"+z.bis; }).join("; "),
    d.stunden?d.stunden+" h verrechenbar":""].filter(Boolean).join(" · ");
}
/* Passt der Rapport zum Protokoll? Lidl-Auftrag, Filiale und Tag gegenhalten. */
function rapportAbweichung(d, filiale, datum, auftrag){
  if(!d) return "";
  var w=[];
  auftrag=String(auftrag||"").trim();
  if(d.auftrag && auftrag && d.auftrag!==auftrag)
    w.push("Der Rapport gehört zu Lidl-Auftrag "+d.auftrag+", das Protokoll zu Auftrag "+auftrag+".");
  if(d.filiale && filiale && String(filiale).replace(/^0+/,"")!==String(d.filiale).replace(/^0+/,""))
    w.push("Der Rapport ist für Filiale "+d.filiale+", das Protokoll für Filiale "+filiale+".");
  if(datum && d.zeilen && d.zeilen.length && !d.zeilen.some(function(z){ return z.datum===datum; }))
    w.push("Der Rapport ist vom "+d.zeilen.map(function(z){ return dfmt(z.datum); }).join(", ")+", das Protokoll vom "+dfmt(datum)+".");
  return w.join(" ");
}
function speichereAuftragPdf(protokollId, pdf){ return speichereAnhangPdf("auftrag", protokollId, pdf); }
function speichereRapportPdf(protokollId, pdf){ return speichereAnhangPdf("rapport", protokollId, pdf); }

/* Link zu Auftrag bzw. Rapport eines Protokolls – null, wenn keiner dabei ist */
function ladeAnhangPdf(art, p){
  var a=ANHANG[art];
  var ref=art==="rapport" ? rapportVon(p) : (p.stoerung && p.stoerung[a.feld]);
  if(!ref) return Promise.resolve(null);
  /* noch nicht uebertragen: das PDF liegt im Geraetespeicher */
  if(p[a.daten] && p[a.daten].datenUrl)
    return Promise.resolve({name:ref.name, url:p[a.daten].datenUrl});
  var id=p._id||p.id;
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc(a.claude+id).get().then(function(snap){
      var d=snap.exists?snap.data():null;
      return d ? {name:ref.name, url:d.datenUrl} : null;
    }, function(){ return null; });
  }
  if(Store.modus==="supabase" && Store.sb){
    return Store.sb.storage.from("protokollfotos").createSignedUrl(a.pfad(id, ref), 3600)
      .then(function(r){ return r.data ? {name:ref.name, url:r.data.signedUrl} : null; },
            function(){ return null; });
  }
  return Promise.resolve(null);
}

/* ein Protokoll wegschreiben – liefert ein Promise, das nie ablehnt */
function speichereProtokoll(id,doc){
  if(demo()) return Promise.resolve(false);
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).set(doc).then(function(){ return true; },function(){ return false; });
  }
  if(Store.modus==="supabase" && Store.sb){
    var zeile=zuZeile(doc,Store.benutzer?Store.benutzer.id:null);
    /* Die Kennung aus der App mitgeben: unter ihr liegen die Fotos, und ein
       zweiter Übertragungsversuch legt so kein doppeltes Protokoll an. */
    zeile.client_id=id;
    return Store.sb.from("protokolle").upsert(zeile,{onConflict:"client_id", ignoreDuplicates:true}).then(function(r){
      if(r.error){
        Store.fehler=/stoerung|mitarbeiter/.test(r.error.message||"")
          ? "In der Datenbank fehlt eine Spalte – bitte supabase-setup.sql im Supabase SQL Editor erneut ausführen"
          : r.error.message;
        return false;
      }
      ladeProtokolle();
      /* Archiv-PDF im Hintergrund – das Speichern wartet nicht darauf */
      berichtAblegen(Object.assign({}, doc, {_id:id, version:doc.version||1}));
      return true;
    },function(){ return false; });
  }
  return Promise.resolve(false);
}

/* eine Korrektur wegschreiben – gleiche Kennung, neue Fassung */
function aktualisiereProtokoll(id, doc, quelle, geraetFotos, geraetAuftrag, geraetRapport){
  if(demo()){
    /* nur im Speicher: die Korrektur ersetzt die Anzeige, nicht die Datenbank */
    /* ein echtes, wartendes Geräteprotokoll nicht anfassen: die Vorführ-Fassung
       ersetzt nur die Anzeige und merkt sich das Original (_original) – beim
       Kontowechsel kommt das Original zurück, übertragen wird nie die Vorführung */
    if(quelle==="geraet"){ lokaleProtokolle=lokaleProtokolle.map(function(e){ return e.id===id ? Object.assign({}, e, {doc:doc, fotos:geraetFotos||e.fotos, auftrag:geraetAuftrag||e.auftrag, rapport:geraetRapport||e.rapport, _demo:true, _original:e._original||e}) : e; }); }
    else protokolle=protokolle.map(function(x){ return x._id===id ? Object.assign({}, x, doc, {_id:id}) : x; });
    return Promise.resolve(true);
  }
  if(quelle==="geraet"){
    return idbSchreiben({id:id, doc:doc, fotos:geraetFotos||[], auftrag:geraetAuftrag||null, rapport:geraetRapport||null, erstellt:doc.erstellt})
      .then(function(){ return true; }, function(){ return false; });
  }
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).set(doc).then(function(){ return true; }, function(){ return false; });
  }
  if(Store.modus==="supabase" && Store.sb){
    var zeile=zuZeile(doc,null);
    delete zeile.erstellt_von;   /* der ursprüngliche Verfasser bleibt eingetragen */
    delete zeile.erstellt;
    zeile.version=doc.version; zeile.geaendert=doc.geaendert; zeile.korrektur_grund=doc.korrekturGrund||null;
    /* bei einer Korrektur heißt „leer“ auch leeren – weggelassen bliebe der alte Wert */
    zeile.mitarbeiter=doc.mitarbeiter||[];
    /* Nur schreiben, wenn das Protokoll noch die Fassung hat, auf der diese
       Korrektur aufbaut. Sonst hat in der Zwischenzeit jemand anderer
       korrigiert – dessen Arbeit soll nicht stillschweigend verschwinden. */
    var erwartet=(doc.version||2)-1;
    Store.fehler="";   /* alte Meldung nicht stehen lassen */
    return Store.sb.from("protokolle").update(zeile)
      .eq("client_id",id).eq("version",erwartet).select("client_id").then(function(r){
      if(r.error){ Store.fehler=r.error.message; return false; }
      if(!r.data || !r.data.length){
        Store.fehler="Das Protokoll wurde inzwischen von jemand anderem geändert. "+
          "Bitte neu laden, die Änderung ansehen und dann noch einmal korrigieren.";
        ladeProtokolle();
        return false;
      }
      ladeProtokolle();
      berichtAblegen(Object.assign({}, doc, {_id:id}));   /* neue Fassung ersetzt das PDF */
      return true;
    },function(){ return false; });
  }
  return Promise.resolve(false);
}
/* überträgt Protokolle vom Gerät, sobald eine zentrale Ablage da ist */
var uebertragungLaeuft=false;
function flushQueue(){
  if(uebertragungLaeuft) return;
  if(Store.modus!=="claude" && Store.modus!=="supabase") return;
  /* Vorführ-Protokolle der Präsentation gehen nie in die Ablage */
  var liste=lokaleProtokolle.filter(function(x){ return !x._demo; }), done=0, i=0;
  if(!liste.length || demo()){ if(!demo()) aenderungenUebertragen(); return; }
  uebertragungLaeuft=true;
  var next=function(){
    if(i>=liste.length){
      uebertragungLaeuft=false;
      aenderungenUebertragen();
      lokaleNeuLaden().then(function(){
        if(done) toast(done+" Protokoll(e) vom Gerät in die zentrale Ablage übertragen.");
        storeNachRender();
      });
      return;
    }
    var e=liste[i++];
    /* ein Protokoll nach dem anderen – mit Zeitgrenze, damit ein hängender
       Upload die Warteschlange nicht für immer blockiert */
    mitFrist(speichereFotos(e.id, e.fotos||[]).then(function(fotosOk){
      if(!fotosOk) return false;
      return speichereAuftragPdf(e.id, e.auftrag).then(function(pdfOk){
        return pdfOk ? speichereRapportPdf(e.id, e.rapport) : false;
      }).then(function(pdfOk){
        if(!pdfOk) return false;
        return speichereProtokoll(e.id,e.doc);
      });
    }), 120000).then(function(ok){
      if(!ok){ next(); return; }
      done++;
      /* erst nach bestätigter Übertragung vom Gerät entfernen */
      idbLoeschen(e.id).then(next,next);
    }, function(){ next(); });
  };
  next();
}
window.addEventListener("online",function(){ flushQueue(); });

/* ================= Störungseinsätze =================
   Lidl schickt je Störung einen Auftrag als PDF. Der QR-Code darauf enthält
   nur die Auftragsnummer – alles andere steht als Text in der PDF und wird
   von dort übernommen. Ein Störungsprotokoll hat die Wartungsart „Störung“
   und verschiebt deshalb keine Fälligkeit (siehe ZAEHLT_ALS_WARTUNG). */
var STOER_AUFTRAG=[
  ["auftragsdatum","Auftragsdatum","date"], ["stoerungsnr","Störungsnummer (Lidl)","text"],
  ["ausfuehrenBis","Ausführen bis","date"], ["kostenstelle","Kostenstelle","text"],
  ["problemtyp","Problemtyp","text"], ["lidlTyp","Typ (Lidl)","text"], ["lidlModell","Modell (Lidl)","text"],
  ["lin","LIN","text"], ["iaNummer","IA-Nummer","text"],
  ["lidlKontakt","Kontakt bei Lidl","text"], ["lidlTelefon","Telefon Lidl","text"], ["lidlMail","E-Mail Lidl","text"]
];
var STOER_BEHEBUNG=[
  ["ankunft","Ankunft","time"], ["ende","Fertig","time"],
  ["kmArt","Kältemittel","text"], ["kmNach","Kältemittel nachgefüllt (kg)","text"], ["kmEnt","Kältemittel zurückgewonnen (kg)","text"]
];
var STOER_TEXTE=[["beschreibung","Beschreibung laut Auftrag"],["fehlerbild","Fehlerbild vor Ort"],
  ["ursache","Ursache"],["massnahmen","Durchgeführte Maßnahmen"]];
/* für Änderungsverlauf und Anzeige: alle Felder mit Namen */
var STOER_NAMEN=(function(){ var n={}; STOER_AUFTRAG.concat(STOER_BEHEBUNG,STOER_TEXTE).forEach(function(f){ n[f[0]]=f[1]; });
  n.material="Material / Ersatzteile"; n.folgeauftrag="Folgeauftrag / Angebot"; n.folgeText="Folgeauftrag – was";
  return n; })();

function istStoerung(p){ return !!p && (p.wartungsart==="Störung" || !!p.stoerung); }
function datumIso(t){ var m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(t||"").trim());
  return m ? m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2) : ""; }

function ladeSkript(src){
  return new Promise(function(ok,nok){
    var s=document.createElement("script"); s.src=src; s.onload=ok;
    s.onerror=function(){ nok(new Error("Werkzeug nicht ladbar – keine Internetverbindung?")); };
    document.head.appendChild(s);
  });
}
var pdfJsBereit=null;
function ladePdfJs(){
  if(pdfJsBereit) return pdfJsBereit;
  var basis="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  pdfJsBereit=ladeSkript(basis+"pdf.min.js").then(function(){
    /* Hilfsprozess als eigene Datei vom selben Ursprung, sonst blockt der Browser */
    return fetch(basis+"pdf.worker.min.js").then(function(r){ return r.text(); }).then(function(t){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:"text/javascript"}));
    }, function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=basis+"pdf.worker.min.js"; });
  });
  pdfJsBereit.catch(function(){ pdfJsBereit=null; });
  return pdfJsBereit;
}

/* Textbausteine der Lidl-PDF mit Position -> Felder.
   Der Auftrag ist ein Formular: links die Bezeichnung, rechts daneben der Wert;
   lange Werte laufen in der nächsten Zeile an derselben Einrückung weiter. */
function werteLidlAuftrag(teile){
  var z=teile.filter(function(t){ return t.s && t.s.trim(); }).map(function(t){ return {s:t.s.trim(), x:t.x, y:t.y}; });
  var alles=z.map(function(t){ return t.s; }).join("\n");
  var LABELS={"Datum:":"auftragsdatum","Kontakt:":"lidlKontakt","Telefon:":"lidlTelefon","Mail-Adresse:":"lidlMail",
    "Ausführen bis":"ausfuehrenBis","Leistungsort":"leistungsort","Kostenstelle":"kostenstelle","Störung":"stoerungsnr",
    "Typ":"lidlTyp","Modell":"lidlModell","Hersteller":"hersteller","Seriennummer":"seriennummer","LIN":"lin",
    "Inventarstandort":"inventarstandort","Problemtyp":"problemtyp","Beschreibung":"beschreibung"};
  var istLabel=function(t){ return LABELS.hasOwnProperty(t.s) || t.s==="Leistungsempfänger" || t.s==="Rechnungsanschrift"; };
  var r={};
  z.forEach(function(l){
    if(!LABELS.hasOwnProperty(l.s)) return;
    var zeile=z.filter(function(t){ return Math.abs(t.y-l.y)<3 && t.x>l.x+5; }).sort(function(a,b){ return a.x-b.x; });
    var grenze=Infinity;
    zeile.forEach(function(t){ if(istLabel(t) && t.x<grenze) grenze=t.x; });
    var werte=zeile.filter(function(t){ return t.x<grenze && !istLabel(t); });
    if(!werte.length) return;
    var xv=werte[0].x, text=[werte.map(function(t){ return t.s; }).join(" ")], y=l.y;
    /* Fortsetzungszeilen */
    for(var i=0;i<4;i++){
      var weiter=z.filter(function(t){ return t.y<y-3 && t.y>y-15 && Math.abs(t.x-xv)<4; });
      if(!weiter.length) break;
      var yy=weiter[0].y;
      /* Eine Fortsetzungszeile hat links von sich nichts stehen. Steht dort
         etwas, beginnt ein neues Feld – auch wenn dessen Bezeichnung hier
         nicht bekannt ist. */
      if(z.some(function(t){ return Math.abs(t.y-yy)<3 && t.x<xv-5; })) break;
      text.push(weiter.map(function(t){ return t.s; }).join(" ")); y=yy;
    }
    r[LABELS[l.s]]=text.join(l.s==="Beschreibung"?" ":"\n");
  });
  var m=/Auftrag-Nr\.:\s*(\d{5,})/.exec(alles) || /Auftrag-Nr\.:\s*\n\s*(\d{5,})/.exec(alles);
  if(m) r.auftragsnummer=m[1];
  m=/IA-Nummer:\s*(\d+)/.exec(alles); if(m) r.iaNummer=m[1];
  r.auftragsdatum=datumIso(r.auftragsdatum); r.ausfuehrenBis=datumIso(r.ausfuehrenBis);
  /* „Lidl Filiale\nMusterstraße 1, 1234 Musterort“ -> Adresse ist die letzte Zeile */
  if(r.leistungsort){ var zl=r.leistungsort.split("\n"); r.adresse=zl[zl.length-1]; }
  return r;
}
/* Ob aus einem PDF überhaupt Text zu holen ist, entscheidet die eingebettete
   Schrift. Lidl-Aufträge kommen mit einer Schrift ohne Unicode-Tabelle – die
   Zeichen lassen sich zeichnen, aber nicht lesen. Dann liefert das Auslesen
   Zeichensalat, und die App merkt das an den fehlenden Feldnamen. */
var LIDL_MARKER=["Auftrag-Nr","Filial-Nr","Störung","Problemtyp","Auftragstext",
                 "Leistungsort","Kostenstelle","Modell","Hersteller","Beschreibung"];
function textIstLesbar(teile){
  var alles=teile.map(function(t){ return t.s; }).join("\n");
  return LIDL_MARKER.some(function(m){ return alles.indexOf(m)>=0; });
}

/* Seiten als Bild – damit geht nichts verloren, auch wenn der Text nicht
   lesbar ist. Die Technikerin sieht den Auftrag und tippt ab, was fehlt. */
function pdfSeitenAlsBild(pdf, maxSeiten){
  var seiten=[]; for(var i=1;i<=Math.min(pdf.numPages, maxSeiten||2);i++) seiten.push(i);
  return Promise.all(seiten.map(function(n){
    return pdf.getPage(n).then(function(pg){
      var roh=pg.getViewport({scale:1});
      /* rund 1400 px breit: gut lesbar und trotzdem sparsam */
      var vp=pg.getViewport({scale:Math.min(2.4, 1400/roh.width)});
      var cv=document.createElement("canvas");
      cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
      return pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise.then(function(){
        return cv.toDataURL("image/jpeg", 0.75);
      });
    });
  }));
}

/* Auftrag ansehen. Links auf eingebettete Daten (data:…) öffnen iPhone und
   Chrome aus Sicherheitsgründen nicht in einem neuen Fenster – es passiert
   einfach nichts. Deshalb zeigt die App PDF und Seitenbilder selbst an. Die
   PDF wird dafür Seite für Seite gezeichnet; das klappt überall, auch in
   der App vom Homebildschirm, wo ein eingebettetes PDF nur Seite 1 zeigt. */
function datenUrlZuBlobUrl(u){
  var m=/^data:([^;,]*)(;base64)?,(.*)$/.exec(u||"");
  if(!m) return u;
  var roh=m[2]?atob(m[3]):decodeURIComponent(m[3]), b=new Uint8Array(roh.length);
  for(var i=0;i<roh.length;i++) b[i]=roh.charCodeAt(i);
  return URL.createObjectURL(new Blob([b],{type:m[1]||"application/octet-stream"}));
}

/* ================= KI-Erkennung =================
   Prüfbuch-Seiten, Typenschilder und eingescannte Lidl-Aufträge liest die
   Funktion ki-lesen in Supabase (Claude). Die App schickt nur verkleinerte
   Bilder und zeigt das Ergebnis vor dem Übernehmen zum Prüfen an – nichts
   wird ungesehen gespeichert. Eingeschaltet über kiAktiv in config.js. */
function kiAn(){
  if(demo()) return false;   /* kostet echtes Geld – nicht in der Präsentation */
  return !!(window.UKT_CONFIG && window.UKT_CONFIG.kiAktiv) && Store.modus==="supabase" && !!Store.sb && !!Store.benutzer;
}
/* Für die Erkennung: größer und schärfer als die Protokollfotos, damit
   Handschrift lesbar bleibt (längste Kante 1800 px, JPEG 0,85) */
function kiBild(quelle){
  return new Promise(function(ok, nein){
    var img=new Image(), url=typeof quelle==="string" ? quelle : URL.createObjectURL(quelle);
    img.onload=function(){
      var f=Math.min(1, 1800/Math.max(img.naturalWidth, img.naturalHeight));
      var cv=document.createElement("canvas");
      cv.width=Math.round(img.naturalWidth*f); cv.height=Math.round(img.naturalHeight*f);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      if(typeof quelle!=="string") URL.revokeObjectURL(url);
      ok(cv.toDataURL("image/jpeg",0.85));
    };
    img.onerror=function(){ nein(new Error("Bild nicht lesbar")); };
    img.src=url;
  });
}

/* Antwort aus der Claude-App lesen – verträgt Codeblöcke und Text drumherum */
function kiAntwortLesen(text, art){
  var t=String(text||"").replace(/```(?:json)?/gi,"");
  var von=t.indexOf("{"), bis=t.lastIndexOf("}");
  if(von<0 || bis<von) throw new Error("Kein Datenblock gefunden – bitte die ganze Antwort von Claude einfügen.");
  var d;
  try{ d=JSON.parse(t.slice(von, bis+1)); }
  catch(e){ throw new Error("Die Antwort ist nicht vollständig – bitte die ganze Antwort kopieren (oder Claude bitten, nur das JSON zu schicken)."); }
  if(!d || typeof d!=="object") throw new Error("Unerwartete Antwort.");
  if(art==="typenschild" && !Array.isArray(d.geraete)){
    /* ein einzelnes Schild ohne Liste geht auch */
    if(d.anlage || d.hersteller || d.modell) d={geraete:[d.anlage||d], unsicher:d.unsicher||[], hinweise:d.hinweise||""};
    else throw new Error("In der Antwort stehen keine Typenschilder (\"geraete\").");
  }
  if(art==="pruefbuch" && !d.anlage && !Array.isArray(d.pruefungen)) throw new Error("In der Antwort stehen keine Prüfbuch-Angaben (\"anlage\").");
  if(!Array.isArray(d.unsicher)) d.unsicher=[];
  return d;
}

function kiLesen(art, quellen, kontext){

    return Store.sb.functions.invoke("ki-lesen", {body:{art:art, kontext:kontext||"",
      bilder:bilder.map(function(u){ return {media_type:"image/jpeg", data:u.split(",")[1]}; })}});
  }).then(function(r){
    if(!r.error) return r.data;
    /* die Funktion schickt eine lesbare Meldung mit – die zeigen */
    var ctx=r.error.context;
    return (ctx && ctx.json ? ctx.json().catch(function(){ return null; }) : Promise.resolve(null)).then(function(j){
      throw new Error((j && j.fehler) || r.error.message || "KI-Erkennung fehlgeschlagen");
    });
