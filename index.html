    return filtered().some(function(x){ return x.id===o.standortId; });
  };
  var alle=offeneStoerungen(true);
  var offen=alle.filter(inAuswahl).concat(alle.filter(function(o){ return !inAuswahl(o); }));
  var draussen=alle.filter(function(o){ return !inAuswahl(o); }).length;
  var c=el('<div class="card"><div class="pad stack">'+
    '<div class="rowflex" style="justify-content:space-between;align-items:flex-start;gap:12px">'+
      '<div><h2>Offene Störungen</h2><div class="sub">Aufträge von Lidl, die noch zu erledigen sind. '+
        "Antippen erstellt daraus das Störungsprotokoll.</div></div>"+
      '<button class="btn sm" type="button" id="st_neu" data-schreiben>+ Störung erfassen</button>'+
    "</div>"+
    '<div class="stack" id="st_liste"></div>'+
  "</div></div>");
  var host=c.querySelector("#st_liste");
  if(!angemeldetOderLokal()){
    /* ohne Anmeldung liefert die Datenbank keine Störungen – nicht „keine“ behaupten */
    host.appendChild(el('<div class="note warnbox" style="font-size:13px"><strong>Nicht angemeldet:</strong> '+
      "Offene Störungen sind erst nach der Anmeldung sichtbar.</div>"));
  } else if(!offen.length){
    host.appendChild(el('<div class="muted" style="font-size:13px">Zur Zeit keine offene Störung. '+
      "Kommt ein Auftrag von Lidl, hier erfassen – er erscheint dann an dieser Stelle.</div>"));
  }
  if(draussen){
    var hinweis=el('<div class="note" style="font-size:13px">'+draussen+" offene Störung"+(draussen===1?" liegt":"en liegen")+
      ' außerhalb der Auswahl oben (Suche bzw. Region) und '+(draussen===1?"steht":"stehen")+' trotzdem hier. '+
      '<button class="btn ghost sm" type="button">Auswahl aufheben</button></div>');
    hinweis.querySelector("button").onclick=function(){ S.q=""; S.region="alle"; render(); };
    host.appendChild(hinweis);
  }
  offen.forEach(function(o){
    var z=stoerungEintrag(o);
    if(!inAuswahl(o)) z.insertBefore(el('<div class="muted" style="font-size:12px">außerhalb der Auswahl</div>'), z.firstChild);
    host.appendChild(z);
  });
  c.querySelector("#st_neu").onclick=function(){ stoerungDialog(null); };
  return c;
}
/* Störungskalender: ein Monat auf einen Blick. Offene Störungen stehen am
   geplanten Einsatztag, ohne den am Zieltermin (umrandet). Erledigte
   Störungseinsätze stehen grau am Tag ihres Protokolls. Antippen eines Tags
   zeigt, was dort liegt. */
function stoerungsKalender(){
  var heute=isoLokal(new Date());
  if(!S.kalMonat) S.kalMonat=heute.slice(0,7);
  if(!S.kalTag) S.kalTag=heute;
  var c=el('<div class="card"><div class="pad stack">'+
    '<div class="rowflex" style="justify-content:space-between;gap:10px;align-items:center">'+
      '<div><h2>Störungskalender</h2><div class="sub">Offene Störungen am geplanten Einsatztag, sonst am Zieltermin. '+
        "Grau: erledigte Einsätze. Den Einsatztag trägt „Ansehen / ändern“ ein.</div></div>"+
      '<div class="rowflex" style="gap:6px;flex-wrap:nowrap">'+
        '<button class="btn ghost sm" type="button" data-k="-1" aria-label="Vormonat">‹</button>'+
        '<strong class="kal-titel" style="min-width:118px;text-align:center"></strong>'+
        '<button class="btn ghost sm" type="button" data-k="1" aria-label="Folgemonat">›</button>'+
      "</div></div>"+
    '<div class="kal"></div>'+
    '<div class="legend">'+
      '<span><i style="background:var(--crit)"></i>Einsatz geplant</span>'+
      '<span><i style="background:transparent;border:2px solid var(--crit)"></i>Zieltermin</span>'+
      '<span><i style="background:var(--ink-3)"></i>erledigt</span>'+
    "</div>"+
    '<div class="stack kal-tag"></div>'+
  "</div></div>");

  function eintraege(){
    var m={}, dazu=function(tag, e){ if(tag) (m[tag]=m[tag]||[]).push(e); };
    offeneStoerungen(true).forEach(function(o){
      if(o.termin) dazu(o.termin, {art:"geplant", o:o});
      if(o.zieltermin && o.zieltermin!==o.termin) dazu(o.zieltermin, {art:"ziel", o:o});
    });
    alleProtokolle().filter(function(p){ return istStoerung(p) && !p.geloescht && p.datum; })
      .forEach(function(p){ dazu(p.datum, {art:"erledigt", p:p}); });
    return m;
  }
  function zeichne(){
    var j=+S.kalMonat.slice(0,4), mo=+S.kalMonat.slice(5,7);
    c.querySelector(".kal-titel").textContent=MONATE_L[mo]+" "+j;
    var m=eintraege();
    var erster=new Date(j,mo-1,1), tage=new Date(j,mo,0).getDate();
    var versatz=(erster.getDay()+6)%7;   /* Montag zuerst */
    var h='<div class="kal-kopf">'+["Mo","Di","Mi","Do","Fr","Sa","So"].map(function(t){ return "<span>"+t+"</span>"; }).join("")+"</div><div class=\"kal-gitter\">";
    for(var i=0;i<versatz;i++) h+='<span class="kal-leer"></span>';
    for(var d=1;d<=tage;d++){
      var iso=j+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0"), e=m[iso]||[];
      var punkte=e.slice(0,4).map(function(x){ return '<i class="kal-p kal-'+x.art+'"></i>'; }).join("")+(e.length>4?'<b>+'+(e.length-4)+"</b>":"");
      h+='<button type="button" class="kal-t'+(iso===heute?" heute":"")+(iso===S.kalTag?" gewaehlt":"")+'" data-t="'+iso+'"'+
        ' aria-label="'+d+". "+MONATE_L[mo]+(e.length?", "+e.length+" Einträge":"")+'">'+
        "<span>"+d+'</span><span class="kal-ps">'+punkte+"</span></button>";
    }
    h+="</div>";
    c.querySelector(".kal").innerHTML=h;
    c.querySelectorAll(".kal-t").forEach(function(b){ b.onclick=function(){ S.kalTag=b.dataset.t; zeichne(); }; });
    tagZeigen(m[S.kalTag]||[]);
  }
  function tagZeigen(e){
    var box=c.querySelector(".kal-tag"); box.innerHTML="";
    if(S.kalTag.slice(0,7)!==S.kalMonat) return;
    box.appendChild(el('<div class="muted" style="font-size:12.5px;font-weight:600">'+esc(dfmt(S.kalTag))+
      (e.length?"":" – nichts eingetragen")+"</div>"));
    e.forEach(function(x){
      if(x.o){
        var z=stoerungEintrag(x.o);
        if(x.art==="ziel") z.insertBefore(el('<div class="muted" style="font-size:12px">Zieltermin an diesem Tag</div>'), z.firstChild);
        box.appendChild(z);
        return;
      }
      var p=x.p;
      var r=el('<div class="posbox"><div class="rowflex" style="justify-content:space-between;gap:8px">'+
        '<div style="min-width:0"><strong style="font-size:14px">'+(byId[p.standortId]?marktLink(byId[p.standortId]):esc(protoName(p)||"Störungseinsatz"))+"</strong>"+
          '<br><span class="muted" style="font-size:12.5px">erledigt'+(p.nameTechniker?" · "+esc(p.nameTechniker):"")+
          (p.auftragsnummer?" · Auftrag "+esc(p.auftragsnummer):"")+"</span></div>"+
        '<button class="btn ghost sm" type="button">Protokoll</button></div></div>');
      r.querySelector("button").onclick=function(){
        var a=ansichtOeffnen("Störungsprotokoll"); a.inhalt.appendChild(protokollDetail(p));
      };
      box.appendChild(r);
    });
  }
  c.querySelectorAll("[data-k]").forEach(function(b){
    b.onclick=function(){
      var j=+S.kalMonat.slice(0,4), mo=+S.kalMonat.slice(5,7)-1+(+b.dataset.k);
      j+=Math.floor(mo/12); mo=((mo%12)+12)%12;
      S.kalMonat=j+"-"+String(mo+1).padStart(2,"0");
      zeichne();
    };
  });
  zeichne();
  return c;
}

/* ---------- Posteingang aus dem Datenbank-Postfach ----------
   Das Skript auf der Synology legt jede PDF aus dem Postfach hier ab. Ein
   Rapport wird dem passenden Protokoll angehängt (Filiale und Datum stehen
   im Rapport), ein Auftrag wird zur offenen Störung. Was davon kam, gilt
   danach als erledigt – erst wenn es wirklich gespeichert ist. */
var POSTEINGANG=[], posteingangOffen=null;
function posteingangAn(){ return !!(window.UKT_CONFIG && window.UKT_CONFIG.posteingangAktiv) && Store.modus==="supabase" && !!Store.sb && !!Store.benutzer && !nurLesen(); }
function ladePosteingang(){
  if(!posteingangAn()) return Promise.resolve([]);
  return Store.sb.from("posteingang").select("*").eq("status","neu").order("eingang",{ascending:false}).limit(100)
    .then(function(r){ POSTEINGANG=r.error?[]:(r.data||[]); return POSTEINGANG; }, function(){ return []; });
}
function posteingangErledigt(art, bezug){
  var e=posteingangOffen;
  if(!e || e.art!==art || !posteingangAn()) return;
  if(e.ziel && e.ziel!==bezug) return;
  if(demo()){ posteingangOffen=null; POSTEINGANG=POSTEINGANG.filter(function(x){ return x.id!==e.id; }); return; }
  posteingangOffen=null;
  Store.sb.from("posteingang").update({status:"erledigt", bezug:bezug, erledigt_von:wer(), erledigt_am:new Date().toISOString()})
    .eq("id", e.id).select("id").then(function(r){
      if(r.error || !(r.data||[]).length){ toast("Posteingang: der Eintrag ließ sich nicht als erledigt markieren – bitte dort von Hand verwerfen."); return; }
      POSTEINGANG=POSTEINGANG.filter(function(x){ return x.id!==e.id; }); }, function(){});
}
function posteingangDatei(e){
  return Store.sb.storage.from("posteingang").createSignedUrl(e.pfad, 600).then(function(r){
    if(!r.data) throw new Error("Datei nicht abrufbar");
    return fetch(r.data.signedUrl).then(function(x){ return x.blob(); });
  }).then(function(b){
    return new File([b], e.dateiname, {type:b.type||"application/pdf"});
  });
}
function posteingangKarte(){
  var c=el('<div class="card"><div class="pad stack"><div><h2>Posteingang</h2><div class="sub">'+
    "Aus dem Datenbank-Postfach: Aufträge und Rapportberichte von Lidl. Antippen ordnet sie zu.</div></div>"+
    '<div class="stack" data-liste><div class="muted">wird geladen …</div></div></div></div>');
  var host=c.querySelector("[data-liste]");
  ladePosteingang().then(function(liste){
    host.innerHTML="";
    if(!liste.length){ host.appendChild(el('<div class="muted" style="font-size:13px">Nichts Neues im Postfach.</div>')); return; }
    liste.forEach(function(e){
      var info=werteRapport("", e.dateiname) || {};
      var s=info.filiale ? ST.filter(function(x){ return String(x.filiale||"").replace(/^0+/,"")===info.filiale; })[0] : null;
      var z=el('<div class="posbox"><div class="rowflex" style="justify-content:space-between;gap:8px">'+
        '<div style="min-width:0"><strong style="word-break:break-all">'+esc(e.dateiname)+"</strong><br>"+
          '<span class="muted" style="font-size:12.5px">'+esc(zeitFmt(e.eingang))+(e.betreff?" · "+esc(e.betreff):"")+"</span>"+
          (s?'<br><span style="font-size:13px">'+marktLink(s)+"</span>":"")+"</div>"+
        '<span class="tag">'+esc({rapport:"Rapport",auftrag:"Auftrag"}[e.art]||"unklar")+"</span></div>"+
        '<div class="rowflex" style="gap:6px"><button class="btn ghost sm" type="button" data-a="sehen">ansehen</button></div></div>');
      var leiste=z.querySelector(".rowflex:last-child");
      z.querySelector('[data-a="sehen"]').onclick=function(){
        posteingangDatei(e).then(function(f){
          var u=URL.createObjectURL(f);
          if(/pdf/.test(f.type)) pdfAnsicht(u, e.dateiname); else bildAnsicht(u, e.dateiname);
        }, function(x){ toast(x.message); });
      };
      if(e.art!=="auftrag"){
        var rb=el('<button class="btn sm" type="button">Rapport zuordnen</button>');
        rb.onclick=function(){ posteingangRapport(e); };
        leiste.appendChild(rb);
      }
      if(e.art!=="rapport"){
        var ab=el('<button class="btn sm" type="button">Als offene Störung erfassen</button>');
        ab.onclick=function(){
          posteingangDatei(e).then(function(f){
            posteingangOffen={id:e.id, art:"auftrag"};
            stoerungDialog(null);
            /* die PDF gleich einlesen, als hätte man sie geöffnet */
            var ein=document.querySelector(".assistent #st_pdf");
            if(ein && /pdf/.test(f.type)){ var dt=new DataTransfer(); dt.items.add(f); ein.files=dt.files; ein.dispatchEvent(new Event("change")); }
          }, function(x){ toast(x.message); });
        };
        leiste.appendChild(ab);
      }
      var vb=el('<button class="btn ghost sm" type="button">verwerfen</button>');
      vb.onclick=function(){
        if(demo()){ z.remove(); toast("Präsentation: verworfen – gespeichert wurde nichts."); return; }
        var g=window.prompt("Warum wird „"+e.dateiname+"“ verworfen?",""); if(g===null) return;
        Store.sb.from("posteingang").update({status:"verworfen", notiz:g, erledigt_von:wer(), erledigt_am:new Date().toISOString()})
          .eq("id",e.id).select("id").then(function(r){
            /* keine Zeile geändert = abgelehnt (Rechte) – dann bleibt der Eintrag stehen */
            if(r.error || !(r.data||[]).length){ toast("Nicht verworfen"+(r.error?" ("+r.error.message+")":" – keine Berechtigung")+"."); return; }
            z.remove(); toast("Verworfen."); }, function(){ toast("Keine Verbindung – nicht verworfen."); });
      };
      leiste.appendChild(vb);
      host.appendChild(z);
    });
  });
  return c;
}
/* Rapport aus dem Postfach: lesen, passendes Protokoll suchen (Filiale und
   Tag), dort anhängen. Ohne Treffer: Liste der Protokolle dieser Filiale. */
function posteingangRapport(e){
  posteingangDatei(e).then(function(f){
    if(!/pdf/i.test(f.type||"") && !/\.pdf$/i.test(e.dateiname||"")) throw new Error("„"+e.dateiname+"“ ist keine PDF – als Rapport nicht verwendbar.");
    if(pdfZuGross(f)) throw new Error("Die PDF ist zu groß für die Ablage.");
    return dateiAlsDatenUrl(f);
  }).then(function(u){
    return leseRapport(u, e.dateiname).then(function(daten){
      /* ohne Filiale und Datum ließe sich nichts sinnvoll vorschlagen */
      if(!daten || (!daten.filiale && !(daten.zeilen&&daten.zeilen.length))){
        toast("Aus diesem Rapport lassen sich Filiale und Datum nicht lesen – bitte im Protokoll über „Rapportbericht anhängen“ zuordnen."); return;
      }
      var fil=daten && daten.filiale;
      var tage=(daten&&daten.zeilen||[]).map(function(z){ return z.datum; });
      var kand=alleProtokolle().filter(function(p){
        if(rapportVon(p) || p.geloescht) return false;
        var s=byId[p.standortId];
        if(fil && (!s || String(s.filiale||"").replace(/^0+/,"")!==fil)) return false;
        return !tage.length || tage.some(function(t){ return gleicherBesuch(t,p.datum); });
      }).sort(function(a,b){ return String(b.datum).localeCompare(String(a.datum)); });
      var v=ansichtOeffnen("Rapport zuordnen");
      v.schritt.textContent=rapportZeile({daten:daten, name:e.dateiname}).replace(/^liegt bei · /,"");
      if(!kand.length) v.inhalt.appendChild(el('<div class="note warnbox">Kein passendes Protokoll ohne Rapport gefunden'+
        (fil?" (Filiale "+esc(fil)+(tage.length?", "+esc(tage.map(dfmt).join(", ")):"")+")":"")+
        ". Gibt es das Protokoll schon? Sonst erst das Protokoll anlegen und den Rapport dort anhängen.</div>"));
      kand.slice(0,8).forEach(function(p){
        var b=el('<button class="btn ghost" type="button" style="text-align:left">'+esc(dfmt(p.datum))+" · "+
          esc(protoName(p))+" · "+esc(istStoerung(p)?"Störung":(p.wartungsart||"Wartung"))+(p.nameTechniker?" · "+esc(p.nameTechniker):"")+"</button>");
        b.onclick=function(){
          v.zu();
          /* an genau dieses Protokoll gebunden – eine andere Korrektur erledigt ihn nicht */
          posteingangOffen={id:e.id, art:"rapport", ziel:p._id};
          S.rapportNeu={name:e.dateiname, datenUrl:u, daten:daten};
          ladeUnterschrift(p).then(function(){ formDirty=false; S.bearbeiten={x:p}; S.view="protokoll"; dialogeSchliessen(); render(); window.scrollTo({top:0}); });
        };
        v.inhalt.appendChild(b);
      });
    });
  }).catch(function(x){ toast(x.message); });   /* auch eine kaputte PDF meldet sich */
}

/* ---------- QR-Code des Lidl-Auftrags zeigen ----------
   Beim Rapport im Lidl-System wird der Auftrag über seinen QR-Code bzw. die
   Nummer wiedergefunden. Die App zeigt den QR-Code groß auf Weiß – gescannt
   wurde er, steht genau dessen Inhalt drin; sonst die Auftragsnummer, die
   laut Auftrag der einzige Inhalt des Lidl-QR-Codes ist. */
/* Der gescannte QR-Inhalt gilt nur, solange er zur eingetragenen Nummer
   passt – nach einer geänderten Nummer oder einem anderen Auftrag wäre es
   der QR-Code des falschen Auftrags. */
function qrPasst(roh, nummer){
  roh=String(roh||"").trim(); nummer=String(nummer||"").trim();
  if(!roh || !nummer) return roh;
  return roh.indexOf(nummer)>=0 ? roh : "";
}
function auftragQrAnsicht(nummer, roh){
  roh=qrPasst(roh, nummer);
  var inhalt=String(roh||nummer||"").trim();
  if(!inhalt){ toast("Keine Auftragsnummer eingetragen."); return; }
  var v=ansichtOeffnen("Lidl-Auftrag "+(nummer||""));
  v.schritt.textContent=roh ? "QR-Code wie auf dem Auftrag gescannt" : "QR-Code aus der Auftragsnummer";
  var box=el('<div class="stack" style="align-items:center;text-align:center">'+
    '<div style="background:#fff;padding:18px;border-radius:12px;display:inline-block;max-width:100%">'+
      '<canvas style="width:min(78vw,340px);height:auto;display:block;image-rendering:pixelated"></canvas></div>'+
    '<div class="mono" style="font-size:30px;font-weight:700;letter-spacing:.06em;user-select:all">'+esc(nummer||inhalt)+"</div>"+
    '<div class="rowflex" style="justify-content:center"><button class="btn ghost sm" type="button">Nummer kopieren</button></div>'+
    '<div class="muted" style="font-size:12.5px">Beim Rapport im Lidl-System scannen oder die Nummer eintippen. '+
      "Bildschirm hell stellen, falls der Scanner nicht greift.</div></div>");
  try{
    if(!window.QRious) throw new Error("QR-Bibliothek nicht geladen – keine Verbindung?");
    new window.QRious({element:box.querySelector("canvas"), value:inhalt, size:600, level:"M", padding:0, background:"#ffffff", foreground:"#000000"});
  }catch(e){
    box.querySelector("canvas").replaceWith(el('<div style="color:#111;font-size:13px;padding:12px">'+esc(e.message)+"</div>"));
  }
  box.querySelector("button").onclick=function(){ inZwischenablage(nummer||inhalt, "Auftragsnummer"); };
  v.inhalt.appendChild(box);
}

/* ---------- Marktansicht von überall ----------
   Ein Marktname lässt sich antippen – in der Fälligkeitsliste, bei offenen
   Störungen, im Kalender, im Protokoll. Es öffnet sich der Markt mit offenen
   Störungen, Anlagen und Terminen und seiner Wartungs- und Störungshistorie,
   ohne dass man den Reiter wechselt und etwas Angefangenes verliert. */
function marktLink(s, text){
  return '<span class="marktlink" role="link" tabindex="0" data-markt="'+esc(s.id)+'" title="Markt ansehen">'+
    esc(text||stName(s))+"</span>";
}
function marktAnsicht(sid){
  var s=byId[sid]; if(!s) return;
  var a=ansichtOeffnen(stName(s));
  a.schritt.textContent=[s.filiale?"Filiale "+s.filiale:"", s.adresse].filter(Boolean).join(" · ");
  a.inhalt.appendChild(standortDetail(s));
  var h=el('<div class="card" style="box-shadow:none;margin-top:12px"><div class="pad stack">'+
    '<h2>Wartungs- und Störungshistorie</h2></div></div>');
  h.querySelector(".stack").appendChild(historieAnsicht(s));
  a.inhalt.appendChild(h);
  /* führt ein Knopf woandershin (Protokoll, Verwaltung), geht die Ansicht zu */
  /* auch wenn man schon im Protokoll-Reiter ist: ein neu begonnenes Protokoll
     (anderer Markt/Termin/Störung) – sonst läge die Ansicht über dem Formular
     und dem Schritt-für-Schritt-Dialog */
  var stand=function(){ return [S.view, S.protoStandort, S.protoPos, S.protoArt, S.stoerungAus, !!S.bearbeiten].join("|"); };
  var vorher=stand();
  a.inhalt.addEventListener("click", function(e){
    if(!e.target.closest || !e.target.closest("button,a")) return;
    setTimeout(function(){ if(stand()!==vorher) a.zu(); }, 60);
  });
}
/* in der Einfangphase: sonst öffnete die Zeile darunter (etwa das
   Protokoll) zuerst ihr eigenes Ziel */
document.addEventListener("click", function(e){
  var m=e.target && e.target.closest ? e.target.closest("[data-markt]") : null;
  if(!m) return;
  e.preventDefault(); e.stopPropagation();
  marktAnsicht(m.dataset.markt);
}, true);
document.addEventListener("keydown", function(e){
  if(e.key!=="Enter") return;
  var m=e.target && e.target.closest ? e.target.closest("[data-markt]") : null;
  if(m){ e.preventDefault(); marktAnsicht(m.dataset.markt); }
}, true);

/* Termin einer Störung für den Kalender des Handys. Mit geplantem Einsatz
   und Uhrzeit wird es ein Termin über eine Stunde, sonst ein Ganztags-
   eintrag am Einsatz- bzw. Zieltag. Das Handy fragt beim Öffnen der Datei,
   in welchen Kalender er soll. */
function stoerungIcs(o){
  var tag=o.termin||o.zieltermin;
  if(!tag){ toast("Erst über „Ansehen / ändern“ einen Einsatztag oder Zieltermin eintragen."); return; }
  var s=o.standortId?byId[o.standortId]:null;
  var tx=function(t){ return String(t||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1"); };
  var d=tag.replace(/-/g,""), zeilen, jetzt=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  if(o.termin && o.terminZeit){
    /* in UTC umgerechnet – das versteht jeder Kalender ohne Zeitzonenangabe */
    var utc=function(x){ return x.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""); };
    var von=new Date(o.termin+"T"+o.terminZeit+":00"), bis=new Date(von.getTime()+3600000);
    zeilen=["DTSTART:"+utc(von), "DTEND:"+utc(bis)];
  } else {
    var n=new Date(tag+"T12:00:00"); n.setDate(n.getDate()+1);
    zeilen=["DTSTART;VALUE=DATE:"+d, "DTEND;VALUE=DATE:"+isoLokal(n).replace(/-/g,"")];
  }
  var titel="Störung "+(s?stName(s):(o.filialCode||""))+(o.problemtyp?" – "+o.problemtyp:"");
  var text=[o.auftragsnummer?"Lidl-Auftrag "+o.auftragsnummer:"", o.zieltermin?"Zieltermin "+dfmt(o.zieltermin):"",
            o.terminTechniker?"Techniker/in: "+o.terminTechniker:"", o.beschreibung||"", o.notiz?"Notiz: "+o.notiz:""].filter(Boolean).join("\n");
  var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//UKT//Wartungsleitstand//DE","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:"+o._id+"@wartungsleitstand", "DTSTAMP:"+jetzt]
    .concat(zeilen)
    .concat(["SUMMARY:"+tx(titel), s?"LOCATION:"+tx(s.adresse):"", "DESCRIPTION:"+tx(text), "END:VEVENT","END:VCALENDAR"])
    .filter(Boolean).join("\r\n");
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar;charset=utf-8"}));
  a.download="stoerung-"+(o.auftragsnummer||o._id)+".ics";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
}

/* ---------- View: Karte ---------- */
/* Kandidaten für die Tour: Standorte, deren Termine zu den gewählten
   Fälligkeiten passen */
function tourKandidaten(){
  var raus=[];
  filtered().forEach(function(s){
    if(!s.lat) return;
    if(S.tour.laender.length && S.tour.laender.indexOf(bundesland(s))<0) return;
    var bis=endeFolgemonat();
    var pos=s.pos.filter(function(p){
      var st = p.status==="geplant" ? "erledigt" : p.status;
      if(S.tour.status.indexOf(st)>=0) return true;
      /* auf Wunsch auch, was erst im nächsten Monat dran ist */
      return S.tour.naechsterMonat && p.naechste && p.naechste<=bis;
    });
    if(pos.length) raus.push({standort:s, positionen:pos});
  });
  return raus;
}
function tourRechnen(){
  var kandidaten=tourKandidaten();
  if(S.tour.manuell){
    var erlaubt={}; S.tour.manuell.forEach(function(id){ erlaubt[id]=1; });
    kandidaten=kandidaten.filter(function(k){ return erlaubt[k.standort.id]; });
  }
  var start=BETRIEB;
  if(S.tour.startId==="__gps"){
    if(S.tour.gps) start={ id:"__gps", name:"Aktueller Standort",
      adresse:"Position des Technikers", lat:S.tour.gps.lat, lon:S.tour.gps.lon };
    /* ohne Positionsfreigabe bleibt der Betrieb als Ausgangspunkt */
  } else if(byId[S.tour.startId] && byId[S.tour.startId].lat){
    start=byId[S.tour.startId];
  }
  S.tour.geometrie=null;
  return planeTour({start:start, stopps:kandidaten, stundenProTag:S.tour.stundenProTag})
    .then(function(erg){
      S.tour.ergebnis=erg;
      if(!erg || !erg.echteStrasse) return null;
      /* die tatsächlich gefahrene Linie für die Karte nachladen */
      return strassenGeometrie([erg.start].concat(erg.reihenfolge).concat([erg.start]))
        .then(function(g){ S.tour.geometrie=g; return g; });
    });
}

function viewKarte(){
  var f=document.createDocumentFragment();
  var list=filtered();
  var withGeo=list.filter(function(s){return s.lat;});
  var noGeo=list.filter(function(s){return !s.lat;});

  if(KARTE_MODUS==="osm" && window.L){
    f.appendChild(karteOsm(withGeo));
    f.appendChild(tourPanel());
    if(noGeo.length) f.appendChild(ohneKarte(noGeo));
    return f;
  }

  var lo=[9.5,17.2], la=[46.35,49.05];
  var k=Math.cos(47.7*Math.PI/180);
  var W=1000, pad=18;
  var uw=(lo[1]-lo[0])*k, uh=la[1]-la[0];
  var sc=(W-2*pad)/uw, H=Math.round(uh*sc+2*pad);
  function X(lon){ return pad+(lon-lo[0])*k*sc; }
  function Y(lat){ return pad+(la[1]-lat)*sc; }

  var path="M"+AT.map(function(p){ return X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1); }).join("L")+"Z";
  var maxPos=1; withGeo.forEach(function(s){ if(s.pos.length>maxPos) maxPos=s.pos.length; });

  var dots=withGeo.slice().sort(function(a,b){ return STATUS_RANK[b.status]-STATUS_RANK[a.status]; }).map(function(s){
    var r=5+3.2*Math.sqrt((s.pos.length-1)/Math.max(1,maxPos-1));
    /* offene Störung: roter Ring um den Punkt */
    return (stoerungVonMarkt(s.id).length?'<circle cx="'+X(s.lon).toFixed(1)+'" cy="'+Y(s.lat).toFixed(1)+'" r="'+(r+4).toFixed(1)+
        '" style="fill:none;stroke:var(--crit);stroke-width:2.5;pointer-events:none"/>':"")+
      '<circle class="dot'+(S.sel===s.id?" sel":"")+'" cx="'+X(s.lon).toFixed(1)+'" cy="'+Y(s.lat).toFixed(1)+'" r="'+r.toFixed(1)+
      '" style="fill:var('+STATUS_VAR[s.status]+')" data-id="'+s.id+'" tabindex="0" role="button" aria-label="'+esc(stName(s)+", "+s.adresse)+'">'+
      "<title>"+esc(stName(s)+" · "+s.adresse+" · "+STATUS_LABEL[s.status])+"</title></circle>";
  }).join("");
  /* Störungsmärkte außerhalb der Auswahl: trotzdem der rote Ring */
  var drin={}; withGeo.forEach(function(s){ drin[s.id]=1; });
  dots+=stoerungsMaerkte().filter(function(s){ return !drin[s.id]; }).map(function(s){
    return '<circle cx="'+X(s.lon).toFixed(1)+'" cy="'+Y(s.lat).toFixed(1)+'" r="9" data-id="'+s.id+'" '+
      'style="fill:none;stroke:var(--crit);stroke-width:2.5"><title>'+esc("Störung offen: "+stName(s))+"</title></circle>";
  }).join("");

  /* Route zeichnen: Linienzug + nummerierte Stopps */
  var routeSvg="";
  var T=S.tour.ergebnis;
  var inTour={};
  if(T){
    var punkte=[T.start].concat(T.reihenfolge).concat([T.start]);
    var d="M"+punkte.map(function(p){ return X(p.lon).toFixed(1)+","+Y(p.lat).toFixed(1); }).join("L");
    routeSvg+='<path d="'+d+'" style="fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;'+
      'stroke-linecap:round;stroke-dasharray:7 5;opacity:.85"/>';
    T.reihenfolge.forEach(function(p,i){ inTour[p.id]=i+1; });
    routeSvg+='<g>'+T.reihenfolge.map(function(p,i){
      return '<circle cx="'+X(p.lon).toFixed(1)+'" cy="'+Y(p.lat).toFixed(1)+'" r="9" style="fill:var(--accent);stroke:var(--surface);stroke-width:1.8"/>'+
        '<text x="'+X(p.lon).toFixed(1)+'" y="'+(Y(p.lat)+3.4).toFixed(1)+'" text-anchor="middle" font-size="10" '+
        'style="fill:#fff;font-weight:600">'+(i+1)+"</text>";
    }).join("")+"</g>";
    routeSvg+='<g><rect x="'+(X(T.start.lon)-7).toFixed(1)+'" y="'+(Y(T.start.lat)-7).toFixed(1)+
      '" width="14" height="14" rx="3" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.8"/>'+
      '<title>'+esc("Start: "+T.start.name)+"</title></g>";
  }

  /* eigene Position, sobald sie bekannt ist */
  if(S.tour.gps){
    var gx=X(S.tour.gps.lon).toFixed(1), gy=Y(S.tour.gps.lat).toFixed(1);
    routeSvg+='<g><circle cx="'+gx+'" cy="'+gy+'" r="11" style="fill:var(--accent);opacity:.22"/>'+
      '<circle cx="'+gx+'" cy="'+gy+'" r="4.5" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/>'+
      "<title>Ihr aktueller Standort</title></g>";
  }

  var cityDots=STAEDTE.map(function(c){
    return '<circle cx="'+X(c[1]).toFixed(1)+'" cy="'+Y(c[2]).toFixed(1)+'" r="2" style="fill:var(--ink-3);opacity:.55"/>';
  }).join("");
  /* Beschriftung nach den Punkten zeichnen, damit sie nicht verdeckt wird */
  var cityLabels=STAEDTE.map(function(c){
    var dx=c[3]==="start"?7:(c[3]==="end"?-7:0);
    return '<text class="cityt" x="'+(X(c[1])+dx).toFixed(1)+'" y="'+(Y(c[2])-8).toFixed(1)+'" text-anchor="'+c[3]+'">'+esc(c[0])+"</text>";
  }).join("");

  var card=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Standortkarte Österreich</h2><div class="sub">'+withGeo.length+' Standorte mit Koordinaten. Punktgröße = Anzahl Wartungspositionen, Farbe = dringlichster Status am Standort. Antippen für Details.</div></div>'+
    stoerungAusserhalbHinweis(withGeo)+
    '<div class="legend">'+["ueberfaellig","faellig","erledigt"].map(function(k2){
      return '<span><i style="background:var('+STATUS_VAR[k2]+')"></i>'+STATUS_LABEL[k2]+"</span>";
    }).join("")+"</div>"+
    '<div class="mapwrap"><svg class="map" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Karte der Lidl-Standorte in Österreich">'+
      '<path class="outline" d="'+path+'"/>'+cityDots+dots+routeSvg+cityLabels+
    "</svg></div>"+
    '<div id="mapdetail"></div>'+
  "</div></div>");

  var det=card.querySelector("#mapdetail");
  function sel(id){ S.sel=id; det.innerHTML=""; det.appendChild(standortDetail(byId[id]));
    card.querySelectorAll(".dot").forEach(function(d){ d.classList.toggle("sel", d.dataset.id===id); }); }
  card.querySelectorAll(".dot").forEach(function(d){
    d.addEventListener("click",function(){ sel(d.dataset.id); });
    d.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); sel(d.dataset.id); } });
    d.addEventListener("mousemove",function(e){ var s=byId[d.dataset.id];
      tipShow(e,"<b>"+esc(stName(s))+"</b><br>"+esc(s.adresse)+"<br>"+s.pos.length+" Position(en) · "+STATUS_LABEL[s.status]); });
    d.addEventListener("mouseleave",tipHide);
  });
  if(S.sel && byId[S.sel] && byId[S.sel].lat) sel(S.sel);
  f.appendChild(card);
  f.appendChild(tourPanel());

  if(noGeo.length) f.appendChild(ohneKarte(noGeo));
  return f;
}

    '<div class="sub">Diese Einträge haben in der Liste keine auswertbare Adresse – meist Sammelzeilen oder Kurznamen.</div>'+
    '<div class="rowflex">'+noGeo.map(function(s){ return '<span class="tag">'+esc(s.name)+" ("+s.pos.length+")</span>"; }).join("")+"</div>"+

/* ---------- Karte auf OpenStreetMap (Leaflet) ---------- */
var leafletKarte=null;
function tokenFarbe(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#0E6E85";
}
/* Märkte mit offener Störung und Koordinaten – unabhängig von jedem Filter */
function stoerungsMaerkte(){
  var ids={};
  offeneStoerungen(true).forEach(function(o){ if(o.standortId) ids[o.standortId]=1; });
  return Object.keys(ids).map(function(id){ return byId[id]; }).filter(function(s){ return s && s.lat; });
}
/* Hinweis, wenn offene Störungen außerhalb der aktuellen Auswahl liegen */
function stoerungAusserhalbHinweis(withGeo){
  var drin={}; withGeo.forEach(function(s){ drin[s.id]=1; });
  var n=offeneStoerungen(true).filter(function(o){ return !o.standortId || !drin[o.standortId]; }).length;
  return n ? '<div class="note warnbox" style="font-size:13px"><strong>'+n+" offene Störung"+(n===1?"":"en")+
    "</strong> außerhalb der Suche bzw. Region – sie stehen trotzdem als rotes Zeichen auf der Karte.</div>" : "";
}
function karteOsm(withGeo){
  var T=S.tour.ergebnis;
  var card=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Standortkarte</h2><div class="sub">'+withGeo.length+' Standorte auf OpenStreetMap. '+
      'Punktgröße = Anzahl Wartungspositionen, Farbe = dringlichster Status. Antippen öffnet Details und die Navigation.</div></div>'+
    stoerungAusserhalbHinweis(withGeo)+
    '<div class="legend">'+["ueberfaellig","faellig","erledigt"].map(function(k){
      return '<span><i style="background:var('+STATUS_VAR[k]+')"></i>'+STATUS_LABEL[k]+"</span>";
    }).join("")+'<span><span class="stoerpin klein">!</span>offene Störung</span></div>'+
    '<div id="osmkarte" style="height:min(68vh,560px);width:100%;border-radius:10px;overflow:hidden;'+
      'border:1px solid var(--line);background:var(--surface-2)"></div>'+
    '<div class="rowflex"><button class="btn ghost sm" type="button" id="kartealle">Alle Standorte zeigen</button>'+
      '<span class="muted" style="font-size:12px">Ist Ihr Standort bekannt, öffnet die Karte in Ihrer Umgebung.</span></div>'+
    '<div id="mapdetail"></div>'+
  "</div></div>");

  /* Leaflet braucht den Container im Dokument, deshalb erst danach aufbauen */
  setTimeout(function(){
    var host=document.getElementById("osmkarte");
    if(!host) return;
    if(leafletKarte){ try{ leafletKarte.remove(); }catch(e){} leafletKarte=null; }
    var karte=L.map(host,{scrollWheelZoom:true}).setView([47.6,13.4],7);
    leafletKarte=karte;
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
      maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(karte);

    var maxPos=1; withGeo.forEach(function(s){ if(s.pos.length>maxPos) maxPos=s.pos.length; });
    var bounds=[];
    withGeo.forEach(function(s){
      var r=6+4*Math.sqrt((s.pos.length-1)/Math.max(1,maxPos-1));
      var m=L.circleMarker([s.lat,s.lon],{
        radius:r, color:tokenFarbe("--surface"), weight:1.8, opacity:1,
        fillColor:tokenFarbe(STATUS_VAR[s.status]), fillOpacity:1
      }).addTo(karte);
      bounds.push([s.lat,s.lon]);
      m.bindPopup(function(){ return popupInhalt(s); },{minWidth:230,maxWidth:280});
      m.on("popupopen",function(){ S.sel=s.id; });
    });
    /* Offene Störungen obenauf: ein rotes Warnzeichen am Markt, das auch
       zwischen vielen Punkten auffällt – IMMER alle, auch Märkte außerhalb
       von Suche oder Region; still weggefiltert sähe es aus, als gäbe es keine */
    stoerungsMaerkte().forEach(function(s){
      var n=stoerungVonMarkt(s.id).length; if(!n) return;
      var mk=L.marker([s.lat,s.lon],{zIndexOffset:1000, title:"Störung offen: "+stName(s),
        icon:L.divIcon({className:"", iconSize:[26,26], iconAnchor:[13,30],
          html:'<div class="stoerpin"><span>'+(n>1?n:"!")+"</span></div>"})}).addTo(karte);
      mk.bindPopup(function(){ return popupInhalt(s); },{minWidth:230,maxWidth:280});
      bounds.push([s.lat,s.lon]);   /* der Ausschnitt schließt die Störungen ein */
    });

    if(T){
      var punkte=[T.start].concat(T.reihenfolge).concat([T.start]);
      if(S.tour.geometrie){
        /* tatsächlicher Straßenverlauf vom Routendienst */
        L.polyline(S.tour.geometrie.map(function(c){ return [c[1],c[0]]; }),{
          color:tokenFarbe("--accent"), weight:4, opacity:.8
        }).addTo(karte);
      } else {
        L.polyline(punkte.map(function(p){ return [p.lat,p.lon]; }),{
          color:tokenFarbe("--accent"), weight:3, opacity:.85, dashArray:"8 6"
        }).addTo(karte);
      }
      T.reihenfolge.forEach(function(p,i){
        L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",iconSize:[22,22],iconAnchor:[11,11],
          html:'<div style="width:22px;height:22px;border-radius:50%;background:'+tokenFarbe("--accent")+
            ';color:'+tokenFarbe("--on-accent")+';font:600 11px/22px system-ui,sans-serif;text-align:center;'+
            'border:2px solid '+tokenFarbe("--surface")+'">'+(i+1)+"</div>"})}).addTo(karte);
      });
      L.marker([T.start.lat,T.start.lon],{icon:L.divIcon({className:"",iconSize:[16,16],iconAnchor:[8,8],
        html:'<div style="width:16px;height:16px;border-radius:4px;background:'+tokenFarbe("--ink")+
          ';border:2px solid '+tokenFarbe("--surface")+'"></div>'})})
        .addTo(karte).bindPopup("Start: "+esc(T.start.name||"Startpunkt"));
      bounds=bounds.concat(punkte.map(function(p){ return [p.lat,p.lon]; }));
    }
    if(S.tour.gps){
      L.circle([S.tour.gps.lat,S.tour.gps.lon],{radius:Math.max(60,S.tour.gps.genauigkeit),
        color:tokenFarbe("--accent"),weight:1,fillColor:tokenFarbe("--accent"),fillOpacity:.18}).addTo(karte);
      L.circleMarker([S.tour.gps.lat,S.tour.gps.lon],{radius:6,color:tokenFarbe("--surface"),weight:2,
        fillColor:tokenFarbe("--accent"),fillOpacity:1}).addTo(karte).bindPopup("Ihr aktueller Standort");
      bounds.push([S.tour.gps.lat,S.tour.gps.lon]);
    }
    function alleZeigen(){
      if(bounds.length) karte.fitBounds(bounds,{padding:[24,24]});
    }
    function ausrichten(){
      /* Ganz Österreich passt auf ein schmales Hochformat nur stark
         verkleinert hinein. Ist die Position bekannt, ist die Umgebung
         des Technikers die nützlichere Ansicht. */
      if(S.tour.gps) karte.setView([S.tour.gps.lat, S.tour.gps.lon], 10);
      else alleZeigen();
    }
    ausrichten();
    /* Leaflet misst den Container sofort, die endgültige Höhe steht
       aber erst nach dem Layout fest */
    setTimeout(function(){ if(leafletKarte){ karte.invalidateSize(); ausrichten(); } },200);

    var knopf=document.getElementById("kartealle");
    if(knopf) knopf.onclick=alleZeigen;
  },0);

  return card;
}

  d.innerHTML='<div style="font:600 14px/1.3 system-ui,sans-serif;margin-bottom:2px">'+esc(stName(s))+"</div>"+
    '<div style="font-size:12.5px;color:#555;margin-bottom:6px">'+esc(s.adresse)+"</div>"+
    '<div style="margin-bottom:8px">'+marktPill(s)+' <span class="tag">'+s.pos.length+" Position(en)</span></div>"+
    stoerungVonMarkt(s.id).map(function(o){
      return '<div style="font-size:12.5px;margin-bottom:8px;padding:6px 8px;border-left:3px solid #B3342A;background:#F7E2E0;color:#222;border-radius:4px">'+
        "<strong>Störung offen</strong>"+(o.problemtyp?": "+esc(o.problemtyp):"")+
        '<br><span style="color:#555">'+esc(stoerungAlter(o).text)+(o.termin?" · Einsatz "+esc(dfmt(o.termin)):"")+"</span></div>";
    }).join("")+
    '<div style="display:flex;flex-direction:column;gap:6px">'+
      '<a class="btn sm" style="text-align:center;text-decoration:none" href="'+gmapsZiel(s)+
        '" target="_blank" rel="noopener">Mit Google Maps navigieren</a>'+
      '<button class="btn ghost sm" type="button" data-akt="detail">Anlagen und Historie</button>'+
      '<button class="btn ghost sm" type="button" data-akt="proto" data-schreiben>Protokoll ausfüllen</button>'+
    "</div>";
  d.querySelector('[data-akt="detail"]').onclick=function(){

  d.querySelector('[data-akt="proto"]').onclick=function(){
    /* keinen Termin vorgeben – das Formular wählt je Anlage den fälligen */
    S.protoStandort=s.id; S.protoPos=""; S.protoArt="wartung"; S.stoerungAus=null; S.view="protokoll"; render(); window.scrollTo({top:0});
  };
  return d;
}

function tourPanel(){
  var kand=tourKandidaten();
  var T=S.tour.ergebnis;
  var gpsHinweis="";
  if(S.tour.startId==="__gps"){
    if(S.tour.gps) gpsHinweis='<div class="note">Startpunkt ist Ihre aktuelle Position, ermittelt auf rund '+
      Math.round(S.tour.gps.genauigkeit)+' m genau.</div>';

  var c=el('<div class="card"><div class="pad stack">'+

          return '<button class="chip" type="button" data-s="'+k+'" aria-pressed="'+(S.tour.status.indexOf(k)>=0)+'">'+
            (k==="erledigt"?"später fällige – alle":STATUS_LABEL[k])+"</button>";
        }).join("")+
        '<button class="chip" type="button" id="t_folge" aria-pressed="'+(!!S.tour.naechsterMonat)+'">'+

      '<div class="muted" style="font-size:12px;margin-top:6px">„Bis Ende nächsten Monats“ nimmt mit, was bald ansteht. '+
        "„Später fällige – alle“ nimmt jeden noch nicht fälligen Termin dazu, auch einen in elf Monaten, "+

      '<div class="chips" id="t_land">'+
        BUNDESLAENDER.filter(function(l){ return ST.some(function(s){ return s.lat && bundesland(s)===l; }); }).map(function(l){
          var n=ST.filter(function(s){ return s.lat && bundesland(s)===l; }).length;
          return '<button class="chip" type="button" data-l="'+esc(l)+'" aria-pressed="'+(S.tour.laender.indexOf(l)>=0)+'">'+
            esc(l)+' <span class="muted">'+n+"</span></button>";
        }).join("")+
        '<button class="chip" type="button" data-l="__alle" aria-pressed="'+(!S.tour.laender.length)+'">ganz Österreich</button>'+
      "</div></div>"+

    '<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">'+
      '<label class="fl"><span>Startpunkt</span><select id="t_start"></select></label>'+
      '<label class="fl"><span>Position</span><button class="btn ghost" type="button" id="t_gps">'+
        (S.tour.gps?"Standort aktualisieren":"Standort bestimmen")+"</button></label>"+
      '<label class="fl"><span>Arbeitszeit je Tag (h)</span>'+
        '<input type="number" id="t_std" min="4" max="14" step="0.5" value="'+S.tour.stundenProTag+'"></label>'+
    "</div>"+
    gpsHinweis+

    '<div class="rowflex">'+
      '<button class="btn" type="button" id="t_go">Route vorschlagen</button>'+

      '<span class="muted" style="font-size:12.5px">'+kand.length+' Standorte passen zur Auswahl'+

  var startSel=c.querySelector("#t_start");
  var oG=document.createElement("option"); oG.value="__gps";

  var o0=document.createElement("option"); o0.value="__betrieb";
  o0.textContent=BETRIEB.name+" · "+BETRIEB.adresse; startSel.appendChild(o0);
  ST.slice().filter(function(x){return x.lat;}).sort(function(a,b){ return stName(a).localeCompare(stName(b),"de"); })
    .forEach(function(x){ var o=document.createElement("option"); o.value=x.id;
      o.textContent=(stName(x)===x.adresse)?x.adresse:(stName(x)+" · "+x.adresse); startSel.appendChild(o); });
  startSel.value=S.tour.startId;

  c.querySelectorAll("#t_status .chip").forEach(function(b){
    b.onclick=function(){
      var k=b.dataset.s, i=S.tour.status.indexOf(k);

    var v=parseFloat(e2.target.value); if(v>=4&&v<=14) S.tour.stundenProTag=v;
  };

  goBtn.onclick=function(){
    S.tour.startId=startSel.value;
    var v=parseFloat(c.querySelector("#t_std").value); if(v>=4&&v<=14) S.tour.stundenProTag=v;
    if(!tourKandidaten().length){ toast("Keine Standorte für diese Auswahl."); return; }

      goBtn.disabled=true; goBtn.textContent="Route wird berechnet …";

        goBtn.disabled=false; goBtn.textContent="Route vorschlagen";

    if(S.tour.startId!=="__gps" || frisch){ rechnen(); return; }
    goBtn.disabled=true; goBtn.textContent="Standort wird ermittelt …";
    holeStandort().then(function(p){
      if(p.fehler){ S.tour.gps=null; S.tour.gpsFehler=p.fehler; }
      else { S.tour.gps=p; S.tour.gpsFehler=""; }
      rechnen();

  return c;

function tourErgebnis(T){
  var box=document.createElement("div");
  box.className="stack";
  box.appendChild(el('<div class="kpis">'+
    '<div class="kpi"><div class="n">'+T.anzahlStopps+'</div><div class="l">Stopps</div></div>'+
    '<div class="kpi"><div class="n">'+T.anzahlPositionen+'</div><div class="l">Wartungen</div></div>'+
    '<div class="kpi"><div class="n">'+Math.round(T.kmGesamt)+'</div><div class="l">km gesamt</div></div>'+
    '<div class="kpi"><div class="n">'+T.tage.length+'</div><div class="l">Arbeitstage</div></div>'+
  "</div>"));

  T.tage.forEach(function(tag){
    var minute=7*60;   /* Tagesbeginn 07:00 */
    var zeilen=tag.stopps.map(function(st,i){
      var anf=minute+st.fahrtH*60;
      var ende=anf+st.arbeitH*60;
      var r='<tr><td class="mono">'+(i+1)+'</td>'+
        '<td><strong>'+esc(stName(st.standort))+"</strong>"+
          (stName(st.standort)===st.standort.adresse ? "" :
            '<br><span class="muted" style="font-size:12px">'+esc(st.standort.adresse)+"</span>")+"</td>"+
        '<td class="mono">'+Math.round(st.km)+' km<br><span class="muted">'+stdFmt(st.fahrtH)+"</span></td>"+
        '<td class="mono">'+uhrFmt(minute,st.fahrtH)+'–'+uhrFmt(minute,st.fahrtH+st.arbeitH)+"</td>"+
        '<td>'+st.positionen.map(function(p){
            return '<span class="tag">'+esc(p.anlagentyp||"Anlage")+"</span>";
          }).join(" ")+"</td>"+
        '<td><a class="btn ghost sm" href="'+gmapsZiel(st.standort)+'" target="_blank" rel="noopener">Navi</a></td></tr>';
      minute=ende;
      return r;
    }).join("");
    var rueck = tag.rueckfahrtH ?
      '<tr><td></td><td class="muted">Rückfahrt zum Startpunkt</td><td class="mono">'+Math.round(tag.rueckfahrtKm)+
      ' km<br><span class="muted">'+stdFmt(tag.rueckfahrtH)+'</span></td><td class="mono">bis '+
      uhrFmt(minute,tag.rueckfahrtH)+"</td><td></td><td></td></tr>" : "";
    var gm=gmapsRoute(tagPunkte(tag,true));
    box.appendChild(el('<div class="card" style="box-shadow:none;background:var(--ground)"><div class="pad stack">'+
      '<div class="rowflex" style="justify-content:space-between">'+
        '<strong style="font-family:var(--f-disp);font-size:14.5px">Tag '+tag.nr+"</strong>"+
        /* Die Rückfahrt getrennt ausweisen: geplant wird auf die eingestellte
           Arbeitszeit, der Heimweg kommt obendrauf. Sonst steht über dem Tag
           eine Stundenzahl, die zur Vorgabe nicht passt. */
        '<span class="muted mono" style="font-size:12px">'+stdFmt(tag.stunden)+' Arbeit'+
        (tag.rueckfahrtH ? ' + '+stdFmt(tag.rueckfahrtH)+' Rückfahrt' : "")+
        ' · '+Math.round(tag.km+(tag.rueckfahrtKm||0))+" km</span>"+
      "</div>"+
      (gm?'<div class="rowflex"><a class="btn sm" href="'+gm.url+'" target="_blank" rel="noopener">'+
        "Tag "+tag.nr+' in Google Maps öffnen</a>'+
        (gm.gekuerzt?'<span class="muted" style="font-size:12px">Google nimmt nur neun Zwischenziele – '+
          'die weiteren Stopps fehlen in der Navigation.</span>':"")+"</div>":"")+
      '<div class="scrollx"><table class="dt"><thead><tr><th>#</th><th>Standort</th><th>Anfahrt</th>'+
      "<th>vor Ort</th><th>Anlagen</th><th></th></tr></thead><tbody>"+zeilen+rueck+"</tbody></table></div>"+
    "</div></div>"));
  });

  box.appendChild(el('<div class="note">'+
    (T.echteStrasse
      ? 'Fahrzeiten und Kilometer stammen aus echtem Straßenrouting über OpenStreetMap (OSRM, PKW): '+
        'Autobahnen, Tempolimits und Umwege sind berücksichtigt. Die Reihenfolge ist nach Fahrzeit optimiert, '+
        'nicht nach Entfernung — über die Autobahn ist der längere Weg oft der schnellere. Verkehrslage und '+
        'Baustellen kennt der Dienst nicht.'
      : '<strong>Achtung, nur geschätzt:</strong> Der Routendienst war nicht erreichbar, daher Luftlinie mit Zuschlag '+
        UMWEG.toString().replace(".",",")+' und '+TEMPO_KMH+' km/h im Mittel. Nochmal berechnen liefert meist echte Werte.')+
    ' Mehrtägige Touren fahren am Folgetag vom letzten Stopp weiter, es ist also eine Übernachtung unterwegs eingerechnet.</div>'));
  return box;
}

  };

/* Zugang zur Regelung – nur wo es Fernzugriff gibt und etwas eingetragen ist.
   Das Passwort steht verdeckt da; aufdecken und kopieren geht mit einem Tipp. */
function inZwischenablage(text, was){
  var fertig=function(ok){ toast(ok ? was+" kopiert." : "Kopieren hat nicht geklappt – bitte von Hand abtippen."); };
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(text).then(function(){ fertig(true); }, function(){ fertig(false); });
  try{
    var h=document.createElement("textarea");
    h.value=text; h.style.position="fixed"; h.style.opacity="0";
    document.body.appendChild(h); h.select();
    fertig(document.execCommand("copy")); document.body.removeChild(h);
  }catch(e){ fertig(false); }
}
function zugangsAdresse(roh){
  var s=String(roh||"").trim();
  if(!s) return "";
  return /^[a-z][a-z0-9+.-]*:\/\//i.test(s) ? s : "http://"+s;
}
function zugangBox(d){

/* Termine einer Anlage für den Dialog: je aktiver Zeile Kürzel und Soll-Monat */
function termineStart(leader){
  return anlageVon(leader).termine.filter(function(t){ return t.aktiv!==false; }).map(function(t){
    return {id:t.id, intervallCode:t.intervallCode||"", monat:+t.monat||0, monatGrund:t.monatGrund||"", naechste:t.naechste||null};
  });
}
/* Was der Dialog an Inbetriebnahme und Terminen geändert hat – je Zeile
   die neuen Werte und die Einträge für den Änderungsverlauf. Die
   Inbetriebnahme gehört der Anlage und geht deshalb auf alle ihre Zeilen. */
/* alle bekannten Wartungsbesuche einer Anlage: Liste und Prüfbuch jeder
   Termin-Zeile, dazu die Wartungsprotokolle der App */
function besucheDerAnlage(p){
  var zeilen=anlageVon(p).termine, ids=zeilen.map(function(t){ return t.id; }), l=[];
  zeilen.forEach(function(t){
    l=l.concat(t.historie||[]).concat((t.nachweise||[]).map(function(n){ return n.datum; }));
  });
  alleProtokolle().forEach(function(pr){
    if(!pr.datum || pr.geloescht || !zaehltAlsWartung(pr)) return;
    var pids=(pr.positionIds&&pr.positionIds.length)?pr.positionIds:(pr.positionId?[pr.positionId]:[]);
    if(pids.some(function(x){ return ids.indexOf(x)>=0; })) l.push(pr.datum);
  });
  return l;
}
function terminAenderungen(start, erg, name){
  var proPos={}, log=[];
  if(!start._termine || !erg._termine) return {proPos:proPos, log:log};
  var ibAlt=start.inbetriebnahme||null, ibNeu=erg.inbetriebnahme||null, ibNeuGesetzt=!gleich(ibAlt, ibNeu);
  if(ibNeuGesetzt) log.push({feld:"inbetriebnahme", name:name+" – Inbetriebnahme", alt:ibAlt?dfmt(ibAlt):"–", neu:ibNeu?dfmt(ibNeu):"–"});
  /* aus dem Prüfbuch gelesene Prüfungen: an die Anlage, ohne einen Besuch
     doppelt zu führen, der schon in Liste, Prüfbuch oder App steht */
  var lid=start._leaderId, lp=lid ? ALLE_POS.filter(function(x){ return x.id===lid; })[0] : null;
  if(lp && erg._nachweiseNeu && erg._nachweiseNeu.length){
    /* schon bekannt: jeder Besuch aus Liste, Prüfbuch und App an IRGENDEINER
       Termin-Zeile der Anlage – und was in diesem Durchgang schon dazukam */
    var zeilen=anlageVon(lp).termine, schon=besucheDerAnlage(lp);
    /* Jeder Eintrag gehört an die Termin-Zeile, deren Termin ihm am nächsten
       liegt – eine Halbjahresinspektion nicht an die Jahreswartung */
    var zeileFuer=function(datum){
      var best=lp, abst=Infinity, y=+datum.slice(0,4);
      zeilen.forEach(function(t){
        var a=null; try{ a=t.intervall ? ankerFuer(t) : null; }catch(e){ a=null; }
        if(!a) return;
        [y-1,y,y+1].forEach(function(j){
          var d=Math.abs(new Date(ankerIm(a,j)+"T12:00:00")-new Date(datum+"T12:00:00"));
          if(d<abst){ abst=d; best=t; }
        });
      });
      return best;
    };
    var dazu=[];
    erg._nachweiseNeu.forEach(function(n){
      if(schon.some(function(d){ return gleicherBesuch(d,n.datum); })) return;
      schon.push(n.datum); dazu.push(n);
      var z=zeileFuer(n.datum), neuL=(proPos[z.id]&&proPos[z.id].nachweise) || (z.nachweise||[]).slice();
      proPos[z.id]=Object.assign(proPos[z.id]||{}, {nachweise:neuL.concat([n]).sort(function(x,y2){ return x.datum.localeCompare(y2.datum); })});
    });
    if(dazu.length) log.push({feld:"nachweise", name:name+" – Wartungen laut Prüfbuch", alt:"–", neu:stammWert("nachweise",dazu)});
  }
  if(lp && erg._notizDazu){
    var nz=String(lp.notiz||"");
    if(nz.indexOf(erg._notizDazu)<0){
      proPos[lid]=Object.assign(proPos[lid]||{}, {notiz:(nz?nz+" ":"")+erg._notizDazu});
      log.push({feld:"notiz", name:name+" – Notiz", alt:nz||"–", neu:(nz?nz+" ":"")+erg._notizDazu});
    }
  }
  erg._termine.forEach(function(t,i){
    var alt=start._termine[i]||{}, d={}, code=String(t.intervallCode||"").toUpperCase()||"?";
    if(ibNeuGesetzt) d.inbetriebnahme=ibNeu;
    if(!gleich(alt.intervallCode||"", t.intervallCode||"")){
      d.intervallCode=t.intervallCode;
      log.push({feld:"intervallCode", name:name+" – Kürzel", alt:alt.intervallCode||"–", neu:t.intervallCode||"–"});
    }
    if((+alt.monat||0)!==(+t.monat||0)){
      d.monat=+t.monat||null;
      log.push({feld:"monat", name:name+" – Soll-Monat "+code, alt:+alt.monat?MONATE_L[+alt.monat]:"–", neu:+t.monat?MONATE_L[+t.monat]:"–"});
    }
    if(!gleich(alt.monatGrund||"", t.monatGrund||"")){
      d.monatGrund=t.monatGrund||"";
      log.push({feld:"monatGrund", name:name+" – Grund für den abweichenden Soll-Monat "+code, alt:alt.monatGrund||"–", neu:t.monatGrund||"–"});
    }
    /* zusammenführen, nicht ersetzen: die erste Zeile ist oft zugleich die
       Anlage, an der schon Prüfbuch-Wartungen und Notiz hängen */
    if(Object.keys(d).length) proPos[t.id]=Object.assign(proPos[t.id]||{}, d);
  });
  return {proPos:proPos, log:log};
}
/* Geänderte Felder mehrerer Zeilen wegschreiben – je Zeile ein Eintrag in
   den Stammdaten, gerechnet gegen den Excel-Stand wie überall sonst. */
function positionenSchreiben(proPos, grund){
  var zeit=new Date().toISOString();
  return Promise.all(Object.keys(proPos).map(function(pid){
    var p=ALLE_POS.filter(function(x){ return x.id===pid; })[0];
    if(!p) return null;
    var neuP=Object.assign(auswahl(p, STAMM_FELDER_POS), proPos[pid]);
    /* vor Ort neu angelegte Anlage: es gibt keinen Excel-Stand – der ganze
       Datensatz samt Markt wird geschrieben, sonst verlöre sie ihren Markt */
    var felderNeu = p._neu ? Object.assign({}, (stammUeber["position:"+pid]||{}).felder||{}, neuP, {standortId:p.standortId})
                           : objDiff(EXCEL["position:"+pid]||{}, neuP, STAMM_FELDER_POS);
    var rec={id:"position:"+pid, typ:"position", ziel:pid, felder:felderNeu,
             neu:!!p._neu, geaendert:zeit, von:wer(), grund:grund};
    stammUeber[rec.id]=rec;
    return stammSpeichern(rec);
  })).then(function(wo){
    wendeStammdatenAn();
    /* nirgends gespeichert (weder Datenbank noch Gerät): so melden, nicht als Erfolg */
    return wo.indexOf(false)>=0 ? false : (wo.indexOf("geraet")>=0 ? "geraet" : "ablage");
  });
}

/* je Anlage ein Block: Name, Anlagendaten, darunter ihre Termine */
/* Anlagendaten ergänzen, ohne ein Protokoll zu schreiben. Dieselbe geführte
   Erfassung; gespeichert wird direkt in die Anlagendaten, mit Eintrag im
   Änderungsverlauf. Anlagendaten darf jede angemeldete Person ergänzen. */
function anlageDatenErgaenzen(leader){
  if(nurLesen()){ toast("Mit diesem Konto lässt sich nur ansehen."); return; }
  if(!Store.benutzer && Store.modus==="anmeldung"){ toast("Dafür bitte zuerst anmelden."); return; }
  var vorher=auswahl(leader, STAMM_FELDER_POS);
  var jetzt=anlageDaten(leader);
  var start={anlagentyp:jetzt.anlagentyp, rueckkuehler:jetzt.rueckkuehler,
             inbetriebnahme:jetzt.inbetriebnahme||null, _termine:termineStart(leader), _leaderId:leader.id};
  ANLAGE_FELDER.forEach(function(f){ start[f.k]=(jetzt[f.k]===undefined?null:jetzt[f.k]); });
  /* true: alle Gruppen zeigen. Hier geht es ums Prüfen und Korrigieren,
     nicht nur ums Nachtragen fehlender Angaben. */
  anlageAssistent(start, anlagenName(jetzt), false, true).then(function(erg){
    if(!erg) return;
    var geaendert=[], leaderNeu={};
    ANLAGE_FELDER.concat([{k:"anlagentyp", l:"Bezeichnung der Anlage"}]).forEach(function(f){
      if(erg[f.k]===undefined) return;
      if(gleich(vorher[f.k], erg[f.k])) return;
      /* im Dialog nicht angefasst (etwa ein Standardwert): nichts speichern */
      if(gleich(start[f.k], erg[f.k])) return;
      leaderNeu[f.k]=erg[f.k];
      geaendert.push({feld:f.k, name:anlagenName(jetzt)+" – "+(f.l||f.k),
        alt:verlaufWert(f, vorher[f.k]), neu:verlaufWert(f, erg[f.k])});
    });
    /* dazu, was sich an Inbetriebnahme und Terminen geändert hat */
    var ta=terminAenderungen(start, erg, anlagenName(jetzt));
    var proPos=ta.proPos;
    if(Object.keys(leaderNeu).length) proPos[leader.id]=Object.assign(proPos[leader.id]||{}, leaderNeu);
    geaendert=geaendert.concat(ta.log);
    if(!geaendert.length){ toast("Nichts geändert."); return; }
    positionenSchreiben(proPos, "Anlagendaten geprüft und ergänzt").then(function(wo){
      if(wo===false){ wendeStammdatenAn(); render(); toast("Nicht gespeichert – weder Datenbank noch Gerätespeicher erreichbar. Bitte nochmals versuchen."); return; }
      wendeStammdatenAn();
      protokolliere({art:"stammdaten", standortId:leader.standortId,
        standortName:stName(byId[leader.standortId]||{}), grund:"Anlagendaten geprüft und ergänzt", felder:geaendert});
      toast(wo==="geraet" ? "Auf dem Gerät gespeichert – wird übertragen, sobald Verbindung besteht."
                          : geaendert.length+" Angabe"+(geaendert.length===1?"":"n")+" gespeichert.");
      render();
    });
  });
}

/* Offene Störungen, die ausdrücklich an dieser Anlage hängen */
function stoerungenDerAnlage(a){
  var ids=a.termine.map(function(t){ return t.id; });
  return offeneStoerungen(true).filter(function(o){ return o.positionId && ids.indexOf(o.positionId)>=0; });
}
/* Alles, was an einer Anlage je gemacht wurde: Wartungen aus Liste und
   Prüfbuch, Protokolle aus der App (Wartung und Störung) und was offen ist.
   Derselbe Besuch aus mehreren Quellen steht nur einmal da. */
function anlageHistorie(leader){
  var a=anlageVon(leader), ids=a.termine.map(function(t){ return t.id; }), z=[];
  var prot=alleProtokolle().filter(function(pr){
    var pids=(pr.positionIds&&pr.positionIds.length)?pr.positionIds:(pr.positionId?[pr.positionId]:[]);
    return pids.some(function(id){ return ids.indexOf(id)>=0; });
  });
  prot.forEach(function(pr){
    var stoe=istStoerung(pr);
    z.push({datum:pr.datum, art:stoe?"Störung"+(pr.stoerung&&pr.stoerung.problemtyp?": "+pr.stoerung.problemtyp:""):(pr.wartungsart||"Wartung"),
      stoerung:stoe, techniker:kanonName(pr.nameTechniker||pr.techniker||""), quelle:"Protokoll", protokoll:pr,
      rapport:rapportVon(pr)});
  });
  a.termine.forEach(function(t){
    (t.historie||[]).forEach(function(d){
      if(prot.some(function(pr){ return !istStoerung(pr) && gleicherBesuch(pr.datum,d); })) return;
      if(z.some(function(x){ return x.quelle!=="Protokoll" && gleicherBesuch(x.datum,d); })) return;
      var nw=(t.nachweise||[]).some(function(n){ return n.datum===d; });
      z.push({datum:d, art:t.intervall.art, techniker:kanonName((t.techniker&&t.techniker[d.slice(0,4)])||""),
        quelle:nw?"Prüfbuch":"Liste"});
    });
  });
  return z.sort(function(x,y){ return String(y.datum).localeCompare(String(x.datum)); });
}

    draussenSt.forEach(function(o){ kSt.querySelector(".pad").appendChild(stoerungEintrag(o)); });

  }

  /* Baujahr-Histogramm */
  var years=pos.filter(function(p){return p.baujahr;}).map(function(p){return p.baujahr;});
  var minY=Math.min.apply(null,years.concat([JAHR])), maxY=Math.max.apply(null,years.concat([JAHR]));
  var counts=[]; for(var y=minY;y<=maxY;y++) counts.push({y:y,n:years.filter(function(v){return v===y;}).length});
  var mx=Math.max(1,Math.max.apply(null,counts.map(function(c){return c.n;})));
  var CW=720,CH=190,cpL=30,cpR=8,cpT=14,cpB=28;
  var ciw=CW-cpL-cpR, cih=CH-cpT-cpB, bw=ciw/counts.length;
  var bars=counts.map(function(c,i){
    var h=c.n/mx*cih, x=cpL+i*bw+2.5, w=bw-5, yy=cpT+cih-h;
    return (c.n?'<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" style="fill:var(--accent)"/>':"")+
      '<rect class="hit" x="'+(cpL+i*bw)+'" y="'+cpT+'" width="'+bw+'" height="'+cih+'" style="fill:transparent" data-y="'+c.y+'" data-n="'+c.n+'"/>'+
      (c.n?'<text class="num" x="'+(x+w/2).toFixed(1)+'" y="'+(yy-4).toFixed(1)+'" text-anchor="middle" font-size="10" style="fill:var(--ink-2)">'+c.n+"</text>":"")+
      '<text x="'+(cpL+i*bw+bw/2).toFixed(1)+'" y="'+(cpT+cih+15)+'" text-anchor="middle" font-size="10" style="fill:var(--ink-3)">'+("'"+String(c.y).slice(2))+"</text>";
  }).join("");
  var gy=[0,Math.round(mx/2),mx].filter(function(v,i,a){return a.indexOf(v)===i;});
  var grid=gy.map(function(v){ var yy=cpT+cih-v/mx*cih;
    return '<line x1="'+cpL+'" y1="'+yy.toFixed(1)+'" x2="'+(CW-cpR)+'" y2="'+yy.toFixed(1)+'" style="stroke:var(--line);stroke-width:1"/>'+
      '<text class="num" x="'+(cpL-6)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end" font-size="10" style="fill:var(--ink-3)">'+v+"</text>"; }).join("");

  var hist=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Inbetriebnahme der Anlagen</h2><div class="sub">'+years.length+' von '+pos.length+' Positionen haben ein Datum in der Liste. Ältester Eintrag '+minY+".</div></div>"+
    '<svg class="chart" viewBox="0 0 '+CW+" "+CH+'" role="img" aria-label="Anzahl Anlagen je Inbetriebnahmejahr">'+grid+bars+"</svg>"+
  "</div></div>");
  hist.querySelectorAll(".hit").forEach(function(r){
    r.addEventListener("mousemove",function(e){ tipShow(e,"<b>"+r.dataset.y+"</b><br>"+r.dataset.n+" Anlage(n) in Betrieb genommen"); });
    r.addEventListener("mouseleave",tipHide);
  });
  f.appendChild(hist);

  /* Standortliste */
  var list=filtered().slice().sort(function(a,b){
    var d=STATUS_RANK[a.status]-STATUS_RANK[b.status]; if(d) return d;
    return (a.plz||"zz").localeCompare(b.plz||"zz");

    '<div class="sub">'+list.length+" Standorte · "+pos.length+" Wartungspositionen. Aufklappen zeigt Anlagendaten und Wartungshistorie.</div></div><div id=\"stlist\"></div></div>");
  var host=card.querySelector("#stlist");
  list.forEach(function(s){
    var st=stoerungVonMarkt(s.id);
    var d=el('<details class="st"><summary>'+
      "<span><strong>"+esc(stName(s))+'</strong><br><span class="muted" style="font-size:12.5px">'+esc(s.adresse)+(s.region?" · "+esc(s.region):"")+"</span></span>"+
      '<span class="rowflex" style="justify-content:flex-end">'+
        (st.length?'<span class="pill p-ueberfaellig">'+(st.length===1?"Störung offen":st.length+" Störungen offen")+"</span>":"")+
        (s.ueber30kg?'<span class="tag f30">&gt;30 kg</span>':"")+
        '<span class="tag">'+anlagenDesMarkts(s,true).length+" Anl.</span>"+marktPill(s)+"</span>"+
    '</summary><div class="inner"></div></details>');
    var inner=d.querySelector(".inner");
    d.addEventListener("toggle",function(){

        var kopf=el('<div class="rowflex" style="gap:8px;margin-bottom:10px">'+
          (s.lat||s.plz?'<a class="btn sm" style="text-decoration:none" href="'+gmapsZiel(s)+'" target="_blank" rel="noopener">Mit Google Maps navigieren</a>':"")+
          "</div>");
        if(kopf.children.length) inner.appendChild(kopf);
        st.forEach(function(o){ var z=stoerungEintrag(o,true); z.style.marginBottom="10px"; inner.appendChild(z); });
        anlagenBloecke(s, inner); inner.dataset.done="1";

  return f;
}
