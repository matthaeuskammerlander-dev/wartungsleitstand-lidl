        protokoll.push({feld:"anlage", name:"Neue Anlage", alt:"–",
          neu:(neuP.anlagentyp||"Anlage")+" · "+neuP.intervallCode+(neuP.inbetriebnahme?" · IB "+dfmt(neuP.inbetriebnahme):"")});
        return;
      }
      var p=posById[pid]; if(!p) return;
      var vorherP=auswahl(p,STAMM_FELDER_POS);
      /* Kurz- und Langform gelten als gleich, sonst wäre jedes HW eine Änderung */
      var norm=function(k){ k=String(k||"").trim().toUpperCase(); return k==="HW"?"HJW":(k.indexOf("HI")===0?"HJI":k); };
      if(norm(vorherP.intervallCode)===norm(neuP.intervallCode)) neuP.intervallCode=vorherP.intervallCode;
      var deltaP=objDiff(vorherP,neuP,STAMM_FELDER_POS);
      if(!Object.keys(deltaP).length) return;
      Object.keys(deltaP).forEach(function(k){
        protokoll.push({feld:k, name:anlagenName(p)+" – "+LABEL_POS[k], alt:stammWert(k,vorherP[k]), neu:stammWert(k,neuP[k])});
      });
      if(p._neu){ neuP.standortId=s.id; recs.push({id:"position:"+pid, felder:neuP, neu:true}); }
      else {
        var gE=objDiff(EXCEL["position:"+pid],neuP,STAMM_FELDER_POS);
        recs.push({id:"position:"+pid, felder:gE, neu:false, leer:!Object.keys(gE).length});
      }
    });
    if(fehlt){ fehler("Jede neue Anlage braucht ein Kürzel (JW, HJW oder HJI) – daraus ergibt sich ihr Termin."); return; }
    if(!recs.length){ fehler("Es wurde nichts geändert."); return; }

    var knopf=c.querySelector("#a_speichern"); knopf.disabled=true; knopf.textContent="Wird gespeichert …";
    Promise.all(recs.map(function(r){
      if(r.leer){ delete stammUeber[r.id]; return stammLoeschen(r.id).then(function(){ return "zurueck"; }); }
      var rec={id:r.id, typ:r.id.split(":")[0], ziel:r.id.split(":")[1], felder:r.felder, neu:!!r.neu,
               geaendert:jetzt, von:von, grund:grund};
      stammUeber[r.id]=rec;
      return stammSpeichern(rec);
    })).then(function(erg){
      if(erg.indexOf(false)>=0){
        knopf.disabled=false; knopf.textContent="Änderungen speichern";
        fehler("Ein Teil der Änderungen ließ sich nicht speichern. Bitte erneut versuchen.");
        return;
      }
      wendeStammdatenAn();
      protokolliere({art:"stammdaten", standortId:s.id, standortName:stName(byId[s.id]||s), grund:grund, felder:protokoll});
      A.entwurf=null; A.sel=s.id;
      toast((s._entwurf?"Markt angelegt":"Gespeichert – "+protokoll.length+" Änderung"+(protokoll.length===1?"":"en"))+
            (erg.indexOf("geraet")>=0?" (vorerst nur auf diesem Gerät)":"")+".");
      render();
    });
  };
  return c;
}

function viewDaten(){

  var ohneKm=POS.filter(function(p){return !p.kaeltemittelText;}).length;
  var ohneGeo=ST.filter(function(s){return !s.lat;});
  var grobGeo=ST.filter(function(s){return s.genauigkeit==="ort";});
  var ohneHist=POS.filter(function(p){return !p.historie.length;}).length;
  var doppelAdr={}; ST.forEach(function(s){ var k=(s.adresse||"").toLowerCase().replace(/[^a-zäöüß0-9]/g,""); if(k){ (doppelAdr[k]=doppelAdr[k]||[]).push(s); } });

    '<dl class="dl">'+
      "<dt>Standorte</dt><dd class='mono'>"+ST.length+"</dd>"+
      "<dt>Wartungspositionen</dt><dd class='mono'>"+POS.length+"</dd>"+
      "<dt>Mit Koordinaten</dt><dd class='mono'>"+(ST.length-ohneGeo.length)+" ("+grobGeo.length+" nur ortsgenau)</dd>"+
      "<dt>Mit Inbetriebnahme</dt><dd class='mono'>"+(POS.length-ohneIB)+"</dd>"+
      "<dt>Mit Wartungshistorie</dt><dd class='mono'>"+(POS.length-ohneHist)+"</dd>"+
    "</dl>"+
  "</div></div>"));

  f.appendChild(el('<div class="card"><div class="pad stack">'+
    '<div><h2>Zu klären</h2><div class="sub">Punkte, die sich aus der Liste allein nicht auflösen lassen.</div></div>'+
    '<div class="stack">'+
      (function(){
        /* Regel: ab 30 kg Kältemittel ist der zweite Besuch im Jahr eine
           Halbjahreswartung (HJW), keine bloße Inspektion */
        var maerkte=ST.filter(function(s){
          if(!s.pos.some(function(p){ return p.ueber30kg; })) return false;
          return !s.pos.some(function(p){ return p.intervall.kurz==="HJW"; });
        });
        if(!maerkte.length) return "";
        return '<div class="note warnbox"><strong>'+maerkte.length+' Märkte mit über 30 kg Kältemittel ohne Halbjahreswartung</strong> – '+
          'dort steht nur eine Jahreswartung, oder der zweite Termin ist als Inspektion (HJI) eingetragen. '+
          'Nach Ihrer Regel braucht es ab 30 kg eine Halbjahreswartung (HJW): '+
          maerkte.slice(0,14).map(function(s){ return esc(stName(s)); }).join(", ")+(maerkte.length>14?" …":"")+".</div>";
      })()+
      (function(){
        /* Soll-Monat der Liste gegen die Inbetriebnahme-Regel prüfen */
        var abw=POS.filter(function(p){
          if(!p.anker || p.anker.quelle!=="Inbetriebnahme" || !p.monat) return false;
          var d=Math.abs(p.anker.monat-p.monat); d=Math.min(d,12-d);
          return d>1;
        });
        if(!abw.length) return "";
        return '<div class="note warnbox"><strong>'+abw.length+' Termine passen nicht zur Inbetriebnahme</strong> – '+
          'der Soll-Monat in der Liste weicht um mehr als einen Monat von „Inbetriebnahme + 6 bzw. + 12 Monate" ab. '+
          'Häufig ist das Kürzel vertauscht (JW statt HW oder umgekehrt) oder das Inbetriebnahmedatum falsch. '+
          'Die App rechnet mit der Inbetriebnahme. Betroffen: '+
          abw.slice(0,10).map(function(p){
            return esc(stName(byId[p.standortId]))+" ("+esc(p.intervallCode||"?")+", Liste "+MONATE[p.monat]+
              ", gerechnet "+MONATE[p.anker.monat]+")";
          }).join("; ")+(abw.length>10?" …":"")+".</div>";
      })()+
      (function(){
        var unklar=POS.filter(function(p){ return p.intervall.unklar; });
        if(!unklar.length) return "";
        var arten={}; unklar.forEach(function(p){ var k=(p.intervallCode||"leer").trim()||"leer"; arten[k]=(arten[k]||0)+1; });
        return '<div class="note"><strong>'+unklar.length+' Positionen mit unklarem Kürzel</strong> ('+
          Object.keys(arten).map(function(k){ return esc(k)+" × "+arten[k]; }).join(", ")+

      })()+
      '<div class="note"><strong>So wird gerechnet:</strong> Jede Zeile der Liste ist ein Termin, der jedes Jahr am selben Tag wiederkehrt – '+
        'die Jahreswartung (JW) am Jahrestag der Inbetriebnahme, Halbjahreswartung (HJW, oft HW) und Halbjahresinspektion '+
        '(HJI, oft HI) sechs Monate versetzt. Eine Wartung zählt für den Termin, in dessen Halbjahresfenster sie fällt; '+
        'wer früher oder später kommt, verschiebt den Folgetermin also nicht. Zusätzlich muss jeder Markt spätestens '+
        '6 Monate nach dem letzten Besuch wieder besucht werden. Protokolle aus der App zählen mit, wenn die Wartungsart '+
        '„planmäßig" oder „Prüfung" ist.</div>'+
      '<div class="note"><strong>'+ohneMonat+' Positionen ohne Soll-Monat</strong> und <strong>'+ohneKm+' ohne Kältemittelangabe</strong>. Für Anlagen ab 5 t CO₂-Äquivalent hängt daran die gesetzliche Dichtheitsprüfpflicht.</div>'+
      (ohneGeo.length?'<div class="note"><strong>'+ohneGeo.length+" Einträge ohne verwertbare Adresse</strong>: "+ohneGeo.map(function(s){return esc(s.name);}).join(", ")+". Das sind Sammelzeilen der Liste, keine echten Standorte.</div>":"")+
      (dupes.length?'<div class="note"><strong>'+dupes.length+" Adressen mehrfach vorhanden</strong> (unterschiedliche Filialnummern an derselben Adresse, z. B. Markt und Lager). Bitte prüfen, ob das gewollt ist: "+
        dupes.slice(0,4).map(function(g){return esc(g.map(stName).join(" / "));}).join(" · ")+"</div>":"")+
    "</div>"+
  "</div></div>"));

  var exp=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Export</h2><div class="sub">CSV mit Semikolon-Trennung, direkt in Excel zu öffnen.</div></div>'+
    '<div class="rowflex"><button class="btn ghost sm" id="expStamm">Anlagenstamm</button>'+

  exp.querySelector("#expStamm").onclick=function(){
    var head=["Filiale","Standort","Adresse","PLZ","Ort","Region","Lat","Lon","Anlagentyp","Kaeltemittel","Kuerzel","SollMonat","Inbetriebnahme","Rueckkuehler","Status","Wartungen"];
    var rows=POS.map(function(p){ var s=byId[p.standortId];
      return [s.filiale,stName(s),s.adresse,s.plz||"",s.ort||"",s.region,s.lat||"",s.lon||"",p.anlagentyp,p.kaeltemittelText,
        p.intervallCode,p.monat?MONATE_L[p.monat]:"",p.inbetriebnahme||"",p.rueckkuehler,STATUS_LABEL[p.status],p.historie.join(" | ")];
    });
    csv("anlagenstamm_lidl.csv",head,rows);
  };
  exp.querySelector("#expProto").onclick=function(){
    var head=["Datum","Uhrzeit","Standort","Adresse","Region","Techniker","Wartungsart","Bestellnummer","Auftragsnummer","Arbeiten","Maengel","Betriebsbereit","Bemerkungen"];
    var rows=alleProtokolle().map(function(x){ return [x.datum,x.uhrzeit,protoName(x),x.adresse,x.region,x.nameTechniker||x.techniker,x.wartungsart,
      x.bestellnummer,x.auftragsnummer,(x.arbeiten||[]).join(" | "),(x.maengel||[]).map(function(m){return m.text+" ("+m.prio+")";}).join(" | "),
      x.betriebsbereit,x.bemerkungen]; });
    csv("protokolle_lidl.csv",head,rows);
  };
  f.appendChild(exp);
  return f;
}
function csv(name,head,rows){
  var q=function(v){ v=String(v==null?"":v); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  var text="﻿"+[head.map(q).join(";")].concat(rows.map(function(r){return r.map(q).join(";");})).join("\r\n");
  if(window.claude&&window.claude.use){
    /* im Artifact sind eigene Downloads gesperrt, der Host übernimmt das */
    window.claude.use("downloads").then(function(d){
      if(!d){ toast("Download in dieser Ansicht nicht möglich."); return; }
      d.save({filename:name,data:text}).then(function(){ toast("Datei bereitgestellt."); },function(){ toast("Download abgebrochen."); });
    },function(){ toast("Download in dieser Ansicht nicht möglich."); });
    return;
  }
  try{
    var blob=new Blob([text],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    toast("CSV heruntergeladen.");
  }catch(e){ toast("Download nicht möglich: "+e.message); }
}

  var alt=document.getElementById("qrOverlay"); if(alt) alt.remove();

        '<button class="btn ghost sm" type="button" id="qrclose">Schließen</button></div>'+

      '<div class="qrurl" id="qrtext"></div>'+
      '<label class="fl"><span>Adresse für den Code</span>'+
        '<input type="url" id="qrinput" inputmode="url" placeholder="https://…"></label>'+
      '<div class="muted" style="font-size:12.5px">Mit der Handykamera scannen. Die Adresse lässt sich hier ändern, '+
        'etwa um den Code schon auf das spätere eigene Hosting zeigen zu lassen — die Änderung bleibt auf diesem Gerät gespeichert.</div>'+
    "</div></div>");
  document.body.appendChild(ov);
  var canvas=ov.querySelector("#qrcanvas"), txt=ov.querySelector("#qrtext"), input=ov.querySelector("#qrinput");
  var rahmen=ov.querySelector(".qrframe");

  function zeichne(u){
    txt.textContent=u||"Noch keine Adresse hinterlegt.";
    if(!u){ rahmen.hidden=true; return; }
    rahmen.hidden=false;
    if(!window.QRious){
      rahmen.innerHTML='<div style="color:#0F1A20;font-size:12.5px;padding:8px;text-align:center">'+
        "QR-Bibliothek nicht erreichbar. Adresse bitte von Hand eintippen.</div>";
      return;
    }
    try{
      new window.QRious({element:canvas,value:u,size:560,level:"M",padding:0,background:"#ffffff",foreground:"#0F1A20"});
    }catch(e){
      rahmen.innerHTML='<div style="color:#0F1A20;font-size:12.5px;padding:8px;text-align:center">QR-Code nicht erzeugbar: '+esc(e.message)+"</div>";
    }
  }
  input.value=url; zeichne(url);
  input.oninput=function(){
    var v=input.value.trim();
    zeichne(v);
    try{ if(v) lsSet("ukt_appurl",v); else localStorage.removeItem("ukt_appurl"); }catch(e){}
  };

  function zu(){ document.removeEventListener("keydown",esc2); ov.remove(); }
  function esc2(e){ if(e.key==="Escape") zu(); }
  ov.querySelector("#qrclose").onclick=zu;
  ov.addEventListener("click",function(e){ if(e.target===ov) zu(); });
  document.addEventListener("keydown",esc2);
  ov.querySelector("#qrclose").focus();
}

/* ----------------------------------------------------------------
   Zugangsschutz. Der Anlagenstamm wird verschlüsselt ausgeliefert
   (AES-256-CBC, Schlüssel aus PBKDF2-SHA256), das Passwort
   entschlüsselt ihn erst im Browser. Ohne Passwort steht in
   daten.enc.js nichts Lesbares.
   ---------------------------------------------------------------- */
(function(){
  "use strict";
  var tabs=document.getElementById("tabs");
  var qrbtn=document.getElementById("qrbtn");
  var stand=document.getElementById("stand");
  var app=document.getElementById("app");

  function b64(s){ var bin=atob(s), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }

  function entschluessle(pw){
    var e=window.LIDL_ENC;
    var mat=new TextEncoder().encode(pw);
    return crypto.subtle.importKey("raw",mat,{name:"PBKDF2"},false,["deriveKey"])
      .then(function(k){
        return crypto.subtle.deriveKey(
          {name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},
          k,{name:"AES-CBC",length:256},false,["decrypt"]);
      })
      .then(function(key){ return crypto.subtle.decrypt({name:"AES-CBC",iv:b64(e.iv)},key,b64(e.data)); })
      .then(function(buf){
        var txt=new TextDecoder().decode(buf);
        if(txt.charAt(0)!=="{") throw new Error("falsch");
        return JSON.parse(txt);
      });
  }

  function start(daten){
    window.LIDL_DB=daten;
    if(tabs) tabs.hidden=false;
    if(qrbtn) qrbtn.hidden=false;
    if(stand) stand.hidden=false;
    starteWartungsleitstand();
  }

  function schirm(){
    if(tabs) tabs.hidden=true;
    if(qrbtn) qrbtn.hidden=true;
    if(stand) stand.hidden=true;
    app.innerHTML="";
    var card=document.createElement("div");
    card.className="card";
    card.style.maxWidth="440px";
    card.style.marginTop="28px";
    card.innerHTML='<div class="pad stack">'+
      '<div><h2>Zugang</h2><div class="sub">Die Anlagen- und Standortdaten sind verschlüsselt hinterlegt. '+
      'Mit dem Passwort aus dem Büro werden sie hier im Browser entschlüsselt.</div></div>'+
      '<form class="stack" id="gateform">'+
        '<label class="fl"><span>Passwort</span>'+
          '<input type="password" id="g_pw" autocomplete="current-password" autofocus required></label>'+
        '<div class="note warnbox" id="g_err" hidden></div>'+
        '<div><button class="btn" type="submit" id="g_btn">Daten anzeigen</button></div>'+
      '</form>'+
      '<div class="muted" style="font-size:12.5px">Das Entschlüsseln dauert einen Moment – '+
      'die Schlüsselableitung ist absichtlich rechenintensiv, damit Passwörter nicht durchprobiert werden können.</div>'+
    '</div>';
    app.appendChild(card);

    var form=card.querySelector("#gateform"),
        pw=card.querySelector("#g_pw"),
        err=card.querySelector("#g_err"),
        btn=card.querySelector("#g_btn");

    form.onsubmit=function(ev){
      ev.preventDefault();
      err.hidden=true; btn.disabled=true; btn.textContent="Entschlüsseln …";
      entschluessle(pw.value).then(function(daten){
        try{ sessionStorage.setItem("ukt_pw",pw.value); }catch(e){}
        start(daten);
      },function(){
        btn.disabled=false; btn.textContent="Daten anzeigen";
        err.textContent="Das Passwort passt nicht.";
        err.hidden=false; pw.select();
      });
    };
  }

  if(window.LIDL_DB){ start(window.LIDL_DB); return; }           // unverschlüsselt ausgeliefert
  if(!window.LIDL_ENC){ start({standorte:[],positionen:[],meta:{}}); return; }
  if(!window.crypto || !window.crypto.subtle){
    app.innerHTML='<div class="card"><div class="pad"><h2>Nicht entschlüsselbar</h2>'+
      '<div class="sub">Dieser Browser stellt keine Verschlüsselungsfunktionen bereit. '+
      'Das passiert, wenn die Seite ohne HTTPS aufgerufen wird.</div></div></div>';
    if(tabs) tabs.hidden=true; if(qrbtn) qrbtn.hidden=true; if(stand) stand.hidden=true;
    return;
  }

  /* innerhalb derselben Browser-Sitzung nicht erneut fragen */
  var gemerkt=null;
  try{ gemerkt=sessionStorage.getItem("ukt_pw"); }catch(e){}
  if(gemerkt){
    schirm();
    entschluessle(gemerkt).then(start,function(){ try{ sessionStorage.removeItem("ukt_pw"); }catch(e){} });
  } else {
    schirm();
  }
})();
</script>
