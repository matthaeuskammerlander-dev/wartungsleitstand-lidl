/* ---------------- Fotos ----------------
   Handykameras liefern 3–8 MB je Bild. Das wird vor dem Hochladen auf
   eine brauchbare Dokumentationsgröße gebracht – sonst dauert es im
   Funkloch ewig und sprengt jede Speichergrenze. */
var FOTO_KANTE = 1600;        // längste Kante in Pixel
var FOTO_BUDGET = 160000;     // Zielgröße je Bild in Byte
var FOTO_MAX = 8;             // Bilder je Protokoll

function verkleinere(datei){
  return new Promise(function(fertig, schiefgegangen){
    var quelle = window.createImageBitmap
      ? createImageBitmap(datei,{imageOrientation:"from-image"})
      : new Promise(function(ok,nok){
          var img=new Image(), url=URL.createObjectURL(datei);
          img.onload=function(){ URL.revokeObjectURL(url); ok(img); };
          img.onerror=function(){ URL.revokeObjectURL(url); nok(new Error("Bild nicht lesbar")); };
          img.src=url;
        });
    quelle.then(function(bild){
      var b=bild.width, h=bild.height;
      var f=Math.min(1, FOTO_KANTE/Math.max(b,h));
      var cv=document.createElement("canvas");
      cv.width=Math.round(b*f); cv.height=Math.round(h*f);
      cv.getContext("2d").drawImage(bild,0,0,cv.width,cv.height);
      if(bild.close) bild.close();
      /* Qualität so weit senken, bis das Budget passt */
      var q=0.78, url=cv.toDataURL("image/jpeg",q);
      while(url.length*0.75 > FOTO_BUDGET && q > 0.36){
        q-=0.08; url=cv.toDataURL("image/jpeg",q);
      }
      fertig({datenUrl:url, breite:cv.width, hoehe:cv.height,
              bytes:Math.round(url.length*0.75), qualitaet:Math.round(q*100)});
    }, schiefgegangen);
  });
}
function datenUrlZuBlob(url){
  var teile=url.split(","), roh=atob(teile[1]);
  var a=new Uint8Array(roh.length);
  for(var i=0;i<roh.length;i++) a[i]=roh.charCodeAt(i);
  return new Blob([a],{type:"image/jpeg"});
}

/* speichert alle Fotos eines Protokolls; liefert false, wenn etwas scheitert */
function speichereFotos(protokollId, fotos){
  if(!fotos || !fotos.length) return Promise.resolve(true);

  if(Store.modus==="claude" && Store.claudeDb){
    /* ein Dokument je Foto – die Grenze liegt bei 256 KiB je Dokument */
    var i=0;
    var naechstes=function(){
      if(i>=fotos.length) return Promise.resolve(true);
      var f=fotos[i++];
      return Store.claudeDb.doc("protokollfotos/"+f.id).set({
        protokollId:protokollId, name:f.name, hinweis:f.hinweis,
        datenUrl:f.datenUrl, erstellt:new Date().toISOString()
      }).then(naechstes, function(){ return false; });
    };
    return naechstes();
  }

  if(Store.modus==="supabase" && Store.sb){
    var j=0;
    var weiter=function(){
      if(j>=fotos.length) return Promise.resolve(true);
      var f=fotos[j++];
      var pfad=protokollId+"/"+f.id+".jpg";
      return Store.sb.storage.from("protokollfotos")
        .upload(pfad, datenUrlZuBlob(f.datenUrl), {contentType:"image/jpeg", upsert:false})
        .then(function(r){ if(r.error){ Store.fehler=r.error.message; return false; } return weiter(); },
              function(){ return false; });
    };
    return weiter();
  }
  return Promise.resolve(false);
}

/* holt die Bilder eines Protokolls zur Anzeige */
function ladeFotos(p){
  /* noch nicht übertragen: die Bilder liegen direkt im Gerätespeicher */
  if(p._fotoDaten && p._fotoDaten.length){
    return Promise.resolve(p._fotoDaten.map(function(f){ return {name:f.name, hinweis:f.hinweis, url:f.datenUrl}; }));

  if(!p.fotos || !p.fotos.length) return Promise.resolve([]);

        var d=snap.exists?snap.data():null;

      },function(){ return {name:f.name, hinweis:f.hinweis, url:null}; });
    }));

  if(Store.modus==="supabase" && Store.sb){
    return Promise.all(p.fotos.map(function(f){

        .createSignedUrl((p._id||p.id)+"/"+f.id+".jpg", 3600)

              function(){ return {name:f.name, hinweis:f.hinweis, url:null}; });

}

/* ein Protokoll wegschreiben – liefert ein Promise, das nie ablehnt */
function speichereProtokoll(id,doc){
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).set(doc).then(function(){ return true; },function(){ return false; });
  }
  if(Store.modus==="supabase" && Store.sb){
    var zeile=zuZeile(doc,Store.benutzer?Store.benutzer.id:null);
    /* Die Kennung aus der App mitgeben: unter ihr liegen die Fotos, und ein
       zweiter Übertragungsversuch legt so kein doppeltes Protokoll an. */
    zeile.client_id=id;
    return Store.sb.from("protokolle").upsert(zeile,{onConflict:"client_id", ignoreDuplicates:true}).then(function(r){
      if(r.error){ Store.fehler=r.error.message; return false; }
      ladeProtokolle(); return true;
    },function(){ return false; });
  }
  return Promise.resolve(false);
}

/* eine Korrektur wegschreiben – gleiche Kennung, neue Fassung */
function aktualisiereProtokoll(id, doc, quelle, geraetFotos){
  if(quelle==="geraet"){
    return idbSchreiben({id:id, doc:doc, fotos:geraetFotos||[], erstellt:doc.erstellt})
      .then(function(){ return true; }, function(){ return false; });
  }
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).set(doc).then(function(){ return true; }, function(){ return false; });
  }
  if(Store.modus==="supabase" && Store.sb){
    var zeile=zuZeile(doc,null);
    delete zeile.erstellt_von;   /* der ursprüngliche Verfasser bleibt eingetragen */
    delete zeile.erstellt;
    zeile.version=doc.version; zeile.geaendert=doc.geaendert; zeile.korrektur_grund=doc.korrekturGrund||null;
    return Store.sb.from("protokolle").update(zeile).eq("client_id",id).then(function(r){
      if(r.error){ Store.fehler=r.error.message; return false; }
      ladeProtokolle(); return true;
    },function(){ return false; });
  }
  return Promise.resolve(false);
}
/* überträgt Protokolle vom Gerät, sobald eine zentrale Ablage da ist */
var uebertragungLaeuft=false;
function flushQueue(){
  if(uebertragungLaeuft) return;
  if(Store.modus!=="claude" && Store.modus!=="supabase") return;
  if(!lokaleProtokolle.length){ aenderungenUebertragen(); return; }
  uebertragungLaeuft=true;
  var liste=lokaleProtokolle.slice(), done=0, i=0;
  var next=function(){
    if(i>=liste.length){
      uebertragungLaeuft=false;
      aenderungenUebertragen();
      lokaleNeuLaden().then(function(){
        if(done) toast(done+" Protokoll(e) vom Gerät in die zentrale Ablage übertragen.");
        storeNachRender();
      });
      return;
    }
    var e=liste[i++];
    speichereFotos(e.id, e.fotos||[]).then(function(fotosOk){
      if(!fotosOk){ next(); return; }
      speichereProtokoll(e.id,e.doc).then(function(ok){
        if(!ok){ next(); return; }
        done++;
        /* erst nach bestätigter Übertragung vom Gerät entfernen */
        idbLoeschen(e.id).then(next,next);
      });
    });
  };
  next();
}

    fotoInfo.textContent="Bilder werden verkleinert …";
    var i=0;
    var naechstes=function(){
      if(i>=dateien.length){ fotosZeichnen(); return; }
      var d=dateien[i++];
      verkleinere(d).then(function(bild){
        fotos.push({id:"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                    name:d.name||"Foto", hinweis:"", datenUrl:bild.datenUrl, bytes:bild.bytes});
        naechstes();
      },function(){ toast("Ein Bild konnte nicht gelesen werden."); naechstes(); });
    };
    naechstes();
  };

  /* Unterschrift */
  var cv=form.querySelector("#sig"), ctx=cv.getContext("2d"), drawing=false, hasSig=false;
  ctx.lineWidth=3.2; ctx.lineCap="round"; ctx.lineJoin="round";
  function stroke(){ ctx.strokeStyle=getComputedStyle(document.body).color; }
  function pt(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; }
  cv.addEventListener("pointerdown",function(e){ e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing=true; hasSig=true; stroke();
    var q=pt(e); ctx.beginPath(); ctx.moveTo(q[0],q[1]); });
  cv.addEventListener("pointermove",function(e){ if(!drawing) return; var q=pt(e); ctx.lineTo(q[0],q[1]); ctx.stroke(); });
  cv.addEventListener("pointerup",function(){ drawing=false; });
  cv.addEventListener("pointerleave",function(){ drawing=false; });
  form.querySelector("#sigclear").onclick=function(){ ctx.clearRect(0,0,cv.width,cv.height); hasSig=false; };

  /* Defaults */
  form.querySelector("#f_datum").value=isoLokal(HEUTE);
  form.querySelector("#f_zeit").value=String(HEUTE.getHours()).padStart(2,"0")+":"+String(HEUTE.getMinutes()).padStart(2,"0");
  var lastTech=lsGet("ukt_tech","");
  if(lastTech){ form.querySelector("#f_tech").value=lastTech; form.querySelector("#f_name").value=lastTech; }

  /* Korrektur: das Formular mit der gespeicherten Fassung füllen */
  if(bearb){
    var setz=function(id,w){ var n=form.querySelector("#"+id); if(n) n.value=(w==null?"":w); };
    setz("f_datum",bearb.datum); setz("f_zeit",bearb.uhrzeit);
    setz("f_bestell",bearb.bestellnummer); setz("f_auftrag",bearb.auftragsnummer);
    if(bearb.region){ var rb=form.querySelector('input[name="fm"][value="'+bearb.region+'"]'); if(rb) rb.checked=true; }
    if(bearb.standortId && byId[bearb.standortId]) selSt.value=bearb.standortId;
    fillPos(null);
    var gew=(bearb.positionIds&&bearb.positionIds.length)?bearb.positionIds:(bearb.positionId?[bearb.positionId]:[]);
    form.querySelectorAll('input[name="posw"]').forEach(function(c){ c.checked=gew.indexOf(c.value)>=0; });
    setz("f_adresse",bearb.adresse);
    var art=bearb.wartungsart||"planmäßig";
    if(art.indexOf("sonstige")===0){
      var r1=form.querySelector('input[name="wart"][value="sonstige"]'); if(r1) r1.checked=true;
      setz("f_wart_sonst",art.replace(/^sonstige:\s*/,""));
    } else { var r2=form.querySelector('input[name="wart"][value="'+art+'"]'); if(r2) r2.checked=true; }
    setz("f_firma",bearb.firma); setz("f_tech",bearb.techniker); setz("f_kontakt",bearb.kontakt);
    setz("f_zertu",bearb.zertUnternehmen); setz("f_zertp",bearb.zertPerson); setz("f_sub",bearb.subunternehmen);
    anlagenHost.innerHTML=""; anlagenN=0;
    (bearb.anlagen&&bearb.anlagen.length?bearb.anlagen:[{}]).forEach(function(a){ fuelleAnlage(addAnlage(null),a); });
    form.querySelectorAll('input[name="arbeit"]').forEach(function(c){ c.checked=(bearb.arbeiten||[]).indexOf(c.value)>=0; });
    setz("f_arb_sonst",bearb.arbeitenSonstiges);
    mHost.innerHTML="";
    (bearb.maengel&&bearb.maengel.length?bearb.maengel:[{}]).forEach(function(m){
      var mb=addMangel();
      mb.querySelector(".m-t").value=m.text||""; mb.querySelector(".m-p").value=m.prio||""; mb.querySelector(".m-m").value=m.massnahme||"";
    });
    if(bearb.betriebsbereit){ var r3=form.querySelector('input[name="bereit"][value="'+bearb.betriebsbereit+'"]'); if(r3) r3.checked=true; }
    setz("f_sofort",bearb.sofortmassnahme);
    form.querySelectorAll('input[name="ergebnis"]').forEach(function(c){ c.checked=(bearb.ergebnis||[]).indexOf(c.value)>=0; });
    setz("f_bem",bearb.bemerkungen); setz("f_name",bearb.nameTechniker); setz("f_agv",bearb.auftraggebervertreter);

    if(bearb.unterschrift){
      var sa=form.querySelector("#f_sigalt"); sa.hidden=false;
      sa.innerHTML='<img alt="bisherige Unterschrift" src="'+bearb.unterschrift+'" style="height:60px;border-bottom:1px solid var(--line-2)">'+
        '<div class="muted" style="font-size:12px">Bisherige Unterschrift – bleibt erhalten, solange Sie unten nicht neu unterschreiben.</div>';
    }
    if(bearb.fotos && bearb.fotos.length){
      fotoInfo.textContent=bearb.fotos.length+" vorhandene(s) Foto(s) bleiben erhalten – hier können weitere dazukommen";
    }
    form.querySelector("#f_grundbox").hidden=false;
    form.querySelector("#f_grund").required=true;
    form.querySelector("#save").textContent="Korrektur speichern";
    form.querySelector("#reset").textContent="Abbrechen";
  }

  form.querySelector("#reset").onclick=function(){
    formDirty=false; S.protoStandort=""; S.protoPos="";
    if(S.bearbeiten){ S.letztesProtokoll=S.bearbeiten.x._id; S.bearbeiten=null; }
    render();
  };

  /* Die eingebaute Browsermeldung erscheint als Sprechblase am Feld. Steht das
     Feld weit oben ausserhalb des Bildes, sieht man auf dem Handy gar nichts
     und der Knopf wirkt tot. Deshalb selbst pruefen, hinscrollen, benennen. */
  var NAMEN={f_grund:"Grund der Korrektur", f_datum:"Datum der Wartung", f_standort:"Standort / Filiale / Lager",
             f_tech:"Techniker/in", f_name:"Name Techniker/in"};
  form.setAttribute("novalidate","novalidate");
  function pflichtPruefung(){
    var fehlend=[];
    form.querySelectorAll("[required]").forEach(function(n){
      var leer = !n.value || !n.value.trim();
      n.style.borderColor = leer ? "var(--crit)" : "";
      if(leer) fehlend.push(n);
    });
    var box=form.querySelector("#f_fehlt");
    if(!fehlend.length){ box.hidden=true; return true; }
    box.textContent = fehlend.length===1
      ? "Es fehlt noch: "+(NAMEN[fehlend[0].id]||"ein Pflichtfeld")
      : "Es fehlen noch "+fehlend.length+" Angaben: "+
        fehlend.map(function(n){ return NAMEN[n.id]||n.id; }).join(", ");
    box.hidden=false;
    fehlend[0].scrollIntoView({behavior:"smooth", block:"center"});
    try{ fehlend[0].focus({preventScroll:true}); }catch(x){ fehlend[0].focus(); }
    return false;
  }

  form.onsubmit=function(e){
    e.preventDefault();
    if(!pflichtPruefung()) return;
    var v=function(id){ var n=form.querySelector("#"+id); return n?n.value.trim():""; };
    var radio=function(name){ var n=form.querySelector('input[name="'+name+'"]:checked'); return n?n.value:""; };
    var anlagen=[];
    Array.prototype.forEach.call(anlagenHost.children,function(b,i){
      var n=i+1;
      var get=function(sel){ var x=b.querySelector(sel); return x?x.value.trim():""; };
      var multi=function(name){ return Array.prototype.map.call(b.querySelectorAll('input[name="'+name+'"]:checked'),function(x){return x.value;}); };
      var typ=multi("atyp"+n), reg=multi("areg"+n);
      if(!typ.length&&!get('input[name="ah'+n+'"]')&&!get('input[name="as'+n+'"]')) return;
      anlagen.push({typ:typ,regelung:reg,fernzugriff:!!b.querySelector('input[name="afern'+n+'"]:checked'),
        hersteller:get('input[name="ah'+n+'"]'),modell:get('input[name="am'+n+'"]'),seriennummer:get('input[name="as'+n+'"]'),
        baujahr:get('input[name="ab'+n+'"]'),leistungKw:get('input[name="ak'+n+'"]'),standortAussen:get('input[name="ao'+n+'"]')});
    });
    var maengel=[];
    Array.prototype.forEach.call(mHost.children,function(b){
      var t=b.querySelector(".m-t").value.trim();
      if(!t) return;
      maengel.push({text:t,prio:b.querySelector(".m-p").value,massnahme:b.querySelector(".m-m").value.trim()});
    });
    var stSel=byId[v("f_standort")];
    var doc={
      standortId:v("f_standort"),
      positionIds:Array.prototype.map.call(form.querySelectorAll('input[name="posw"]:checked'),function(x){ return x.value; }),
      positionId:(form.querySelector('input[name="posw"]:checked')||{}).value||"",
      filiale:stSel?stSel.filiale:"", standortName:stSel?stName(stSel):"",
      adresse:v("f_adresse"), region:radio("fm"),
      datum:v("f_datum"), uhrzeit:v("f_zeit"),
      bestellnummer:v("f_bestell"), auftragsnummer:v("f_auftrag"),
      wartungsart:radio("wart")==="sonstige"?("sonstige: "+v("f_wart_sonst")):radio("wart"),
      firma:v("f_firma"), techniker:v("f_tech"), kontakt:v("f_kontakt"),
      subunternehmen:v("f_sub"), zertUnternehmen:v("f_zertu"), zertPerson:v("f_zertp"),
      anlagen:anlagen,
      arbeiten:Array.prototype.map.call(form.querySelectorAll('input[name="arbeit"]:checked'),function(x){return x.value;}),
      arbeitenSonstiges:v("f_arb_sonst"),
      maengel:maengel,
      betriebsbereit:radio("bereit"), sofortmassnahme:v("f_sofort"),
      ergebnis:Array.prototype.map.call(form.querySelectorAll('input[name="ergebnis"]:checked'),function(x){return x.value;}),
      bemerkungen:v("f_bem"),
      nameTechniker:v("f_name"), auftraggebervertreter:v("f_agv"),
      unterschrift:hasSig?cv.toDataURL("image/png"):"",
      /* die Bilddaten liegen getrennt, im Protokoll steht nur der Verweis */
      fotos:fotos.map(function(f){ return {id:f.id, name:f.name, hinweis:f.hinweis, bytes:f.bytes}; }),
      erstellt:new Date().toISOString()
    };
    lsSet("ukt_tech",doc.nameTechniker||doc.techniker);
    var id="p_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
    var btn=form.querySelector("#save"); btn.disabled=true; btn.textContent="Speichern …";
    var fertig=function(msg){
      btn.disabled=false; btn.textContent="Protokoll speichern"; formDirty=false; toast(msg);
      S.protoStandort=""; S.protoPos="";
      S.letztesProtokoll=id;     /* nach dem Neuzeichnen direkt aufklappen */
      berechneFaelligkeiten();   /* die gewarteten Positionen rücken sofort weiter */
      render();
    };
    var fehlschlag=function(text){
      /* Formular bleibt stehen – nichts von dem Eingegebenen geht verloren */
      btn.disabled=false; btn.textContent="Protokoll speichern";
      var box=form.querySelector("#f_fehlt");
      box.textContent=text; box.hidden=false;
      box.scrollIntoView({behavior:"smooth",block:"center"});
    };

    /* ---- Korrektur eines gespeicherten Protokolls ---- */
    if(bearb){
      var grund=v("f_grund");
      doc.erstellt=bearb.erstellt||doc.erstellt;
      doc.version=(bearb.version||1)+1;
      doc.geaendert=new Date().toISOString();
      doc.korrekturGrund=grund;
      if(!hasSig) doc.unterschrift=bearb.unterschrift||"";
      doc.fotos=(bearb.fotos||[]).concat(doc.fotos);   /* Fotos kommen nur dazu, keines verschwindet */
      var felder=vergleiche(bearb, doc);
      if(!felder.length){ fehlschlag("Es wurde nichts geändert – die Korrektur wird nicht gespeichert."); return; }

      var kid=bearb._id, aufGeraet=bearb._quelle==="geraet";
      btn.disabled=true; btn.textContent="Korrektur wird gespeichert …";
      var geraetFotos=aufGeraet ? (bearb._fotoDaten||[]).concat(fotos) : null;
      (aufGeraet ? Promise.resolve(true) : speichereFotos(kid, fotos)).then(function(fotosOk){
        if(!fotosOk){ fehlschlag("Die neuen Fotos ließen sich nicht übertragen – die Korrektur ist noch nicht gespeichert. Bitte bei Verbindung erneut versuchen."); return; }
        aktualisiereProtokoll(kid, doc, bearb._quelle, geraetFotos).then(function(ok){
          if(!ok){ fehlschlag("Die Korrektur konnte nicht gespeichert werden"+(Store.fehler?" ("+Store.fehler+")":"")+". Ihre Eingaben sind noch da."); return; }
          protokolliere({art:"korrigiert", protokollId:kid, standortId:doc.standortId,
                         standortName:doc.standortName, grund:grund, felder:felder});
          (aufGeraet ? lokaleNeuLaden() : Promise.resolve()).then(function(){
            formDirty=false; S.bearbeiten=null; S.letztesProtokoll=kid;
            toast("Korrektur gespeichert – "+felder.length+" Feld"+(felder.length===1?"":"er")+" geändert.");
            berechneFaelligkeiten(); render();
          });
        });
      });
      return;
    }

    /* 1. immer zuerst sicher aufs Gerät – das klappt auch im Funkloch */
    var eintrag={id:id, doc:doc, fotos:fotos, erstellt:doc.erstellt};
    idbSchreiben(eintrag).then(function(){
      lokaleProtokolle.unshift(eintrag);
      protokolliere({art:"angelegt", protokollId:id, standortId:doc.standortId, standortName:doc.standortName,
                     felder:[{feld:"positionIds", name:"Gewartete Anlagen", alt:"–", neu:feldText("positionIds",doc.positionIds)}]});

      /* 2. gibt es eine zentrale Ablage, gleich dorthin übertragen */
      if(Store.modus!=="claude" && Store.modus!=="supabase"){
        fertig("Protokoll gespeichert"+(fotos.length?" – mit "+fotos.length+" Foto(s)":"")+".");
        return;
      }
      if(fotos.length) btn.textContent="Fotos werden übertragen …";
      speichereFotos(id,fotos).then(function(fotosOk){
        if(!fotosOk){ fertig("Auf dem Gerät gespeichert – wird übertragen, sobald Verbindung besteht."); return; }
        btn.textContent="Übertragen …";
        speichereProtokoll(id,doc).then(function(ok){
          if(!ok){ fertig("Auf dem Gerät gespeichert – wird übertragen, sobald Verbindung besteht."); return; }
          idbLoeschen(id).then(function(){
            lokaleProtokolle=lokaleProtokolle.filter(function(x){ return x.id!==id; });
            fertig("Protokoll gespeichert und übertragen.");
          },function(){ fertig("Protokoll gespeichert und übertragen."); });
        });
      });
    },function(err){
      fehlschlag("Das Protokoll konnte auf diesem Gerät nicht gespeichert werden: "+
        (err&&err.message?err.message:"unbekannter Fehler")+
        ". Ihre Eingaben sind noch da. Häufigste Ursache: privates Browserfenster oder voller Speicher – "+
        "bitte in einem normalen Fenster öffnen oder Fotos entfernen und erneut speichern.");
    });
  };

  var head = bearb
    ? el('<div class="card" style="border-color:var(--warn)"><div class="pad stack">'+
        '<div><h2>Protokoll korrigieren</h2><div class="sub">Protokoll vom <strong>'+dfmt(bearb.datum)+"</strong>"+
        (bearb.standortName?" – "+esc(bearb.standortName):"")+". Ändern Sie, was falsch ist, und geben Sie unten den Grund an. "+
        "Die bisherige Fassung bleibt im Änderungsverlauf nachvollziehbar.</div></div>"+
      "</div></div>")
    : el('<div class="card"><div class="pad stack">'+
        '<div><h2>Wartungsprotokoll Klimaanlage</h2><div class="sub">Digitale Fassung des Einseiters. '+
        (s?"Vorbelegt für <strong>"+esc(stName(s))+"</strong>.":"Standort unten auswählen oder aus Liste bzw. Karte heraus öffnen.")+"</div></div>"+
      "</div></div>");
  f.appendChild(head);
  var body=el('<div class="card"><div class="pad"></div></div>');
  body.querySelector(".pad").appendChild(form);
  f.appendChild(body);

  /* gespeicherte Protokolle: zentral abgelegte und die auf diesem Gerät */
  var alle=alleProtokolle();
  var teile=[];
  if(Store.modus==="claude"||Store.modus==="supabase") teile.push(protokolle.length+" in der gemeinsamen Ablage");
  if(lokaleProtokolle.length) teile.push(lokaleProtokolle.length+" auf diesem Gerät");
  var unterzeile = alle.length
    ? teile.join(" · ")+". Antippen öffnet das Protokoll – dort auch Drucken und PDF."
    : "Noch keine Protokolle erfasst.";
  /* Admins können gelöschte Protokolle einblenden, um sie wiederherzustellen */
  var anzGeloescht=alleProtokolle(true).length-alle.length;
  if(Admin.frei && S.zeigeGeloeschte) alle=alleProtokolle(true);
  var gesp=el('<div class="card"><div class="pad stack">'+
    "<div><h2>Gespeicherte Protokolle</h2>"+
    '<div class="sub">'+unterzeile+"</div></div>"+
    (Admin.frei && anzGeloescht ? '<div class="chips"><button class="chip" type="button" id="p_geloescht" aria-pressed="'+
      (!!S.zeigeGeloeschte)+'">gelöschte anzeigen ('+anzGeloescht+")</button></div>" : "")+
    '<div class="scrollx" id="plist"></div></div></div>');
  var chipG=gesp.querySelector("#p_geloescht");
  if(chipG) chipG.onclick=function(){ S.zeigeGeloeschte=!S.zeigeGeloeschte; render(); };
  var pl=gesp.querySelector("#plist");
  if(alle.length){
    var tbl=el('<table class="dt"><thead><tr><th>Datum</th><th>Standort</th><th>Techniker/in</th>'+
      "<th>Art</th><th>Mängel</th><th>Fotos</th><th>Ablage</th></tr></thead><tbody></tbody></table>");
    var tb=tbl.querySelector("tbody");
    alle.slice(0,60).forEach(function(x){
      var tr=el("<tr style='cursor:pointer"+(x.geloescht?";opacity:.55;text-decoration:line-through":"")+"'><td class='mono'>"+dfmt(x.datum)+"</td><td>"+esc(x.standortName||x.adresse||"–")+
        "</td><td>"+esc(x.nameTechniker||x.techniker||"–")+"</td><td>"+esc(x.wartungsart||"–")+
        "</td><td class='mono'>"+((x.maengel||[]).length||"0")+"</td>"+
        "<td class='mono'>"+((x.fotos||[]).length||"0")+"</td>"+
        "<td>"+(x._quelle==="geraet"?'<span class="tag">Gerät</span>':'<span class="tag f30">gemeinsam</span>')+"</td></tr>");
      tr.onclick=function(){
        var ziel=gesp.querySelector("#pdetail");
        ziel.innerHTML=""; ziel.appendChild(protokollDetail(x));
        ziel.scrollIntoView({behavior:"smooth",block:"start"});
      };
      tb.appendChild(tr);
    });
    pl.appendChild(tbl);
    gesp.querySelector(".stack").appendChild(el('<div id="pdetail"></div>'));
    if(S.letztesProtokoll){
      var neu=alle.filter(function(x){ return x._id===S.letztesProtokoll; })[0];
      S.letztesProtokoll=null;
      if(neu){
        var ziel=gesp.querySelector("#pdetail");
        ziel.appendChild(protokollDetail(neu));
        setTimeout(function(){ ziel.scrollIntoView({behavior:"smooth",block:"start"}); },60);
      }
    }
  } else {
    pl.appendChild(el('<div class="muted" style="font-size:13px">Noch keine Protokolle erfasst.</div>'));
  }
  f.appendChild(gesp);
  return f;
}

/* ---------- Protokoll als Blatt: Drucken oder als PDF sichern ---------- */
function kreuz(an){ return an ? "&#9746;" : "&#9744;"; }
function druckeProtokoll(p){
  var alt=document.getElementById("druckansicht"); if(alt) alt.remove();
  var gew=function(liste,wert){ return (liste||[]).indexOf(wert)>=0; };
  var zeile=function(k,v){ return "<tr><td class='k'>"+k+"</td><td>"+(v?esc(v):"&nbsp;")+"</td></tr>"; };

  var anlagenHtml=(p.anlagen&&p.anlagen.length?p.anlagen:[{}]).map(function(a,i){
    return "<table style='margin-bottom:8px'>"+
      "<tr><th colspan='2'>Anlage "+(i+1)+"</th></tr>"+
      "<tr><td class='k'>Anlagentyp</td><td>"+ANLAGENTYPEN.map(function(t){
        return kreuz(gew(a.typ,t))+" "+esc(t); }).join(" &nbsp; ")+"</td></tr>"+
      "<tr><td class='k'>Regelung</td><td>"+REGELUNGEN.map(function(t){
        return kreuz(gew(a.regelung,t))+" "+esc(t); }).join(" &nbsp; ")+
        " &nbsp; Fernzugriff: "+kreuz(a.fernzugriff)+" ja "+kreuz(a.fernzugriff===false)+" nein</td></tr>"+
      zeile("Hersteller / Modell",[a.hersteller,a.modell].filter(Boolean).join(" / "))+
      zeile("Seriennummer",a.seriennummer)+
      zeile("Baujahr / Nennleistung",[a.baujahr,a.leistungKw?a.leistungKw+" kW":""].filter(Boolean).join(" / "))+
      zeile("Standort Außengerät",a.standortAussen)+
    "</table>";
  }).join("");

  var maengelHtml=(p.maengel&&p.maengel.length)
    ? "<table><tr><th>Mangel / Feststellung</th><th style='width:14%'>Priorität</th><th>Empfohlene Maßnahme / Frist</th></tr>"+
      p.maengel.map(function(m){ return "<tr><td>"+esc(m.text)+"</td><td>"+esc(m.prio||"")+"</td><td>"+esc(m.massnahme||"")+"</td></tr>"; }).join("")+
      "</table>"
    : "<div>Keine Mängel festgestellt.</div>";

  var ov=document.createElement("div");
  ov.id="druckansicht";
  ov.innerHTML=
    '<div class="druckleiste">'+
      '<button class="btn" type="button" id="d_druck">Drucken / als PDF speichern</button>'+
      '<button class="btn ghost" type="button" id="d_zu" style="background:#fff">Schließen</button>'+
    "</div>"+
    '<div class="blatt">'+
      '<div class="kopf">'+
        '<div class="firma"><b>KAMMERLANDER</b><span>Umwelt- und Klimatechnik GmbH</span></div>'+
        '<div class="kontakt">Speckbacherstraße 92, A-6380 St. Johann in Tirol<br>'+
          "Telefon 05352 / 61207-0 · office@ukt.at · www.ukt.at</div>"+
      "</div>"+
      "<h1>WARTUNGSPROTOKOLL</h1><div style='color:#444'>Lidl Markt / Lager</div>"+

      "<h2>Einsatz</h2><table>"+
        zeile("Datum der Wartung",dfmt(p.datum)+(p.uhrzeit?", "+p.uhrzeit+" Uhr":""))+

    panel.querySelector('[data-rolle="loeschtitel"]').textContent = wiederher?"Grund für das Wiederherstellen":"Grund für das Löschen";

    var ja=panel.querySelector('[data-rolle="loeschja"]');

      ja.disabled=true; ja.textContent= wiederher?"Wird wiederhergestellt …":"Wird gelöscht …";

        if(!ok){
          ja.disabled=false; ja.textContent= wiederher?"Wiederherstellen":"Protokoll löschen";

        }

  };
  var loeschKnopf=d.querySelector('[data-akt="loeschen"]');
  if(loeschKnopf) loeschKnopf.onclick=function(){ oeffnePanel(false); };
  var wiederKnopf=d.querySelector('[data-akt="wiederher"]');
  if(wiederKnopf) wiederKnopf.onclick=function(){ oeffnePanel(true); };
  d.querySelector('[data-akt="verlauf"]').onclick=function(){
    S.verlaufProtokoll=p._id; S.view="verlauf"; render(); window.scrollTo({top:0});
  };
  var weg=d.querySelector('[data-akt="weg"]');
  if(weg) weg.onclick=function(){
    var grund=window.prompt("Dieses Protokoll liegt nur auf diesem Gerät und wird endgültig gelöscht.\n\n"+
                            "Bitte kurz den Grund angeben – er wird im Änderungsverlauf festgehalten:");

    if(!grund.trim()){ toast("Ohne Grund wird nicht gelöscht."); return; }
    idbLoeschen(p._id).then(function(){
      lokaleProtokolle=lokaleProtokolle.filter(function(x){ return x.id!==p._id; });
      protokolliere({art:"geloescht", protokollId:p._id, standortId:p.standortId, standortName:p.standortName,
                     grund:grund.trim(), felder:[{feld:"datum", name:"Protokoll vom", alt:dfmt(p.datum), neu:"gelöscht"}]});
      toast("Protokoll vom Gerät gelöscht."); berechneFaelligkeiten(); render();
    },function(){ toast("Löschen fehlgeschlagen."); });
  };

  var fh=d.querySelector("#pfotos");
  if(p.fotos && p.fotos.length){
    fh.innerHTML='<div class="muted" style="font-size:12.5px">'+p.fotos.length+" Foto(s) werden geladen …</div>";
    ladeFotos(p).then(function(bilder){
      fh.innerHTML='<div class="l muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Fotos</div>';
      var g=el('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px"></div>');
      bilder.forEach(function(b){
        g.appendChild(el('<figure style="margin:0">'+
          (b.url?'<a href="'+b.url+'" target="_blank" rel="noopener">'+
                 '<img src="'+b.url+'" alt="'+esc(b.hinweis||b.name)+'" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)"></a>'
               :'<div class="note warnbox" style="font-size:12px">Bild nicht abrufbar</div>')+
          '<figcaption class="muted" style="font-size:12px;margin-top:4px">'+esc(b.hinweis||b.name||"")+"</figcaption></figure>"));
      });
      fh.appendChild(g);
    });
  }
  return d;
}

/* ---------- Wartungshistorie einer Filiale ----------
   Führt die Einträge aus der Excel-Liste und die Protokolle der App
   zusammen: wer hat wann welche Anlage gewartet. */
function historieEintraege(s){
  var zeilen=[];
  s.pos.forEach(function(p){
    (p.historie||[]).forEach(function(d){
      zeilen.push({datum:d, anlage:anlagenName(p), art:p.intervall.art,
        techniker:(p.techniker&&p.techniker[d.slice(0,4)])||"", quelle:"Liste"});
    });
  });
  alleProtokolle().forEach(function(pr){
    if(pr.standortId!==s.id || !pr.datum) return;
    var ids=(pr.positionIds&&pr.positionIds.length)?pr.positionIds:(pr.positionId?[pr.positionId]:[]);
    zeilen.push({datum:pr.datum, anlage:ids.length?feldText("positionIds",ids):"(Markt allgemein)",
      art:pr.wartungsart||"", techniker:pr.nameTechniker||pr.techniker||"", quelle:"App", protokoll:pr});
  });
  return zeilen.sort(function(a,b){ return b.datum.localeCompare(a.datum); });
}
function historieAnsicht(s){
  var box=document.createElement("div");
  box.className="stack";
  var z=historieEintraege(s);
  if(!z.length){ box.appendChild(el('<div class="muted">Für diesen Standort ist keine Wartung erfasst.</div>')); return box; }

  /* wer war in den letzten Jahren hier – auf einen Blick */
  var wer={}; z.forEach(function(e){ if(e.techniker) wer[e.techniker]=(wer[e.techniker]||0)+1; });
  var namen=Object.keys(wer).sort(function(a,b){ return wer[b]-wer[a]; });
  var ohneName=z.filter(function(e){ return !e.techniker; }).length;
  box.appendChild(el('<dl class="dl">'+
    "<dt>Letzter Besuch</dt><dd class='mono'>"+(s.letzterBesuch?dfmt(s.letzterBesuch):"—")+"</dd>"+
    "<dt>Wartungen erfasst</dt><dd>"+z.length+" seit "+z[z.length-1].datum.slice(0,4)+"</dd>"+
    "<dt>Techniker</dt><dd>"+(namen.length?namen.map(function(n){ return esc(n)+" ("+wer[n]+"×)"; }).join(", "):"in der Liste nicht eingetragen")+
      (ohneName&&namen.length?' <span class="muted">· '+ohneName+" ohne Namen</span>":"")+"</dd>"+
  "</dl>"));

  var jahre={}; z.forEach(function(e){ var j=e.datum.slice(0,4); (jahre[j]=jahre[j]||[]).push(e); });
  Object.keys(jahre).sort().reverse().forEach(function(j){
    var t=el('<div><div class="chart-t" style="margin-bottom:4px">'+j+' <span class="muted mono" style="font-size:12px;font-weight:400">· '+
      jahre[j].length+" Wartung"+(jahre[j].length===1?"":"en")+'</span></div>'+
      '<div class="scrollx"><table class="dt"><thead><tr><th>Datum</th><th>Anlage</th><th>Art</th><th>Techniker/in</th><th>Quelle</th></tr></thead>'+
      "<tbody></tbody></table></div></div>");
    var tb=t.querySelector("tbody");
    jahre[j].forEach(function(e){
      var tr=el("<tr><td class='mono'>"+dfmt(e.datum)+"</td><td>"+esc(e.anlage)+"</td><td>"+esc(e.art)+
        "</td><td>"+(e.techniker?esc(e.techniker):'<span class="muted">–</span>')+"</td><td>"+
        (e.quelle==="App"?'<span class="tag f30">Protokoll</span>':'<span class="tag">Liste</span>')+"</td></tr>");
      if(e.protokoll){
        tr.style.cursor="pointer";
        tr.title="Protokoll öffnen";
        tr.onclick=function(){ S.letztesProtokoll=e.protokoll._id; S.view="protokoll"; render(); };
      }
      tb.appendChild(tr);
    });
    box.appendChild(t);
  });
  return box;
}

var ART_TEXT={angelegt:"Protokoll angelegt", korrigiert:"Protokoll korrigiert", geloescht:"Protokoll gelöscht",
              wiederhergestellt:"Protokoll wiederhergestellt", stammdaten:"Stammdaten geändert"};
var ART_KLASSE={angelegt:"p-erledigt", korrigiert:"p-faellig", geloescht:"p-ueberfaellig",
                wiederhergestellt:"p-erledigt", stammdaten:"p-geplant"};
function zeitFmt(iso){
  if(!iso) return "–";
  var d=new Date(iso);
  return dfmt(isoLokal(d))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

function viewVerlauf(){
  var f=document.createDocumentFragment();

  /* 1. Wartungshistorie je Filiale */
  var hk=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Wartungshistorie einer Filiale</h2><div class="sub">Wer hat wann gewartet – aus der Excel-Liste und aus den '+
      'Protokollen dieser App zusammengeführt, nach Jahren geordnet.</div></div>'+
    '<label class="fl"><span>Filiale / Standort</span><select id="v_st"></select></label>'+
    '<div id="v_hist"></div>'+
  "</div></div>");
  var sel=hk.querySelector("#v_st");
  sel.appendChild(el('<option value="">– bitte wählen –</option>'));
  ST.slice().sort(function(a,b){ return stName(a).localeCompare(stName(b),"de",{numeric:true}); }).forEach(function(x){
    var o=document.createElement("option"); o.value=x.id;
    o.textContent=(stName(x)===x.adresse)?x.adresse:(stName(x)+" · "+x.adresse); sel.appendChild(o);
  });
  var zeige=function(){
    var host=hk.querySelector("#v_hist"); host.innerHTML="";
    if(byId[sel.value]) host.appendChild(historieAnsicht(byId[sel.value]));
  };
  sel.value=S.verlaufStandort||"";
  sel.onchange=function(){ S.verlaufStandort=sel.value; zeige(); };
  zeige();
  f.appendChild(hk);

  /* 2. Änderungsprotokoll */
  var ak=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Letzte Änderungen</h2><div class="sub">Jedes angelegte, korrigierte und gelöschte Protokoll – wann, von wem, '+
      'warum und welches Feld von welchem auf welchen Wert. Die Einträge lassen sich nicht ändern oder löschen.</div></div>'+
    '<div id="v_filter"></div>'+
    '<div id="v_ae" class="stack"><div class="muted">wird geladen …</div></div>'+
  "</div></div>");
  f.appendChild(ak);

  var zeichne=function(liste){
    var host=ak.querySelector("#v_ae"); host.innerHTML="";
    var fh=ak.querySelector("#v_filter"); fh.innerHTML="";
    if(S.verlaufProtokoll){
      liste=liste.filter(function(e){ return e.protokollId===S.verlaufProtokoll; });
      var chip=el('<div class="rowflex"><span class="tag">nur ein Protokoll</span>'+
        '<button class="btn ghost sm" type="button">alle Änderungen zeigen</button></div>');
      chip.querySelector("button").onclick=function(){ S.verlaufProtokoll=null; zeichne(aenderungen); };
      fh.appendChild(chip);
    }
    if(!liste.length){
      host.appendChild(el('<div class="muted" style="font-size:13px">Noch keine Änderungen erfasst. Ab dieser Version wird jedes '+
        'Anlegen, Korrigieren und Löschen hier festgehalten; Protokolle aus der Zeit davor haben keinen Eintrag.</div>'));
      return;
    }
    liste.slice(0,150).forEach(function(e){
      var zeilen=(e.felder||[]).filter(function(x){ return e.art==="korrigiert"||e.art==="stammdaten"; }).map(function(x){
        return "<tr><td>"+esc(x.name)+"</td><td>"+esc(x.alt)+"</td><td><strong>"+esc(x.neu)+"</strong></td></tr>";
      }).join("");
      var b=el('<div class="posbox">'+
        '<div class="rowflex" style="justify-content:space-between;gap:8px">'+
          '<span><strong>'+esc(e.standortName||"Protokoll")+"</strong><br>"+
          '<span class="muted mono" style="font-size:12px">'+zeitFmt(e.zeit)+" · "+esc(e.von||"unbekannt")+"</span></span>"+
          '<span class="pill '+(ART_KLASSE[e.art]||"p-unbekannt")+'">'+(ART_TEXT[e.art]||esc(e.art))+"</span>"+
        "</div>"+
        (e.grund?'<div style="font-size:13px"><span class="muted">Grund:</span> '+esc(e.grund)+"</div>":"")+
        (zeilen?'<div class="scrollx"><table class="dt"><thead><tr><th>Feld</th><th>vorher</th><th>nachher</th></tr></thead><tbody>'+
          zeilen+"</tbody></table></div>":"")+
        (e.protokollId?'<div><button class="btn ghost sm" type="button">Protokoll öffnen</button></div>':
          (e.art==="stammdaten"&&e.standortId?'<div><button class="btn ghost sm" type="button">Markt in der Verwaltung öffnen</button></div>':""))+
      "</div>");
      var knopf=b.querySelector("button");
      if(knopf) knopf.onclick=function(){
        if(e.protokollId){ S.letztesProtokoll=e.protokollId; S.view="protokoll"; }
        else { S.adm=S.adm||{suche:"", filter:"alle", sort:"filiale", auf:true}; S.adm.sel=e.standortId; S.adm.entwurf=null; S.view="verwaltung"; }
        render(); window.scrollTo({top:0});
      };
      host.appendChild(b);
    });
  };
  ladeAenderungen().then(zeichne, function(){ zeichne(aenderungen); });
  return f;
}

var LABEL_ST={filiale:"Filialnummer", name:"Bezeichnung", adresse:"Adresse", plz:"PLZ", ort:"Ort",
  region:"FM-Region", lat:"Breitengrad", lon:"Längengrad", aktiv:"betreut", notiz:"Notiz"};
var LABEL_POS={anlagentyp:"Anlagentyp", intervallCode:"Kürzel", inbetriebnahme:"Inbetriebnahme",
  monat:"Soll-Monat", kaeltemittelKg:"Kältemittel (kg)", kaeltemittelArt:"Kältemittelart",
  rueckkuehler:"Rückkühler", aktiv:"in Betrieb", notiz:"Notiz"};
function stammWert(feld, w){
  if(w===null||w===undefined||w==="") return "–";
  if(feld==="aktiv") return w?"ja":"nein";
  if(feld==="monat") return MONATE_L[+w]||"–";
  if(feld==="inbetriebnahme") return dfmt(w);
  return String(w);
}
function objDiff(vorher, nachher, felder){
  var d={}; felder.forEach(function(k){ if(!gleich(vorher[k],nachher[k])) d[k]=nachher[k]; }); return d;
}

/* Was an einem Markt nicht stimmt – getrennt nach Fehlern und fehlenden Angaben */
function auffaelligkeiten(s){
  var f=[], l=[];
  if(!s.lat) f.push("keine Kartenposition");
  if(!s.region) f.push("keine FM-Region");
  if(s.filiale){
    var doppelt=ALLE_ST.filter(function(o){ return o!==s && o.aktiv && String(o.filiale)===String(s.filiale); });
    if(doppelt.length) f.push("Filialnummer "+s.filiale+" ist mehrfach vergeben");
  }
  if(!s.pos.length) f.push("keine Anlage in Betrieb");
  if(s.pos.some(function(p){ return p.ueber30kg; }) && !s.pos.some(function(p){ return p.intervall&&p.intervall.kurz==="HJW"; }))
    f.push("über 30 kg Kältemittel, aber keine Halbjahreswartung (HJW)");
  s.pos.forEach(function(p){
    var n=anlagenName(p);
    if(p.intervall && p.intervall.unklar) f.push(n+": Kürzel „"+(p.intervallCode||"leer")+"“ unklar");
    if(p.anker && p.anker.quelle==="Inbetriebnahme" && p.monat){
      var d=Math.abs(p.anker.monat-p.monat); d=Math.min(d,12-d);
      if(d>1) f.push(n+": Soll-Monat "+MONATE_L[p.monat]+" passt nicht zur Inbetriebnahme (ergibt "+MONATE_L[p.anker.monat]+")");
    }
    if(!p.inbetriebnahme) l.push(n+": Inbetriebnahme fehlt");
    if(!p.kaeltemittelText) l.push(n+": Kältemittelmenge fehlt");
  });
  if(!s.filiale) l.push("keine Filialnummer");
  if(!s.plz) l.push("keine PLZ in der Adresse");
  if(s.pos.length===1) l.push("nur ein Termin im Jahr eingetragen – der Halbjahresbesuch fehlt in der Liste");
  return {fehler:f, luecken:l};
}
function naechsterTerminMarkt(s){
  var t=s.pos.map(function(p){ return p.naechste; }).filter(Boolean);
  if(s.naechsterBesuch) t.push(s.naechsterBesuch);
  t.sort(); return t[0]||null;
}

    "</div>");
    host.appendChild(b);
  };
  ausgewaehlt.forEach(function(p){ anlageBlock(p,false); });
  if(s._entwurf) anlageBlock({id:"NP"+Date.now().toString(36), aktiv:true},true);
  c.querySelector("#a_plus").onclick=function(){ anlageBlock({id:"NP"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), aktiv:true},true); };

  c.querySelector("#adm_schliessen").onclick=function(){ A.sel=null; A.entwurf=null; render(); };

  c.querySelector("#a_geo").onclick=function(){
    var adr=c.querySelector("#a_adresse").value.trim();
    if(!adr){ toast("Zuerst eine Adresse eintragen."); return; }
    toast("Adresse wird verortet …");
    fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=at&q="+encodeURIComponent(adr))
      .then(function(r){ return r.json(); })

        if(!j||!j[0]){ toast("Adresse nicht gefunden – bitte genauer angeben oder Koordinaten von Hand eintragen."); return; }
        c.querySelector("#a_lat").value=(+j[0].lat).toFixed(5);
        c.querySelector("#a_lon").value=(+j[0].lon).toFixed(5);
        toast("Gefunden: "+j[0].display_name.split(",").slice(0,3).join(","));
      }, function(){ toast("Verortung hier nicht möglich – bitte Koordinaten von Hand eintragen."); });
  };

  var fehler=function(t){ var e=c.querySelector("#a_err"); e.textContent=t; e.hidden=false; e.scrollIntoView({behavior:"smooth",block:"center"}); };
  var grundHolen=function(){
    var g=c.querySelector("#a_grund").value.trim();
    if(!g){ fehler("Bitte einen Grund angeben – er wird mit der Änderung im Verlauf festgehalten."); c.querySelector("#a_grund").focus(); }
    return g;
  };

  var resetKnopf=c.querySelector("#a_reset");
  if(resetKnopf) resetKnopf.onclick=function(){
    var grund=grundHolen(); if(!grund) return;
    if(!window.confirm("Alle Änderungen an diesem Markt und seinen Anlagen verwerfen und wieder die Werte der Excel-Liste verwenden?")) return;
    var schl=["standort:"+s.id].concat(ausgewaehlt.filter(function(p){ return !p._neu; }).map(function(p){ return "position:"+p.id; }));
    var felder=[];
    schl.forEach(function(k){ if(stammUeber[k]){ Object.keys(stammUeber[k].felder||{}).forEach(function(f2){
      felder.push({feld:f2, name:(k.indexOf("standort")===0?"":"Anlage – ")+(LABEL_ST[f2]||LABEL_POS[f2]||f2),
                   alt:stammWert(f2,stammUeber[k].felder[f2]), neu:"Excel-Wert"}); }); } });
    Promise.all(schl.filter(function(k){ return stammUeber[k]; }).map(function(k){ delete stammUeber[k]; return stammLoeschen(k); }))
      .then(function(){
        wendeStammdatenAn();
        protokolliere({art:"stammdaten", standortId:s.id, standortName:stName(s), grund:grund, felder:felder});
        toast("Auf Excel-Stand zurückgesetzt."); render();
      });
  };

  c.querySelector("#a_speichern").onclick=function(){
    var grund=grundHolen(); if(!grund) return;
    var num=function(v){ v=String(v).trim().replace(",","."); return v===""?null:+v; };
    var neuSt={
      filiale:c.querySelector("#a_filiale").value.trim(), name:c.querySelector("#a_name").value.trim(),
      adresse:c.querySelector("#a_adresse").value.trim(), plz:c.querySelector("#a_plz").value.trim(),
      ort:c.querySelector("#a_ort").value.trim(), region:c.querySelector("#a_region").value,
      lat:num(c.querySelector("#a_lat").value), lon:num(c.querySelector("#a_lon").value),
      aktiv:c.querySelector("#a_aktiv").checked, notiz:c.querySelector("#a_notiz").value.trim()
    };
    if(!neuSt.filiale && !neuSt.name && !neuSt.adresse){ fehler("Ein Markt braucht mindestens Filialnummer, Bezeichnung oder Adresse."); return; }
    if(neuSt.lat!=null && (isNaN(neuSt.lat)||neuSt.lat<46||neuSt.lat>49.5)){ fehler("Der Breitengrad liegt nicht in Österreich (etwa 46,3 bis 49,1)."); return; }
    if(neuSt.lon!=null && (isNaN(neuSt.lon)||neuSt.lon<9||neuSt.lon>17.5)){ fehler("Der Längengrad liegt nicht in Österreich (etwa 9,5 bis 17,2)."); return; }

    var recs=[], protokoll=[];
    var jetzt=new Date().toISOString(), von=wer();

    /* Markt */
    var vorherSt=auswahl(s,STAMM_FELDER_ST);
    var deltaSt=objDiff(vorherSt,neuSt,STAMM_FELDER_ST);
    Object.keys(deltaSt).forEach(function(k){ protokoll.push({feld:k, name:LABEL_ST[k], alt:stammWert(k,vorherSt[k]), neu:stammWert(k,neuSt[k])}); });
    if(s._neu){
      if(Object.keys(deltaSt).length || s._entwurf) recs.push({id:"standort:"+s.id, felder:neuSt, neu:true});
    } else if(Object.keys(deltaSt).length){
      var gegenExcel=objDiff(EXCEL["standort:"+s.id],neuSt,STAMM_FELDER_ST);
      recs.push({id:"standort:"+s.id, felder:gegenExcel, neu:false, leer:!Object.keys(gegenExcel).length});
    }

    /* Anlagen */
    var fehlt=false;
    host.querySelectorAll(".posbox").forEach(function(b){
      var pid=b.dataset.pid, istNeu=b.dataset.neu==="1";
      var lese=function(k){ var x=b.querySelector('[data-k="'+k+'"]'); return x.type==="checkbox"?x.checked:x.value.trim(); };
      var neuP={anlagentyp:lese("anlagentyp"), intervallCode:lese("intervallCode"), inbetriebnahme:lese("inbetriebnahme")||null,
                monat:+lese("monat")||0, kaeltemittelKg:num(lese("kaeltemittelKg")), kaeltemittelArt:lese("kaeltemittelArt"),
                rueckkuehler:lese("rueckkuehler"), aktiv:lese("aktiv"), notiz:lese("notiz")};
      if(istNeu){
        if(!neuP.anlagentyp && !neuP.intervallCode && !neuP.inbetriebnahme) return;   /* leerer Zusatzblock */
        if(!neuP.intervallCode){ fehlt=true; return; }
        neuP.standortId=s.id;
        recs.push({id:"position:"+pid, felder:neuP, neu:true});
        protokoll.push({feld:"anlage", name:"Neue Anlage", alt:"–",
          neu:(neuP.anlagentyp||"Anlage")+" · "+neuP.intervallCode+(neuP.inbetriebnahme?" · IB "+dfmt(neuP.inbetriebnahme):"")});
        return;
      }
      var p=posById[pid]; if(!p) return;
      var vorherP=auswahl(p,STAMM_FELDER_POS);
      /* Kurz- und Langform gelten als gleich, sonst wäre jedes HW eine Änderung */
      var norm=function(k){ k=String(k||"").trim().toUpperCase(); return k==="HW"?"HJW":(k.indexOf("HI")===0?"HJI":k); };
      if(norm(vorherP.intervallCode)===norm(neuP.intervallCode)) neuP.intervallCode=vorherP.intervallCode;
      var deltaP=objDiff(vorherP,neuP,STAMM_FELDER_POS);
      if(!Object.keys(deltaP).length) return;
      Object.keys(deltaP).forEach(function(k){
        protokoll.push({feld:k, name:anlagenName(p)+" – "+LABEL_POS[k], alt:stammWert(k,vorherP[k]), neu:stammWert(k,neuP[k])});
      });
      if(p._neu){ neuP.standortId=s.id; recs.push({id:"position:"+pid, felder:neuP, neu:true}); }
      else {
        var gE=objDiff(EXCEL["position:"+pid],neuP,STAMM_FELDER_POS);
        recs.push({id:"position:"+pid, felder:gE, neu:false, leer:!Object.keys(gE).length});
      }
    });
    if(fehlt){ fehler("Jede neue Anlage braucht ein Kürzel (JW, HJW oder HJI) – daraus ergibt sich ihr Termin."); return; }
    if(!recs.length){ fehler("Es wurde nichts geändert."); return; }

    var knopf=c.querySelector("#a_speichern"); knopf.disabled=true; knopf.textContent="Wird gespeichert …";
    Promise.all(recs.map(function(r){
      if(r.leer){ delete stammUeber[r.id]; return stammLoeschen(r.id).then(function(){ return "zurueck"; }); }
      var rec={id:r.id, typ:r.id.split(":")[0], ziel:r.id.split(":")[1], felder:r.felder, neu:!!r.neu,
               geaendert:jetzt, von:von, grund:grund};
      stammUeber[r.id]=rec;
      return stammSpeichern(rec);
    })).then(function(erg){
      if(erg.indexOf(false)>=0){
        knopf.disabled=false; knopf.textContent="Änderungen speichern";
        fehler("Ein Teil der Änderungen ließ sich nicht speichern. Bitte erneut versuchen.");
        return;
      }
      wendeStammdatenAn();
      protokolliere({art:"stammdaten", standortId:s.id, standortName:stName(byId[s.id]||s), grund:grund, felder:protokoll});
      A.entwurf=null; A.sel=s.id;
      toast((s._entwurf?"Markt angelegt":"Gespeichert – "+protokoll.length+" Änderung"+(protokoll.length===1?"":"en"))+
            (erg.indexOf("geraet")>=0?" (vorerst nur auf diesem Gerät)":"")+".");
      render();
    });
  };
  return c;
}

      x.betriebsbereit,x.bemerkungen]; });

function csv(name,head,rows){
  var q=function(v){ v=String(v==null?"":v); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  var text="﻿"+[head.map(q).join(";")].concat(rows.map(function(r){return r.map(q).join(";");})).join("\r\n");
  if(window.claude&&window.claude.use){
    /* im Artifact sind eigene Downloads gesperrt, der Host übernimmt das */
    window.claude.use("downloads").then(function(d){
      if(!d){ toast("Download in dieser Ansicht nicht möglich."); return; }
      d.save({filename:name,data:text}).then(function(){ toast("Datei bereitgestellt."); },function(){ toast("Download abgebrochen."); });
    },function(){ toast("Download in dieser Ansicht nicht möglich."); });
    return;
  }
  try{
    var blob=new Blob([text],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    toast("CSV heruntergeladen.");
  }catch(e){ toast("Download nicht möglich: "+e.message); }
}

function render(){

  var host=document.getElementById("app");
  host.innerHTML="";
  var sec=document.createElement("section"); sec.className="view";
  if(["protokoll","daten","verlauf","verwaltung"].indexOf(S.view)<0) host.appendChild(filterBar());
  if(S.view==="faellig") sec.appendChild(viewFaellig());
  else if(S.view==="karte") sec.appendChild(viewKarte());
  else if(S.view==="anlagen") sec.appendChild(viewAnlagen());
  else if(S.view==="protokoll") sec.appendChild(viewProtokoll());
  else if(S.view==="verlauf") sec.appendChild(viewVerlauf());
  else if(S.view==="verwaltung") sec.appendChild(viewVerwaltung());
  else sec.appendChild(viewDaten());
  host.appendChild(sec);
  tipHide();
}

/* ----------------------------------------------------------------
   Zugangsschutz. Der Anlagenstamm wird verschlüsselt ausgeliefert
   (AES-256-CBC, Schlüssel aus PBKDF2-SHA256), das Passwort
   entschlüsselt ihn erst im Browser. Ohne Passwort steht in
   daten.enc.js nichts Lesbares.
   ---------------------------------------------------------------- */
(function(){
  "use strict";
  var tabs=document.getElementById("tabs");
  var qrbtn=document.getElementById("qrbtn");
  var stand=document.getElementById("stand");
  var app=document.getElementById("app");

  function b64(s){ var bin=atob(s), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }

  function entschluessle(pw){
    var e=window.LIDL_ENC;
    var mat=new TextEncoder().encode(pw);
    return crypto.subtle.importKey("raw",mat,{name:"PBKDF2"},false,["deriveKey"])
      .then(function(k){
        return crypto.subtle.deriveKey(
          {name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},
          k,{name:"AES-CBC",length:256},false,["decrypt"]);
      })
      .then(function(key){ return crypto.subtle.decrypt({name:"AES-CBC",iv:b64(e.iv)},key,b64(e.data)); })
      .then(function(buf){
        var txt=new TextDecoder().decode(buf);
        if(txt.charAt(0)!=="{") throw new Error("falsch");
        return JSON.parse(txt);
      });
  }

  function start(daten){
    window.LIDL_DB=daten;
    if(tabs) tabs.hidden=false;
    if(qrbtn) qrbtn.hidden=false;
    if(stand) stand.hidden=false;
    starteWartungsleitstand();
  }

  function schirm(){
    if(tabs) tabs.hidden=true;
    if(qrbtn) qrbtn.hidden=true;
    if(stand) stand.hidden=true;
    app.innerHTML="";
    var card=document.createElement("div");
    card.className="card";
    card.style.maxWidth="440px";
    card.style.marginTop="28px";
    card.innerHTML='<div class="pad stack">'+
      '<div><h2>Zugang</h2><div class="sub">Die Anlagen- und Standortdaten sind verschlüsselt hinterlegt. '+
      'Mit dem Passwort aus dem Büro werden sie hier im Browser entschlüsselt.</div></div>'+
      '<form class="stack" id="gateform">'+
        '<label class="fl"><span>Passwort</span>'+
          '<input type="password" id="g_pw" autocomplete="current-password" autofocus required></label>'+
        '<div class="note warnbox" id="g_err" hidden></div>'+
        '<div><button class="btn" type="submit" id="g_btn">Daten anzeigen</button></div>'+
      '</form>'+
      '<div class="muted" style="font-size:12.5px">Das Entschlüsseln dauert einen Moment – '+
      'die Schlüsselableitung ist absichtlich rechenintensiv, damit Passwörter nicht durchprobiert werden können.</div>'+
    '</div>';
    app.appendChild(card);

    var form=card.querySelector("#gateform"),
        pw=card.querySelector("#g_pw"),
        err=card.querySelector("#g_err"),
        btn=card.querySelector("#g_btn");

    form.onsubmit=function(ev){
      ev.preventDefault();
      err.hidden=true; btn.disabled=true; btn.textContent="Entschlüsseln …";
      entschluessle(pw.value).then(function(daten){
        try{ sessionStorage.setItem("ukt_pw",pw.value); }catch(e){}
        start(daten);
      },function(){
        btn.disabled=false; btn.textContent="Daten anzeigen";
        err.textContent="Das Passwort passt nicht.";
        err.hidden=false; pw.select();
      });
    };
  }

  if(window.LIDL_DB){ start(window.LIDL_DB); return; }           // unverschlüsselt ausgeliefert
  if(!window.LIDL_ENC){ start({standorte:[],positionen:[],meta:{}}); return; }
  if(!window.crypto || !window.crypto.subtle){
    app.innerHTML='<div class="card"><div class="pad"><h2>Nicht entschlüsselbar</h2>'+
      '<div class="sub">Dieser Browser stellt keine Verschlüsselungsfunktionen bereit. '+
      'Das passiert, wenn die Seite ohne HTTPS aufgerufen wird.</div></div></div>';
    if(tabs) tabs.hidden=true; if(qrbtn) qrbtn.hidden=true; if(stand) stand.hidden=true;
    return;
  }

  /* innerhalb derselben Browser-Sitzung nicht erneut fragen */
  var gemerkt=null;
  try{ gemerkt=sessionStorage.getItem("ukt_pw"); }catch(e){}
  if(gemerkt){
    schirm();
    entschluessle(gemerkt).then(start,function(){ try{ sessionStorage.removeItem("ukt_pw"); }catch(e){} });
  } else {
    schirm();
  }
})();
</script>
