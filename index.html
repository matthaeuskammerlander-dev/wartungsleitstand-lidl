<!DOCTYPE html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wartungsleitstand Lidl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1F4F5; --surface:#FFFFFF; --surface-2:#E7ECEE; --surface-3:#DCE3E6;
  --ink:#0F1A20; --ink-2:#3C4D56; --ink-3:#6B7E88;
  --line:#D3DBDF; --line-2:#BFCBD1;
  --accent:#0E6E85; --accent-ink:#0A5566; --accent-soft:#D9EBF0;
  --crit:#B3342A; --crit-soft:#F7E2E0;
  --warn:#B6740F; --warn-soft:#FAEDD8;
  --good:#2C7A56; --good-soft:#DDEEE5;
  --plan:#41697E; --plan-soft:#E2EAEE;
  --shadow:0 1px 2px rgba(15,26,32,.06), 0 6px 18px rgba(15,26,32,.05);
  --r:10px;
  --f-disp:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0B1114; --surface:#141D22; --surface-2:#1C272D; --surface-3:#25333A;
  --ink:#E4EDF1; --ink-2:#AFC1C9; --ink-3:#83969F;
  --line:#26343B; --line-2:#33454D;
  --accent:#43ACC4; --accent-ink:#8FD4E2; --accent-soft:#12303A;
  --crit:#E86A5E; --crit-soft:#3A1C19;
  --warn:#E0A241; --warn-soft:#38290F;
  --good:#5CB98C; --good-soft:#14301F;
  --plan:#8AAAB9; --plan-soft:#1B2A31;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --ground:#0B1114; --surface:#141D22; --surface-2:#1C272D; --surface-3:#25333A;
  --ink:#E4EDF1; --ink-2:#AFC1C9; --ink-3:#83969F;
  --line:#26343B; --line-2:#33454D;
  --accent:#43ACC4; --accent-ink:#8FD4E2; --accent-soft:#12303A;
  --crit:#E86A5E; --crit-soft:#3A1C19;
  --warn:#E0A241; --warn-soft:#38290F;
  --good:#5CB98C; --good-soft:#14301F;
  --plan:#8AAAB9; --plan-soft:#1B2A31;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
/* ausserhalb von Claude fehlt das Host-Reset, deshalb hier selbst */
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* ---- header ---- */
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:9px;min-width:0}
/* Firmenlogo: weißer Grund, damit es auch im dunklen Modus wie gedruckt aussieht */
.logo{height:38px;width:auto;flex:none;display:block;background:#fff;border-radius:4px}
@media (max-width:600px){ .logo{height:30px} }
.mark b{font-family:var(--f-disp);font-size:19px;font-weight:700;letter-spacing:.02em}
.mark span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
/* auf dem Handy zaehlt jede Zeile – der Zusatz im Kopf entfaellt dort */
@media (max-width:560px){
  .mark span{display:none}
  .mark b{font-size:17px}
  .hbar{gap:8px;padding-block:8px}
  .stand{font-size:11px;white-space:normal}
  nav.tabs button{padding:10px 11px;font-size:14px}
}
.hspace{flex:1 1 auto}
.stand{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);
  font-family:var(--f-disp);font-size:14.5px;font-weight:600;letter-spacing:.02em;padding:11px 13px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

/* ---- filter row ---- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;font-family:var(--f-body);font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#06171C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#06171C}}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="search"],input[type="text"],input[type="date"],input[type="time"],input[type="number"],select,textarea{
  font-family:var(--f-body);font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.search{flex:1 1 200px;min-width:160px;max-width:320px}

/* ---- cards / layout ---- */
main{padding-block:4px 48px}
section.view{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.pad{padding:16px}
.card h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.card .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:grid;gap:2px}
.kpi .n{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.kpi.crit{border-left:3px solid var(--crit)} .kpi.crit .n{color:var(--crit)}
.kpi.warn{border-left:3px solid var(--warn)} .kpi.warn .n{color:var(--warn)}
.kpi.good{border-left:3px solid var(--good)} .kpi.good .n{color:var(--good)}
.kpi.plan{border-left:3px solid var(--plan)}

/* ---- status pills ---- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.p-ueberfaellig{background:var(--crit-soft);color:var(--crit)}
.p-faellig{background:var(--warn-soft);color:var(--warn)}
.p-geplant{background:var(--plan-soft);color:var(--plan)}
.p-erledigt{background:var(--good-soft);color:var(--good)}
.p-unbekannt{background:var(--surface-2);color:var(--ink-3)}
.p-pausiert{background:var(--surface-2);color:var(--ink-3);font-style:italic}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.st{background:var(--crit-soft);color:var(--crit);font-weight:600}
.tag.f30{background:var(--accent-soft);color:var(--accent-ink);font-family:var(--f-mono)}

/* ---- due list ---- */
.rows{display:grid}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:start;
  padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;
  text-align:left;font:inherit;color:inherit;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .when{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);min-width:62px;text-align:right;padding-top:2px}
.row .body{min-width:0}
.row .ttl{display:block;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.row .meta{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.row .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:560px){
  .row{grid-template-columns:1fr auto;padding:12px}
  .row .when{grid-column:1;text-align:left;min-width:0}
  .row .right{grid-row:1;grid-column:2}
  .row .body{grid-column:1/-1}
}

/* ---- charts ---- */
.smallmult{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.chart-t{font-family:var(--f-disp);font-size:13.5px;font-weight:600;letter-spacing:.03em}
.chart-s{font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{font-family:var(--f-body)}
svg.chart text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--ground);
  font-size:12px;line-height:1.35;padding:7px 9px;border-radius:7px;max-width:240px;box-shadow:var(--shadow);display:none}
#tip b{font-family:var(--f-disp);font-size:12.5px}

/* ---- map ---- */
.mapwrap{position:relative}
svg.map{display:block;width:100%;height:auto}
.map .outline{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.2;stroke-linejoin:round}
.map .cityt{font-family:var(--f-body);font-size:11px;fill:var(--ink-3);letter-spacing:.04em;
  paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.map .dot{stroke:var(--surface);stroke-width:1.6;cursor:pointer}
.map .dot:hover{stroke:var(--ink);stroke-width:2}
.map .dot.sel{stroke:var(--ink);stroke-width:2.5}
.map .dim{opacity:.18}

/* ---- detail ---- */
.detail{display:grid;gap:12px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;align-items:baseline}
.dl dt{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.dl dd{margin:0}
.timeline{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tl{font-family:var(--f-mono);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.tl.cur{background:var(--good-soft);color:var(--good);font-weight:500}

/* ---- accordion ---- */
details.st{border-top:1px solid var(--line)}
details.st:first-of-type{border-top:0}
details.st>summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
details.st>summary::-webkit-details-marker{display:none}
details.st>summary:hover{background:var(--surface-2)}
details.st[open]>summary{background:var(--surface-2)}
.st .inner{padding:4px 16px 16px;display:grid;gap:10px}
.posbox{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--ground)}

/* ---- form ---- */
form .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.fl{display:grid;gap:4px;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
label.fl>span.req::after{content:" *";color:var(--crit)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0;background:var(--surface)}
legend{font-family:var(--f-disp);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);padding-inline:6px}
.optrow{display:flex;gap:6px;flex-wrap:wrap}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt span{display:inline-block;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);cursor:pointer;user-select:none}
.opt input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.chk:hover{background:var(--surface-2)}
.chk input{margin:2px 0 0;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk span{min-width:0;overflow-wrap:anywhere}
.chk input:checked~span{font-weight:500}
.btn{appearance:none;font-family:var(--f-disp);font-size:14px;font-weight:600;letter-spacing:.03em;
  padding:10px 18px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
:root[data-theme="dark"] .btn{color:#06171C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06171C}}
.btn.ghost{background:var(--surface);color:var(--accent);}
.btn.sm{font-size:12.5px;padding:6px 12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mangelrow{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:8px;align-items:end}
@media (max-width:640px){.mangelrow{grid-template-columns:1fr}}
canvas.sig{width:100%;height:150px;border:1px dashed var(--line-2);border-radius:8px;background:var(--surface);touch-action:none;display:block}
.note{font-size:12.5px;color:var(--ink-3);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.note.warnbox{background:var(--warn-soft);color:var(--warn)}
/* ---- QR-Overlay ---- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(9,15,18,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);
  width:min(400px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px}
.overlay h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
/* QR immer dunkel auf hell – helle Module auf dunklem Grund lesen viele Scanner nicht */
.qrframe{background:#fff;border-radius:10px;padding:14px;display:flex;justify-content:center}
.qrframe canvas{display:block;width:100%;height:auto;max-width:280px;image-rendering:pixelated}
.qrurl{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);overflow-wrap:anywhere;background:var(--surface-2);padding:9px 11px;border-radius:8px}
.btn.icon{padding:6px 10px;font-size:12.5px}
/* ---- Druckansicht: immer hell, wie ein Blatt Papier ---- */
.qrscan{position:fixed;inset:0;z-index:120;background:rgba(10,14,18,.94);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:16px}
.qrscan .qrbox{position:relative;width:min(88vw,420px);aspect-ratio:1;overflow:hidden;border-radius:14px;background:#000}
.qrscan video{width:100%;height:100%;object-fit:cover}
.qrscan .qrrahmen{position:absolute;inset:18%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.qrscan .qrtext{color:#fff;font-size:14px;text-align:center}
.assistent{position:fixed;inset:0;z-index:110;background:rgba(10,14,18,.55);display:flex;align-items:center;justify-content:center;padding:12px}
.as-karte{background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;
  border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
.as-kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.as-titel{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.as-schritt{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.as-inhalt{padding:16px;overflow:auto;display:grid;gap:16px;flex:1;align-content:start}
.as-frage{font-size:15px;font-weight:600}
.as-feld{display:grid;gap:8px}
.as-label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.as-feld .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.as-feld .chip{font-size:14px;padding:9px 14px}
.as-hinweis{font-size:12.5px;color:var(--warn)}
.as-fuss{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.as-gruppe{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.as-gkopf{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.as-zeile{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.as-zeile span{color:var(--ink-3)}
.as-zeile strong{text-align:right;overflow-wrap:anywhere}
.as-offen{color:var(--warn)}
.akarte{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--ground)}
@media (max-width:600px){ .assistent{padding:0} .as-karte{border-radius:0;height:100%} }
.modus{display:inline-flex;align-self:flex-start;justify-self:start;width:max-content;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.modus button{border:0;background:transparent;color:inherit;font:inherit;font-weight:600;padding:9px 18px;cursor:pointer}
.modus button[aria-pressed="true"]{background:var(--accent);color:#fff}
#druckansicht{position:fixed;inset:0;z-index:95;overflow:auto;background:#5b6770;padding:16px}
#druckansicht .druckleiste{position:sticky;top:0;z-index:2;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
  max-width:820px;margin:0 auto 12px}
#druckansicht .blatt{background:#fff;color:#111;max-width:820px;margin:0 auto;padding:28px 30px;border-radius:4px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);font:12.5px/1.45 "IBM Plex Sans","Segoe UI",Arial,sans-serif}
.blatt h1{font:700 19px/1.2 "IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.04em;margin:14px 0 2px}
.blatt h2{font:700 11.5px/1.2 "IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:#0E6E85;border-bottom:1.5px solid #0E6E85;padding-bottom:3px;margin:16px 0 8px}
.blatt .kopf{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #111;padding-bottom:10px}
.blatt .firma b{display:block;font:700 17px/1.15 "IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.06em}
.blatt .firma span{font-size:11px;color:#444}
.blatt .firma img{height:58px;width:auto;display:block}
.blatt .kontakt{font-size:10.5px;color:#444;text-align:right}
.blatt table{width:100%;border-collapse:collapse}
.blatt td,.blatt th{padding:4px 6px;border:1px solid #c9cfd3;vertical-align:top;text-align:left}
.blatt th{background:#eef2f4;font-weight:600;font-size:11px}
.blatt td.k{width:34%;color:#444;background:#f7f9fa}
.blatt .kaestchen{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 16px}
.blatt .kaestchen div{white-space:normal}
.blatt .fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.blatt .fotos figure{margin:0;break-inside:avoid}

function starteWartungsleitstand(){
"use strict";
var DB = window.LIDL_DB || {standorte:[],positionen:[],meta:{}};

/* ALLE_ST / ALLE_POS: jeder Datensatz, auch deaktivierte und von Hand angelegte.

var ST = ALLE_ST, POS = ALLE_POS;
var byId = {}, posById = {};

/* Was sich in der Verwaltung ändern lässt. Der Excel-Stand wird beim Start
   gemerkt, damit jede Änderung zurückgesetzt werden kann. */

                        "regelung","regelungFirma","regelungFirmaName","fernzugriff","hersteller","modell","seriennummer","vorOrtNeu",

function auswahl(o, felder){
  var r={}; felder.forEach(function(k){ r[k]=(o[k]===undefined?null:o[k]); }); return r;
}
var EXCEL = {};
ALLE_ST.forEach(function(s){ s.aktiv=(s.aktiv!==false); EXCEL["standort:"+s.id]=auswahl(s,STAMM_FELDER_ST.concat(["genauigkeit"])); });
ALLE_POS.forEach(function(p){
  p.aktiv=(p.aktiv!==false);
  EXCEL["position:"+p.id]=auswahl(p,STAMM_FELDER_POS.concat(ABGELEITET_POS));
});

function indexNeuAufbauen(){
  byId={}; posById={};
  ALLE_ST.forEach(function(s){ byId[s.id]=s; s.pos=[]; s.pausiertePos=[]; });
  ALLE_POS.forEach(function(p){ posById[p.id]=p; });
  anlagenBilden();
  /* „zur Zeit nicht gewartet“ gilt für die ganze Anlage (steht an ihrer ersten Zeile):
     bleibt sichtbar, zählt aber für keine Fälligkeit */
  ALLE_POS.forEach(function(p){
    if(!p.aktiv || !byId[p.standortId]) return;
    (anlagePausiert(p) ? byId[p.standortId].pausiertePos : byId[p.standortId].pos).push(p);
  });
  ST = ALLE_ST.filter(function(s){ return s.aktiv; });

    s.baujahrBis=bj.length?Math.max.apply(null,bj):null;
    s.ueber30kg=s.pos.some(function(p){ return p.ueber30kg; });

/* ---------- Anlagen und ihre Termine ----------
   Die Excel-Liste hat je Wartungstermin eine Zeile – eine Anlage mit
   Jahres- und Halbjahreswartung steht also zweimal drin. Hier werden die
   Zeilen wieder zu Anlagen zusammengefasst: Zeilen desselben Markts, deren
   Termine rund ein halbes Jahr auseinanderliegen, gehören zusammen (zuerst
   bei gleichem Namen, sonst wenn genau zwei übrig sind). Zeilen mit gleichem
   Termin sind echte Doppel und bleiben getrennt. In der Verwaltung lässt sich
   jede Zuordnung von Hand festlegen (Feld anlageZu).
   Die erste Zeile einer Anlage – bevorzugt die Jahreswartung – trägt deren
   Anlagendaten und den Status. */
var ANLAGEN={};
function slotMonat(p){
  var iv=intervallArt(p.intervallCode), halb=/^HJ/.test(iv.kurz);
  if(p.inbetriebnahme && !iv.unklar) return +plusMonate(p.inbetriebnahme, halb?6:12).slice(5,7);
  return +p.monat||0;
}
function anlagenBilden(){
  ANLAGEN={};
  var jeMarkt={};
  ALLE_POS.forEach(function(p){
    p.anlageId=null;
    if(p.aktiv && p.standortId) (jeMarkt[p.standortId]=jeMarkt[p.standortId]||[]).push(p);
  });
  var halb=function(p){ return /^HJ/.test(intervallArt(p.intervallCode).kurz); };
  var norm=function(p){ return String(p.anlagentyp||"").toLowerCase().replace(/[^a-z0-9äöüß]/g,""); };
  Object.keys(jeMarkt).forEach(function(sid){
    var ps=jeMarkt[sid];
    /* 1. von Hand festgelegt */
    ps.forEach(function(p){ if(p.anlageZu===p.id) p.anlageId=p.id; });
    ps.forEach(function(p){
      if(!p.anlageZu || p.anlageZu===p.id) return;
      var z=posById[p.anlageZu];
      if(z && z.standortId===sid && z.aktiv){ if(!z.anlageId) z.anlageId=z.id; p.anlageId=z.anlageId; }
    });
    /* 2. automatisch */
    var frei=ps.filter(function(p){ return !p.anlageId; });
    var passt=function(a,b){
      var m1=slotMonat(a), m2=slotMonat(b);
      if(m1 && m2){ var d=Math.abs(m1-m2); d=Math.min(d,12-d); if(d<4) return false; if(d>=5) return true; }
      return halb(a)!==halb(b);
    };
    var paaren=function(bed){
      frei.forEach(function(a){
        if(a.anlageId) return;
        var b=frei.filter(function(x){ return x!==a && !x.anlageId && passt(a,x) && bed(a,x); })[0];
        if(!b) return;
        var chef=(halb(a)&&!halb(b))?b:a;
        a.anlageId=b.anlageId=chef.id;
      });
    };
    paaren(function(a,b){ return norm(a)===norm(b); });
    if(frei.filter(function(p){ return !p.anlageId; }).length===2) paaren(function(){ return true; });
  });
  ALLE_POS.forEach(function(p){
    if(!p.anlageId) p.anlageId=p.id;
    (ANLAGEN[p.anlageId]=ANLAGEN[p.anlageId]||{id:p.anlageId, termine:[]}).termine.push(p);
  });
  Object.keys(ANLAGEN).forEach(function(k){
    var a=ANLAGEN[k];
    a.leader=posById[k]||a.termine[0];
    /* Jahreswartung zuerst, dann die Halbjahrestermine */
    a.termine.sort(function(x,y){ return (halb(x)?1:0)-(halb(y)?1:0); });
  });
}
function anzahlAnlagen(){ var m={}; POS.forEach(function(p){ m[p.anlageId]=1; }); return Object.keys(m).length; }
/* Anlagen eines Markts in Reihenfolge, je mit ihren (aktiven) Terminen */
function anlagenDesMarkts(s, auchPausiert){
  var m={}, liste=[];
  s.pos.concat(auchPausiert?s.pausiertePos:[]).forEach(function(p){
    var a=anlageVon(p);
    if(!m[a.id]){ m[a.id]={id:a.id, leader:a.leader, termine:[]}; liste.push(m[a.id]); }
    m[a.id].termine.push(p);
  });
  return liste;
}
function anlageVon(p){ return p ? ANLAGEN[p.anlageId] || {id:p.id, leader:p, termine:[p]} : null; }
function anlageLeader(p){ return anlageVon(p).leader; }
function anlagePausiert(p){ var l=anlageLeader(p); return !!(l && l.pausiert); }
/* Anlagendaten einer Anlage: erste Zeile zuerst, Lücken aus den anderen Zeilen */
var ANLAGE_DATEN_KEYS=null;
function anlageDaten(p){

    if(!leerWert(r[k])) return;
    for(var i=0;i<a.termine.length;i++){ if(!leerWert(a.termine[i][k])){ r[k]=a.termine[i][k]; break; } }
  });
  return r;
}
/* „Jahreswartung 17.06. · Halbjahreswartung 17.12.“ */
function termineText(p){
  return anlageVon(p).termine.filter(function(t){ return t.aktiv; }).map(function(t){

  }).join(" · ");
}

/* ---------- Fälligkeit ----------
   Regeln von Kammerlander:
     JW  = Jahreswartung
     HJW = Halbjahreswartung   (vorgeschrieben ab 30 kg Kältemittel)
     HJI = Halbjahresinspektion
   Jeder Markt wird alle 6 Monate besucht.

   Aufbau der Liste: jede Zeile ist ein Besuchstermin, der JEDES JAHR im
   selben Monat wiederkehrt. Den Halbjahresrhythmus ergeben zwei Zeilen im
   Abstand von 6 Monaten – typisch JW im Jänner und HJI im Juli. Eine
   einzelne Zeile ist deshalb nach 12 Monaten wieder fällig; das Kürzel
   sagt, WAS gemacht wird, nicht wie oft. Die Halbjahresregel wird auf
   Marktebene geprüft – sie fängt auch Märkte mit nur einer Zeile. */
var ZEILEN_INTERVALL = 12;
var MARKT_INTERVALL = 6;

   ist kein Wartungsnachweis. */
var ZAEHLT_ALS_WARTUNG = ["planmäßig","Prüfung"];

function intervallArt(code){
  var c=String(code||"").trim().toUpperCase();
  if(c==="JW") return {art:"Jahreswartung", monate:ZEILEN_INTERVALL, kurz:"JW"};
  if(c==="HJW"||c==="HW") return {art:"Halbjahreswartung", monate:ZEILEN_INTERVALL, kurz:"HJW", wartung:true};
  if(c==="HJI"||c.indexOf("HI")===0) return {art:"Halbjahresinspektion", monate:ZEILEN_INTERVALL, kurz:"HJI"};
  return {art:"Besuch (Kürzel "+(c||"leer")+")", monate:ZEILEN_INTERVALL, kurz:c||"?", unklar:true};
}

   plus 12 Monate für die Jahreswartung, plus 6 Monate für die Halbjahres-
   termine – jedes Jahr am selben Tag. Ohne Inbetriebnahme bleibt der
   Soll-Monat der Liste (Monatsmitte) als Anker. */
function ankerFuer(p){
  var k=p.intervall.kurz, halb=(k==="HJW"||k==="HJI"||k==="HJ");
  if(p.inbetriebnahme && !p.intervall.unklar){
    var erster=plusMonate(p.inbetriebnahme, halb?6:12);
    return {monat:+erster.slice(5,7), tag:+erster.slice(8,10), erster:erster, quelle:"Inbetriebnahme"};
  }
  if(p.monat) return {monat:p.monat, tag:15, erster:null, quelle:"Soll-Monat"};
  return null;
}
function ankerIm(a, jahr){
  var letzter=new Date(jahr, a.monat, 0).getDate();
  return jahr+"-"+String(a.monat).padStart(2,"0")+"-"+String(Math.min(a.tag,letzter)).padStart(2,"0");
}

function plusMonate(iso, n){
  var t=iso.split("-"), j=+t[0], m=+t[1]-1+n, tag=+t[2];
  j+=Math.floor(m/12); m=((m%12)+12)%12;
  var letzter=new Date(j, m+1, 0).getDate();
  return j+"-"+String(m+1).padStart(2,"0")+"-"+String(Math.min(tag,letzter)).padStart(2,"0");
}
function tageBis(iso){
  var a=new Date(isoLokal(new Date())+"T00:00:00"), b=new Date(iso+"T00:00:00");
  return Math.round((b-a)/86400000);
}

var STATUS_LABEL={ueberfaellig:"überfällig",faellig:"fällig in "+VORLAUF_TAGE+" Tagen",
                  geplant:"im Plan",erledigt:"im Plan",unbekannt:"ohne Termin",pausiert:"zur Zeit nicht gewartet"};
var STATUS_RANK={ueberfaellig:0,faellig:1,unbekannt:2,geplant:3,erledigt:3,pausiert:4};
var STATUS_VAR={ueberfaellig:"--crit",faellig:"--warn",geplant:"--good",erledigt:"--good",unbekannt:"--ink-3",pausiert:"--ink-3"};

/* ---------- Technikernamen: eine Person, eine Schreibweise ----------
   Groß-/Kleinschreibung und Leerzeichen werden an den bekannten Namen
   angeglichen, bekannte Tippfehler zusätzlich über die Liste unten. Die
   Schreibweise aus der Excel-Liste hat Vorrang vor später getippten. */
var NAMEN_ALIAS={ datko:"Darko" };
var NAMEN_KANON={};
function baueNamenKanon(){
  var k={};
  var merke=function(n){
    n=String(n||"").trim();
    if(!n || /^\d+$/.test(n)) return;          /* Zahlen sind keine Namen (Datum in der falschen Spalte) */
    var l=n.toLowerCase();
    if(!k[l]) k[l]=NAMEN_ALIAS[l]||n;
  };
  ALLE_POS.forEach(function(p){
    Object.keys(p.techniker||{}).forEach(function(j){ String(p.techniker[j]).split(",").forEach(merke); });
  });
  (typeof alleProtokolle==="function" ? alleProtokolle() : []).forEach(function(pr){
    [pr.techniker, pr.nameTechniker].forEach(function(v){ String(v||"").split(",").forEach(merke); });
  });
  return k;
}
function kanonName(n){
  return String(n||"").split(",").map(function(t){
    t=t.trim(); var l=t.toLowerCase();
    return NAMEN_ALIAS[l] || NAMEN_KANON[l] || t;
  }).filter(Boolean).join(",");
}
function bekannteNamen(){
  var s={}; Object.keys(NAMEN_KANON).forEach(function(l){ s[NAMEN_KANON[l]]=1; });
  return Object.keys(s).sort(function(a,b){ return a.localeCompare(b,"de"); });
}

/* rechnet alle Fälligkeiten neu – beim Start und nach jedem Protokoll */
function berechneFaelligkeiten(){
  NAMEN_KANON = baueNamenKanon();
  var heute=isoLokal(new Date());
  var bald=isoLokal(new Date(Date.now()+VORLAUF_TAGE*86400000));

  /* Wartungsnachweise aus den Protokollen der App */
  var ausProtPos={}, ausProtMarkt={};
  (typeof alleProtokolle==="function" ? alleProtokolle() : []).forEach(function(pr){
    if(!pr.datum || ZAEHLT_ALS_WARTUNG.indexOf(pr.wartungsart)<0) return;
    if(pr.standortId) (ausProtMarkt[pr.standortId]=ausProtMarkt[pr.standortId]||[]).push(pr.datum);
    var ids = (pr.positionIds && pr.positionIds.length) ? pr.positionIds : (pr.positionId?[pr.positionId]:[]);
    ids.forEach(function(id){ (ausProtPos[id]=ausProtPos[id]||[]).push(pr.datum); });
  });

  POS.forEach(function(p){
    p.intervall=intervallArt(p.intervallCode);
    var termine=(p.historie||[]).concat(ausProtPos[p.id]||[]).filter(Boolean).sort();
    p.letzte=termine.length?termine[termine.length-1]:null;
    p.letzteAusApp=!!(ausProtPos[p.id]&&ausProtPos[p.id].indexOf(p.letzte)>=0);

    var a=ankerFuer(p);
    p.anker=a;
    if(!a){
      /* kein fester Termin bestimmbar – dann ab der letzten Wartung */
      p.naechste = p.letzte ? plusMonate(p.letzte, ZEILEN_INTERVALL) : null;
      p.status = !p.naechste ? "unbekannt" : p.naechste<heute ? "ueberfaellig" : p.naechste<bald ? "faellig" : "erledigt";
      p.erledigtDurch=null;
      return;
    }

    /* Jeder Termin hat ein Fenster von einem halben Jahr davor bis einem
       halben Jahr danach. Die Fenster aufeinanderfolgender Jahre stoßen
       aneinander, jede Wartung gehört also genau zu einem Termin. */
    var erledigtFuer=function(termin){
      var von=plusMonate(termin,-6), bis=plusMonate(termin,6);
      for(var i=termine.length-1;i>=0;i--){ if(termine[i]>von && termine[i]<=bis) return termine[i]; }
      return null;
    };

    /* aktueller Termin = der letzte, der spätestens in VORLAUF_TAGE Tagen ansteht */
    var j=+bald.slice(0,4), aktuell=ankerIm(a,j);
    if(aktuell>bald) aktuell=ankerIm(a,j-1);

    if(a.erster && aktuell<a.erster){
      /* noch keine Wartung fällig seit Inbetriebnahme */
      p.naechste=a.erster; p.erledigtDurch=null; p.status="erledigt";
      return;
    }
    var durch=erledigtFuer(aktuell);
    var folge=ankerIm(a,+aktuell.slice(0,4)+1);
    var vorgezogen=erledigtFuer(folge);
    p.ausgelassen=null;

    if(vorgezogen){
      /* Für den kommenden Termin schon gewartet. Ein davor versäumter Termin
         lässt sich nicht mehr nachholen – er wird vermerkt, aber nicht mehr
         als überfällig gezählt. */
      if(!durch) p.ausgelassen=aktuell;
      p.naechste=ankerIm(a,+folge.slice(0,4)+1);
      p.erledigtDurch=vorgezogen;
      p.status = p.naechste<bald ? "faellig" : "erledigt";
      return;
    }
    if(!durch){
      p.naechste=aktuell; p.erledigtDurch=null;
      p.status = aktuell<heute ? "ueberfaellig" : "faellig";
      return;
    }
    /* erledigt – als nächstes steht derselbe Tag im Folgejahr an */
    p.naechste=folge;
    p.erledigtDurch=durch;
    p.status = folge<bald ? "faellig" : "erledigt";
  });

  ST.forEach(function(s){
    /* nur Anlagen, die zur Zeit nicht gewartet werden: der Markt ist nicht fällig */
    if(!s.pos.length && s.pausiertePos.length){
      s.letzterBesuch=null; s.naechsterBesuch=null; s.marktStatus="pausiert"; s.status="pausiert"; s.offen=0;
      return;
    }
    var besuche=[];
    s.pos.forEach(function(p){ if(p.letzte) besuche.push(p.letzte); });
    (ausProtMarkt[s.id]||[]).forEach(function(d){ besuche.push(d); });
    besuche.sort();
    s.letzterBesuch = besuche.length ? besuche[besuche.length-1] : null;
    s.naechsterBesuch = s.letzterBesuch ? plusMonate(s.letzterBesuch, MARKT_INTERVALL) : null;
    s.marktStatus = !s.naechsterBesuch ? "unbekannt"
                  : s.naechsterBesuch < heute ? "ueberfaellig"
                  : s.naechsterBesuch < bald ? "faellig" : "erledigt";
    /* der schlechtere von Positionen und Halbjahresregel zählt */
    var st=s.pos.reduce(function(a,p){ return STATUS_RANK[p.status]<STATUS_RANK[a]?p.status:a; },"erledigt");
    if(STATUS_RANK[s.marktStatus]<STATUS_RANK[st]) st=s.marktStatus;
    s.status=st;
    s.offen=s.pos.filter(function(p){ return p.status==="ueberfaellig"||p.status==="faellig"; }).length;
  });
}
berechneFaelligkeiten();

/* ---------- Helper ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
/* toISOString rechnet in UTC – vor 2 Uhr früh käme sonst der Vortag heraus */
function isoLokal(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dfmt(iso){ if(!iso) return "–"; var p=iso.split("-"); return p[2]+"."+p[1]+"."+p[0]; }
function el(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* Wie UKT einen Markt nennt: „Seekirchen“, in Orten mit mehreren Märkten
   „Wien Jedletzbergerstraße“. Eine in der Verwaltung vergebene Bezeichnung
   geht vor; die Filialnummer ist nur Zusatz. */
function eigenerName(s){
  var n=String(s.name||"").trim();
  if(!n || /^Filiale\s/i.test(n) || n===String(s.adresse||"").trim()) return "";
  return n;
}
function stName(s){
  if(!s) return "";
  return eigenerName(s) || s.autoName || (s.filiale ? "Filiale "+s.filiale : (s.name||s.adresse||""));
}
/* Name eines Protokolls: immer der aktuelle Name des Marktes, damit
   eine spätere Umbenennung auch alte Protokolle erfasst */
function protoName(p){
  var s=p&&p.standortId&&byId[p.standortId];
  return s ? stName(s) : ((p&&(p.standortName||p.adresse))||"");
}
function strasseAus(s){
  var a=String(s.adresse||"").trim().replace(/^\d{4}\s*/,"");
  if(s.ort && a.toLowerCase().indexOf(s.ort.toLowerCase())===0) a=a.slice(s.ort.length);
  a=a.replace(/^[\s,]+/,"")
     .replace(/[\s,]*\d.*$/,"")                    /* Hausnummer und alles danach */
     .replace(/\.G\.?$/,"-Gasse")                   /* Christian-Bucher.G. */
     .replace(/([a-zäöüß])str\.?$/i,"$1straße")     /* Heinestr. */
     .replace(/(^|[\s-])Str\.?$/,"$1Straße")        /* Triester Str., August-Jacksch-Str. */
     .replace(/strasse$/i,"straße")
     .replace(/([a-zäöüß])g\.$/i,"$1gasse")         /* Zieglerg. */
     .replace(/[\s,.]+$/,"");
  return a;
}
function autoNamenVergeben(){
  var jeOrt={};
  ALLE_ST.forEach(function(s){ if(s.ort){ var k=s.ort.toLowerCase(); jeOrt[k]=(jeOrt[k]||0)+1; } });
  ALLE_ST.forEach(function(s){
    if(!s.ort){ s.autoName=s.filiale?String(s.adresse||"").trim():""; return; }
    var str=jeOrt[s.ort.toLowerCase()]>1 ? strasseAus(s) : "";
    s.autoName=s.ort+(str?" "+str:"");
  });
  /* gleiche Namen (z. B. zwei Märkte an einer Adresse): Filialnummer dazu.
     Verglichen wird ohne Schreibweise – „Johann Federer Str.“ = „Johann-Federer-Straße“ */
  var schluessel=function(n){ return String(n||"").toLowerCase().replace(/strasse|straße|str\b/g,"str").replace(/[^a-z0-9äöüß]/g,""); };
  var zahl={};
  ALLE_ST.forEach(function(s){ var k=schluessel(stName(s)); zahl[k]=(zahl[k]||0)+1; });
  ALLE_ST.forEach(function(s){
    if(!eigenerName(s) && s.autoName && zahl[schluessel(s.autoName)]>1 && s.filiale) s.autoName+=" (Fil. "+s.filiale+")";
  });
}

/* ---------- Tourenplanung ---------- */
var ARBEIT_H = 1.25;        // Richtwert je Wartungsposition
var TEMPO_KMH = 70;         // Reisegeschwindigkeit im Mittel
var UMWEG = 1.3;            // Zuschlag Luftlinie -> Straße
var BETRIEB = { id:"__betrieb", name:"Betrieb St. Johann i. T.",
  adresse:"Speckbacherstraße 92, 6380 St. Johann in Tirol", lat:47.51712, lon:12.41888 };

function luftlinie(a,b){
  var R=6371, t=Math.PI/180;
  var dLat=(b.lat-a.lat)*t, dLon=(b.lon-a.lon)*t;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function fahrKm(a,b){ return luftlinie(a,b)*UMWEG; }
function fahrH(a,b){ return fahrKm(a,b)/TEMPO_KMH; }

/* ---------- Straßenrouting über OSRM (frei, ohne Schlüssel) ---------- */
var ROUTER = [
  "https://routing.openstreetmap.de/routed-car",   // FOSSGIS, betreibt auch osm.org
  "https://router.project-osrm.org"                // Ausweichdienst
];
var routerBasis = null;
var ROUTER_MAX = 90;   // Grenze der öffentlichen Matrix-Schnittstelle

function osrm(pfad){
  var kandidaten = routerBasis
    ? [routerBasis].concat(ROUTER.filter(function(b){ return b!==routerBasis; }))
    : ROUTER.slice();
  var i=0;
  function versuch(){
    if(i>=kandidaten.length) return Promise.resolve(null);
    var basis=kandidaten[i++];
    return fetch(basis+pfad)
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if(j && j.code==="Ok"){ routerBasis=basis; return j; } return versuch(); })
      .catch(function(){ return versuch(); });
  }
  return versuch();
}
function koordListe(punkte){
  return punkte.map(function(p){ return p.lon.toFixed(5)+","+p.lat.toFixed(5); }).join(";");
}
function strassenMatrix(punkte){
  if(punkte.length<2 || punkte.length>ROUTER_MAX) return Promise.resolve(null);
  return osrm("/table/v1/driving/"+koordListe(punkte)+"?annotations=duration,distance")
    .then(function(j){
      if(!j || !j.durations || !j.distances) return null;
      return {dauer:j.durations, distanz:j.distances};
    });
}
function strassenGeometrie(punkte){
  if(punkte.length<2 || punkte.length>ROUTER_MAX) return Promise.resolve(null);
  return osrm("/route/v1/driving/"+koordListe(punkte)+"?overview=full&geometries=geojson")
    .then(function(j){
      if(!j || !j.routes || !j.routes[0]) return null;
      return j.routes[0].geometry.coordinates;   // [[lon,lat], ...]
    });
}

/* Nächster Nachbar, danach 2-opt gegen die schlimmsten Überkreuzungen.
   Gerechnet wird auf Fahrzeiten, nicht auf Entfernungen – über die
   Autobahn ist der längere Weg oft der schnellere. */
function reihenfolgeIdx(kosten, n){
  var offen=[]; for(var i=1;i<n;i++) offen.push(i);
  var weg=[], hier=0;
  while(offen.length){
    var best=0, bestD=Infinity;
    for(var k=0;k<offen.length;k++){ var d=kosten(hier,offen[k]); if(d<bestD){ bestD=d; best=k; } }
    hier=offen[best]; weg.push(hier); offen.splice(best,1);
  }
  var knoten=[0].concat(weg);
  var laenge=function(kn){ var s=0; for(var i=0;i<kn.length-1;i++) s+=kosten(kn[i],kn[i+1]); return s; };
  var aktuell=laenge(knoten), verbessert=true, runden=0;
  while(verbessert && runden<80){
    verbessert=false; runden++;
    for(var a=1;a<knoten.length-1;a++){
      for(var b=a+1;b<knoten.length;b++){
        var neu=knoten.slice(0,a).concat(knoten.slice(a,b+1).reverse(), knoten.slice(b+1));
        var l=laenge(neu);
        if(l+1e-9 < aktuell){ knoten=neu; aktuell=l; verbessert=true; }
      }
    }
  }
  return knoten.slice(1);
}

/* liefert ein Promise, weil die Fahrzeiten vom Routendienst kommen */
function planeTour(opt){
  var start = opt.start;
  var stopps = opt.stopps;                 // [{standort, positionen:[...]}]
  if(!stopps.length) return Promise.resolve(null);
  var punkte=[start].concat(stopps.map(function(s){ return s.standort; }));

  return strassenMatrix(punkte).then(function(M){
    var echteStrasse = !!M;
    var dauerH = M ? function(i,j){ return M.dauer[i][j]/3600; }
                   : function(i,j){ return fahrH(punkte[i],punkte[j]); };
    var distKm = M ? function(i,j){ return M.distanz[i][j]/1000; }
                   : function(i,j){ return fahrKm(punkte[i],punkte[j]); };

    var folge = reihenfolgeIdx(dauerH, punkte.length);
    var tage=[], tag=null, hierIdx=0, kmGesamt=0;

    for(var n=0;n<folge.length;n++){
      var zielIdx=folge[n];
      var eintrag=stopps[zielIdx-1];
      var fahrt=dauerH(hierIdx,zielIdx), km=distKm(hierIdx,zielIdx);
      var arbeit=eintrag.positionen.length*ARBEIT_H;
      if(!tag || (tag.stunden + fahrt + arbeit) > opt.stundenProTag){
        if(tag) tage.push(tag);
        /* ein neuer Tag beginnt dort, wo der vorige endete (Übernachtung) */
        tag={nr:tage.length+1, stunden:0, km:0, stopps:[], startPunkt:punkte[hierIdx]};
      }
      tag.stunden += fahrt + arbeit;
      tag.km += km; kmGesamt += km;
      tag.stopps.push({standort:punkte[zielIdx], positionen:eintrag.positionen,
                       fahrtH:fahrt, km:km, arbeitH:arbeit});
      hierIdx=zielIdx;
    }
    if(tag) tage.push(tag);

    var rueck = tage.length ? dauerH(hierIdx,0) : 0;
    var rueckKm = tage.length ? distKm(hierIdx,0) : 0;
    if(tage.length){ tage[tage.length-1].rueckfahrtH=rueck; tage[tage.length-1].rueckfahrtKm=rueckKm; }

    return { start:start, tage:tage,
      reihenfolge:folge.map(function(i){ return punkte[i]; }),
      echteStrasse:echteStrasse,
      kmGesamt:kmGesamt+rueckKm,
      stundenGesamt:tage.reduce(function(a,t){return a+t.stunden;},0)+rueck,
      anzahlStopps:folge.length,
      anzahlPositionen:stopps.reduce(function(a,s){return a+s.positionen.length;},0) };
  });
}

/* ---------- Google Maps: Navigation und Routenübergabe ---------- */
function gmapsPunkt(p){
  /* echte Adresse navigiert zuverlässiger als eine Koordinate,
     aber nur wenn sie vollständig genug ist */
  if(p.plz && p.adresse) return encodeURIComponent(p.adresse+", Österreich");
  return p.lat+","+p.lon;
}
function gmapsZiel(p){
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+gmapsPunkt(p);
}
/* Google nimmt über die URL höchstens neun Zwischenziele entgegen */
var GMAPS_MAX_WAYPOINTS=9;
function gmapsRoute(punkte){
  if(punkte.length<2) return null;
  var start=punkte[0], ziel=punkte[punkte.length-1];
  var zwischen=punkte.slice(1,-1).slice(0,GMAPS_MAX_WAYPOINTS);
  var u="https://www.google.com/maps/dir/?api=1&travelmode=driving"+
    "&origin="+gmapsPunkt(start)+"&destination="+gmapsPunkt(ziel);
  if(zwischen.length) u+="&waypoints="+zwischen.map(gmapsPunkt).join("%7C");
  return {url:u, gekuerzt: punkte.slice(1,-1).length > GMAPS_MAX_WAYPOINTS};
}
function tagPunkte(tag, mitRueckfahrt){
  var p=[tag.startPunkt].concat(tag.stopps.map(function(s){ return s.standort; }));
  if(mitRueckfahrt && tag.rueckfahrtH) p.push(S.tour.ergebnis.start);
  return p;
}

function stdFmt(h){
  var m=Math.round(h*60);
  return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+" h";
}
function uhrFmt(startMin, h){
  var m=Math.round(startMin+h*60);
  return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}

/* ---------- State ---------- */
var S={view:"faellig",region:"alle",q:"",sel:null,selPos:null,protoStandort:"",protoPos:"",
  tour:{status:["ueberfaellig","faellig"], stundenProTag:8, startId:"__gps",
        gps:null, gpsFehler:"", ergebnis:null, manuell:null, naechsterMonat:false}};
/* letzter Tag des Folgemonats – für „auch nächsten Monat mitnehmen“ */
function endeFolgemonat(){

/* Aktueller Standort des Technikers als Startpunkt */
function holeStandort(){
  return new Promise(function(fertig){
    if(!navigator.geolocation){ fertig({fehler:"Dieses Gerät meldet keine Position."}); return; }
    navigator.geolocation.getCurrentPosition(
      function(p){
        fertig({ lat:p.coords.latitude, lon:p.coords.longitude,
                 genauigkeit:p.coords.accuracy, zeit:Date.now() });
      },
      function(e){
        var txt="Position nicht verfügbar.";

    );

}

/* ---------- Chart: Fälligkeiten der kommenden 12 Monate je Region ---------- */
function faelligkeitsBand(region, positionen){
  var jetzt=new Date(), j0=jetzt.getFullYear(), m0=jetzt.getMonth();
  var ueber=positionen.filter(function(p){ return p.status==="ueberfaellig"; }).length;
  var bald=[], spaeter=[], labels=[];
  for(var i=0;i<12;i++){
    var m=(m0+i)%12, j=j0+Math.floor((m0+i)/12);
    var schluessel=j+"-"+String(m+1).padStart(2,"0");
    var imMonat=positionen.filter(function(p){
      return p.naechste && p.status!=="ueberfaellig" && p.naechste.slice(0,7)===schluessel;
    });
    bald.push(imMonat.filter(function(p){ return p.status==="faellig"; }).length);
    spaeter.push(imMonat.filter(function(p){ return p.status!=="faellig"; }).length);
    labels.push({kurz:MONATE[m+1], lang:MONATE_L[m+1]+" "+j});
  }
  return {region:region, ueber:ueber, bald:bald, spaeter:spaeter, labels:labels,
          max:Math.max.apply(null,[ueber].concat(bald.map(function(v,i){return v+spaeter[i];})))};
}
function bandSVG(band, maxV){
  /* 13 Spalten: überfällig, dann die nächsten 12 Monate ab heute */
  var W=330,H=112,padL=4,padR=4,padB=20,padT=10;
  var n=13, iw=W-padL-padR, bw=iw/n, gap=3, ih=H-padT-padB;
  var parts=[];
  parts.push('<line x1="'+padL+'" y1="'+(padT+ih)+'" x2="'+(W-padR)+'" y2="'+(padT+ih)+'" style="stroke:var(--line-2);stroke-width:1"/>');
  for(var k=0;k<n;k++){
    var x=padL+k*bw+gap/2, w=bw-gap, y=padT+ih, beschr, tip;
    if(k===0){
      var vu=band.ueber;
      if(vu>0){ var hu=Math.max(2,vu/maxV*ih); y-=hu;
        parts.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hu.toFixed(1)+'" rx="3" style="fill:var(--crit)"/>');
        parts.push('<text class="num" x="'+(x+w/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" text-anchor="middle" font-size="9.5" style="fill:var(--ink-2)">'+vu+"</text>"); }
      beschr="überf."; tip="<b>Überfällig</b><br>"+vu+" Position(en)";
    } else {
      var i=k-1, vb=band.bald[i], vs=band.spaeter[i];
      if(vs>0){ var hs=Math.max(2,vs/maxV*ih); y-=hs;
        parts.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hs.toFixed(1)+'" rx="2" style="fill:var(--plan)"/>'); }
      if(vb>0){ var hb=Math.max(2,vb/maxV*ih); y-=(hb+(vs>0?2:0));
        parts.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hb.toFixed(1)+'" rx="2" style="fill:var(--warn)"/>'); }
      if(vb+vs>0) parts.push('<text class="num" x="'+(x+w/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" text-anchor="middle" font-size="9.5" style="fill:var(--ink-2)">'+(vb+vs)+"</text>");
      beschr=band.labels[i].kurz;
      tip="<b>"+band.labels[i].lang+"</b><br>"+(vb+vs)+" Position(en) fällig"+(vb?" · davon "+vb+" in "+VORLAUF_TAGE+" Tagen":"");
    }
    parts.push('<rect class="hit" x="'+(padL+k*bw)+'" y="'+padT+'" width="'+bw+'" height="'+ih+'" style="fill:transparent;cursor:default" data-tip="'+esc(tip)+'"/>');
    parts.push('<text x="'+(padL+k*bw+bw/2).toFixed(1)+'" y="'+(padT+ih+13)+'" text-anchor="middle" font-size="9" style="fill:var('+(k===0?"--crit":"--ink-3")+')'+(k===0?";font-weight:600":"")+'">'+beschr+"</text>");
  }
  return '<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Fälligkeiten der nächsten 12 Monate, Region '+esc(band.region)+'">'+parts.join("")+"</svg>";
}
function wannText(p){
  if(!p.naechste) return {zeile:"—", zusatz:""};
  var t=tageBis(p.naechste);
  return {zeile:dfmt(p.naechste).replace(/\.(\d\d)(\d\d)$/,".$2"),
          zusatz: t<0 ? "seit "+(-t)+" T." : (t===0?"heute":"in "+t+" T.")};
}

/* Kandidaten für die Tour: Standorte, deren Positionen zu den gewählten
   Fälligkeiten passen – oder die die Halbjahresregel für den Markt reißen */
function tourKandidaten(){
  var raus=[];
  filtered().forEach(function(s){
    if(!s.lat) return;
    var bis=endeFolgemonat();
    var pos=s.pos.filter(function(p){
      var st = p.status==="geplant" ? "erledigt" : p.status;
      if(S.tour.status.indexOf(st)>=0) return true;
      /* auf Wunsch auch, was erst im nächsten Monat dran ist */
      return S.tour.naechsterMonat && p.naechste && p.naechste<=bis;
    });
    if(!pos.length && S.tour.status.indexOf(s.marktStatus)>=0){
      /* Anlagen einzeln im Plan, aber der Halbjahresbesuch ist fällig */
      pos=[{id:"markt_"+s.id, anlagentyp:"Halbjahresbesuch Markt", _markt:true}];
    }
    if(pos.length) raus.push({standort:s, positionen:pos});
  });
  return raus;
}
function tourRechnen(){
  var kandidaten=tourKandidaten();
  if(S.tour.manuell){
    var erlaubt={}; S.tour.manuell.forEach(function(id){ erlaubt[id]=1; });
    kandidaten=kandidaten.filter(function(k){ return erlaubt[k.standort.id]; });
  }
  var start=BETRIEB;
  if(S.tour.startId==="__gps"){
    if(S.tour.gps) start={ id:"__gps", name:"Aktueller Standort",
      adresse:"Position des Technikers", lat:S.tour.gps.lat, lon:S.tour.gps.lon };
    /* ohne Positionsfreigabe bleibt der Betrieb als Ausgangspunkt */
  } else if(byId[S.tour.startId] && byId[S.tour.startId].lat){
    start=byId[S.tour.startId];
  }
  S.tour.geometrie=null;
  return planeTour({start:start, stopps:kandidaten, stundenProTag:S.tour.stundenProTag})
    .then(function(erg){
      S.tour.ergebnis=erg;
      if(!erg || !erg.echteStrasse) return null;
      /* die tatsächlich gefahrene Linie für die Karte nachladen */
      return strassenGeometrie([erg.start].concat(erg.reihenfolge).concat([erg.start]))
        .then(function(g){ S.tour.geometrie=g; return g; });
    });
}

    d.addEventListener("click",function(){ sel(d.dataset.id); });
    d.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); sel(d.dataset.id); } });
    d.addEventListener("mousemove",function(e){ var s=byId[d.dataset.id];
      tipShow(e,"<b>"+esc(stName(s))+"</b><br>"+esc(s.adresse)+"<br>"+s.pos.length+" Position(en) · "+STATUS_LABEL[s.status]); });
    d.addEventListener("mouseleave",tipHide);
  });
  if(S.sel && byId[S.sel] && byId[S.sel].lat) sel(S.sel);
  f.appendChild(card);
  f.appendChild(tourPanel());

  if(noGeo.length) f.appendChild(ohneKarte(noGeo));
  return f;
}

function ohneKarte(noGeo){
  return el('<div class="card"><div class="pad stack">'+
    '<h2>Ohne Kartenposition</h2>'+
    '<div class="sub">Diese Einträge haben in der Liste keine auswertbare Adresse – meist Sammelzeilen oder Kurznamen.</div>'+
    '<div class="rowflex">'+noGeo.map(function(s){ return '<span class="tag">'+esc(s.name)+" ("+s.pos.length+")</span>"; }).join("")+"</div>"+
  "</div></div>");
}

/* ---------- Karte auf OpenStreetMap (Leaflet) ---------- */
var leafletKarte=null;
function tokenFarbe(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#0E6E85";
}
function karteOsm(withGeo){
  var T=S.tour.ergebnis;
  var card=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Standortkarte</h2><div class="sub">'+withGeo.length+' Standorte auf OpenStreetMap. '+
      'Punktgröße = Anzahl Wartungspositionen, Farbe = dringlichster Status. Antippen öffnet Details und die Navigation.</div></div>'+
    '<div class="legend">'+["ueberfaellig","faellig","erledigt"].map(function(k){
      return '<span><i style="background:var('+STATUS_VAR[k]+')"></i>'+STATUS_LABEL[k]+"</span>";
    }).join("")+"</div>"+
    '<div id="osmkarte" style="height:min(68vh,560px);width:100%;border-radius:10px;overflow:hidden;'+
      'border:1px solid var(--line);background:var(--surface-2)"></div>'+
    '<div class="rowflex"><button class="btn ghost sm" type="button" id="kartealle">Alle Standorte zeigen</button>'+
      '<span class="muted" style="font-size:12px">Ist Ihr Standort bekannt, öffnet die Karte in Ihrer Umgebung.</span></div>'+
    '<div id="mapdetail"></div>'+
  "</div></div>");

  /* Leaflet braucht den Container im Dokument, deshalb erst danach aufbauen */
  setTimeout(function(){
    var host=document.getElementById("osmkarte");
    if(!host) return;
    if(leafletKarte){ try{ leafletKarte.remove(); }catch(e){} leafletKarte=null; }
    var karte=L.map(host,{scrollWheelZoom:true}).setView([47.6,13.4],7);
    leafletKarte=karte;
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
      maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(karte);

    var maxPos=1; withGeo.forEach(function(s){ if(s.pos.length>maxPos) maxPos=s.pos.length; });
    var bounds=[];
    withGeo.forEach(function(s){
      var r=6+4*Math.sqrt((s.pos.length-1)/Math.max(1,maxPos-1));
      var m=L.circleMarker([s.lat,s.lon],{
        radius:r, color:tokenFarbe("--surface"), weight:1.8, opacity:1,
        fillColor:tokenFarbe(STATUS_VAR[s.status]), fillOpacity:1
      }).addTo(karte);
      bounds.push([s.lat,s.lon]);
      m.bindPopup(function(){ return popupInhalt(s); },{minWidth:230,maxWidth:280});
      m.on("popupopen",function(){ S.sel=s.id; });
    });

    if(T){
      var punkte=[T.start].concat(T.reihenfolge).concat([T.start]);
      if(S.tour.geometrie){
        /* tatsächlicher Straßenverlauf vom Routendienst */
        L.polyline(S.tour.geometrie.map(function(c){ return [c[1],c[0]]; }),{
          color:tokenFarbe("--accent"), weight:4, opacity:.8
        }).addTo(karte);
      } else {
        L.polyline(punkte.map(function(p){ return [p.lat,p.lon]; }),{
          color:tokenFarbe("--accent"), weight:3, opacity:.85, dashArray:"8 6"
        }).addTo(karte);
      }
      T.reihenfolge.forEach(function(p,i){
        L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",iconSize:[22,22],iconAnchor:[11,11],
          html:'<div style="width:22px;height:22px;border-radius:50%;background:'+tokenFarbe("--accent")+
            ';color:#fff;font:600 11px/22px system-ui,sans-serif;text-align:center;'+
            'border:2px solid '+tokenFarbe("--surface")+'">'+(i+1)+"</div>"})}).addTo(karte);
      });
      L.marker([T.start.lat,T.start.lon],{icon:L.divIcon({className:"",iconSize:[16,16],iconAnchor:[8,8],
        html:'<div style="width:16px;height:16px;border-radius:4px;background:'+tokenFarbe("--ink")+
          ';border:2px solid '+tokenFarbe("--surface")+'"></div>'})})
        .addTo(karte).bindPopup("Start: "+esc(T.start.name||"Startpunkt"));
      bounds=bounds.concat(punkte.map(function(p){ return [p.lat,p.lon]; }));
    }
    if(S.tour.gps){
      L.circle([S.tour.gps.lat,S.tour.gps.lon],{radius:Math.max(60,S.tour.gps.genauigkeit),
        color:tokenFarbe("--accent"),weight:1,fillColor:tokenFarbe("--accent"),fillOpacity:.18}).addTo(karte);
      L.circleMarker([S.tour.gps.lat,S.tour.gps.lon],{radius:6,color:tokenFarbe("--surface"),weight:2,
        fillColor:tokenFarbe("--accent"),fillOpacity:1}).addTo(karte).bindPopup("Ihr aktueller Standort");
      bounds.push([S.tour.gps.lat,S.tour.gps.lon]);
    }
    function alleZeigen(){
      if(bounds.length) karte.fitBounds(bounds,{padding:[24,24]});
    }
    function ausrichten(){
      /* Ganz Österreich passt auf ein schmales Hochformat nur stark
         verkleinert hinein. Ist die Position bekannt, ist die Umgebung
         des Technikers die nützlichere Ansicht. */
      if(S.tour.gps) karte.setView([S.tour.gps.lat, S.tour.gps.lon], 10);
      else alleZeigen();
    }
    ausrichten();
    /* Leaflet misst den Container sofort, die endgültige Höhe steht
       aber erst nach dem Layout fest */
    setTimeout(function(){ if(leafletKarte){ karte.invalidateSize(); ausrichten(); } },200);

    var knopf=document.getElementById("kartealle");
    if(knopf) knopf.onclick=alleZeigen;
  },0);

  return card;
}

function popupInhalt(s){
  var d=document.createElement("div");
  d.innerHTML='<div style="font:600 14px/1.3 system-ui,sans-serif;margin-bottom:2px">'+esc(stName(s))+"</div>"+
    '<div style="font-size:12.5px;color:#555;margin-bottom:6px">'+esc(s.adresse)+"</div>"+
    '<div style="margin-bottom:8px">'+pill(s.status)+' <span class="tag">'+s.pos.length+" Position(en)</span></div>"+
    '<div style="display:flex;flex-direction:column;gap:6px">'+
      '<a class="btn sm" style="text-align:center;text-decoration:none" href="'+gmapsZiel(s)+
        '" target="_blank" rel="noopener">Mit Google Maps navigieren</a>'+
      '<button class="btn ghost sm" type="button" data-akt="detail">Anlagen und Historie</button>'+
      '<button class="btn ghost sm" type="button" data-akt="proto">Protokoll ausfüllen</button>'+
    "</div>";
  d.querySelector('[data-akt="detail"]').onclick=function(){
    var host=document.getElementById("mapdetail");
    if(host){ host.innerHTML=""; host.appendChild(standortDetail(s)); host.scrollIntoView({behavior:"smooth",block:"start"}); }
    if(leafletKarte) leafletKarte.closePopup();
  };
  d.querySelector('[data-akt="proto"]').onclick=function(){
    S.protoStandort=s.id; S.protoPos=s.pos.length?s.pos[0].id:""; S.protoArt="wartung"; S.view="protokoll"; render(); window.scrollTo({top:0});
  };
  return d;
}

function tourPanel(){
  var kand=tourKandidaten();
  var T=S.tour.ergebnis;
  var gpsHinweis="";
  if(S.tour.startId==="__gps"){
    if(S.tour.gps) gpsHinweis='<div class="note">Startpunkt ist Ihre aktuelle Position, ermittelt auf rund '+
      Math.round(S.tour.gps.genauigkeit)+' m genau.</div>';
    else if(S.tour.gpsFehler) gpsHinweis='<div class="note warnbox">'+esc(S.tour.gpsFehler)+
      ' Als Ausweich-Startpunkt wird der Betrieb in St. Johann verwendet.</div>';
    else gpsHinweis='<div class="note">Beim Berechnen fragt der Browser einmal nach Ihrem Standort – bitte erlauben, '+
      'sonst startet die Route beim Betrieb in St. Johann.</div>';
  }

  var c=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Tourenplanung</h2><div class="sub">Reihenfolge über kürzeste Wege, '+ARBEIT_H.toString().replace(".",",")+
      ' h Arbeitszeit je Wartungsposition. Ein Markt mit mehreren Positionen bindet entsprechend länger.</div></div>'+

    '<div><div class="fl" style="margin-bottom:6px"><span>Welche Wartungen einplanen</span></div>'+
      '<div class="chips" id="t_status">'+
        ["ueberfaellig","faellig","erledigt"].map(function(k){
          return '<button class="chip" type="button" data-s="'+k+'" aria-pressed="'+(S.tour.status.indexOf(k)>=0)+'">'+
            (k==="erledigt"?"im Plan – vorziehen":STATUS_LABEL[k])+"</button>";
        }).join("")+
        '<button class="chip" type="button" id="t_folge" aria-pressed="'+(!!S.tour.naechsterMonat)+'">'+
          "auch nächster Monat – bis "+dfmt(endeFolgemonat())+"</button>"+
      "</div></div>"+

    '<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">'+
      '<label class="fl"><span>Startpunkt</span><select id="t_start"></select></label>'+
      '<label class="fl"><span>Position</span><button class="btn ghost" type="button" id="t_gps">'+
        (S.tour.gps?"Standort aktualisieren":"Standort bestimmen")+"</button></label>"+
      '<label class="fl"><span>Arbeitszeit je Tag (h)</span>'+
        '<input type="number" id="t_std" min="4" max="14" step="0.5" value="'+S.tour.stundenProTag+'"></label>'+
    "</div>"+
    gpsHinweis+

    '<div class="rowflex">'+
      '<button class="btn" type="button" id="t_go">Route vorschlagen</button>'+
      (T?'<button class="btn ghost" type="button" id="t_clear">Route löschen</button>':"")+
      '<span class="muted" style="font-size:12.5px">'+kand.length+' Standorte passen zur Auswahl'+
      (S.tour.manuell?' · '+S.tour.manuell.length+' davon von Hand gewählt':"")+"</span>"+
    "</div>"+
    '<div id="t_out"></div>'+
  "</div></div>");

  var startSel=c.querySelector("#t_start");
  var oG=document.createElement("option"); oG.value="__gps";
  oG.textContent="Aktueller Standort des Technikers"; startSel.appendChild(oG);
  var o0=document.createElement("option"); o0.value="__betrieb";
  o0.textContent=BETRIEB.name+" · "+BETRIEB.adresse; startSel.appendChild(o0);
  ST.slice().filter(function(x){return x.lat;}).sort(function(a,b){ return stName(a).localeCompare(stName(b),"de"); })
    .forEach(function(x){ var o=document.createElement("option"); o.value=x.id;
      o.textContent=(stName(x)===x.adresse)?x.adresse:(stName(x)+" · "+x.adresse); startSel.appendChild(o); });
  startSel.value=S.tour.startId;

  c.querySelectorAll("#t_status .chip").forEach(function(b){
    b.onclick=function(){
      var k=b.dataset.s, i=S.tour.status.indexOf(k);
      if(i>=0){ if(S.tour.status.length>1) S.tour.status.splice(i,1); } else S.tour.status.push(k);
      S.tour.manuell=null; render();
    };
  });
  c.querySelector("#t_folge").onclick=function(){
    S.tour.naechsterMonat=!S.tour.naechsterMonat; S.tour.manuell=null; render();
  };
  startSel.onchange=function(){ S.tour.startId=startSel.value; };

  var gpsBtn=c.querySelector("#t_gps");
  gpsBtn.onclick=function(){
    gpsBtn.disabled=true; gpsBtn.textContent="Wird ermittelt …";
    holeStandort().then(function(p){
      if(p.fehler){ S.tour.gps=null; S.tour.gpsFehler=p.fehler; }
      else { S.tour.gps=p; S.tour.gpsFehler=""; S.tour.startId="__gps"; toast("Standort übernommen."); }
      render();
    });
  };
  c.querySelector("#t_std").onchange=function(e2){
    var v=parseFloat(e2.target.value); if(v>=4&&v<=14) S.tour.stundenProTag=v;
  };
  var goBtn=c.querySelector("#t_go");
  goBtn.onclick=function(){
    S.tour.startId=startSel.value;
    var v=parseFloat(c.querySelector("#t_std").value); if(v>=4&&v<=14) S.tour.stundenProTag=v;
    if(!tourKandidaten().length){ toast("Keine Standorte für diese Auswahl."); return; }

    var rechnen=function(){
      goBtn.disabled=true; goBtn.textContent="Route wird berechnet …";
      tourRechnen().then(function(){
        render(); window.scrollTo({top:0,behavior:"smooth"});
      },function(){
        goBtn.disabled=false; goBtn.textContent="Route vorschlagen";
        toast("Die Route konnte nicht berechnet werden.");
      });
    };

    var frisch = S.tour.gps && (Date.now()-S.tour.gps.zeit < 300000);
    if(S.tour.startId!=="__gps" || frisch){ rechnen(); return; }
    goBtn.disabled=true; goBtn.textContent="Standort wird ermittelt …";
    holeStandort().then(function(p){
      if(p.fehler){ S.tour.gps=null; S.tour.gpsFehler=p.fehler; }
      else { S.tour.gps=p; S.tour.gpsFehler=""; }
      rechnen();
    });
  };
  var clr=c.querySelector("#t_clear");
  if(clr) clr.onclick=function(){ S.tour.ergebnis=null; S.tour.manuell=null; render(); };

  if(T) c.querySelector("#t_out").appendChild(tourErgebnis(T));
  return c;
}

function tourErgebnis(T){
  var box=document.createElement("div");
  box.className="stack";
  box.appendChild(el('<div class="kpis">'+
    '<div class="kpi"><div class="n">'+T.anzahlStopps+'</div><div class="l">Stopps</div></div>'+
    '<div class="kpi"><div class="n">'+T.anzahlPositionen+'</div><div class="l">Wartungen</div></div>'+
    '<div class="kpi"><div class="n">'+Math.round(T.kmGesamt)+'</div><div class="l">km gesamt</div></div>'+
    '<div class="kpi"><div class="n">'+T.tage.length+'</div><div class="l">Arbeitstage</div></div>'+
  "</div>"));

  T.tage.forEach(function(tag){
    var minute=7*60;   /* Tagesbeginn 07:00 */
    var zeilen=tag.stopps.map(function(st,i){
      var anf=minute+st.fahrtH*60;
      var ende=anf+st.arbeitH*60;
      var r='<tr><td class="mono">'+(i+1)+'</td>'+
        '<td><strong>'+esc(stName(st.standort))+"</strong>"+
          (stName(st.standort)===st.standort.adresse ? "" :
            '<br><span class="muted" style="font-size:12px">'+esc(st.standort.adresse)+"</span>")+"</td>"+
        '<td class="mono">'+Math.round(st.km)+' km<br><span class="muted">'+stdFmt(st.fahrtH)+"</span></td>"+
        '<td class="mono">'+uhrFmt(minute,st.fahrtH)+'–'+uhrFmt(minute,st.fahrtH+st.arbeitH)+"</td>"+
        '<td>'+st.positionen.map(function(p){
            return '<span class="tag">'+esc(p.anlagentyp||"Anlage")+"</span>";
          }).join(" ")+"</td>"+
        '<td><a class="btn ghost sm" href="'+gmapsZiel(st.standort)+'" target="_blank" rel="noopener">Navi</a></td></tr>';
      minute=ende;
      return r;
    }).join("");
    var rueck = tag.rueckfahrtH ?
      '<tr><td></td><td class="muted">Rückfahrt zum Startpunkt</td><td class="mono">'+Math.round(tag.rueckfahrtKm)+
      ' km<br><span class="muted">'+stdFmt(tag.rueckfahrtH)+'</span></td><td class="mono">bis '+
      uhrFmt(minute,tag.rueckfahrtH)+"</td><td></td><td></td></tr>" : "";
    var gm=gmapsRoute(tagPunkte(tag,true));
    box.appendChild(el('<div class="card" style="box-shadow:none;background:var(--ground)"><div class="pad stack">'+
      '<div class="rowflex" style="justify-content:space-between">'+
        '<strong style="font-family:var(--f-disp);font-size:14.5px">Tag '+tag.nr+"</strong>"+
        '<span class="muted mono" style="font-size:12px">'+stdFmt(tag.stunden+(tag.rueckfahrtH||0))+
        ' · '+Math.round(tag.km+(tag.rueckfahrtKm||0))+" km</span>"+
      "</div>"+
      (gm?'<div class="rowflex"><a class="btn sm" href="'+gm.url+'" target="_blank" rel="noopener">'+
        "Tag "+tag.nr+' in Google Maps öffnen</a>'+
        (gm.gekuerzt?'<span class="muted" style="font-size:12px">Google nimmt nur neun Zwischenziele – '+
          'die weiteren Stopps fehlen in der Navigation.</span>':"")+"</div>":"")+
      '<div class="scrollx"><table class="dt"><thead><tr><th>#</th><th>Standort</th><th>Anfahrt</th>'+
      "<th>vor Ort</th><th>Anlagen</th><th></th></tr></thead><tbody>"+zeilen+rueck+"</tbody></table></div>"+
    "</div></div>"));
  });

  box.appendChild(el('<div class="note">'+
    (T.echteStrasse
      ? 'Fahrzeiten und Kilometer stammen aus echtem Straßenrouting über OpenStreetMap (OSRM, PKW): '+
        'Autobahnen, Tempolimits und Umwege sind berücksichtigt. Die Reihenfolge ist nach Fahrzeit optimiert, '+
        'nicht nach Entfernung — über die Autobahn ist der längere Weg oft der schnellere. Verkehrslage und '+
        'Baustellen kennt der Dienst nicht.'
      : '<strong>Achtung, nur geschätzt:</strong> Der Routendienst war nicht erreichbar, daher Luftlinie mit Zuschlag '+
        UMWEG.toString().replace(".",",")+' und '+TEMPO_KMH+' km/h im Mittel. Nochmal berechnen liefert meist echte Werte.')+
    ' Mehrtägige Touren fahren am Folgetag vom letzten Stopp weiter, es ist also eine Übernachtung unterwegs eingerechnet.</div>'));
  return box;
}

      "<dt>Geocodierung</dt><dd class='muted'>"+({adresse:"Adressgenau",strasse:"Straßenebene",ort:"Ortsebene",keine:"keine"}[s.genauigkeit]||s.genauigkeit)+"</dd>"+

/* zur Zeit nicht gewartet – sichtbar, aber ohne Termin */
function pausiertBox(p){
  var d=anlageDaten(p);
  return el('<div class="posbox" style="opacity:.75"><div class="rowflex" style="justify-content:space-between;gap:8px">'+
    '<strong style="font-size:14px">'+esc(anlagenName(d))+"</strong>"+pill("pausiert")+"</div>"+
    '<div class="muted" style="font-size:13px">'+esc([d.pausiertGrund?"Grund: "+d.pausiertGrund:"", anlageKurz(d)].filter(Boolean).join(" · ")||"Keine Termine, bis die Anlage in der Verwaltung wieder auf „in Betrieb“ steht.")+"</div></div>");
}
/* je Anlage ein Block: Name, Anlagendaten, darunter ihre Termine */
function anlagenBloecke(s, host){
  anlagenDesMarkts(s,true).forEach(function(a){
    if(anlagePausiert(a.leader)){ host.appendChild(pausiertBox(a.leader)); return; }
    var d=anlageDaten(a.leader), l=anlageLuecken(d);
    var blk=el('<div class="akarte" style="background:var(--surface)"><div class="rowflex" style="justify-content:space-between;gap:8px">'+
      '<strong style="font-size:15px">'+esc(anlagenName(d))+"</strong>"+
      '<span class="muted" style="font-size:12px">'+a.termine.length+" Termin"+(a.termine.length===1?"":"e")+" im Jahr</span></div>"+
      '<div style="font-size:13px">'+(anlageKurz(d)?esc(anlageKurz(d)):'<span class="muted">Anlagendaten noch nicht erfasst</span>')+
        (l.length?' <span class="muted" style="font-size:12px">· '+l.length+" Angabe(n) offen</span>":"")+"</div>"+

      '<div class="stack" data-termine></div></div>');
    a.termine.forEach(function(t){ blk.querySelector("[data-termine]").appendChild(posBox(t,s,true)); });
    host.appendChild(blk);
  });
}
function posBox(p,s,imBlock){
