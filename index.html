  return { _id:r.client_id||r.id, erstellt:r.erstellt, standortName:r.standort_name, adresse:r.adresse, region:r.region,
    version:r.version||1, geaendert:r.geaendert, korrekturGrund:r.korrektur_grund,
    geloescht:r.geloescht||null, geloeschtVon:r.geloescht_von||null, loeschGrund:r.loesch_grund||null,
    firma:r.firma, kontakt:r.kontakt, subunternehmen:r.subunternehmen, zertUnternehmen:r.zert_unternehmen, zertPerson:r.zert_person,
    arbeitenSonstiges:r.arbeiten_sonstiges,
    /* ohne diese drei verschieben übertragene Protokolle die Fälligkeit nicht */
    standortId:r.standort_id, positionId:r.position_id, positionIds:r.position_ids||[],
    datum:r.datum, uhrzeit:r.uhrzeit, techniker:r.techniker, nameTechniker:r.name_techniker,
    wartungsart:r.wartungsart, bestellnummer:r.bestellnummer, auftragsnummer:r.auftragsnummer,
    arbeiten:r.arbeiten||[], maengel:r.maengel||[], betriebsbereit:r.betriebsbereit,
    bemerkungen:r.bemerkungen, filiale:r.filiale, fotos:r.fotos||[],
    anlagen:r.anlagen||[], ergebnis:r.ergebnis||[], unterschrift:r.unterschrift,
    sofortmassnahme:r.sofortmassnahme, auftraggebervertreter:r.auftraggebervertreter,
    stoerung:r.stoerung||null, mitarbeiter:r.mitarbeiter||[] };
}
/* Alle Spalten außer der Unterschrift. Die ist ein PNG als Text, rund 25 KB
   je Protokoll – bei tausend Protokollen wären das 25 MB bei jedem Start der
   App, im Markt am Handy eine Zumutung. Gebraucht wird sie nur, wenn ein
   einzelnes Protokoll gedruckt, als PDF gesichert oder korrigiert wird; dann
   holt ladeUnterschrift() sie nach. */
var PROTOKOLL_SPALTEN=["id","client_id","erstellt","erstellt_von","standort_id","position_id","position_ids",
  "filiale","standort_name","adresse","region","datum","uhrzeit","bestellnummer","auftragsnummer","wartungsart",
  "firma","techniker","kontakt","subunternehmen","zert_unternehmen","zert_person","anlagen","arbeiten",
  "arbeiten_sonstiges","maengel","betriebsbereit","sofortmassnahme","ergebnis","bemerkungen","name_techniker",
  "auftraggebervertreter","fotos","version","geaendert","korrektur_grund","geloescht","geloescht_von",
  "loesch_grund","stoerung","mitarbeiter"].join(",");

/* Holt die Unterschrift eines Protokolls nach. Schon vorhandene bleibt.
   Liefert immer, auch wenn es keine gibt oder die Leitung weg ist. */
function ladeUnterschrift(p){
  if(!p) return Promise.resolve("");
  if(typeof p.unterschrift==="string") return Promise.resolve(p.unterschrift);
  if(!Store.sb || !p._id){ p.unterschrift=""; return Promise.resolve(""); }
  return Store.sb.from("protokolle").select("unterschrift").eq("client_id",p._id).limit(1).then(function(r){
    var w=(r && r.data && r.data[0] && r.data[0].unterschrift) || "";
    p.unterschrift=w;
    /* Die Listen liefern Kopien; damit nicht bei jedem Öffnen neu geladen
       wird, auch am gemerkten Datensatz hinterlegen. */
    (protokolle||[]).forEach(function(x){ if(x._id===p._id) x.unterschrift=w; });
    return w;
  }, function(){ return ""; });
}

function ladeProtokolle(){
  if(!Store.sb) return;
  /* Die Grenze muss über den gesamten Bestand reichen: aus den Protokollen
     kommt der Wartungsnachweis. Fällt ein altes Protokoll heraus, gilt seine
     Wartung als nicht geschehen und der Termin springt auf überfällig. */
  Store.sb.from("protokolle").select(PROTOKOLL_SPALTEN).order("erstellt",{ascending:false}).limit(1000).then(function(r){
    if(r.error){ Store.fehler=r.error.message; return; }
    protokolle=(r.data||[]).map(ausZeile);
    storeNachRender();
    offeneBerichteNachholen();
  });
}

/* ---------------- Fotos ----------------
   Handykameras liefern 3–8 MB je Bild. Das wird vor dem Hochladen auf
   eine brauchbare Dokumentationsgröße gebracht – sonst dauert es im
   Funkloch ewig und sprengt jede Speichergrenze. */
var FOTO_KANTE = 1600;        // längste Kante in Pixel
var FOTO_BUDGET = 160000;     // Zielgröße je Bild in Byte
var FOTO_MAX = 8;             // Bilder je Protokoll

function verkleinere(datei){
  return new Promise(function(fertig, schiefgegangen){
    var quelle = window.createImageBitmap
      ? createImageBitmap(datei,{imageOrientation:"from-image"})
      : new Promise(function(ok,nok){
          var img=new Image(), url=URL.createObjectURL(datei);
          img.onload=function(){ URL.revokeObjectURL(url); ok(img); };
          img.onerror=function(){ URL.revokeObjectURL(url); nok(new Error("Bild nicht lesbar")); };
          img.src=url;
        });
    quelle.then(function(bild){
      var b=bild.width, h=bild.height;
      var f=Math.min(1, FOTO_KANTE/Math.max(b,h));
      var cv=document.createElement("canvas");
      cv.width=Math.round(b*f); cv.height=Math.round(h*f);
      cv.getContext("2d").drawImage(bild,0,0,cv.width,cv.height);
      if(bild.close) bild.close();
      /* Qualität so weit senken, bis das Budget passt */
      var q=0.78, url=cv.toDataURL("image/jpeg",q);
      while(url.length*0.75 > FOTO_BUDGET && q > 0.36){
        q-=0.08; url=cv.toDataURL("image/jpeg",q);
      }
      fertig({datenUrl:url, breite:cv.width, hoehe:cv.height,
              bytes:Math.round(url.length*0.75), qualitaet:Math.round(q*100)});
    }, schiefgegangen);
  });
}
function datenUrlZuBlob(url, typ){
  var teile=url.split(","), roh=atob(teile[1]);
  var a=new Uint8Array(roh.length);
  for(var i=0;i<roh.length;i++) a[i]=roh.charCodeAt(i);
  return new Blob([a],{type:typ||"image/jpeg"});
}
/* eine Datei so einlesen, wie sie ist – fuer das Auftrags-PDF, das im
   Original erhalten bleiben soll und nicht als Bild */
function dateiAlsDatenUrl(datei){
  return new Promise(function(ok, nein){
    var r=new FileReader();
    r.onload=function(){ ok(r.result); };
    r.onerror=function(){ nein(r.error||new Error("Datei nicht lesbar")); };
    r.readAsDataURL(datei);
  });
}
/* Groesse der Originaldatei aus der Data-URL, ohne sie zu dekodieren */
function datenUrlBytes(url){
  var b64=String(url||"").split(",")[1]||"";
  var fuell=(b64.slice(-2).match(/=/g)||[]).length;
  return Math.max(0, Math.floor(b64.length*3/4)-fuell);
}

/* speichert alle Fotos eines Protokolls; liefert false, wenn etwas scheitert */
function speichereFotos(protokollId, fotos){
  if(!fotos || !fotos.length) return Promise.resolve(true);

  if(Store.modus==="claude" && Store.claudeDb){
    /* ein Dokument je Foto – die Grenze liegt bei 256 KiB je Dokument */
    var i=0;
    var naechstes=function(){
      if(i>=fotos.length) return Promise.resolve(true);
      var f=fotos[i++];
      return Store.claudeDb.doc("protokollfotos/"+f.id).set({
        protokollId:protokollId, name:f.name, hinweis:f.hinweis,
        datenUrl:f.datenUrl, erstellt:new Date().toISOString()
      }).then(naechstes, function(){ return false; });
    };
    return naechstes();
  }

  if(Store.modus==="supabase" && Store.sb){
    var j=0;
    var weiter=function(){
      if(j>=fotos.length) return Promise.resolve(true);
      var f=fotos[j++];
      var pfad=protokollId+"/"+f.id+".jpg";
      return Store.sb.storage.from("protokollfotos")
        .upload(pfad, datenUrlZuBlob(f.datenUrl), {contentType:"image/jpeg", upsert:false})
        .then(function(r){ if(r.error){ Store.fehler=r.error.message; return false; } return weiter(); },
              function(){ return false; });
    };
    return weiter();
  }
  return Promise.resolve(false);
}

/* holt die Bilder eines Protokolls zur Anzeige */
function ladeFotos(p){
  /* noch nicht übertragen: die Bilder liegen direkt im Gerätespeicher */
  if(p._fotoDaten && p._fotoDaten.length){
    return Promise.resolve(p._fotoDaten.map(function(f){ return {name:f.name, hinweis:f.hinweis, url:f.datenUrl}; }));
  }
  if(!p.fotos || !p.fotos.length) return Promise.resolve([]);
  if(Store.modus==="claude" && Store.claudeDb){
    return Promise.all(p.fotos.map(function(f){
      return Store.claudeDb.doc("protokollfotos/"+f.id).get().then(function(snap){
        var d=snap.exists?snap.data():null;
        return {name:f.name, hinweis:f.hinweis, url:d?d.datenUrl:null};
      },function(){ return {name:f.name, hinweis:f.hinweis, url:null}; });
    }));
  }
  if(Store.modus==="supabase" && Store.sb){
    return Promise.all(p.fotos.map(function(f){
      return Store.sb.storage.from("protokollfotos")
        .createSignedUrl((p._id||p.id)+"/"+f.id+".jpg", 3600)
        .then(function(r){ return {name:f.name, hinweis:f.hinweis, url:r.data?r.data.signedUrl:null}; },
              function(){ return {name:f.name, hinweis:f.hinweis, url:null}; });
    }));
  }
  return Promise.resolve([]);
}

/* --------------------------------------------------------------------
   Das Auftrags-PDF von Lidl. Es gehoert zum Einsatz und wird deshalb beim
   Protokoll abgelegt – im Original, nicht als Bild. Die Bilder der ersten
   zwei Seiten bleiben daneben bestehen, sie sind fuer die Anzeige da.
   Ablage wie bei den Fotos: ein Pfad unter der Protokollkennung.
   -------------------------------------------------------------------- */
function auftragPfad(protokollId){ return protokollId+"/auftrag.pdf"; }

function speichereAuftragPdf(protokollId, pdf){
  if(!pdf || !pdf.datenUrl) return Promise.resolve(true);
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("auftragspdf/"+protokollId).set({
      protokollId:protokollId, name:pdf.name||"auftrag.pdf",
      datenUrl:pdf.datenUrl, erstellt:new Date().toISOString()
    }).then(function(){ return true; }, function(){ return false; });
  }
  if(Store.modus==="supabase" && Store.sb){
    return Store.sb.storage.from("protokollfotos")
      .upload(auftragPfad(protokollId), datenUrlZuBlob(pdf.datenUrl,"application/pdf"),
              {contentType:"application/pdf", upsert:false})
      .then(function(r){ if(r.error){ Store.fehler=r.error.message; return false; } return true; },
            function(){ return false; });
  }
  return Promise.resolve(false);
}

/* Link zum Auftrag eines Protokolls – null, wenn keiner dabei ist */
function ladeAuftragPdf(p){
  var ref=p.stoerung && p.stoerung.auftragDatei;
  if(!ref) return Promise.resolve(null);
  /* noch nicht uebertragen: das PDF liegt im Geraetespeicher */
  if(p._auftragDaten && p._auftragDaten.datenUrl)
    return Promise.resolve({name:ref.name, url:p._auftragDaten.datenUrl});
  var id=p._id||p.id;
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("auftragspdf/"+id).get().then(function(snap){
      var d=snap.exists?snap.data():null;
      return d ? {name:ref.name, url:d.datenUrl} : null;
    }, function(){ return null; });
  }
  if(Store.modus==="supabase" && Store.sb){
    return Store.sb.storage.from("protokollfotos").createSignedUrl(auftragPfad(id), 3600)
      .then(function(r){ return r.data ? {name:ref.name, url:r.data.signedUrl} : null; },
            function(){ return null; });
  }
  return Promise.resolve(null);
}

/* ein Protokoll wegschreiben – liefert ein Promise, das nie ablehnt */
function speichereProtokoll(id,doc){
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).set(doc).then(function(){ return true; },function(){ return false; });
  }
  if(Store.modus==="supabase" && Store.sb){
    var zeile=zuZeile(doc,Store.benutzer?Store.benutzer.id:null);
    /* Die Kennung aus der App mitgeben: unter ihr liegen die Fotos, und ein
       zweiter Übertragungsversuch legt so kein doppeltes Protokoll an. */
    zeile.client_id=id;
    return Store.sb.from("protokolle").upsert(zeile,{onConflict:"client_id", ignoreDuplicates:true}).then(function(r){
      if(r.error){
        Store.fehler=/stoerung|mitarbeiter/.test(r.error.message||"")
          ? "In der Datenbank fehlt eine Spalte – bitte supabase-setup.sql im Supabase SQL Editor erneut ausführen"
          : r.error.message;
        return false;
      }
      ladeProtokolle();
      /* Archiv-PDF im Hintergrund – das Speichern wartet nicht darauf */
      berichtAblegen(Object.assign({}, doc, {_id:id, version:doc.version||1}));
      return true;
    },function(){ return false; });
  }
  return Promise.resolve(false);
}

/* eine Korrektur wegschreiben – gleiche Kennung, neue Fassung */
function aktualisiereProtokoll(id, doc, quelle, geraetFotos, geraetAuftrag){
  if(quelle==="geraet"){
    return idbSchreiben({id:id, doc:doc, fotos:geraetFotos||[], auftrag:geraetAuftrag||null, erstellt:doc.erstellt})
      .then(function(){ return true; }, function(){ return false; });
  }
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).set(doc).then(function(){ return true; }, function(){ return false; });
  }
  if(Store.modus==="supabase" && Store.sb){
    var zeile=zuZeile(doc,null);
    delete zeile.erstellt_von;   /* der ursprüngliche Verfasser bleibt eingetragen */
    delete zeile.erstellt;
    zeile.version=doc.version; zeile.geaendert=doc.geaendert; zeile.korrektur_grund=doc.korrekturGrund||null;
    /* Nur schreiben, wenn das Protokoll noch die Fassung hat, auf der diese
       Korrektur aufbaut. Sonst hat in der Zwischenzeit jemand anderer
       korrigiert – dessen Arbeit soll nicht stillschweigend verschwinden. */
    var erwartet=(doc.version||2)-1;
    Store.fehler="";   /* alte Meldung nicht stehen lassen */
    return Store.sb.from("protokolle").update(zeile)
      .eq("client_id",id).eq("version",erwartet).select("client_id").then(function(r){
      if(r.error){ Store.fehler=r.error.message; return false; }
      if(!r.data || !r.data.length){
        Store.fehler="Das Protokoll wurde inzwischen von jemand anderem geändert. "+
          "Bitte neu laden, die Änderung ansehen und dann noch einmal korrigieren.";
        ladeProtokolle();
        return false;
      }
      ladeProtokolle();
      berichtAblegen(Object.assign({}, doc, {_id:id}));   /* neue Fassung ersetzt das PDF */
      return true;
    },function(){ return false; });
  }
  return Promise.resolve(false);
}
/* überträgt Protokolle vom Gerät, sobald eine zentrale Ablage da ist */
var uebertragungLaeuft=false;
function flushQueue(){
  if(uebertragungLaeuft) return;
  if(Store.modus!=="claude" && Store.modus!=="supabase") return;
  if(!lokaleProtokolle.length){ aenderungenUebertragen(); return; }
  uebertragungLaeuft=true;
  var liste=lokaleProtokolle.slice(), done=0, i=0;
  var next=function(){
    if(i>=liste.length){
      uebertragungLaeuft=false;
      aenderungenUebertragen();
      lokaleNeuLaden().then(function(){
        if(done) toast(done+" Protokoll(e) vom Gerät in die zentrale Ablage übertragen.");
        storeNachRender();
      });
      return;
    }
    var e=liste[i++];
    speichereFotos(e.id, e.fotos||[]).then(function(fotosOk){
      if(!fotosOk){ next(); return; }
      speichereAuftragPdf(e.id, e.auftrag).then(function(pdfOk){
        if(!pdfOk){ next(); return; }
        speichereProtokoll(e.id,e.doc).then(function(ok){
          if(!ok){ next(); return; }
          done++;
          /* erst nach bestätigter Übertragung vom Gerät entfernen */
          idbLoeschen(e.id).then(next,next);
        });
      });
    });
  };
  next();
}
window.addEventListener("online",function(){ flushQueue(); });

/* Wer angemeldet ist, samt Passwort ändern und Abmelden.
   Steht außerhalb des Protokollformulars, damit Enter im Passwortfeld
   nicht versehentlich ein Protokoll abschickt. */
function kontoKarte(){
  var mail=Store.benutzer&&Store.benutzer.email?Store.benutzer.email:"";
  var c=el('<div class="card"><div class="pad stack">'+

/* ================= Störungseinsätze =================
   Lidl schickt je Störung einen Auftrag als PDF. Der QR-Code darauf enthält
   nur die Auftragsnummer – alles andere steht als Text in der PDF und wird
   von dort übernommen. Ein Störungsprotokoll hat die Wartungsart „Störung“
   und verschiebt deshalb keine Fälligkeit (siehe ZAEHLT_ALS_WARTUNG). */
var STOER_AUFTRAG=[
  ["auftragsdatum","Auftragsdatum","date"], ["stoerungsnr","Störungsnummer (Lidl)","text"],
  ["ausfuehrenBis","Ausführen bis","date"], ["kostenstelle","Kostenstelle","text"],
  ["problemtyp","Problemtyp","text"], ["lidlTyp","Typ (Lidl)","text"], ["lidlModell","Modell (Lidl)","text"],
  ["lin","LIN","text"], ["iaNummer","IA-Nummer","text"],
  ["lidlKontakt","Kontakt bei Lidl","text"], ["lidlTelefon","Telefon Lidl","text"], ["lidlMail","E-Mail Lidl","text"]
];
var STOER_BEHEBUNG=[
  ["ankunft","Ankunft","time"], ["ende","Fertig","time"],
  ["kmArt","Kältemittel","text"], ["kmNach","Kältemittel nachgefüllt (kg)","text"], ["kmEnt","Kältemittel zurückgewonnen (kg)","text"]
];
var STOER_TEXTE=[["beschreibung","Beschreibung laut Auftrag"],["fehlerbild","Fehlerbild vor Ort"],
  ["ursache","Ursache"],["massnahmen","Durchgeführte Maßnahmen"]];
/* für Änderungsverlauf und Anzeige: alle Felder mit Namen */
var STOER_NAMEN=(function(){ var n={}; STOER_AUFTRAG.concat(STOER_BEHEBUNG,STOER_TEXTE).forEach(function(f){ n[f[0]]=f[1]; });
  n.material="Material / Ersatzteile"; n.folgeauftrag="Folgeauftrag / Angebot"; n.folgeText="Folgeauftrag – was"; return n; })();

function istStoerung(p){ return !!p && (p.wartungsart==="Störung" || !!p.stoerung); }
function datumIso(t){ var m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(t||"").trim());
  return m ? m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2) : ""; }

function ladeSkript(src){
  return new Promise(function(ok,nok){
    var s=document.createElement("script"); s.src=src; s.onload=ok;
    s.onerror=function(){ nok(new Error("Werkzeug nicht ladbar – keine Internetverbindung?")); };
    document.head.appendChild(s);
  });
}
var pdfJsBereit=null;
function ladePdfJs(){
  if(pdfJsBereit) return pdfJsBereit;
  var basis="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  pdfJsBereit=ladeSkript(basis+"pdf.min.js").then(function(){
    /* Hilfsprozess als eigene Datei vom selben Ursprung, sonst blockt der Browser */
    return fetch(basis+"pdf.worker.min.js").then(function(r){ return r.text(); }).then(function(t){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:"text/javascript"}));
    }, function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=basis+"pdf.worker.min.js"; });
  });
  pdfJsBereit.catch(function(){ pdfJsBereit=null; });
  return pdfJsBereit;
}

/* Textbausteine der Lidl-PDF mit Position -> Felder.
   Der Auftrag ist ein Formular: links die Bezeichnung, rechts daneben der Wert;
   lange Werte laufen in der nächsten Zeile an derselben Einrückung weiter. */
function werteLidlAuftrag(teile){
  var z=teile.filter(function(t){ return t.s && t.s.trim(); }).map(function(t){ return {s:t.s.trim(), x:t.x, y:t.y}; });
  var alles=z.map(function(t){ return t.s; }).join("\n");
  var LABELS={"Datum:":"auftragsdatum","Kontakt:":"lidlKontakt","Telefon:":"lidlTelefon","Mail-Adresse:":"lidlMail",
    "Ausführen bis":"ausfuehrenBis","Leistungsort":"leistungsort","Kostenstelle":"kostenstelle","Störung":"stoerungsnr",
    "Typ":"lidlTyp","Modell":"lidlModell","Hersteller":"hersteller","Seriennummer":"seriennummer","LIN":"lin",
    "Inventarstandort":"inventarstandort","Problemtyp":"problemtyp","Beschreibung":"beschreibung"};
  var istLabel=function(t){ return LABELS.hasOwnProperty(t.s) || t.s==="Leistungsempfänger" || t.s==="Rechnungsanschrift"; };
  var r={};
  z.forEach(function(l){
    if(!LABELS.hasOwnProperty(l.s)) return;
    var zeile=z.filter(function(t){ return Math.abs(t.y-l.y)<3 && t.x>l.x+5; }).sort(function(a,b){ return a.x-b.x; });
    var grenze=Infinity;
    zeile.forEach(function(t){ if(istLabel(t) && t.x<grenze) grenze=t.x; });
    var werte=zeile.filter(function(t){ return t.x<grenze && !istLabel(t); });
    if(!werte.length) return;
    var xv=werte[0].x, text=[werte.map(function(t){ return t.s; }).join(" ")], y=l.y;
    /* Fortsetzungszeilen */
    for(var i=0;i<4;i++){
      var weiter=z.filter(function(t){ return t.y<y-3 && t.y>y-15 && Math.abs(t.x-xv)<4; });
      if(!weiter.length) break;
      var yy=weiter[0].y;
      /* Eine Fortsetzungszeile hat links von sich nichts stehen. Steht dort
         etwas, beginnt ein neues Feld – auch wenn dessen Bezeichnung hier
         nicht bekannt ist. */
      if(z.some(function(t){ return Math.abs(t.y-yy)<3 && t.x<xv-5; })) break;
      text.push(weiter.map(function(t){ return t.s; }).join(" ")); y=yy;
    }
    r[LABELS[l.s]]=text.join(l.s==="Beschreibung"?" ":"\n");
  });
  var m=/Auftrag-Nr\.:\s*(\d{5,})/.exec(alles) || /Auftrag-Nr\.:\s*\n\s*(\d{5,})/.exec(alles);
  if(m) r.auftragsnummer=m[1];
  m=/IA-Nummer:\s*(\d+)/.exec(alles); if(m) r.iaNummer=m[1];
  r.auftragsdatum=datumIso(r.auftragsdatum); r.ausfuehrenBis=datumIso(r.ausfuehrenBis);
  /* „Lidl Filiale\nMusterstraße 1, 1234 Musterort“ -> Adresse ist die letzte Zeile */
  if(r.leistungsort){ var zl=r.leistungsort.split("\n"); r.adresse=zl[zl.length-1]; }
  return r;
}
/* Ob aus einem PDF überhaupt Text zu holen ist, entscheidet die eingebettete
   Schrift. Lidl-Aufträge kommen mit einer Schrift ohne Unicode-Tabelle – die
   Zeichen lassen sich zeichnen, aber nicht lesen. Dann liefert das Auslesen
   Zeichensalat, und die App merkt das an den fehlenden Feldnamen. */
var LIDL_MARKER=["Auftrag-Nr","Filial-Nr","Störung","Problemtyp","Auftragstext",
                 "Leistungsort","Kostenstelle","Modell","Hersteller","Beschreibung"];
function textIstLesbar(teile){
  var alles=teile.map(function(t){ return t.s; }).join("\n");
  return LIDL_MARKER.some(function(m){ return alles.indexOf(m)>=0; });
}

/* Seiten als Bild – damit geht nichts verloren, auch wenn der Text nicht
   lesbar ist. Die Technikerin sieht den Auftrag und tippt ab, was fehlt. */
function pdfSeitenAlsBild(pdf, maxSeiten){
  var seiten=[]; for(var i=1;i<=Math.min(pdf.numPages, maxSeiten||2);i++) seiten.push(i);
  return Promise.all(seiten.map(function(n){
    return pdf.getPage(n).then(function(pg){
      var roh=pg.getViewport({scale:1});
      /* rund 1400 px breit: gut lesbar und trotzdem sparsam */
      var vp=pg.getViewport({scale:Math.min(2.4, 1400/roh.width)});
      var cv=document.createElement("canvas");
      cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
      return pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise.then(function(){
        return cv.toDataURL("image/jpeg", 0.75);
      });
    });
  }));
}

/* Auftrag ansehen. Links auf eingebettete Daten (data:…) öffnen iPhone und
   Chrome aus Sicherheitsgründen nicht in einem neuen Fenster – es passiert
   einfach nichts. Deshalb zeigt die App PDF und Seitenbilder selbst an. Die
   PDF wird dafür Seite für Seite gezeichnet; das klappt überall, auch in
   der App vom Homebildschirm, wo ein eingebettetes PDF nur Seite 1 zeigt. */
function datenUrlZuBlobUrl(u){
  var m=/^data:([^;,]*)(;base64)?,(.*)$/.exec(u||"");
  if(!m) return u;
  var roh=m[2]?atob(m[3]):decodeURIComponent(m[3]), b=new Uint8Array(roh.length);
  for(var i=0;i<roh.length;i++) b[i]=roh.charCodeAt(i);
  return URL.createObjectURL(new Blob([b],{type:m[1]||"application/octet-stream"}));
}
function ansichtOeffnen(titel){
  var ov=el('<div class="assistent" role="dialog" aria-modal="true"><div class="as-karte">'+
    '<div class="as-kopf"><div style="min-width:0"><div class="as-titel"></div><div class="as-schritt"></div></div>'+
      '<button class="btn ghost sm" type="button" data-a="zu">Schließen</button></div>'+
    '<div class="as-inhalt"></div><div class="as-fuss"></div></div></div>');
  ov.querySelector(".as-titel").textContent=titel;
  /* liegt über einem anderen Dialog (etwa der offenen Störung) */
  ov.style.zIndex="1100";
  document.body.appendChild(ov);
  var vorher=document.body.style.overflow;
  document.body.style.overflow="hidden";
  var blobs=[];
  var zu=function(){ ov.remove(); document.body.style.overflow=vorher; blobs.forEach(function(b){ URL.revokeObjectURL(b); }); };
  ov.querySelector('[data-a="zu"]').onclick=zu;
  return {inhalt:ov.querySelector(".as-inhalt"), fuss:ov.querySelector(".as-fuss"),
          schritt:ov.querySelector(".as-schritt"), zu:zu, blob:function(u){ var b=datenUrlZuBlobUrl(u); if(b!==u) blobs.push(b); return b; }};
}
function bildAnsicht(bild, titel){
  var a=ansichtOeffnen(titel||"Auftrag");
  a.inhalt.appendChild(el('<img alt="" src="'+bild+'" style="width:100%;border:1px solid var(--line);border-radius:8px;background:#fff">'));
}
function pdfAnsicht(quelle, name){
  var a=ansichtOeffnen(name||"Auftrag");
  a.schritt.textContent="wird geladen …";
  var link=el('<a class="btn ghost sm" style="text-decoration:none" target="_blank" rel="noopener">Datei öffnen</a>');
  var holen = /^data:/.test(quelle)
    ? Promise.resolve().then(function(){ var u=a.blob(quelle); link.href=u; link.download=name||"auftrag.pdf"; return fetch(u); })
    : Promise.resolve().then(function(){ link.href=quelle; return fetch(quelle); });
  a.fuss.appendChild(link);
  Promise.all([ladePdfJs(), holen.then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.arrayBuffer(); })])
    .then(function(x){ return window.pdfjsLib.getDocument({data:new Uint8Array(x[1])}).promise; })
    .then(function(pdf){
      a.schritt.textContent=pdf.numPages+" Seite"+(pdf.numPages===1?"":"n");
      var seiten=[]; for(var i=1;i<=Math.min(pdf.numPages,20);i++) seiten.push(i);
      return pdfSeitenAlsBild(pdf, seiten.length).then(function(bilder){
        bilder.forEach(function(b,i){
          a.inhalt.appendChild(el('<img alt="Seite '+(i+1)+'" src="'+b+'" style="width:100%;border:1px solid var(--line);'+
            'border-radius:8px;margin-bottom:10px;background:#fff">'));
        });
      });
    })
    .catch(function(e){
      a.schritt.textContent="";
      a.inhalt.appendChild(el('<div class="note warnbox">Die PDF ließ sich hier nicht anzeigen ('+esc(e&&e.message||String(e))+
        '). Über „Datei öffnen“ geht es mit dem Programm des Geräts.</div>'));
    });
}

/* Jeder Link auf eingebettete Daten – Auftragsseiten, Fotos, die noch auf
   dem Gerät liegen – geht in die eigene Ansicht statt ins Leere. */
document.addEventListener("click",function(e){
  var a=e.target && e.target.closest ? e.target.closest('a[href^="data:"]') : null;
  if(!a || a.hasAttribute("download")) return;
  e.preventDefault();
  var u=a.getAttribute("href");
  if(/^data:application\/pdf/.test(u)) pdfAnsicht(u, a.dataset.name||"Auftrag");
  else bildAnsicht(u, a.getAttribute("title")||"Ansicht");
});

function leseLidlPdf(datei){
  /* das Original merken – es wird beim Protokoll abgelegt */
  var roh=null;
  return ladePdfJs().then(function(){ return dateiAlsDatenUrl(datei); })
    .then(function(u){ roh=u; return datei.arrayBuffer(); }).then(function(buf){
    return window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  }).then(function(pdf){
    var seiten=[]; for(var i=1;i<=Math.min(pdf.numPages,2);i++) seiten.push(i);
    return Promise.all(seiten.map(function(n){
      return pdf.getPage(n).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
        /* Seite 2 nach unten versetzen, damit sich Zeilen nicht überlagern */
        return tc.items.map(function(it){ return {s:it.str, x:Math.round(it.transform[4]), y:Math.round(it.transform[5])-(n-1)*2000}; });
      });
    })).then(function(listen){
      var teile=[].concat.apply([],listen);
      var lesbar=textIstLesbar(teile);
      return pdfSeitenAlsBild(pdf, 2).then(function(bilder){
        var a = lesbar ? werteLidlAuftrag(teile) : {};
        a._lesbar=lesbar; a._seiten=bilder;
        a._pdfName=datei.name||"auftrag.pdf"; a._pdfDaten=roh;
        return a;
      });
    });
  });
}

/* Kostenstelle AT0234 -> Filiale 234; sonst über die Adresse */
function standortZuAuftrag(a){
  var m=/AT0*(\d+)/i.exec(a.kostenstelle||"");
  if(m){ var tr=ST.filter(function(s){ return String(s.filiale||"").replace(/^0+/,"")===m[1]; }); if(tr.length) return tr[0]; }
  if(a.adresse){
    var norm=function(t){ return String(t||"").toLowerCase().replace(/straße|strasse/g,"str").replace(/[^a-z0-9äöüß]/g,""); };
    var plz=(/\b(\d{4})\b/.exec(a.adresse)||[])[1], strasse=norm(a.adresse.split(",")[0]);
    var tr2=ST.filter(function(s){ return (!plz||s.plz===plz) && strasse && norm(s.adresse).indexOf(strasse)>=0; });
    if(tr2.length===1) return tr2[0];
  }
  return null;
}

/* QR-Code mit der Kamera lesen. Nimmt die eingebaute Erkennung des Browsers,
   wo es sie gibt (Android), sonst eine kleine Bibliothek (iPhone). */
function scanneQr(){
  return new Promise(function(fertig){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast("Dieser Browser erlaubt keinen Kamerazugriff."); fertig(null); return; }
    var ov=el('<div class="qrscan"><div class="qrbox"><video playsinline muted></video><div class="qrrahmen"></div></div>'+
      '<div class="qrtext">QR-Code des Lidl-Auftrags in den Rahmen halten</div>'+
      '<button class="btn" type="button">Abbrechen</button></div>');
    document.body.appendChild(ov);
    var video=ov.querySelector("video"), strom=null, aus=false, cv=document.createElement("canvas");
    var ende=function(wert){
      if(aus) return; aus=true;
      if(strom) strom.getTracks().forEach(function(t){ t.stop(); });
      ov.remove(); fertig(wert);
    };
    ov.querySelector("button").onclick=function(){ ende(null); };
    var erkenner=null;
    var vorbereitet = ("BarcodeDetector" in window)
      ? Promise.resolve().then(function(){ erkenner=new window.BarcodeDetector({formats:["qr_code"]}); })
          .catch(function(){ return window.jsQR?null:ladeSkript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"); })
      : (window.jsQR?Promise.resolve():ladeSkript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"));
    Promise.all([vorbereitet, navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false})])
      .then(function(r){
        strom=r[1]; if(aus){ ende(null); return; }
        video.srcObject=strom; return video.play();
      }).then(function(){
        var runde=function(){
          if(aus) return;
          var w=video.videoWidth, h=video.videoHeight;
          if(!w){ setTimeout(runde,150); return; }
          var weiter=function(wert){ if(wert) ende(wert); else setTimeout(runde,180); };
          if(erkenner){
            erkenner.detect(video).then(function(c){ weiter(c.length?c[0].rawValue:null); }, function(){ weiter(null); });
          } else {
            var sk=Math.min(1, 800/Math.max(w,h)); cv.width=Math.round(w*sk); cv.height=Math.round(h*sk);
            var g=cv.getContext("2d"); g.drawImage(video,0,0,cv.width,cv.height);
            var q=window.jsQR(g.getImageData(0,0,cv.width,cv.height).data, cv.width, cv.height);
            weiter(q?q.data:null);
          }
        };
        runde();
      }).catch(function(e){
        toast(e && e.name==="NotAllowedError" ? "Kamerazugriff wurde nicht erlaubt." : "Kamera nicht verfügbar: "+(e&&e.message||e));
        ende(null);
      });
  });
}

/* ================= Geführtes Protokoll =================
   Derselbe Ablauf wie bei den Anlagendaten: ein Thema je Schritt, große
   Knöpfe, am Ende eine Übersicht. Der Dialog füllt das Formular darunter
   aus – gespeichert wird also genau wie bisher, mit Fotos, Anlagendaten
   und Unterschrift. */
function protokollAssistent(form, stoer){
  var ov=el('<div class="assistent" role="dialog" aria-modal="true"><div class="as-karte">'+
    '<div class="as-kopf"><div style="min-width:0"><div class="as-titel"></div><div class="as-schritt"></div></div>'+
      '<button class="btn ghost sm" type="button" data-as="zu">Schließen</button></div>'+
    '<div class="as-inhalt"></div><div class="as-fuss"></div></div></div>');
  document.body.appendChild(ov);
  document.body.style.overflow="hidden";
  var inhalt=ov.querySelector(".as-inhalt"), fuss=ov.querySelector(".as-fuss");
  var zu=function(){ ov.remove(); document.body.style.overflow=""; };
  ov.querySelector('[data-as="zu"]').onclick=function(){
    if(window.confirm("Dialog schließen? Das Eingetragene bleibt im Formular stehen, Sie können dort weitermachen.")) zu();
  };
  var f=function(sel){ return form.querySelector(sel); };
  var setz=function(sel,wert){ var n=f(sel); if(n){ n.value=wert; formDirty=true; } };
  var wert=function(sel){ var n=f(sel); return n?n.value:""; };

  /* ---- Bausteine ---- */
  function frage(text){ return '<div class="as-frage">'+esc(text)+"</div>"; }
  function feld(label, innen){ return '<div class="as-feld"><div class="as-label">'+esc(label)+"</div>"+innen+"</div>"; }
  function chips(werte, aktiv, auswahl){
    var box=el('<div class="chips"></div>');
    werte.forEach(function(w){
      var b=el('<button class="chip" type="button" aria-pressed="'+(w[0]===aktiv)+'">'+esc(w[1])+"</button>");
      b.onclick=function(){ auswahl(w[0]); box.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed", String(x===b)); }); };
      box.appendChild(b);
    });
    return box;
  }
  function textFeld(label, sel, mehrzeilig, platzhalter){
    var d=el('<div class="as-feld"><div class="as-label">'+esc(label)+"</div>"+
      (mehrzeilig?'<textarea rows="3"></textarea>':'<input type="text">')+"</div>");

    /* Ein Protokoll entsteht nach dem Einsatz. Ein Datum in der Zukunft ist
       immer ein Vertipper – und einer mit Folgen: liegt es im Fenster des
       nächsten Termins, gilt der als erledigt und die Wartung fällt aus. */
    var dfeld=form.querySelector("#f_datum"), heute=isoLokal(new Date());
    if(!fehlend.length && dfeld && dfeld.value && dfeld.value>heute){
      dfeld.style.borderColor="var(--crit)";
      box.textContent="Das Datum liegt in der Zukunft ("+dfmt(dfeld.value)+"). "+
        "Bitte den Tag eintragen, an dem der Einsatz war.";
      box.hidden=false;
      dfeld.scrollIntoView({behavior:"smooth", block:"center"});
      try{ dfeld.focus({preventScroll:true}); }catch(x){ dfeld.focus(); }
      return false;
    }
    /* Weit zurückliegende Nachträge gibt es, aber selten – einmal nachfragen. */
    if(!fehlend.length && dfeld && dfeld.value && dfeld.value < plusMonate(heute,-24) &&
       !window.confirm("Das Datum liegt mehr als zwei Jahre zurück ("+dfmt(dfeld.value)+").\n\nStimmt das?"))
      { dfeld.focus(); return false; }
    if(!fehlend.length){ box.hidden=true; return true; }
    box.textContent = fehlend.length===1
      ? "Es fehlt noch: "+(NAMEN[fehlend[0].id]||"ein Pflichtfeld")
      : "Es fehlen noch "+fehlend.length+" Angaben: "+
        fehlend.map(function(n){ return NAMEN[n.id]||n.id; }).join(", ");
    box.hidden=false;
    fehlend[0].scrollIntoView({behavior:"smooth", block:"center"});
    try{ fehlend[0].focus({preventScroll:true}); }catch(x){ fehlend[0].focus(); }
    return false;
  }

  /* ---- Angefangenes Protokoll auf dem Gerät halten ----
     Alles, was im Formular steht, wird laufend weggeschrieben: Felder,
     Haken, Mängel- und Materialzeilen, Fotos, Unterschrift und die vor Ort
     ergänzten Anlagendaten. Beim nächsten Öffnen fragt die App, ob es
     weitergehen soll. */
  function entwurfSammeln(){
    var d={art:stoer?"stoerung":"wartung", zeit:new Date().toISOString(),
      standort:form.querySelector("#f_standort").value||"",
      stoerungAus:S.stoerungAus||null,
      werte:{}, haken:{}, wahl:{},
      maengel:[], material:[], fotos:fotos.slice(),
      anlagenAend:JSON.parse(JSON.stringify(anlagenAend||{})),
      neueAnlagen:JSON.parse(JSON.stringify(neueAnlagen||[])),
      auftragSeiten:(geladenerAuftrag&&geladenerAuftrag._seiten)||null,
      auftragPdf:auftragPdf,
      unterschrift: form._sig.vorhanden() ? cv.toDataURL("image/png") : ""
    };
    form.querySelectorAll("input,select,textarea").forEach(function(n){
      if(!n.id) return;
      if(n.type==="checkbox"||n.type==="radio"){ if(n.checked) d.haken[n.id]=true; }
      else if(n.type!=="file") d.werte[n.id]=n.value;
    });
    form.querySelectorAll(".mangelrow").forEach(function(z){
      d.maengel.push({t:z.querySelector(".m-t").value, p:z.querySelector(".m-p").value, m:z.querySelector(".m-m").value});
    });
    if(matHost) Array.prototype.forEach.call(matHost.children,function(z){
      var t=z.querySelector(".mt-t"), m=z.querySelector(".mt-m");
      if(t) d.material.push({text:t.value, menge:m?m.value:""});
    });
    return d;
  }
  function entwurfEinsetzen(d){
    if(!d) return;
    if(d.standort){ var sel2=form.querySelector("#f_standort"); sel2.value=d.standort; if(sel2.onchange) sel2.onchange(); }
    Object.keys(d.werte||{}).forEach(function(id){
      var n=form.querySelector("#"+CSS.escape(id)); if(n && n.type!=="file") n.value=d.werte[id];
    });
    form.querySelectorAll('input[type="checkbox"],input[type="radio"]').forEach(function(n){
      if(n.id) n.checked=!!(d.haken&&d.haken[n.id]);
    });
    /* Mängel- und Materialzeilen in der gespeicherten Zahl wiederherstellen */
    mHost.innerHTML="";
    (d.maengel&&d.maengel.length?d.maengel:[null]).forEach(function(m){
      var z=addMangel();
      if(m){ z.querySelector(".m-t").value=m.t||""; z.querySelector(".m-p").value=m.p||""; z.querySelector(".m-m").value=m.m||""; }
    });
    if(stoer && matHost){
      matHost.innerHTML="";
      (d.material&&d.material.length?d.material:[null]).forEach(addMaterial);
    }
    fotos.length=0; (d.fotos||[]).forEach(function(f){ fotos.push(f); });
    fotosZeichnen();
    if(d.anlagenAend){ Object.keys(anlagenAend).forEach(function(k){ delete anlagenAend[k]; });
      Object.keys(d.anlagenAend).forEach(function(k){ anlagenAend[k]=d.anlagenAend[k]; }); }
    if(d.neueAnlagen){ neueAnlagen.length=0; d.neueAnlagen.forEach(function(n){ neueAnlagen.push(n); }); }
    anlagenZeichnen();
    if(d.auftragSeiten && d.auftragSeiten.length) auftragBildZeigen(d.auftragSeiten);
    if(d.auftragPdf && d.auftragPdf.datenUrl) auftragPdf=d.auftragPdf;
    if(d.unterschrift) form._sig.setzen(d.unterschrift);
    if(d.stoerungAus) S.stoerungAus=d.stoerungAus;
    formDirty=true;
  }
  /* Nicht bei jedem Tastendruck schreiben – das Gerät hat anderes zu tun. */
  var entwurfTakt=null;
  function entwurfMerken(){
    if(bearb) return;                 /* eine Korrektur ist kein Entwurf */
    clearTimeout(entwurfTakt);
    entwurfTakt=setTimeout(function(){
      /* Ein Fehler beim Zwischenspeichern darf das Formular nicht stoeren,
         soll aber nicht stillschweigend verschwinden. */
      try{ entwurfSchreiben(entwurfSammeln()); }
      catch(e){ if(window.console) console.warn("Entwurf nicht gespeichert:", e); }
    }, 1200);
  }
  form.addEventListener("input", entwurfMerken);
  form.addEventListener("change", entwurfMerken);
  form._entwurfMerken=entwurfMerken;   /* Fotos und Unterschrift melden sich selbst */

  /* Hinweis auf einen liegengebliebenen Entwurf – er kommt weiter unten
     direkt über das Formular. */
  var entwurfKasten=null;
  if(!bearb && entwurfStand && entwurfStand.werte){
    var e2=entwurfStand;
    var wieAlt=function(){
      var m=Math.round((Date.now()-new Date(e2.zeit).getTime())/60000);
      if(m<60) return "vor "+Math.max(1,m)+" Minuten";
      if(m<1440) return "vor "+Math.round(m/60)+" Stunden";
      return "vom "+tagFmt(e2.zeit);
    };
    var wo=byId[e2.standort];
    var kasten=el('<div class="note warnbox" style="margin-bottom:12px">'+
      "<strong>Angefangenes Protokoll gefunden</strong> – "+esc(wieAlt())+
      (wo?", "+esc(stName(wo)):"")+(e2.art==="stoerung"?" (Störung)":"")+
      ". Weitermachen oder verwerfen?"+
      '<div class="rowflex" style="margin-top:8px"><button class="btn sm" type="button" data-e="weiter">Weitermachen</button>'+
      '<button class="btn ghost sm" type="button" data-e="weg">Verwerfen</button></div></div>');
    kasten.querySelector('[data-e="weiter"]').onclick=function(){
      if(e2.art==="stoerung" && !stoer){ S.protoArt="stoerung"; render(); return; }
      if(e2.art!=="stoerung" && stoer){ S.protoArt="wartung"; render(); return; }
      entwurfEinsetzen(e2); kasten.remove();
      toast("Weiter, wo Sie aufgehört haben.");
    };
    kasten.querySelector('[data-e="weg"]').onclick=function(){
      if(!window.confirm("Das angefangene Protokoll verwerfen?\n\nDie Eingaben sind dann weg.")) return;
      entwurfWeg(); kasten.remove(); toast("Entwurf verworfen.");
    };
    entwurfKasten=kasten;
  }

  form.onsubmit=function(e){
    e.preventDefault();
    if(!pflichtPruefung()) return;
    var v=function(id){ var n=form.querySelector("#"+id); return n?n.value.trim():""; };
    var radio=function(name){ var n=form.querySelector('input[name="'+name+'"]:checked'); return n?n.value:""; };
    /* frühere, frei getippte Anlagenblöcke bleiben erhalten; sonst der aktuelle Stand der angehakten Anlagen */
    var anlagen = altAnlagen || anlagenSchnappschuss();
    var maengel=[];
    Array.prototype.forEach.call(mHost.children,function(b){
      var t=b.querySelector(".m-t").value.trim();
      if(!t) return;
      maengel.push({text:t,prio:b.querySelector(".m-p").value,massnahme:b.querySelector(".m-m").value.trim()});
    });
    var stSel=byId[v("f_standort")];
    var doc={
      standortId:v("f_standort"),
      positionIds:angehakt().concat(neueAnlagen.map(function(n){ return n.id; })),
      positionId:(form.querySelector('input[name="posw"]:checked')||{}).value||"",
      filiale:stSel?stSel.filiale:"", standortName:stSel?stName(stSel):"",
      adresse:v("f_adresse"), region:radio("fm"),
      datum:v("f_datum"), uhrzeit:v("f_zeit"),
      bestellnummer:v("f_bestell"), auftragsnummer:v("f_auftrag"),
      wartungsart:radio("wart")==="sonstige"?("sonstige: "+v("f_wart_sonst")):radio("wart"),
      firma:v("f_firma"), techniker:kanonName(v("f_tech")), kontakt:v("f_kontakt"),
      /* wer noch mitgearbeitet hat */
      mitarbeiter:[v("f_tech2"),v("f_tech3")].map(kanonName).filter(Boolean),
      subunternehmen:v("f_sub"), zertUnternehmen:v("f_zertu"), zertPerson:v("f_zertp"),
      anlagen:anlagen,
      arbeiten:Array.prototype.map.call(form.querySelectorAll('input[name="arbeit"]:checked'),function(x){return x.value;}),
      arbeitenSonstiges:v("f_arb_sonst"),
      maengel:maengel,
      betriebsbereit:radio("bereit"), sofortmassnahme:v("f_sofort"),
      ergebnis:Array.prototype.map.call(form.querySelectorAll('input[name="ergebnis"]:checked'),function(x){return x.value;}),
      bemerkungen:v("f_bem"),
      nameTechniker:kanonName(v("f_name")), auftraggebervertreter:v("f_agv"),
      unterschrift:hasSig?cv.toDataURL("image/png"):"",
      /* die Bilddaten liegen getrennt, im Protokoll steht nur der Verweis */
      fotos:fotos.map(function(f){ return {id:f.id, name:f.name, hinweis:f.hinweis, bytes:f.bytes}; }),
      erstellt:new Date().toISOString()
    };
    if(stoer){
      var so2={};
      STOER_AUFTRAG.concat(STOER_BEHEBUNG,STOER_TEXTE).forEach(function(f2){ so2[f2[0]]=v("s_"+f2[0]); });
      so2.material=[];
      Array.prototype.forEach.call(matHost.children,function(b){
        var t=b.querySelector(".mt-t").value.trim(); if(t) so2.material.push({text:t, menge:b.querySelector(".mt-m").value.trim()});
      });
      so2.folgeauftrag=form.querySelector("#s_folgeauftrag").checked;
      so2.folgeText=v("s_folgeText");
      /* woher die Auftragsdaten stammen – hilft beim Nachvollziehen */
      so2.quelle = geladenerAuftrag ? "pdf" : qrGescannt ? "qr" : (bearb&&bearb.stoerung&&bearb.stoerung.quelle) || "hand";
      /* Verweis auf das abgelegte Auftrags-PDF. Die Datei selbst liegt
         daneben, wie die Fotos – im Protokoll steht nur, dass es sie gibt. */
      var altePdf=bearb && bearb.stoerung && bearb.stoerung.auftragDatei;
      if(altePdf) so2.auftragDatei=altePdf;             /* liegt schon da und bleibt */
      else if(auftragPdf && auftragPdf.datenUrl)
        so2.auftragDatei={name:auftragPdf.name||"auftrag.pdf", bytes:datenUrlBytes(auftragPdf.datenUrl)};
      doc.stoerung=so2;
      doc.wartungsart="Störung";
    }
    lsSet("ukt_tech",doc.nameTechniker||doc.techniker);
    /* für die nächste Wartung merken */
    (function(){
      var k=kanonName(doc.techniker||doc.nameTechniker); if(!k) return;
      var m=lsGet("ukt_techdaten",{})||{};
      m[k]={zertp:doc.zertPerson||(m[k]||{}).zertp||"", kontakt:doc.kontakt||(m[k]||{}).kontakt||""};
      lsSet("ukt_techdaten",m);
      if(doc.zertUnternehmen) lsSet("ukt_zertu",doc.zertUnternehmen);
    })();
    var id="p_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
    var btn=form.querySelector("#save"); btn.disabled=true; btn.textContent="Speichern …";
    var fertig=function(msg){
      btn.disabled=false; btn.textContent="Protokoll speichern"; formDirty=false; toast(msg);
      entwurfWeg();          /* abgeschickt – der Entwurf hat seinen Zweck erfüllt */
      S.protoStandort=""; S.protoPos="";
      S.letztesProtokoll=id;     /* nach dem Neuzeichnen direkt aufklappen */
      /* Kam das Protokoll aus einer offenen Störung, ist die damit erledigt. */
      if(S.stoerungAus){
        var vor=OFFENE.filter(function(x){ return x._id===S.stoerungAus; })[0];
        S.stoerungAus=null;
        if(vor){
          var z=Object.assign({}, vor, {erledigt:new Date().toISOString(), protokollId:id});
          stoerungSpeichern(z, "Durch Störungsprotokoll vom "+dfmt(doc.datum)+" erledigt")
            .then(function(){ berechneFaelligkeiten(); render(); });
        }
      }
      berechneFaelligkeiten();   /* die gewarteten Positionen rücken sofort weiter */
      render();
    };
    var fehlschlag=function(text){
      /* Formular bleibt stehen – nichts von dem Eingegebenen geht verloren */
      btn.disabled=false; btn.textContent="Protokoll speichern";
      var box=form.querySelector("#f_fehlt");
      box.textContent=text; box.hidden=false;
      box.scrollIntoView({behavior:"smooth",block:"center"});
    };

    /* ---- Korrektur eines gespeicherten Protokolls ---- */
    if(bearb){
      var grund=v("f_grund");
      doc.erstellt=bearb.erstellt||doc.erstellt;
      doc.version=(bearb.version||1)+1;
      doc.geaendert=new Date().toISOString();
      doc.korrekturGrund=grund;
      if(!hasSig) doc.unterschrift=bearb.unterschrift||"";
      doc.fotos=(bearb.fotos||[]).concat(doc.fotos);   /* Fotos kommen nur dazu, keines verschwindet */
      var felder=vergleiche(bearb, doc);
      if(!felder.length){ fehlschlag("Es wurde nichts geändert – die Korrektur wird nicht gespeichert."); return; }

      var kid=bearb._id, aufGeraet=bearb._quelle==="geraet";
      btn.disabled=true; btn.textContent="Korrektur wird gespeichert …";
      var geraetFotos=aufGeraet ? (bearb._fotoDaten||[]).concat(fotos) : null;
      /* beim Korrigieren darf ein Auftrags-PDF nachgereicht werden; ein schon
         abgelegtes bleibt, wo es ist */
      var neuesPdf=(auftragPdf && auftragPdf.datenUrl && !(bearb.stoerung && bearb.stoerung.auftragDatei))
                   ? auftragPdf : null;
      var geraetAuftrag=aufGeraet ? (neuesPdf || bearb._auftragDaten || null) : null;
      (aufGeraet ? Promise.resolve(true)
                 : speichereFotos(kid, fotos).then(function(ok2){
                     return ok2 ? speichereAuftragPdf(kid, neuesPdf) : false; })
      ).then(function(fotosOk){
        if(!fotosOk){ fehlschlag("Die neuen Fotos ließen sich nicht übertragen – die Korrektur ist noch nicht gespeichert. Bitte bei Verbindung erneut versuchen."); return; }
        aktualisiereProtokoll(kid, doc, bearb._quelle, geraetFotos, geraetAuftrag).then(function(ok){
          if(!ok){ fehlschlag("Die Korrektur konnte nicht gespeichert werden"+(Store.fehler?" ("+Store.fehler+")":"")+". Ihre Eingaben sind noch da."); return; }
          anlagenUebernehmen(doc);
          protokolliere({art:"korrigiert", protokollId:kid, standortId:doc.standortId,
                         standortName:doc.standortName, grund:grund, felder:felder});
          (aufGeraet ? lokaleNeuLaden() : Promise.resolve()).then(function(){
            formDirty=false; S.bearbeiten=null; S.letztesProtokoll=kid;
            toast("Korrektur gespeichert – "+felder.length+" Feld"+(felder.length===1?"":"er")+" geändert.");
            berechneFaelligkeiten(); render();
          });
        });
      });
      return;
    }

    /* 1. immer zuerst sicher aufs Gerät – das klappt auch im Funkloch */
    var eintrag={id:id, doc:doc, fotos:fotos, auftrag:(auftragPdf&&auftragPdf.datenUrl)?auftragPdf:null,
                 erstellt:doc.erstellt};
    idbSchreiben(eintrag).then(function(){
      anlagenUebernehmen(doc);   /* vor Ort ergänzte Anlagendaten */
      lokaleProtokolle.unshift(eintrag);
      protokolliere({art:"angelegt", protokollId:id, standortId:doc.standortId, standortName:doc.standortName,
                     felder:[{feld:"positionIds", name:"Gewartete Anlagen", alt:"–", neu:feldText("positionIds",doc.positionIds)}]});

      /* 2. gibt es eine zentrale Ablage, gleich dorthin übertragen */
      if(Store.modus!=="claude" && Store.modus!=="supabase"){
        fertig("Protokoll gespeichert"+(fotos.length?" – mit "+fotos.length+" Foto(s)":"")+".");
        return;
      }
      var wartet="Auf dem Gerät gespeichert – wird übertragen, sobald Verbindung besteht.";
      if(fotos.length) btn.textContent="Fotos werden übertragen …";
      speichereFotos(id,fotos).then(function(fotosOk){
        if(!fotosOk){ fertig(wartet); return; }
        if(eintrag.auftrag) btn.textContent="Auftrag wird übertragen …";
        return speichereAuftragPdf(id, eintrag.auftrag).then(function(pdfOk){
          if(!pdfOk){ fertig(wartet); return; }
          btn.textContent="Übertragen …";
          return speichereProtokoll(id,doc).then(function(ok){
            if(!ok){ fertig(wartet); return; }
            return idbLoeschen(id).then(function(){
              lokaleProtokolle=lokaleProtokolle.filter(function(x){ return x.id!==id; });
              fertig("Protokoll gespeichert und übertragen.");
            },function(){ fertig("Protokoll gespeichert und übertragen."); });
          });
        });
      });
    },function(err){
      fehlschlag("Das Protokoll konnte auf diesem Gerät nicht gespeichert werden: "+
        (err&&err.message?err.message:"unbekannter Fehler")+
        ". Ihre Eingaben sind noch da. Häufigste Ursache: privates Browserfenster oder voller Speicher – "+
        "bitte in einem normalen Fenster öffnen oder Fotos entfernen und erneut speichern.");
    });
  };

  var head = bearb
    ? el('<div class="card" style="border-color:var(--warn)"><div class="pad stack">'+
        '<div><h2>Protokoll korrigieren</h2><div class="sub">Protokoll vom <strong>'+dfmt(bearb.datum)+"</strong>"+
        (protoName(bearb)?" – "+esc(protoName(bearb)):"")+". Ändern Sie, was falsch ist, und geben Sie unten den Grund an. "+
        "Die bisherige Fassung bleibt im Änderungsverlauf nachvollziehbar.</div></div>"+
      "</div></div>")
    : el('<div class="card"><div class="pad stack">'+
        '<div class="modus" role="group" aria-label="Art des Protokolls">'+
          '<button type="button" data-art="wartung" aria-pressed="'+(!stoer)+'">Wartung</button>'+
          '<button type="button" data-art="stoerung" aria-pressed="'+stoer+'">Störung</button></div>'+
        (stoer
          ? '<div><h2>Störungsprotokoll Klimaanlage</h2><div class="sub">Einsatz auf einen Lidl-Störungsauftrag. '+
            "Erscheint in der Anlagenhistorie, verschiebt aber keinen Wartungstermin.</div></div>"
          : '<div><h2>Wartungsprotokoll Klimaanlage</h2><div class="sub">Digitale Fassung des Einseiters. '+
            (s?"Vorbelegt für <strong>"+esc(stName(s))+"</strong>.":"Standort unten auswählen oder aus Liste bzw. Karte heraus öffnen.")+"</div></div>")+
        '<div class="rowflex"><button class="btn" type="button" id="p_gefuehrt">Schritt für Schritt ausfüllen</button>'+
          '<span class="muted" style="font-size:12.5px">ein Thema nach dem anderen – am Handy meist schneller</span></div>'+
      "</div></div>");
  var gefuehrt=head.querySelector("#p_gefuehrt");
  if(gefuehrt) gefuehrt.onclick=function(){ protokollAssistent(form, stoer); };
  head.querySelectorAll("[data-art]").forEach(function(b){
    b.onclick=function(){
      var ziel=b.getAttribute("data-art");
      if((ziel==="stoerung")===stoer) return;
      if(formDirty && !window.confirm("Das Formular enthält Eingaben. Wirklich wechseln? Die Eingaben gehen verloren.")) return;
      formDirty=false; S.protoArt=ziel; render(); window.scrollTo({top:0});
    };
  });
  if(Store.modus==="supabase" && Store.sb && !bearb) f.appendChild(kontoKarte());
  f.appendChild(head);
  if(entwurfKasten) f.appendChild(entwurfKasten);
  var body=el('<div class="card"><div class="pad"></div></div>');
  body.querySelector(".pad").appendChild(form);
  f.appendChild(body);

  /* gespeicherte Protokolle: zentral abgelegte und die auf diesem Gerät */
  var alle=alleProtokolle();
  var teile=[];
  if(Store.modus==="claude"||Store.modus==="supabase") teile.push(protokolle.length+" in der gemeinsamen Ablage");
  if(lokaleProtokolle.length) teile.push(lokaleProtokolle.length+" auf diesem Gerät");
  var unterzeile = alle.length
    ? teile.join(" · ")+". Antippen öffnet das Protokoll – dort auch Drucken und PDF."
    : "Noch keine Protokolle erfasst.";
  /* Admins können gelöschte Protokolle einblenden, um sie wiederherzustellen */
  var anzGeloescht=alleProtokolle(true).length-alle.length;
  if(Admin.frei && S.zeigeGeloeschte) alle=alleProtokolle(true);
  var gesp=el('<div class="card"><div class="pad stack">'+
    "<div><h2>Gespeicherte Protokolle</h2>"+
    '<div class="sub">'+unterzeile+"</div></div>"+
    (Admin.frei && anzGeloescht ? '<div class="chips"><button class="chip" type="button" id="p_geloescht" aria-pressed="'+
      (!!S.zeigeGeloeschte)+'">gelöschte anzeigen ('+anzGeloescht+")</button></div>" : "")+
    '<div class="scrollx" id="plist"></div></div></div>');
  var chipG=gesp.querySelector("#p_geloescht");
  if(chipG) chipG.onclick=function(){ S.zeigeGeloeschte=!S.zeigeGeloeschte; render(); };
  var pl=gesp.querySelector("#plist");
  if(alle.length){
    var tbl=el('<table class="dt"><thead><tr><th>Datum</th><th>Standort</th><th>Techniker/in</th>'+
      "<th>Art</th><th>Mängel</th><th>Fotos</th><th>Ablage</th></tr></thead><tbody></tbody></table>");
    var tb=tbl.querySelector("tbody");
    alle.slice(0,60).forEach(function(x){
      var tr=el("<tr style='cursor:pointer"+(x.geloescht?";opacity:.55;text-decoration:line-through":"")+"'><td class='mono'>"+dfmt(x.datum)+"</td><td>"+esc(protoName(x)||"–")+
        "</td><td>"+esc(kanonName(x.nameTechniker||x.techniker)||"–")+"</td><td>"+
        (istStoerung(x)?'<span class="tag st">Störung</span>':esc(x.wartungsart||"–"))+
        "</td><td class='mono'>"+((x.maengel||[]).length||"0")+"</td>"+
        "<td class='mono'>"+((x.fotos||[]).length||"0")+"</td>"+
        "<td>"+(x._quelle==="geraet"?'<span class="tag">Gerät</span>':'<span class="tag f30">gemeinsam</span>')+"</td></tr>");
      tr.onclick=function(){
        var ziel=gesp.querySelector("#pdetail");
        ziel.innerHTML=""; ziel.appendChild(protokollDetail(x));
        ziel.scrollIntoView({behavior:"smooth",block:"start"});
      };
      tb.appendChild(tr);
    });
    pl.appendChild(tbl);
    gesp.querySelector(".stack").appendChild(el('<div id="pdetail"></div>'));
    if(S.letztesProtokoll){
      var neu=alle.filter(function(x){ return x._id===S.letztesProtokoll; })[0];
      S.letztesProtokoll=null;
      if(neu){
        var ziel=gesp.querySelector("#pdetail");
        ziel.appendChild(protokollDetail(neu));
        setTimeout(function(){ ziel.scrollIntoView({behavior:"smooth",block:"start"}); },60);
      }
    }
  } else {
    pl.appendChild(el('<div class="muted" style="font-size:13px">Noch keine Protokolle erfasst.</div>'));
  }
  f.appendChild(gesp);
  return f;
}

/* Fotos ins Blatt setzen. Für das PDF als eingebettete Daten, sonst würde
   das Zeichnen an fremden Bildadressen scheitern. */
function fotosEinsetzen(host, p, eingebettet){
  if(!p.fotos || !p.fotos.length){ host.innerHTML=""; return Promise.resolve(); }
  host.innerHTML="<h2>Fotos</h2><div>werden geladen …</div>";
  return ladeFotos(p).then(function(bilder){
    var alsDaten=function(url){
      if(!eingebettet || !url || url.indexOf("data:")===0) return Promise.resolve(url);
      return fetch(url).then(function(r){ return r.blob(); }).then(function(b){
        return new Promise(function(ok){ var fr=new FileReader(); fr.onload=function(){ ok(fr.result); }; fr.onerror=function(){ ok(null); }; fr.readAsDataURL(b); });
      }).catch(function(){ return null; });
    };
    return Promise.all(bilder.map(function(b){ return alsDaten(b.url).then(function(u){ return Object.assign({},b,{url:u}); }); }))
      .then(function(fertig){
        host.innerHTML="<h2>Fotos</h2><div class='fotos'>"+fertig.map(function(b){
          return "<figure>"+(b.url?'<img alt="" src="'+b.url+'">':"<div>Bild nicht abrufbar</div>")+
            "<figcaption>"+esc(b.hinweis||b.name||"")+"</figcaption></figure>";
        }).join("")+"</div>";
      });
  });
}

function druckeProtokoll(p){

function druckansichtZeigen(p){
  var alt=document.getElementById("druckansicht"); if(alt) alt.remove();

    '<div class="druckleiste">'+

      '<button class="btn ghost" type="button" id="d_zu" style="background:#fff">Schließen</button>'+
    "</div>"+
    '<div class="blatt">'+blattInhalt(p)+"</div>";
  document.body.appendChild(ov);
  document.body.classList.add("druckmodus");
  var zu=function(){ ov.remove(); document.body.classList.remove("druckmodus"); };
  ov.querySelector("#d_zu").onclick=zu;
  ov.querySelector("#d_druck").onclick=function(){ window.print(); };
  /* Eigenes PDF statt Druckdialog: ohne Kopf- und Fußzeile des Browsers
     (Adresse der Seite, Datum, Seitenzahlen) und ohne leere Seiten. */
  var pdfKnopf=ov.querySelector("#d_pdf");
  pdfKnopf.onclick=function(){
    pdfKnopf.disabled=true; pdfKnopf.textContent="PDF wird erstellt …";
    pdfErzeugen(p).then(function(blob){
      var name=(istStoerung(p)?"Stoerungsprotokoll_":"Wartungsprotokoll_")+
        String(protoName(p)||"").replace(/[\\/:*?"<>|]/g,"").replace(/\s+/g,"-")+"_"+(p.datum||"")+".pdf";
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download=name; a.rel="noopener";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },4000);
      pdfKnopf.disabled=false; pdfKnopf.textContent="Als PDF speichern";
      toast("PDF erstellt.");
    }, function(e){
      pdfKnopf.disabled=false; pdfKnopf.textContent="Als PDF speichern";
      toast("PDF ließ sich nicht erstellen: "+(e&&e.message||e));
    });
  };
  fotosEinsetzen(ov.querySelector('[data-rolle="fotos"]'), p, false);
}

/* ---------------- PDF für das Archiv ----------------
   Das Blatt wird unsichtbar aufgebaut, als Bild gezeichnet und auf
   A4-Seiten verteilt – Seitenumbrüche nur zwischen Zeilen und Abschnitten. */
var PDF_BIBLIOTHEKEN=[
  "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
];
var pdfBereit=null, pdfInArbeit={};
function ladePdfBibliotheken(){
  if(pdfBereit) return pdfBereit;
  pdfBereit=PDF_BIBLIOTHEKEN.reduce(function(kette,src){
    return kette.then(function(){ return new Promise(function(ok,nok){
      var s=document.createElement("script"); s.src=src; s.onload=ok;
      s.onerror=function(){ pdfBereit=null; nok(new Error("PDF-Werkzeug nicht ladbar")); };
      document.head.appendChild(s);
    }); });
  }, Promise.resolve());
  return pdfBereit;
}
function bilderGeladen(host){
  var imgs=Array.prototype.slice.call(host.querySelectorAll("img"));
  return Promise.all(imgs.map(function(i){
    if(i.complete && i.naturalWidth) return Promise.resolve();
    return new Promise(function(ok){ i.onload=ok; i.onerror=ok; setTimeout(ok,8000); });
  }));
}
function pdfErzeugen(p){
  return ladeUnterschrift(p).then(ladePdfBibliotheken).then(function(){
    var BREITE=794;                                  /* A4 bei 96 dpi */
    var huelle=document.createElement("div");
    huelle.style.cssText="position:fixed;left:-12000px;top:0;width:"+BREITE+"px;background:#fff;z-index:-1";
    huelle.innerHTML='<div class="blatt" style="background:#fff;color:#111;font:12.5px/1.45 \'IBM Plex Sans\',\'Segoe UI\',Arial,sans-serif;padding:4px 6px;box-sizing:border-box;width:'+BREITE+'px">'+
      blattInhalt(p)+"</div>";
    document.body.appendChild(huelle);
    var blatt=huelle.querySelector(".blatt");
    return fotosEinsetzen(blatt.querySelector('[data-rolle="fotos"]'), p, true)
      .then(function(){ return bilderGeladen(blatt); })
      .then(function(){
        /* mögliche Umbruchstellen: Unterkanten von Zeilen, Überschriften, Fotos */
        var oben=blatt.getBoundingClientRect().top, stellen=[];
        blatt.querySelectorAll("tr, h2, h1, .kopf, .kaestchen > div, figure, .fuss, table").forEach(function(e){
          stellen.push(Math.round(e.getBoundingClientRect().bottom-oben));
        });
        stellen.sort(function(a,b){ return a-b; });
        var hoehe=blatt.scrollHeight;
        /* Obergrenze für die Zeichenfläche – Safari am iPhone verweigert mehr als ~16 Mio. Pixel */
        var skala=Math.min(2, Math.sqrt(14e6/(BREITE*hoehe)));
        return window.html2canvas(blatt,{scale:skala, backgroundColor:"#ffffff", useCORS:true, logging:false})
          .then(function(bild){ return {bild:bild, stellen:stellen, hoehe:hoehe, skala:skala}; });
      })
      .then(function(r){
        document.body.removeChild(huelle);
        var jsPDF=window.jspdf.jsPDF;
        var doc=new jsPDF({unit:"mm", format:"a4", compress:true});
        var RAND=10, nutzB=210-2*RAND, nutzH=297-2*RAND-6;          /* 6 mm für die Seitenzahl */
        var pxProMm=BREITE/nutzB, seitePx=Math.floor(nutzH*pxProMm);
        var seiten=[], start=0;
        while(start < r.hoehe-2){
          var grenze=start+seitePx, ende=grenze;
          if(grenze < r.hoehe){
            var passend=r.stellen.filter(function(y){ return y>start+seitePx*0.5 && y<=grenze; });
            if(passend.length) ende=passend[passend.length-1];
          } else ende=r.hoehe;
          seiten.push([start,ende]); start=ende;
        }
        seiten.forEach(function(s,i){
          if(i) doc.addPage();
          var hPx=s[1]-s[0];
          var teil=document.createElement("canvas");
          teil.width=r.bild.width; teil.height=Math.max(1,Math.round(hPx*r.skala));
          var g=teil.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,teil.width,teil.height);
          g.drawImage(r.bild, 0, Math.round(s[0]*r.skala), r.bild.width, teil.height, 0, 0, teil.width, teil.height);
          doc.addImage(teil.toDataURL("image/jpeg",0.86),"JPEG",RAND,RAND,nutzB,hPx/pxProMm);
          doc.setFontSize(8); doc.setTextColor(120);
          doc.text((istStoerung(p)?"Störungsprotokoll ":"Wartungsprotokoll ")+protoName(p)+" vom "+dfmt(p.datum)+"  -  Seite "+(i+1)+" von "+seiten.length,
                   105, 297-RAND+1, {align:"center"});
        });
        doc.setProperties({title:(istStoerung(p)?"Störungsprotokoll ":"Wartungsprotokoll ")+protoName(p)+" "+dfmt(p.datum),
          subject:"Lidl Klimaanlagen - Protokoll "+(p._id||""), author:"Kammerlander Umwelt- und Klimatechnik GmbH",
          creator:"Wartungsleitstand"});
        return doc.output("blob");
      }, function(e){ if(huelle.parentNode) document.body.removeChild(huelle); throw e; });
  });
}

/* PDF in Supabase ablegen, von dort holt es die Synology ab.
   Der Pfad hängt nur an der Kennung – den lesbaren Dateinamen vergibt die Synology. */
function berichtAblegen(p){
  if(Store.modus!=="supabase" || !Store.sb || !p || !p._id) return Promise.resolve(false);
  if(pdfInArbeit[p._id]) return pdfInArbeit[p._id];
  /* Archiv noch nicht eingerichtet (SQL-Abschnitt fehlt): gar nicht erst ein PDF bauen */
  return archivEingerichtet().then(function(an){ return an ? berichtErzeugenUndAblegen(p) : false; });
}
var archivStatus=null;
function archivEingerichtet(){
  if(!archivStatus) archivStatus=Store.sb.from("berichte").select("client_id").limit(1)
    .then(function(r){ return !r.error; }, function(){ archivStatus=null; return false; });
  return archivStatus;
}
function berichtErzeugenUndAblegen(p){
  var jahr=String(p.datum||"").slice(0,4)||"ohne-datum", pfad=jahr+"/"+p._id+".pdf";
  var offen=lsGet("ukt_pdf_offen",[]);
  var merken=function(){ if(offen.indexOf(p._id)<0){ offen.push(p._id); lsSet("ukt_pdf_offen",offen); } return false; };
  var lauf=pdfErzeugen(p).then(function(blob){
    return Store.sb.storage.from("berichte").upload(pfad, blob, {contentType:"application/pdf", upsert:true})
      .then(function(r){
        if(r.error){ Store.fehler=r.error.message; return merken(); }
        return Store.sb.from("berichte").upsert({client_id:p._id, version:p.version||1, pfad:pfad,
          erstellt:new Date().toISOString()},{onConflict:"client_id"}).then(function(r2){
            if(r2.error){ Store.fehler=r2.error.message; return merken(); }
            lsSet("ukt_pdf_offen", lsGet("ukt_pdf_offen",[]).filter(function(x){ return x!==p._id; }));
            return true;
          });
      });
  }).catch(function(e){ Store.fehler=e&&e.message; return merken(); })
    .then(function(x){ delete pdfInArbeit[p._id]; return x; });
  pdfInArbeit[p._id]=lauf;
  return lauf;
}
/* was beim letzten Mal nicht klappte (Funkloch), erneut versuchen */
function offeneBerichteNachholen(){
  if(Store.modus!=="supabase") return;
  var offen=lsGet("ukt_pdf_offen",[]);
  if(!offen.length) return;
  var i=0;
  var weiter=function(){
    if(i>=offen.length) return;
    var id=offen[i++];
    var p=(protokolle||[]).filter(function(x){ return x._id===id && !x.geloescht; })[0];
    if(!p){ lsSet("ukt_pdf_offen", lsGet("ukt_pdf_offen",[]).filter(function(x){ return x!==id; })); return weiter(); }
    berichtAblegen(p).then(weiter);
  };
  weiter();
}

    var ja=panel.querySelector('[data-rolle="loeschja"]');
    ja.textContent = wiederher?"Wiederherstellen":"Protokoll löschen";
    ja.style.background = wiederher?"":"var(--crit)"; ja.style.borderColor = wiederher?"":"var(--crit)";
    var feld=panel.querySelector('[data-rolle="loeschgrund"]'); feld.value=""; feld.focus();
    var fehl=panel.querySelector('[data-rolle="loeschfehler"]'); fehl.hidden=true;
    ja.onclick=function(){
      var grund=feld.value.trim();
      if(!grund){ fehl.textContent="Bitte einen Grund angeben – er wird im Änderungsverlauf festgehalten."; fehl.hidden=false; return; }
      ja.disabled=true; ja.textContent= wiederher?"Wird wiederhergestellt …":"Wird gelöscht …";

        if(!ok){
          ja.disabled=false; ja.textContent= wiederher?"Wiederherstellen":"Protokoll löschen";
          fehl.textContent=Store.fehler||"Das hat nicht geklappt."; fehl.hidden=false; return;
        }
        toast(wiederher?"Protokoll wiederhergestellt.":"Protokoll gelöscht.");
        berechneFaelligkeiten(); render();

    panel.querySelector('[data-rolle="loeschnein"]').onclick=function(){ panel.hidden=true; };

  };

  if(loeschKnopf) loeschKnopf.onclick=function(){ oeffnePanel(false); };
  var wiederKnopf=d.querySelector('[data-akt="wiederher"]');

  };

               :'<div class="note warnbox" style="font-size:12px">Bild nicht abrufbar</div>')+
          '<figcaption class="muted" style="font-size:12px;margin-top:4px">'+esc(b.hinweis||b.name||"")+"</figcaption></figure>"));
      });
      fh.appendChild(g);
    });
  }
  return d;
}

/* ---------- View: Datenbasis ---------- */
/* ---------- Wartungshistorie einer Filiale ----------
   Führt die Einträge aus der Excel-Liste und die Protokolle der App
   zusammen: wer hat wann welche Anlage gewartet. */
function historieEintraege(s){
  var zeilen=[];
  s.pos.forEach(function(p){
    (p.historie||[]).forEach(function(d){
      zeilen.push({datum:d, anlage:anlagenName(p), art:p.intervall.art,
        techniker:kanonName((p.techniker&&p.techniker[d.slice(0,4)])||""), quelle:"Liste"});
    });
  });
  alleProtokolle().forEach(function(pr){
    if(pr.standortId!==s.id || !pr.datum) return;
    var ids=(pr.positionIds&&pr.positionIds.length)?pr.positionIds:(pr.positionId?[pr.positionId]:[]);
    var stoe=istStoerung(pr);
    zeilen.push({datum:pr.datum, anlage:ids.length?feldText("positionIds",ids):"(Markt allgemein)",
      art:stoe ? ("Störung"+(pr.stoerung&&pr.stoerung.problemtyp?": "+pr.stoerung.problemtyp:"")) : (pr.wartungsart||""),
      stoerung:stoe, techniker:kanonName(pr.nameTechniker||pr.techniker||""), quelle:"App", protokoll:pr});
  });
  return zeilen.sort(function(a,b){ return b.datum.localeCompare(a.datum); });
}
function historieAnsicht(s){
  var box=document.createElement("div");
  box.className="stack";
  var z=historieEintraege(s);
  if(!z.length){ box.appendChild(el('<div class="muted">Für diesen Standort ist keine Wartung erfasst.</div>')); return box; }
  var anzStoer=z.filter(function(e){ return e.stoerung; }).length, anzWart=z.length-anzStoer;

  /* wer war in den letzten Jahren hier – auf einen Blick */
  var wer={}; z.forEach(function(e){ if(e.techniker) wer[e.techniker]=(wer[e.techniker]||0)+1; });
  var namen=Object.keys(wer).sort(function(a,b){ return wer[b]-wer[a]; });
  var ohneName=z.filter(function(e){ return !e.techniker; }).length;
  box.appendChild(el('<dl class="dl">'+
    "<dt>Letzter Besuch</dt><dd class='mono'>"+(s.letzterBesuch?dfmt(s.letzterBesuch):"—")+"</dd>"+
    "<dt>Wartungen erfasst</dt><dd>"+anzWart+" seit "+z[z.length-1].datum.slice(0,4)+"</dd>"+
    (anzStoer?"<dt>Störungseinsätze</dt><dd>"+anzStoer+"</dd>":"")+
    "<dt>Techniker</dt><dd>"+(namen.length?namen.map(function(n){ return esc(n)+" ("+wer[n]+"×)"; }).join(", "):"in der Liste nicht eingetragen")+
      (ohneName&&namen.length?' <span class="muted">· '+ohneName+" ohne Namen</span>":"")+"</dd>"+
  "</dl>"));

  var jahre={}; z.forEach(function(e){ var j=e.datum.slice(0,4); (jahre[j]=jahre[j]||[]).push(e); });
  Object.keys(jahre).sort().reverse().forEach(function(j){
    var nS=jahre[j].filter(function(e){ return e.stoerung; }).length, nW=jahre[j].length-nS;
    var t=el('<div><div class="chart-t" style="margin-bottom:4px">'+j+' <span class="muted mono" style="font-size:12px;font-weight:400">· '+
      [nW?nW+" Wartung"+(nW===1?"":"en"):"", nS?nS+" Störung"+(nS===1?"":"en"):""].filter(Boolean).join(" · ")+'</span></div>'+
      '<div class="scrollx"><table class="dt"><thead><tr><th>Datum</th><th>Anlage</th><th>Art</th><th>Techniker/in</th><th>Quelle</th></tr></thead>'+
      "<tbody></tbody></table></div></div>");
    var tb=t.querySelector("tbody");
    jahre[j].forEach(function(e){
      var tr=el("<tr><td class='mono'>"+dfmt(e.datum)+"</td><td>"+esc(e.anlage)+"</td><td>"+
        (e.stoerung?'<span class="tag st">Störung</span> '+esc(e.art.replace(/^Störung:?\s*/,"")):esc(e.art))+
        "</td><td>"+(e.techniker?esc(e.techniker):'<span class="muted">–</span>')+"</td><td>"+
        (e.quelle==="App"?'<span class="tag f30">Protokoll</span>':'<span class="tag">Liste</span>')+"</td></tr>");
      if(e.protokoll){
        tr.style.cursor="pointer";
        tr.title="Protokoll öffnen";
        tr.onclick=function(){ S.letztesProtokoll=e.protokoll._id; S.view="protokoll"; render(); };
      }
      tb.appendChild(tr);
    });
    box.appendChild(t);
  });
  return box;
}

var ART_TEXT={angelegt:"Protokoll angelegt", korrigiert:"Protokoll korrigiert", geloescht:"Protokoll gelöscht",
              wiederhergestellt:"Protokoll wiederhergestellt", stammdaten:"Stammdaten geändert"};
var ART_KLASSE={angelegt:"p-erledigt", korrigiert:"p-faellig", geloescht:"p-ueberfaellig",
                wiederhergestellt:"p-erledigt", stammdaten:"p-geplant"};
function zeitFmt(iso){
  if(!iso) return "–";
  var d=new Date(iso);
  return dfmt(isoLokal(d))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

/* ---------- Übersicht zum Mitnehmen ----------
   Was zuletzt gemacht wurde und was als Nächstes ansteht – als CSV für
   Excel oder als Ausdruck bzw. PDF. */
function berichtDaten(tageZurueck, tageVoraus, region){
  var heute=isoLokal(new Date());
  var von=isoLokal(new Date(Date.now()-tageZurueck*86400000));
  var bis=isoLokal(new Date(Date.now()+tageVoraus*86400000));
  var passt=function(s){ return !region || s.region===region; };
  var rueck=[];
  alleProtokolle().forEach(function(p){
    if(!p.datum || p.datum<von || p.datum>heute) return;
    var s=byId[p.standortId];
    if(s && !passt(s)) return;
    if(!s && region) return;
    var ids=(p.positionIds&&p.positionIds.length)?p.positionIds:(p.positionId?[p.positionId]:[]);
    rueck.push({datum:p.datum, markt:protoName(p), filiale:s?s.filiale:p.filiale, region:p.region||(s?s.region:""),
      anlage:ids.length?feldText("positionIds",ids):"(Markt allgemein)",
      art:istStoerung(p)?("Störung"+(p.stoerung&&p.stoerung.problemtyp?": "+p.stoerung.problemtyp:"")):(p.wartungsart||"Wartung"),
      techniker:kanonName(p.nameTechniker||p.techniker||""), maengel:(p.maengel||[]).length, quelle:"Protokoll"});
  });
  /* Termine aus der Excel-Liste, zu denen es kein App-Protokoll gibt */
  POS.forEach(function(p){
    var s=byId[p.standortId]; if(!s || !passt(s)) return;
    (p.historie||[]).forEach(function(d){
      if(d<von || d>heute) return;
      if(rueck.some(function(r){ return r.datum===d && r.markt===stName(s); })) return;
      rueck.push({datum:d, markt:stName(s), filiale:s.filiale, region:s.region, anlage:anlagenName(p),
        art:p.intervall.art, techniker:kanonName((p.techniker&&p.techniker[d.slice(0,4)])||""), maengel:"", quelle:"Liste"});
    });
  });
  rueck.sort(function(a,b){ return b.datum.localeCompare(a.datum); });

  var vor=[];
  POS.forEach(function(p){
    var s=byId[p.standortId]; if(!s || !passt(s) || !p.naechste || p.naechste>bis) return;
    vor.push({datum:p.naechste, status:STATUS_LABEL[p.status]||"", markt:stName(s), filiale:s.filiale, region:s.region,
      anlage:anlagenName(p), termin:p.intervall.art, letzte:p.letzte?dfmt(p.letzte):"—", adresse:s.adresse});
  });
