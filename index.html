<title>Wartungsleitstand Lidl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1F4F5; --surface:#FFFFFF; --surface-2:#E7ECEE; --surface-3:#DCE3E6;
  --ink:#0F1A20; --ink-2:#3C4D56; --ink-3:#6B7E88;
  --line:#D3DBDF; --line-2:#BFCBD1;
  --accent:#0E6E85; --accent-ink:#0A5566; --accent-soft:#D9EBF0;
  --crit:#B3342A; --crit-soft:#F7E2E0;
  --warn:#B6740F; --warn-soft:#FAEDD8;
  --good:#2C7A56; --good-soft:#DDEEE5;
  --plan:#41697E; --plan-soft:#E2EAEE;
  --shadow:0 1px 2px rgba(15,26,32,.06), 0 6px 18px rgba(15,26,32,.05);
  --r:10px;
  --f-disp:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0B1114; --surface:#141D22; --surface-2:#1C272D; --surface-3:#25333A;
  --ink:#E4EDF1; --ink-2:#AFC1C9; --ink-3:#83969F;
  --line:#26343B; --line-2:#33454D;
  --accent:#43ACC4; --accent-ink:#8FD4E2; --accent-soft:#12303A;
  --crit:#E86A5E; --crit-soft:#3A1C19;
  --warn:#E0A241; --warn-soft:#38290F;
  --good:#5CB98C; --good-soft:#14301F;
  --plan:#8AAAB9; --plan-soft:#1B2A31;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --ground:#0B1114; --surface:#141D22; --surface-2:#1C272D; --surface-3:#25333A;
  --ink:#E4EDF1; --ink-2:#AFC1C9; --ink-3:#83969F;
  --line:#26343B; --line-2:#33454D;
  --accent:#43ACC4; --accent-ink:#8FD4E2; --accent-soft:#12303A;
  --crit:#E86A5E; --crit-soft:#3A1C19;
  --warn:#E0A241; --warn-soft:#38290F;
  --good:#5CB98C; --good-soft:#14301F;
  --plan:#8AAAB9; --plan-soft:#1B2A31;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
/* ausserhalb von Claude fehlt das Host-Reset, deshalb hier selbst */
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* ---- header ---- */
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:9px;min-width:0}
.mark b{font-family:var(--f-disp);font-size:19px;font-weight:700;letter-spacing:.02em}
.mark span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.hspace{flex:1 1 auto}
.stand{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);
  font-family:var(--f-disp);font-size:14.5px;font-weight:600;letter-spacing:.02em;padding:11px 13px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

/* ---- filter row ---- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;font-family:var(--f-body);font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#06171C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#06171C}}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="search"],input[type="text"],input[type="date"],input[type="time"],input[type="number"],select,textarea{
  font-family:var(--f-body);font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.search{flex:1 1 200px;min-width:160px;max-width:320px}

/* ---- cards / layout ---- */
main{padding-block:4px 48px}
section.view{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.pad{padding:16px}
.card h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.card .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:grid;gap:2px}
.kpi .n{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.kpi.crit{border-left:3px solid var(--crit)} .kpi.crit .n{color:var(--crit)}
.kpi.warn{border-left:3px solid var(--warn)} .kpi.warn .n{color:var(--warn)}
.kpi.good{border-left:3px solid var(--good)} .kpi.good .n{color:var(--good)}
.kpi.plan{border-left:3px solid var(--plan)}

/* ---- status pills ---- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.p-ueberfaellig{background:var(--crit-soft);color:var(--crit)}
.p-faellig{background:var(--warn-soft);color:var(--warn)}
.p-geplant{background:var(--plan-soft);color:var(--plan)}
.p-erledigt{background:var(--good-soft);color:var(--good)}
.p-unbekannt{background:var(--surface-2);color:var(--ink-3)}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.f30{background:var(--accent-soft);color:var(--accent-ink);font-family:var(--f-mono)}

/* ---- due list ---- */
.rows{display:grid}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:start;
  padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;
  text-align:left;font:inherit;color:inherit;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .when{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);min-width:62px;text-align:right;padding-top:2px}
.row .ttl{font-weight:600;font-size:14.5px}
.row .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.row .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:560px){
  .row{grid-template-columns:1fr auto;padding:12px}
  .row .when{grid-column:1;text-align:left;min-width:0}
  .row .right{grid-row:1;grid-column:2}
  .row .body{grid-column:1/-1}
}

/* ---- charts ---- */
.smallmult{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.chart-t{font-family:var(--f-disp);font-size:13.5px;font-weight:600;letter-spacing:.03em}
.chart-s{font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{font-family:var(--f-body)}
svg.chart text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--ground);
  font-size:12px;line-height:1.35;padding:7px 9px;border-radius:7px;max-width:240px;box-shadow:var(--shadow);display:none}
#tip b{font-family:var(--f-disp);font-size:12.5px}

/* ---- map ---- */
.mapwrap{position:relative}
svg.map{display:block;width:100%;height:auto}
.map .outline{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.2;stroke-linejoin:round}
.map .cityt{font-family:var(--f-body);font-size:11px;fill:var(--ink-3);letter-spacing:.04em;
  paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.map .dot{stroke:var(--surface);stroke-width:1.6;cursor:pointer}
.map .dot:hover{stroke:var(--ink);stroke-width:2}
.map .dot.sel{stroke:var(--ink);stroke-width:2.5}
.map .dim{opacity:.18}

/* ---- detail ---- */
.detail{display:grid;gap:12px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;align-items:baseline}
.dl dt{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.dl dd{margin:0}
.timeline{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tl{font-family:var(--f-mono);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.tl.cur{background:var(--good-soft);color:var(--good);font-weight:500}

/* ---- accordion ---- */
details.st{border-top:1px solid var(--line)}
details.st:first-of-type{border-top:0}
details.st>summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
details.st>summary::-webkit-details-marker{display:none}
details.st>summary:hover{background:var(--surface-2)}
details.st[open]>summary{background:var(--surface-2)}
.st .inner{padding:4px 16px 16px;display:grid;gap:10px}
.posbox{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--ground)}

/* ---- form ---- */
form .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.fl{display:grid;gap:4px;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
label.fl>span.req::after{content:" *";color:var(--crit)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0;background:var(--surface)}
legend{font-family:var(--f-disp);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);padding-inline:6px}
.optrow{display:flex;gap:6px;flex-wrap:wrap}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt span{display:inline-block;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);cursor:pointer;user-select:none}
.opt input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.chk:hover{background:var(--surface-2)}
.chk input{margin:2px 0 0;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk span{min-width:0;overflow-wrap:anywhere}
.chk input:checked~span{font-weight:500}
.btn{appearance:none;font-family:var(--f-disp);font-size:14px;font-weight:600;letter-spacing:.03em;
  padding:10px 18px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
:root[data-theme="dark"] .btn{color:#06171C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06171C}}
.btn.ghost{background:var(--surface);color:var(--accent);}
.btn.sm{font-size:12.5px;padding:6px 12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mangelrow{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:8px;align-items:end}
@media (max-width:640px){.mangelrow{grid-template-columns:1fr}}
canvas.sig{width:100%;height:150px;border:1px dashed var(--line-2);border-radius:8px;background:var(--surface);touch-action:none;display:block}
.note{font-size:12.5px;color:var(--ink-3);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.note.warnbox{background:var(--warn-soft);color:var(--warn)}
/* ---- QR-Overlay ---- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(9,15,18,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);
  width:min(400px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px}
.overlay h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
/* QR immer dunkel auf hell – helle Module auf dunklem Grund lesen viele Scanner nicht */
.qrframe{background:#fff;border-radius:10px;padding:14px;display:flex;justify-content:center}
.qrframe canvas{display:block;width:100%;height:auto;max-width:280px;image-rendering:pixelated}
.qrurl{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);overflow-wrap:anywhere;background:var(--surface-2);padding:9px 11px;border-radius:8px}
.btn.icon{padding:6px 10px;font-size:12.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:100;
  background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow);display:none}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;font-family:var(--f-disp);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.scrollx{overflow-x:auto}
.muted{color:var(--ink-3)}
.stack{display:grid;gap:10px}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style>

<header class="app">
  <div class="wrap hbar">
    <div class="mark"><b>Wartungsleitstand</b><span>Lidl Österreich · Klimaanlagen</span></div>
    <div class="hspace"></div>
    <button class="btn ghost icon" type="button" id="qrbtn" hidden>QR-Code</button>
    <div class="stand" id="stand" hidden></div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist" hidden></nav></div>
</header>

<main class="wrap"><div id="app"></div></main>
<div id="tip" role="status"></div>
<div class="toast" id="toast"></div>

  if(p.monat === MON) return "faellig";
  return "geplant";
}

/* ---------- Tourenplanung ---------- */
var ARBEIT_H = 1.25;        // Richtwert je Wartungsposition
var TEMPO_KMH = 70;         // Reisegeschwindigkeit im Mittel
var UMWEG = 1.3;            // Zuschlag Luftlinie -> Straße
var BETRIEB = { id:"__betrieb", name:"Betrieb St. Johann i. T.",
  adresse:"Speckbacherstraße 92, 6380 St. Johann in Tirol", lat:47.51712, lon:12.41888 };

function luftlinie(a,b){
  var R=6371, t=Math.PI/180;
  var dLat=(b.lat-a.lat)*t, dLon=(b.lon-a.lon)*t;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function fahrKm(a,b){ return luftlinie(a,b)*UMWEG; }
function fahrH(a,b){ return fahrKm(a,b)/TEMPO_KMH; }

/* Nächster Nachbar, danach 2-opt gegen die schlimmsten Überkreuzungen */
function reihenfolge(start, ziele){
  var offen=ziele.slice(), weg=[], hier=start;
  while(offen.length){
    var best=0, bestD=Infinity;
    for(var i=0;i<offen.length;i++){ var d=luftlinie(hier,offen[i]); if(d<bestD){bestD=d;best=i;} }
    hier=offen[best]; weg.push(hier); offen.splice(best,1);
  }
  var knoten=[start].concat(weg);
  var laenge=function(k){ var s=0; for(var i=0;i<k.length-1;i++) s+=luftlinie(k[i],k[i+1]); return s; };
  var verbessert=true, runden=0;
  while(verbessert && runden<60){
    verbessert=false; runden++;
    for(var i=1;i<knoten.length-1;i++){
      for(var j=i+1;j<knoten.length;j++){
        var neu=knoten.slice(0,i).concat(knoten.slice(i,j+1).reverse(), knoten.slice(j+1));
        if(laenge(neu)+1e-9 < laenge(knoten)){ knoten=neu; verbessert=true; }
      }
    }
  }
  return knoten.slice(1);
}

function planeTour(opt){
  var start = opt.start;
  var stopps = opt.stopps;                 // [{standort, positionen:[...]}]
  if(!stopps.length) return null;
  var sortiert = reihenfolge(start, stopps.map(function(s){ return s.standort; }));
  var nachId={}; stopps.forEach(function(s){ nachId[s.standort.id]=s; });

  var tage=[], tag=null, hier=start, kmGesamt=0;
  for(var i=0;i<sortiert.length;i++){
    var ziel=sortiert[i], eintrag=nachId[ziel.id];
    var fahrt=fahrH(hier,ziel), km=fahrKm(hier,ziel);
    var arbeit=eintrag.positionen.length*ARBEIT_H;
    if(!tag || (tag.stunden + fahrt + arbeit) > opt.stundenProTag){
      if(tag) tage.push(tag);
      tag={nr:tage.length+1, stunden:0, km:0, stopps:[], startPunkt:hier};
      /* ein neuer Tag beginnt dort, wo der vorige endete (Übernachtung) */
    }
    tag.stunden += fahrt + arbeit;
    tag.km += km; kmGesamt += km;
    tag.stopps.push({standort:ziel, positionen:eintrag.positionen, fahrtH:fahrt, km:km, arbeitH:arbeit});
    hier=ziel;
  }
  if(tag) tage.push(tag);

  var rueck = tage.length ? fahrH(hier,start) : 0;
  var rueckKm = tage.length ? fahrKm(hier,start) : 0;
  if(tage.length){ tage[tage.length-1].rueckfahrtH=rueck; tage[tage.length-1].rueckfahrtKm=rueckKm; }

  return { start:start, tage:tage, reihenfolge:sortiert,
    kmGesamt:kmGesamt+rueckKm,
    stundenGesamt:tage.reduce(function(a,t){return a+t.stunden;},0)+rueck,
    anzahlStopps:sortiert.length,
    anzahlPositionen:stopps.reduce(function(a,s){return a+s.positionen.length;},0) };
}

function stdFmt(h){
  var m=Math.round(h*60);
  return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+" h";
}
function uhrFmt(startMin, h){
  var m=Math.round(startMin+h*60);
  return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}

function holeStandort(){
  return new Promise(function(fertig){
    if(!navigator.geolocation){ fertig({fehler:"Dieses Gerät meldet keine Position."}); return; }
    navigator.geolocation.getCurrentPosition(
      function(p){
        fertig({ lat:p.coords.latitude, lon:p.coords.longitude,
                 genauigkeit:p.coords.accuracy, zeit:Date.now() });
      },
      function(e){
        var txt="Position nicht verfügbar.";
        if(e.code===1) txt="Zugriff auf den Standort wurde abgelehnt. Im Browser unter den Seiteneinstellungen erlauben.";
        else if(e.code===2) txt="Kein Positionssignal. Im Gebäude hilft oft ein Schritt ins Freie.";
        else if(e.code===3) txt="Die Positionsbestimmung hat zu lange gedauert.";
        fertig({fehler:txt});
      },
      {enableHighAccuracy:true, timeout:12000, maximumAge:120000}
    );
  });
}

/* ---------- Chart: Jahresband je Region ---------- */
function monatsBand(region, positionen){
  var open=positionen.filter(function(p){return p.status!=="erledigt" && p.monat;});
  var done=positionen.filter(function(p){return p.status==="erledigt";});
  var co=[],cd=[];
  for(var m=1;m<=12;m++){
    co.push(open.filter(function(p){return p.monat===m;}).length);
    cd.push(done.filter(function(p){ var w=wartung(p,JAHR); return w? (+w.slice(5,7)===m) : (p.monat===m); }).length);
  }
  return {region:region,open:co,done:cd,total:co.map(function(v,i){return v+cd[i];})};
}
function bandSVG(band, maxV){
  var W=320,H=112,padL=4,padR=4,padB=20,padT=8;
  var iw=W-padL-padR, bw=iw/12, gap=3;
  var ih=H-padT-padB;
  var parts=[];
  parts.push('<line x1="'+padL+'" y1="'+(padT+ih)+'" x2="'+(W-padR)+'" y2="'+(padT+ih)+'" style="stroke:var(--line-2);stroke-width:1"/>');
  for(var m=0;m<12;m++){
    var x=padL+m*bw+gap/2, w=bw-gap;
    var vo=band.open[m], vd=band.done[m];
    var cur=(m+1)===MON;
    if(cur) parts.push('<rect x="'+(padL+m*bw)+'" y="'+padT+'" width="'+bw+'" height="'+ih+'" style="fill:var(--accent-soft);opacity:.55"/>');
    var y=padT+ih;
    if(vd>0){ var hd=Math.max(2,vd/maxV*ih); y-=hd;
      parts.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hd.toFixed(1)+'" rx="2" style="fill:var(--good);opacity:.42"/>'); }
    if(vo>0){ var ho=Math.max(2,vo/maxV*ih); y-=(ho+2);
      var col=(m+1)<MON?"--crit":((m+1)===MON?"--warn":"--plan");
      parts.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+ho.toFixed(1)+'" rx="3" style="fill:var('+col+')"/>');
      parts.push('<text class="num" x="'+(x+w/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" text-anchor="middle" font-size="9.5" style="fill:var(--ink-2)">'+vo+"</text>"); }
    parts.push('<rect class="hit" x="'+(padL+m*bw)+'" y="'+padT+'" width="'+bw+'" height="'+ih+'" style="fill:transparent;cursor:default" data-m="'+(m+1)+'" data-o="'+vo+'" data-d="'+vd+'"/>');
    parts.push('<text x="'+(padL+m*bw+bw/2).toFixed(1)+'" y="'+(padT+ih+13)+'" text-anchor="middle" font-size="9.5" style="fill:var('+(cur?"--accent":"--ink-3")+')'+(cur?";font-weight:600":"")+'">'+MONATE[m+1]+"</text>");
  }
  return '<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Offene Wartungen je Monat, Region '+esc(band.region)+'">'+parts.join("")+"</svg>";
}

    '<div class="sub">Balken = Anzahl Wartungspositionen im Soll-Monat. Gleiche Skala in allen drei Regionen (Maximum '+maxV+'). Laufender Monat hervorgehoben.</div></div>'+
    '<div class="legend">'+
      '<span><i style="background:var(--crit)"></i>überfällig (Soll-Monat vorbei)</span>'+
      '<span><i style="background:var(--warn)"></i>diesen Monat fällig</span>'+
      '<span><i style="background:var(--plan)"></i>noch geplant</span>'+
      '<span><i style="background:var(--good);opacity:.42"></i>bereits erledigt</span>'+
    '</div>'+
    '<div class="smallmult">'+bands.map(function(b){
      var sum=b.open.reduce(function(a,v){return a+v;},0);
      return '<div><div class="chart-t">'+esc(b.region)+'</div><div class="chart-s">'+sum+' offen · '+b.done.reduce(function(a,v){return a+v;},0)+' erledigt</div>'+bandSVG(b,maxV)+"</div>";
    }).join("")+"</div>"+
  "</div></div>");
  chart.querySelectorAll(".hit").forEach(function(r){
    r.addEventListener("mousemove",function(e){
      tipShow(e,"<b>"+MONATE_L[+r.dataset.m]+" "+JAHR+"</b><br>"+r.dataset.o+" offen · "+r.dataset.d+" erledigt");
    });
    r.addEventListener("mouseleave",tipHide);
  });
  f.appendChild(chart);

  /* Liste */
  var list=pos.slice().sort(function(a,b){
    var d=STATUS_RANK[a.status]-STATUS_RANK[b.status]; if(d) return d;
    return (a.monat||99)-(b.monat||99);
  });
  var offen=list.filter(function(p){return p.status!=="erledigt";});
  var show=offen.length?offen:list;
  var card=el('<div class="card"><div class="pad"><h2>'+(offen.length?"Offene Wartungen":"Alle Positionen")+'</h2>'+
    '<div class="sub">'+show.length+' Positionen, sortiert nach Dringlichkeit. Tippen öffnet das Wartungsprotokoll.</div></div>'+
    '<div class="rows" id="dulist"></div></div>');
  var rows=card.querySelector("#dulist");
  show.slice(0,120).forEach(function(p){
    var s=byId[p.standortId];
    var r=el('<button class="row" type="button">'+
      '<span class="when">'+(p.monat?MONATE[p.monat]+" "+JAHR:"—")+"</span>"+
      '<span class="body"><span class="ttl">'+esc(stName(s))+"</span>"+
        '<span class="meta">'+esc(s.adresse)+(s.region?" · "+esc(s.region):"")+"</span>"+
        '<span class="badges"><span class="tag">'+esc(anlagenName(p))+"</span>"+
          (p.kaeltemittelText?'<span class="tag f30">'+esc(p.kaeltemittelText)+" Kältemittel</span>":"")+
          (p.intervallCode?'<span class="tag">Kürzel '+esc(p.intervallCode)+"</span>":"")+
          (p.letzte?'<span class="tag">zuletzt '+dfmt(p.letzte)+"</span>":'<span class="tag">keine Historie</span>')+
        "</span>"+
      "</span>"+
      '<span class="right">'+pill(p.status)+"</span>"+
    "</button>");
    r.onclick=function(){ S.protoStandort=s.id; S.protoPos=p.id; S.view="protokoll"; render(); window.scrollTo({top:0}); };
    rows.appendChild(r);
  });
  if(show.length>120) card.appendChild(el('<div class="pad muted" style="font-size:12.5px">… weitere '+(show.length-120)+" Positionen über Filter eingrenzen.</div>"));
  f.appendChild(card);
  return f;
}

/* ---------- View: Karte ---------- */
/* Kandidaten für die Tour: gefilterte Standorte mit Koordinaten,
   deren offene Positionen zu den gewählten Fälligkeiten passen */
function tourKandidaten(){
  var raus=[];
  filtered().forEach(function(s){
    if(!s.lat) return;
    var pos=s.pos.filter(function(p){ return S.tour.status.indexOf(p.status)>=0; });
    if(pos.length) raus.push({standort:s, positionen:pos});
  });
  return raus;
}
function tourRechnen(){
  var kandidaten=tourKandidaten();
  if(S.tour.manuell){
    var erlaubt={}; S.tour.manuell.forEach(function(id){ erlaubt[id]=1; });
    kandidaten=kandidaten.filter(function(k){ return erlaubt[k.standort.id]; });
  }
  var start=BETRIEB;
  if(S.tour.startId==="__gps"){
    if(S.tour.gps) start={ id:"__gps", name:"Aktueller Standort",
      adresse:"Position des Technikers", lat:S.tour.gps.lat, lon:S.tour.gps.lon };
    /* ohne Positionsfreigabe bleibt der Betrieb als Ausgangspunkt */
  } else if(byId[S.tour.startId] && byId[S.tour.startId].lat){
    start=byId[S.tour.startId];
  }
  S.tour.ergebnis=planeTour({start:start, stopps:kandidaten, stundenProTag:S.tour.stundenProTag});
}

function viewKarte(){
  var f=document.createDocumentFragment();
  var list=filtered();
  var withGeo=list.filter(function(s){return s.lat;});
  var noGeo=list.filter(function(s){return !s.lat;});

  var lo=[9.5,17.2], la=[46.35,49.05];
  var k=Math.cos(47.7*Math.PI/180);
  var W=1000, pad=18;
  var uw=(lo[1]-lo[0])*k, uh=la[1]-la[0];
  var sc=(W-2*pad)/uw, H=Math.round(uh*sc+2*pad);
  function X(lon){ return pad+(lon-lo[0])*k*sc; }
  function Y(lat){ return pad+(la[1]-lat)*sc; }

  var path="M"+AT.map(function(p){ return X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1); }).join("L")+"Z";
  var maxPos=1; withGeo.forEach(function(s){ if(s.pos.length>maxPos) maxPos=s.pos.length; });

  var dots=withGeo.slice().sort(function(a,b){ return STATUS_RANK[b.status]-STATUS_RANK[a.status]; }).map(function(s){
    var r=5+3.2*Math.sqrt((s.pos.length-1)/Math.max(1,maxPos-1));
    return '<circle class="dot'+(S.sel===s.id?" sel":"")+'" cx="'+X(s.lon).toFixed(1)+'" cy="'+Y(s.lat).toFixed(1)+'" r="'+r.toFixed(1)+
      '" style="fill:var('+STATUS_VAR[s.status]+')" data-id="'+s.id+'" tabindex="0" role="button" aria-label="'+esc(stName(s)+", "+s.adresse)+'">'+
      "<title>"+esc(stName(s)+" · "+s.adresse+" · "+STATUS_LABEL[s.status])+"</title></circle>";
  }).join("");

  /* Route zeichnen: Linienzug + nummerierte Stopps */
  var routeSvg="";
  var T=S.tour.ergebnis;
  var inTour={};
  if(T){
    var punkte=[T.start].concat(T.reihenfolge).concat([T.start]);
    var d="M"+punkte.map(function(p){ return X(p.lon).toFixed(1)+","+Y(p.lat).toFixed(1); }).join("L");
    routeSvg+='<path d="'+d+'" style="fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;'+
      'stroke-linecap:round;stroke-dasharray:7 5;opacity:.85"/>';
    T.reihenfolge.forEach(function(p,i){ inTour[p.id]=i+1; });
    routeSvg+='<g>'+T.reihenfolge.map(function(p,i){
      return '<circle cx="'+X(p.lon).toFixed(1)+'" cy="'+Y(p.lat).toFixed(1)+'" r="9" style="fill:var(--accent);stroke:var(--surface);stroke-width:1.8"/>'+
        '<text x="'+X(p.lon).toFixed(1)+'" y="'+(Y(p.lat)+3.4).toFixed(1)+'" text-anchor="middle" font-size="10" '+
        'style="fill:#fff;font-weight:600">'+(i+1)+"</text>";
    }).join("")+"</g>";
    routeSvg+='<g><rect x="'+(X(T.start.lon)-7).toFixed(1)+'" y="'+(Y(T.start.lat)-7).toFixed(1)+
      '" width="14" height="14" rx="3" style="fill:var(--ink);stroke:var(--surface);stroke-width:1.8"/>'+
      '<title>'+esc("Start: "+T.start.name)+"</title></g>";
  }

  /* eigene Position, sobald sie bekannt ist */
  if(S.tour.gps){
    var gx=X(S.tour.gps.lon).toFixed(1), gy=Y(S.tour.gps.lat).toFixed(1);
    routeSvg+='<g><circle cx="'+gx+'" cy="'+gy+'" r="11" style="fill:var(--accent);opacity:.22"/>'+
      '<circle cx="'+gx+'" cy="'+gy+'" r="4.5" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/>'+
      "<title>Ihr aktueller Standort</title></g>";
  }

  var cityDots=STAEDTE.map(function(c){
    return '<circle cx="'+X(c[1]).toFixed(1)+'" cy="'+Y(c[2]).toFixed(1)+'" r="2" style="fill:var(--ink-3);opacity:.55"/>';
  }).join("");
  /* Beschriftung nach den Punkten zeichnen, damit sie nicht verdeckt wird */
  var cityLabels=STAEDTE.map(function(c){
    var dx=c[3]==="start"?7:(c[3]==="end"?-7:0);
    return '<text class="cityt" x="'+(X(c[1])+dx).toFixed(1)+'" y="'+(Y(c[2])-8).toFixed(1)+'" text-anchor="'+c[3]+'">'+esc(c[0])+"</text>";
  }).join("");

  var card=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Standortkarte Österreich</h2><div class="sub">'+withGeo.length+' Standorte mit Koordinaten. Punktgröße = Anzahl Wartungspositionen, Farbe = dringlichster Status am Standort. Antippen für Details.</div></div>'+
    '<div class="legend">'+["ueberfaellig","faellig","geplant","erledigt"].map(function(k2){
      return '<span><i style="background:var('+STATUS_VAR[k2]+')"></i>'+STATUS_LABEL[k2]+"</span>";
    }).join("")+"</div>"+
    '<div class="mapwrap"><svg class="map" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Karte der Lidl-Standorte in Österreich">'+
      '<path class="outline" d="'+path+'"/>'+cityDots+dots+routeSvg+cityLabels+
    "</svg></div>"+
    '<div id="mapdetail"></div>'+
  "</div></div>");

  var det=card.querySelector("#mapdetail");
  function sel(id){ S.sel=id; det.innerHTML=""; det.appendChild(standortDetail(byId[id]));
    card.querySelectorAll(".dot").forEach(function(d){ d.classList.toggle("sel", d.dataset.id===id); }); }
  card.querySelectorAll(".dot").forEach(function(d){
    d.addEventListener("click",function(){ sel(d.dataset.id); });
    d.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); sel(d.dataset.id); } });
    d.addEventListener("mousemove",function(e){ var s=byId[d.dataset.id];
      tipShow(e,"<b>"+esc(stName(s))+"</b><br>"+esc(s.adresse)+"<br>"+s.pos.length+" Position(en) · "+STATUS_LABEL[s.status]); });
    d.addEventListener("mouseleave",tipHide);
  });
  if(S.sel && byId[S.sel] && byId[S.sel].lat) sel(S.sel);
  f.appendChild(card);
  f.appendChild(tourPanel());

  if(noGeo.length){
    f.appendChild(el('<div class="card"><div class="pad stack">'+
      '<h2>Ohne Kartenposition</h2>'+
      '<div class="sub">Diese Einträge haben in der Liste keine auswertbare Adresse – meist Sammelzeilen oder Kurznamen.</div>'+
      '<div class="rowflex">'+noGeo.map(function(s){ return '<span class="tag">'+esc(s.name)+" ("+s.pos.length+")</span>"; }).join("")+"</div>"+
    "</div></div>"));
  }
  return f;
}

function tourPanel(){
  var kand=tourKandidaten();
  var T=S.tour.ergebnis;
  var gpsHinweis="";
  if(S.tour.startId==="__gps"){
    if(S.tour.gps) gpsHinweis='<div class="note">Startpunkt ist Ihre aktuelle Position, ermittelt auf rund '+
      Math.round(S.tour.gps.genauigkeit)+' m genau.</div>';
    else if(S.tour.gpsFehler) gpsHinweis='<div class="note warnbox">'+esc(S.tour.gpsFehler)+
      ' Als Ausweich-Startpunkt wird der Betrieb in St. Johann verwendet.</div>';
    else gpsHinweis='<div class="note">Beim Berechnen fragt der Browser einmal nach Ihrem Standort – bitte erlauben, '+
      'sonst startet die Route beim Betrieb in St. Johann.</div>';
  }

  var c=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Tourenplanung</h2><div class="sub">Reihenfolge über kürzeste Wege, '+ARBEIT_H.toString().replace(".",",")+
      ' h Arbeitszeit je Wartungsposition. Ein Markt mit mehreren Positionen bindet entsprechend länger.</div></div>'+

    '<div><div class="fl" style="margin-bottom:6px"><span>Welche Wartungen einplanen</span></div>'+
      '<div class="chips" id="t_status">'+
        ["ueberfaellig","faellig","geplant"].map(function(k){
          return '<button class="chip" type="button" data-s="'+k+'" aria-pressed="'+(S.tour.status.indexOf(k)>=0)+'">'+
            STATUS_LABEL[k]+"</button>";
        }).join("")+
      "</div></div>"+

    '<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">'+
      '<label class="fl"><span>Startpunkt</span><select id="t_start"></select></label>'+
      '<label class="fl"><span>Position</span><button class="btn ghost" type="button" id="t_gps">'+
        (S.tour.gps?"Standort aktualisieren":"Standort bestimmen")+"</button></label>"+
      '<label class="fl"><span>Arbeitszeit je Tag (h)</span>'+
        '<input type="number" id="t_std" min="4" max="14" step="0.5" value="'+S.tour.stundenProTag+'"></label>'+
    "</div>"+
    gpsHinweis+

    '<div class="rowflex">'+
      '<button class="btn" type="button" id="t_go">Route vorschlagen</button>'+
      (T?'<button class="btn ghost" type="button" id="t_clear">Route löschen</button>':"")+
      '<span class="muted" style="font-size:12.5px">'+kand.length+' Standorte passen zur Auswahl'+
      (S.tour.manuell?' · '+S.tour.manuell.length+' davon von Hand gewählt':"")+"</span>"+
    "</div>"+
    '<div id="t_out"></div>'+
  "</div></div>");

  var startSel=c.querySelector("#t_start");
  var oG=document.createElement("option"); oG.value="__gps";
  oG.textContent="Aktueller Standort des Technikers"; startSel.appendChild(oG);
  var o0=document.createElement("option"); o0.value="__betrieb";
  o0.textContent=BETRIEB.name+" · "+BETRIEB.adresse; startSel.appendChild(o0);
  ST.slice().filter(function(x){return x.lat;}).sort(function(a,b){ return stName(a).localeCompare(stName(b),"de"); })
    .forEach(function(x){ var o=document.createElement("option"); o.value=x.id;
      o.textContent=(stName(x)===x.adresse)?x.adresse:(stName(x)+" · "+x.adresse); startSel.appendChild(o); });
  startSel.value=S.tour.startId;

  c.querySelectorAll("#t_status .chip").forEach(function(b){
    b.onclick=function(){
      var k=b.dataset.s, i=S.tour.status.indexOf(k);
      if(i>=0){ if(S.tour.status.length>1) S.tour.status.splice(i,1); } else S.tour.status.push(k);
      S.tour.manuell=null; render();
    };
  });
  startSel.onchange=function(){ S.tour.startId=startSel.value; };

  var gpsBtn=c.querySelector("#t_gps");
  gpsBtn.onclick=function(){
    gpsBtn.disabled=true; gpsBtn.textContent="Wird ermittelt …";
    holeStandort().then(function(p){
      if(p.fehler){ S.tour.gps=null; S.tour.gpsFehler=p.fehler; }
      else { S.tour.gps=p; S.tour.gpsFehler=""; S.tour.startId="__gps"; toast("Standort übernommen."); }
      render();
    });
  };
  c.querySelector("#t_std").onchange=function(e2){
    var v=parseFloat(e2.target.value); if(v>=4&&v<=14) S.tour.stundenProTag=v;
  };
  var goBtn=c.querySelector("#t_go");
  goBtn.onclick=function(){
    S.tour.startId=startSel.value;
    var v=parseFloat(c.querySelector("#t_std").value); if(v>=4&&v<=14) S.tour.stundenProTag=v;
    if(!tourKandidaten().length){ toast("Keine Standorte für diese Auswahl."); return; }

    var frisch = S.tour.gps && (Date.now()-S.tour.gps.zeit < 300000);
    if(S.tour.startId!=="__gps" || frisch){
      tourRechnen(); render(); window.scrollTo({top:0,behavior:"smooth"}); return;
    }
    goBtn.disabled=true; goBtn.textContent="Standort wird ermittelt …";
    holeStandort().then(function(p){
      if(p.fehler){ S.tour.gps=null; S.tour.gpsFehler=p.fehler; }
      else { S.tour.gps=p; S.tour.gpsFehler=""; }
      tourRechnen(); render(); window.scrollTo({top:0,behavior:"smooth"});
    });
  };
  var clr=c.querySelector("#t_clear");
  if(clr) clr.onclick=function(){ S.tour.ergebnis=null; S.tour.manuell=null; render(); };

  if(T) c.querySelector("#t_out").appendChild(tourErgebnis(T));
  return c;
}

function tourErgebnis(T){
  var box=document.createElement("div");
  box.className="stack";
  box.appendChild(el('<div class="kpis">'+
    '<div class="kpi"><div class="n">'+T.anzahlStopps+'</div><div class="l">Stopps</div></div>'+
    '<div class="kpi"><div class="n">'+T.anzahlPositionen+'</div><div class="l">Wartungen</div></div>'+
    '<div class="kpi"><div class="n">'+Math.round(T.kmGesamt)+'</div><div class="l">km gesamt</div></div>'+
    '<div class="kpi"><div class="n">'+T.tage.length+'</div><div class="l">Arbeitstage</div></div>'+
  "</div>"));

  T.tage.forEach(function(tag){
    var minute=7*60;   /* Tagesbeginn 07:00 */
    var zeilen=tag.stopps.map(function(st,i){
      var anf=minute+st.fahrtH*60;
      var ende=anf+st.arbeitH*60;
      var r='<tr><td class="mono">'+(i+1)+'</td>'+
        '<td><strong>'+esc(stName(st.standort))+"</strong>"+
          (stName(st.standort)===st.standort.adresse ? "" :
            '<br><span class="muted" style="font-size:12px">'+esc(st.standort.adresse)+"</span>")+"</td>"+
        '<td class="mono">'+Math.round(st.km)+' km<br><span class="muted">'+stdFmt(st.fahrtH)+"</span></td>"+
        '<td class="mono">'+uhrFmt(minute,st.fahrtH)+'–'+uhrFmt(minute,st.fahrtH+st.arbeitH)+"</td>"+
        '<td>'+st.positionen.map(function(p){
            return '<span class="tag">'+esc(p.anlagentyp||"Anlage")+"</span>";
          }).join(" ")+"</td></tr>";
      minute=ende;
      return r;
    }).join("");
    var rueck = tag.rueckfahrtH ?
      '<tr><td></td><td class="muted">Rückfahrt zum Startpunkt</td><td class="mono">'+Math.round(tag.rueckfahrtKm)+
      ' km<br><span class="muted">'+stdFmt(tag.rueckfahrtH)+'</span></td><td class="mono">bis '+
      uhrFmt(minute,tag.rueckfahrtH)+"</td><td></td></tr>" : "";
    box.appendChild(el('<div class="card" style="box-shadow:none;background:var(--ground)"><div class="pad stack">'+
      '<div class="rowflex" style="justify-content:space-between">'+
        '<strong style="font-family:var(--f-disp);font-size:14.5px">Tag '+tag.nr+"</strong>"+
        '<span class="muted mono" style="font-size:12px">'+stdFmt(tag.stunden+(tag.rueckfahrtH||0))+
        ' · '+Math.round(tag.km+(tag.rueckfahrtKm||0))+" km</span>"+
      "</div>"+
      '<div class="scrollx"><table class="dt"><thead><tr><th>#</th><th>Standort</th><th>Anfahrt</th>'+
      "<th>vor Ort</th><th>Anlagen</th></tr></thead><tbody>"+zeilen+rueck+"</tbody></table></div>"+
    "</div></div>"));
  });

  box.appendChild(el('<div class="note">Die Fahrzeiten sind geschätzt: Luftlinie mit Zuschlag '+
    UMWEG.toString().replace(".",",")+' für den Straßenverlauf, gerechnet mit '+TEMPO_KMH+
    ' km/h im Mittel. Für die echte Fahrzeit braucht es einen Routendienst — das lässt sich nachrüsten. '+
    'Mehrtägige Touren fahren am Folgetag vom letzten Stopp weiter, es ist also eine Übernachtung unterwegs eingerechnet.</div>'));
  return box;
}

function standortDetail(s){
  var d=el('<div class="detail card" style="box-shadow:none;background:var(--ground)"><div class="pad stack">'+
    '<div class="rowflex" style="justify-content:space-between"><h2 style="text-transform:none;font-size:17px;color:var(--ink)">'+esc(stName(s))+"</h2>"+pill(s.status)+"</div>"+
    '<dl class="dl">'+
      "<dt>Adresse</dt><dd>"+esc(s.adresse)+"</dd>"+
      "<dt>FM-Region</dt><dd>"+esc(s.region||"nicht zugeordnet")+"</dd>"+
      (s.filiale?"<dt>Filiale</dt><dd class='mono'>"+esc(s.filiale)+"</dd>":"")+
      "<dt>Positionen</dt><dd>"+s.pos.length+"</dd>"+
      (s.baujahrVon?"<dt>Baujahr</dt><dd class='mono'>"+s.baujahrVon+(s.baujahrBis!==s.baujahrVon?"–"+s.baujahrBis:"")+"</dd>":"")+
      "<dt>Geocodierung</dt><dd class='muted'>"+({adresse:"Adressgenau",strasse:"Straßenebene",ort:"Ortsebene",keine:"keine"}[s.genauigkeit]||s.genauigkeit)+"</dd>"+
    "</dl>"+
    '<div class="stack" id="poslist"></div>'+
  "</div></div>");
  var pl=d.querySelector("#poslist");
  s.pos.forEach(function(p){ pl.appendChild(posBox(p,s)); });
  return d;
}
function posBox(p,s){
  var b=el('<div class="posbox">'+
    '<div class="rowflex" style="justify-content:space-between;gap:8px">'+
      '<strong style="font-size:14px">'+esc(anlagenName(p))+"</strong>"+pill(p.status)+"</div>"+
    '<dl class="dl">'+
      "<dt>Soll-Monat</dt><dd>"+(p.monat?MONATE_L[p.monat]:"—")+"</dd>"+
      "<dt>Kürzel</dt><dd class='mono'>"+esc(p.intervallCode||"—")+"</dd>"+
      (p.kaeltemittelText?"<dt>Kältemittel</dt><dd class='mono'>"+esc(p.kaeltemittelText)+"</dd>":"")+
      (p.inbetriebnahme?"<dt>Inbetriebnahme</dt><dd class='mono'>"+dfmt(p.inbetriebnahme)+"</dd>":"")+
      (p.rueckkuehler?"<dt>Rückkühler</dt><dd>"+esc(p.rueckkuehler)+"</dd>":"")+
    "</dl>"+
    '<div><div class="l muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Durchgeführte Wartungen</div>'+

/* ---------- View: Anlagen ---------- */
function viewAnlagen(){
  var f=document.createDocumentFragment();
  var pos=filteredPos();

  /* Baujahr-Histogramm */
  var years=pos.filter(function(p){return p.baujahr;}).map(function(p){return p.baujahr;});
  var minY=Math.min.apply(null,years.concat([JAHR])), maxY=Math.max.apply(null,years.concat([JAHR]));
  var counts=[]; for(var y=minY;y<=maxY;y++) counts.push({y:y,n:years.filter(function(v){return v===y;}).length});
  var mx=Math.max(1,Math.max.apply(null,counts.map(function(c){return c.n;})));
  var CW=720,CH=190,cpL=30,cpR=8,cpT=14,cpB=28;
  var ciw=CW-cpL-cpR, cih=CH-cpT-cpB, bw=ciw/counts.length;
  var bars=counts.map(function(c,i){
    var h=c.n/mx*cih, x=cpL+i*bw+2.5, w=bw-5, yy=cpT+cih-h;
    return (c.n?'<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" style="fill:var(--accent)"/>':"")+
      '<rect class="hit" x="'+(cpL+i*bw)+'" y="'+cpT+'" width="'+bw+'" height="'+cih+'" style="fill:transparent" data-y="'+c.y+'" data-n="'+c.n+'"/>'+
      (c.n?'<text class="num" x="'+(x+w/2).toFixed(1)+'" y="'+(yy-4).toFixed(1)+'" text-anchor="middle" font-size="10" style="fill:var(--ink-2)">'+c.n+"</text>":"")+
      '<text x="'+(cpL+i*bw+bw/2).toFixed(1)+'" y="'+(cpT+cih+15)+'" text-anchor="middle" font-size="10" style="fill:var(--ink-3)">'+("'"+String(c.y).slice(2))+"</text>";
  }).join("");
  var gy=[0,Math.round(mx/2),mx].filter(function(v,i,a){return a.indexOf(v)===i;});
  var grid=gy.map(function(v){ var yy=cpT+cih-v/mx*cih;
    return '<line x1="'+cpL+'" y1="'+yy.toFixed(1)+'" x2="'+(CW-cpR)+'" y2="'+yy.toFixed(1)+'" style="stroke:var(--line);stroke-width:1"/>'+
      '<text class="num" x="'+(cpL-6)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end" font-size="10" style="fill:var(--ink-3)">'+v+"</text>"; }).join("");

  var hist=el('<div class="card"><div class="pad stack">'+
    '<div><h2>Inbetriebnahme der Anlagen</h2><div class="sub">'+years.length+' von '+pos.length+' Positionen haben ein Datum in der Liste. Ältester Eintrag '+minY+".</div></div>"+
    '<svg class="chart" viewBox="0 0 '+CW+" "+CH+'" role="img" aria-label="Anzahl Anlagen je Inbetriebnahmejahr">'+grid+bars+"</svg>"+
  "</div></div>");
  hist.querySelectorAll(".hit").forEach(function(r){
    r.addEventListener("mousemove",function(e){ tipShow(e,"<b>"+r.dataset.y+"</b><br>"+r.dataset.n+" Anlage(n) in Betrieb genommen"); });
    r.addEventListener("mouseleave",tipHide);
  });
  f.appendChild(hist);

  /* Standortliste */
  var list=filtered().slice().sort(function(a,b){
    var d=STATUS_RANK[a.status]-STATUS_RANK[b.status]; if(d) return d;
    return (a.plz||"zz").localeCompare(b.plz||"zz");
  });
  var card=el('<div class="card"><div class="pad"><h2>Anlagenstamm</h2>'+
    '<div class="sub">'+list.length+" Standorte · "+pos.length+" Wartungspositionen. Aufklappen zeigt Anlagendaten und Wartungshistorie.</div></div><div id=\"stlist\"></div></div>");
  var host=card.querySelector("#stlist");
  list.forEach(function(s){
    var d=el('<details class="st"><summary>'+
      "<span><strong>"+esc(stName(s))+'</strong><br><span class="muted" style="font-size:12.5px">'+esc(s.adresse)+(s.region?" · "+esc(s.region):"")+"</span></span>"+
      '<span class="rowflex" style="justify-content:flex-end">'+
        (s.ueber30kg?'<span class="tag f30">&gt;30 kg</span>':"")+
        '<span class="tag">'+s.pos.length+" Pos.</span>"+pill(s.status)+"</span>"+
    '</summary><div class="inner"></div></details>');
    var inner=d.querySelector(".inner");
    d.addEventListener("toggle",function(){
      if(d.open && !inner.dataset.done){ s.pos.forEach(function(p){ inner.appendChild(posBox(p,s)); }); inner.dataset.done="1"; }
    });
    host.appendChild(d);
  });
  f.appendChild(card);
  return f;
}

/* ----------------------------------------------------------------
   Speicher: im Artifact die Claude-Datenbank, auf GitHub Pages
   Supabase, und wenn beides fehlt nur lokal am Gerät.
   ---------------------------------------------------------------- */
var CFG=window.UKT_CONFIG||{};
var Store={
  modus:"lade",        // lade | claude | supabase | anmeldung | lokal
  claudeDb:null,
  sb:null,
  benutzer:null,
  fehler:""
};
function storeNachRender(){ if((S.view==="protokoll"||S.view==="daten") && darfRendern()) render(); }

function initStore(versuch){
  versuch=versuch||0;
  var supabaseKonfiguriert = CFG.supabaseUrl && CFG.supabaseAnonKey;
  /* window.claude setzt der Host erst nach dem ersten Skriptlauf */
  if(!window.claude || !window.claude.use){
    if(!supabaseKonfiguriert && versuch<40){ setTimeout(function(){ initStore(versuch+1); },250); return; }
    if(supabaseKonfiguriert) return initSupabase();
    Store.modus="lokal"; storeNachRender(); return;
  }
  window.claude.use("db").then(function(api){
    if(!api){ if(supabaseKonfiguriert) return initSupabase(); Store.modus="lokal"; storeNachRender(); return; }
    Store.claudeDb=api; Store.modus="claude";
    api.collection("protokolle").orderBy("erstellt","desc").limit(200).onSnapshot(function(snap){
      protokolle=(snap.docs||[]).map(function(d){ return Object.assign({_id:d.id},d.data()||{}); });
      storeNachRender();
    }, function(){ });
    flushQueue();
    storeNachRender();
  }, function(){ if(supabaseKonfiguriert) return initSupabase(); Store.modus="lokal"; storeNachRender(); });
}

function initSupabase(){
  if(!window.supabase || !window.supabase.createClient){ Store.modus="lokal"; Store.fehler="Supabase-Bibliothek nicht geladen."; storeNachRender(); return; }
  Store.sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  Store.sb.auth.getSession().then(function(r){
    var sess=r&&r.data?r.data.session:null;
    if(sess){ Store.benutzer=sess.user; Store.modus="supabase"; ladeProtokolle(); flushQueue(); }
    else { Store.modus="anmeldung"; }
    storeNachRender();
  });
  Store.sb.auth.onAuthStateChange(function(_ev,sess){
    if(sess){ Store.benutzer=sess.user; Store.modus="supabase"; ladeProtokolle(); flushQueue(); }
    else { Store.benutzer=null; Store.modus="anmeldung"; protokolle=[]; }
    storeNachRender();
  });
}

    firma:doc.firma, techniker:doc.techniker, kontakt:doc.kontakt, subunternehmen:doc.subunternehmen,
    zert_unternehmen:doc.zertUnternehmen, zert_person:doc.zertPerson,

    maengel:doc.maengel, betriebsbereit:doc.betriebsbereit, sofortmassnahme:doc.sofortmassnahme,

    name_techniker:doc.nameTechniker, auftraggebervertreter:doc.auftraggebervertreter,

}
function ausZeile(r){
  return { _id:r.id, erstellt:r.erstellt, standortName:r.standort_name, adresse:r.adresse, region:r.region,
    datum:r.datum, uhrzeit:r.uhrzeit, techniker:r.techniker, nameTechniker:r.name_techniker,
    wartungsart:r.wartungsart, bestellnummer:r.bestellnummer, auftragsnummer:r.auftragsnummer,

    bemerkungen:r.bemerkungen, filiale:r.filiale };
}
function ladeProtokolle(){
  if(!Store.sb) return;
  Store.sb.from("protokolle").select("*").order("erstellt",{ascending:false}).limit(200).then(function(r){
    if(r.error){ Store.fehler=r.error.message; return; }
    protokolle=(r.data||[]).map(ausZeile);
    storeNachRender();
  });
}

/* ein Protokoll wegschreiben – liefert ein Promise, das nie ablehnt */
function speichereProtokoll(id,doc){
  if(Store.modus==="claude" && Store.claudeDb){
    return Store.claudeDb.doc("protokolle/"+id).set(doc).then(function(){ return true; },function(){ return false; });
  }
  if(Store.modus==="supabase" && Store.sb){
    return Store.sb.from("protokolle").insert(zuZeile(doc,Store.benutzer?Store.benutzer.id:null)).then(function(r){
      if(r.error){ Store.fehler=r.error.message; return false; }
      ladeProtokolle(); return true;
    },function(){ return false; });
  }
  return Promise.resolve(false);
}
function flushQueue(){
  var q=lsGet("ukt_queue",[]);
  if(!q.length) return;
  var rest=[], done=0;
  var next=function(i){
    if(i>=q.length){ lsSet("ukt_queue",rest); if(done) toast(done+" zwischengespeicherte(s) Protokoll(e) übertragen"); return; }
    speichereProtokoll(q[i].id,q[i].doc).then(function(ok){
      if(ok) done++; else rest.push(q[i]);
      next(i+1);
    });
  };
  next(0);
}

function csv(name,head,rows){
  var q=function(v){ v=String(v==null?"":v); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  var text="﻿"+[head.map(q).join(";")].concat(rows.map(function(r){return r.map(q).join(";");})).join("\r\n");
  if(window.claude&&window.claude.use){
    /* im Artifact sind eigene Downloads gesperrt, der Host übernimmt das */
    window.claude.use("downloads").then(function(d){
      if(!d){ toast("Download in dieser Ansicht nicht möglich."); return; }
      d.save({filename:name,data:text}).then(function(){ toast("Datei bereitgestellt."); },function(){ toast("Download abgebrochen."); });
    },function(){ toast("Download in dieser Ansicht nicht möglich."); });
    return;
  }
  try{
    var blob=new Blob([text],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    toast("CSV heruntergeladen.");
  }catch(e){ toast("Download nicht möglich: "+e.message); }
}

        '<input type="url" id="qrinput" inputmode="url" placeholder="https://…"></label>'+
      '<div class="muted" style="font-size:12.5px">Mit der Handykamera scannen. Die Adresse lässt sich hier ändern, '+
        'etwa um den Code schon auf das spätere eigene Hosting zeigen zu lassen — die Änderung bleibt auf diesem Gerät gespeichert.</div>'+
    "</div></div>");
  document.body.appendChild(ov);
  var canvas=ov.querySelector("#qrcanvas"), txt=ov.querySelector("#qrtext"), input=ov.querySelector("#qrinput");

  function zeichne(u){
    txt.textContent=u||"Noch keine Adresse hinterlegt.";
    if(!u){ rahmen.hidden=true; return; }
    rahmen.hidden=false;
    if(!window.QRious){
      rahmen.innerHTML='<div style="color:#0F1A20;font-size:12.5px;padding:8px;text-align:center">'+
        "QR-Bibliothek nicht erreichbar. Adresse bitte von Hand eintippen.</div>";
      return;
    }
    try{
      new window.QRious({element:canvas,value:u,size:560,level:"M",padding:0,background:"#ffffff",foreground:"#0F1A20"});
    }catch(e){
      rahmen.innerHTML='<div style="color:#0F1A20;font-size:12.5px;padding:8px;text-align:center">QR-Code nicht erzeugbar: '+esc(e.message)+"</div>";
    }
  }
  input.value=url; zeichne(url);
  input.oninput=function(){
    var v=input.value.trim();
    zeichne(v);
    try{ if(v) lsSet("ukt_appurl",v); else localStorage.removeItem("ukt_appurl"); }catch(e){}
  };

  function zu(){ document.removeEventListener("keydown",esc2); ov.remove(); }
  function esc2(e){ if(e.key==="Escape") zu(); }
  ov.querySelector("#qrclose").onclick=zu;
  ov.addEventListener("click",function(e){ if(e.target===ov) zu(); });
  document.addEventListener("keydown",esc2);
  ov.querySelector("#qrclose").focus();
}

/* ----------------------------------------------------------------
   Zugangsschutz. Der Anlagenstamm wird verschlüsselt ausgeliefert
   (AES-256-CBC, Schlüssel aus PBKDF2-SHA256), das Passwort
   entschlüsselt ihn erst im Browser. Ohne Passwort steht in
   daten.enc.js nichts Lesbares.
   ---------------------------------------------------------------- */
(function(){
  "use strict";
  var tabs=document.getElementById("tabs");
  var qrbtn=document.getElementById("qrbtn");
  var stand=document.getElementById("stand");
  var app=document.getElementById("app");

  function b64(s){ var bin=atob(s), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }

  function entschluessle(pw){
    var e=window.LIDL_ENC;
    var mat=new TextEncoder().encode(pw);
    return crypto.subtle.importKey("raw",mat,{name:"PBKDF2"},false,["deriveKey"])
      .then(function(k){
        return crypto.subtle.deriveKey(
          {name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},
          k,{name:"AES-CBC",length:256},false,["decrypt"]);
      })
      .then(function(key){ return crypto.subtle.decrypt({name:"AES-CBC",iv:b64(e.iv)},key,b64(e.data)); })
      .then(function(buf){
        var txt=new TextDecoder().decode(buf);
        if(txt.charAt(0)!=="{") throw new Error("falsch");
        return JSON.parse(txt);
      });
  }

  function start(daten){
    window.LIDL_DB=daten;
    if(tabs) tabs.hidden=false;
    if(qrbtn) qrbtn.hidden=false;
    if(stand) stand.hidden=false;
    starteWartungsleitstand();
  }

  function schirm(){
    if(tabs) tabs.hidden=true;
    if(qrbtn) qrbtn.hidden=true;
    if(stand) stand.hidden=true;
    app.innerHTML="";
    var card=document.createElement("div");
    card.className="card";
    card.style.maxWidth="440px";
    card.style.marginTop="28px";
    card.innerHTML='<div class="pad stack">'+
      '<div><h2>Zugang</h2><div class="sub">Die Anlagen- und Standortdaten sind verschlüsselt hinterlegt. '+
      'Mit dem Passwort aus dem Büro werden sie hier im Browser entschlüsselt.</div></div>'+
      '<form class="stack" id="gateform">'+
        '<label class="fl"><span>Passwort</span>'+
          '<input type="password" id="g_pw" autocomplete="current-password" autofocus required></label>'+
        '<div class="note warnbox" id="g_err" hidden></div>'+
        '<div><button class="btn" type="submit" id="g_btn">Daten anzeigen</button></div>'+
      '</form>'+
      '<div class="muted" style="font-size:12.5px">Das Entschlüsseln dauert einen Moment – '+
      'die Schlüsselableitung ist absichtlich rechenintensiv, damit Passwörter nicht durchprobiert werden können.</div>'+
    '</div>';
    app.appendChild(card);

    var form=card.querySelector("#gateform"),
        pw=card.querySelector("#g_pw"),
        err=card.querySelector("#g_err"),
        btn=card.querySelector("#g_btn");

    form.onsubmit=function(ev){
      ev.preventDefault();
      err.hidden=true; btn.disabled=true; btn.textContent="Entschlüsseln …";
      entschluessle(pw.value).then(function(daten){
        try{ sessionStorage.setItem("ukt_pw",pw.value); }catch(e){}
        start(daten);
      },function(){
        btn.disabled=false; btn.textContent="Daten anzeigen";
        err.textContent="Das Passwort passt nicht.";
        err.hidden=false; pw.select();
      });
    };
  }

  if(window.LIDL_DB){ start(window.LIDL_DB); return; }           // unverschlüsselt ausgeliefert
  if(!window.LIDL_ENC){ start({standorte:[],positionen:[],meta:{}}); return; }
  if(!window.crypto || !window.crypto.subtle){
    app.innerHTML='<div class="card"><div class="pad"><h2>Nicht entschlüsselbar</h2>'+
      '<div class="sub">Dieser Browser stellt keine Verschlüsselungsfunktionen bereit. '+
      'Das passiert, wenn die Seite ohne HTTPS aufgerufen wird.</div></div></div>';
    if(tabs) tabs.hidden=true; if(qrbtn) qrbtn.hidden=true; if(stand) stand.hidden=true;
    return;
  }

  /* innerhalb derselben Browser-Sitzung nicht erneut fragen */
  var gemerkt=null;
  try{ gemerkt=sessionStorage.getItem("ukt_pw"); }catch(e){}
  if(gemerkt){
    schirm();
    entschluessle(gemerkt).then(start,function(){ try{ sessionStorage.removeItem("ukt_pw"); }catch(e){} });
  } else {
    schirm();
  }
})();
</script>
